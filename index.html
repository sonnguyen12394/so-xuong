function bcCauNoi(){
  const dtNet=bal(TK.DOANH_THU).co-bal(TK.DOANH_THU).no;
  const lai=dtNet-bal(TK.GIA_VON).net-bal(TK.LO_KHAC).net;
  const congMinh=bal(TK.CONG_CHU_XUONG).net*-1;const noLuong=bal(TK.PHAI_TRA_THO).net*-1;
  const von=bal(TK.VON).net*-1;
  const phaiThu=bal(TK.PHAI_THU).net;const wip=bal(TK.WIP).net;const roChung=bal(TK.RO_CHUNG).net;const quy=bal(TK.QUY).net;
  const tinh=lai+congMinh+noLuong+von-phaiThu-wip-roChung;const khop=Math.abs(tinh-quy)<1;
  const rows=[['head','Lãi ròng cả xưởng (bạn làm ra được)',lai,'',''],
    ['','Công của chính bạn','+',congMinh,'Chi phí này không phải trả ai cả'],
    ['','May chưa trả lương thợ','+',noLuong,'Tiền còn giữ được vì chưa trả']];
  if(Math.abs(von)>0.5)rows.push(['','Vốn của bạn (đầu kỳ + bỏ thêm − đã rút)',von>=0?'+':'−',Math.abs(von),'Tiền bạn bỏ vào hoặc rút ra khỏi xưởng — không phải lãi, không phải chi phí']);
  rows.push(['','Chủ hàng còn nợ','−',phaiThu,'Đã tính lãi nhưng chưa thu tiền'],
    ['','Hàng còn đang làm dở','−',wip,'Tiền đang nằm trong hàng trên bàn'],
    ['','Chi phí chung chưa phân bổ hết','−',roChung,'Rổ chi phí còn treo lại']);
  let h=`<div class="${khop?'check-ok':'check-ok check-bad'}">${khop?'✓ Hai con số khớp tuyệt đối — không thể mâu thuẫn':'✗ LỆCH '+fmt(tinh-quy)}</div>`;
  h+=`<div class="hint" style="margin:-4px 4px 12px">Vì sao <b>lãi cao</b> mà <b>két ít tiền</b>? Bảng này giải thích từng đồng, và nó tự cân.</div>`;
  h+=`<div class="card" style="overflow:hidden">`;
  rows.forEach(r=>{if(r[0]==='head')h+=`<div class="bridge-row head"><div class="bl">${r[1]}</div><div class="bv num">${fmt(r[2])}</div></div>`;
    else h+=`<div class="bridge-row"><div class="bridge-sign">${r[2]}</div><div class="bl">${r[1]}</div>
      <div class="bv num ${r[2]==='+'?'money-pos':'money-neg'}">${fmt(r[3])}</div></div><div class="bridge-explain">${r[4]}</div>`;});
  h+=`<div class="bridge-row foot"><div class="bl">= Tiền thật trong két</div><div class="bv num">${fmt(quy)}</div></div></div>`;
  h+=`<div class="hint" style="text-align:center;margin-top:4px">Sổ giấy chỉ nói được một trong hai con số — và thường nói sai.</div>`;
  return h;
}
function bcDongTien(){

  DB.butToan.forEach(bt=>bt.dong.forEach(d=>{if(d.tk!==TK.QUY)return;

  h+=(rows||`<div class="divider-note" style="padding:16px">Không có tiền gối.</div>`)+`</div>`;

function bcKhoaKy(){
  const ro=bal(TK.RO_CHUNG).net;
  const chiThuc=bal(TK.RO_CHUNG).no;const daHapThu=bal(TK.RO_CHUNG).co;
  let h=`<div class="card"><div class="card-pad">
    <div class="kv"><div class="k">Chi phí chung đã chi (tiền mặt)</div><div class="v">${fmt(chiThuc)}</div></div>
    <div class="kv"><div class="k">Đã phân bổ vào các đơn (ước)</div><div class="v">${fmt(daHapThu)}</div></div>
    <div class="kv"><div class="k" style="font-weight:800">Chênh lệch còn treo</div><div class="v big-num ${ro>0?'money-neg':'money-pos'}">${fmt(ro)}</div></div></div></div>`;
  if(Math.abs(ro)>0.5){h+=`<div class="warn-box">Khóa kỳ sẽ ghi phần chênh lệch thực–ước (${fmt(ro)}) vào giá vốn và đưa rổ về 0. Phần đã khóa <b>không sửa được</b> — sai sót sau này ghi ở kỳ mới.</div>
    <button class="btn btn-primary" onclick="doKhoaKy()">🔒 Khóa kỳ — chốt chênh lệch hiện tại</button>`;}
  else{h+=`<div class="check-ok">✓ Rổ chi phí đang ở 0 — chưa có gì để khóa. Cuối tháng, sau khi ghi hết chi phí, quay lại đây.</div>`;}
  // công tiêu trên hàng phế (gộp từ 'Rò rỉ' cũ)
  let phe=0;DB.don.forEach(don=>DB.phieuGiao.filter(p=>p.donId===don.id).forEach(p=>{
    const sp=pPhe(p);if(sp>0)phe+=sp*donGiaCds(don,pCds(p));}));
  if(phe>0)h+=`<div class="card"><div class="card-pad"><div class="kv"><div class="k">Công tiêu trên hàng phế (đến nay)</div><div class="v" style="color:var(--ink-3)">${fmt(phe)}</div></div><div class="hint" style="margin:6px 0 0">Tiền công đã trả cho phần hàng hư/phế — rò rỉ lặng lẽ ăn vào lãi.</div></div></div>`;
  const kyLogs=(DB.settings.kyLog||[]).slice().reverse();
  h+=`<div class="section-h">Các lần khóa kỳ (${kyLogs.length})</div><div class="card">`;
  h+=kyLogs.length?kyLogs.map(l=>`<div class="slip"><div><div class="who" style="font-size:13.5px">${new Date(l.ngay).toLocaleDateString('vi-VN')}</div>
    <div class="meta">tỷ lệ ước lúc đó: ${Math.round((l.tyLe||0)*100)}% tiền công</div></div>
    <div class="big-num ${l.chenh>0?'money-neg':l.chenh<0?'money-pos':''}">${l.chenh>0?'vượt ':l.chenh<0?'dưới ':''}${fmt(Math.abs(l.chenh))}</div></div>`).join('')
    :`<div class="divider-note" style="padding:14px">Chưa khóa lần nào. Khóa kỳ là việc lặp lại mỗi cuối tháng, không phải một lần rồi thôi.</div>`;
  h+=`</div>`;
  h+=`<div class="hint" style="text-align:center;margin-top:8px">Nếu tháng nào cũng "vượt" — không phải tháng nào cũng xui, mà tỷ lệ ước đang đặt thấp. Kỳ ế thì phân bổ = 0 → toàn bộ chi phí chung thành lỗ thuần, bạn thấy ngay.</div>`;
  return h;
}

function redrawMau(){drawMauForm();}
function mauAnhChon(inp){const f=inp.files&&inp.files[0];if(!f)return;
  if(!/^image\//.test(f.type))return toast('Chọn tệp ảnh.',true);
  const rd=new FileReader();
  rd.onload=e=>{const img=new Image();
    img.onload=()=>{const MAX=820;let w=img.width,h=img.height;
      if(w>=h&&w>MAX){h=Math.round(h*MAX/w);w=MAX;}else if(h>w&&h>MAX){w=Math.round(w*MAX/h);h=MAX;}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);
      let data;try{data=cv.toDataURL('image/jpeg',0.7);}catch(err){return toast('Không đọc được ảnh này.',true);}
      mauCtx.anh=data;redrawMau();
      const kb=Math.round(data.length*3/4/1024);toast('Đã thêm ảnh (~'+kb+' KB).');};
    img.onerror=()=>toast('Ảnh lỗi, thử ảnh khác.',true);
    img.src=e.target.result;};
  rd.onerror=()=>toast('Không đọc được tệp.',true);
  rd.readAsDataURL(f);}

function buildDKHtml(){
  const n=cdEdit.length;
  if(n<2)return '<div class="hint" style="margin:0">Thêm từ 2 công đoạn trở lên (ở màn mẫu) rồi mới xếp điều kiện.</div>';
  const tenB=(i)=>escHtml(((cdEdit[i]&&cdEdit[i].ten||'').trim())||('Công đoạn '+(i+1)));
  const selHtml=(i,gi,exclude)=>{const opts=[];for(let a=0;a<n;a++){if(a===i)continue;if(exclude.includes(a))continue;if(cdDependsOn(a,i))continue;opts.push(a);}
    if(!opts.length)return'';
    return `<select onchange="if(this.value!==''){cdThemDK(${i},${gi},+this.value)}" style="padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;background:#fff"><option value="">+ cần bước…</option>${opts.map(a=>`<option value="${a}">${a+1}. ${tenB(a)}</option>`).join('')}</select>`;};
  const chipHtml=(i,gi,a)=>`<span style="display:inline-flex;align-items:center;gap:4px;background:#eef1f5;border-radius:8px;padding:3px 8px;font-size:12.5px">${a+1}. ${tenB(a)} <b onclick="cdBoDK(${i},${gi},${a})" style="cursor:pointer;color:#c0392b">✕</b></span>`;
  return cdEdit.map((c,i)=>{
    const gs=migCT(c.canTruoc);

      inner=`<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center"><span style="font-size:12px;color:var(--ink-3)">cần:</span><span style="font-size:12px;color:var(--ink-3)">— (làm lúc nào cũng được)</span> ${selHtml(i,0,[])}</div>`;
    }else{
      inner=gs.map((g,gi)=>{
        const chips=g.map(a=>chipHtml(i,gi,a)).join(' ');
        const del=`<b onclick="cdXoaCT(${i},${gi})" style="cursor:pointer;color:#999;font-size:11.5px;margin-left:2px">✕ bỏ</b>`;
        const lbl=gs.length>1?`<span style="font-size:11px;color:var(--brand);font-weight:800;min-width:52px">CT ${gi+1}${gi>0?' (hoặc)':''}</span>`:'<span style="font-size:12px;color:var(--ink-3)">cần:</span>';
        return `<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:5px">${lbl}${chips||'<span style="font-size:12px;color:var(--ink-3)">—</span>'} ${selHtml(i,gi,g)}${del}</div>`;
      }).join('');
    }
    const themCT=gs.length?`<button class="btn btn-ghost btn-sm" style="padding:3px 10px;font-size:12px;margin-top:1px" onclick="cdThemCT(${i})">＋ Thêm công thức (hoặc)</button>`:'';

function migCT(ct){if(!Array.isArray(ct)||!ct.length)return[];if(ct.every(x=>Array.isArray(x)))return ct.map(g=>g.slice());return [ct.filter(x=>typeof x==='number')];}
function normCT(ct){return migCT(ct).map(g=>g.filter(x=>typeof x==='number')).filter(g=>g.length);}
function normGD(v){const n=parseInt(v,10);return (v==null||v===''||isNaN(n)||n<1)?null:n;}
function ctOf(i){const gs=migCT(cdEdit[i].canTruoc);cdEdit[i].canTruoc=gs;return gs;}
function cdDependsOn(a,target,seen){seen=seen||{};if(a===target)return true;if(seen[a])return false;seen[a]=1;const gs=migCT(cdEdit[a]&&cdEdit[a].canTruoc);for(const g of gs)for(const x of g){if(cdDependsOn(x,target,seen))return true;}return false;}
function cdThemDK(i,gi,a){if(i===a)return;if(cdDependsOn(a,i))return toast('Không được — sẽ tạo vòng lặp điều kiện.',true);const gs=ctOf(i);while(gs.length<=gi)gs.push([]);if(!gs[gi].includes(a))gs[gi].push(a);redrawMS();}
function cdBoDK(i,gi,a){const gs=ctOf(i);if(gs[gi])gs[gi]=gs[gi].filter(x=>x!==a);redrawMS();}
function cdThemCT(i){const gs=ctOf(i);gs.push([]);redrawMS();}
function cdXoaCT(i,gi){const gs=ctOf(i);gs.splice(gi,1);redrawMS();}

/* ===========================================================
   NGĂN XẾP ĐIỀU HƯỚNG — một mạch back thống nhất
   Nguyên tắc: mỗi sheet mở ra = 1 khung; ✕ / chạm nền / đóng
   = lùi ĐÚNG một khung (mở lại khung ngay dưới), hết khung mới
   về màn nền. Không viết cứng đích quay về ở từng nút nữa.
   =========================================================== */
let _nav=[];          // mỗi khung: {name,args,key}
let _navMode='push';  // 'push' bình thường | 're' khi đang dựng lại khung cũ lúc back
function _navKey(name,args){try{return name+'|'+JSON.stringify(args);}catch(e){return name+'|?';}}
function _frame(name,args){
  if(_navMode==='re'){_navMode='push';return;}            // đang re-render khung cũ → không đụng stack
  while(_nav.length&&/^confirm/.test(_nav[_nav.length-1].name))_nav.pop(); // bỏ hộp xác nhận tạm khi mở khung thật đè lên
  const key=_navKey(name,args);
  const i=_nav.findIndex(f=>f.key===key);
  if(i>=0)_nav.length=i;                                  // quay lại đúng khung đã có: bỏ mọi khung phía trên
  _nav.push({name,args,key});
}
function _reopenTop(){
  const f=_nav[_nav.length-1];if(!f)return false;
  _navMode='re';
  try{window[f.name].apply(null,f.args);return true;}
  catch(e){_navMode='push';_nav.pop();return _reopenTop();} // khung hỏng (dữ liệu đã đổi) → lùi tiếp
}
function navBack(){
  if(_nav.length>1){_nav.pop();if(_reopenTop())return;}
  _nav=[];_hardClose();
}
function _hardClose(){el('scrim').classList.remove('on');_nvBackTo=null;_sheetClose=null;}
const _NAV_FRAMES=['modalDon','modalTaoDon','modalGiaoViec','modalNhanVe','modalChamGio','modalChiPhiDon','modalGiaoXe','modalTienDen','modalXinCham','modalChamVe','modalThao','modalGiaoTP','modalChuHang','modalThuTien','modalNoXau','modalChiPhi','modalRutVon','modalBoVon','modalGhiBoSung','modalSoCong','modalChotLuong','modalSoCongTho','modalChotSo','modalThoChiTiet','modalTraLuong','modalUng','modalPhatSinhTho','modalSuaPhatSinh','modalSuaDonLS','modalSuaDon','modalOp','modalChonChuThu','modalCaiDat','modalPhucHoi','modalThemChu','modalSuaChu','modalThemTho','modalSuaTho','modalThemMau','modalSuaMau','modalKhoMau','modalThemMauSan','modalSuaMauSan','modalDKMauSan','modalNeoMauSan','modalDauKy','moNhanNhanh','doDongDon','confirmDongDon','confirmHuyDon','confirmTraLai','confirmTraHet','confirmXoaDon','confirmXoaHanDon','kmChot','mcOpen','exportModal','hoiLanTruyen','moKetNoiDamMay','openSoKeToan','askDao','ltDetail','modalSoRieng'];
function _installNavFrames(){_NAV_FRAMES.forEach(name=>{const orig=window[name];
  if(typeof orig!=='function'||orig._wrapped)return;
  const w=function(){const a=Array.prototype.slice.call(arguments);_frame(name,a);return orig.apply(this,a);};
  w._wrapped=true;w._orig=orig;window[name]=w;});}

    <div class="sheet-body">
    <div class="hint" style="margin-top:0;white-space:pre-line;font-size:14px;color:var(--ink)">${msg}</div>
    <div style="height:14px"></div>
    <div class="act-grid">
      <button class="btn btn-ghost" onclick="closeConfirm()">Thôi</button>
      <button class="btn ${cls}" onclick="const f=window.__onXacNhan;window.__onXacNhan=null;closeConfirm();if(f)f();">${nhan}</button>
    </div></div>`;
  el('scrim2').classList.add('on');
}
el('scrim2').addEventListener('click',e=>{if(e.target===el('scrim2'))closeConfirm();});
document.addEventListener('input',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('sep')){const raw=(''+t.value).replace(/[^\d]/g,'');t.value=raw?(+raw).toLocaleString('vi-VN'):'';}});
let toastT;function toast(msg,err){const t=el('toast');t.style.display='block';t.textContent=msg;t.className='toast on'+(err?' err':'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='toast',err?2600:1800);}
/* toast kèm nút Hoàn tác — hiện sau khi nhập, cho sửa ngay */
/* Bỏ nút "Hoàn tác" hiện sau khi nhập — chỉ báo đã ghi, không kèm nút.
   Khoản đã ghi vẫn sửa/xóa được ở Chốt sổ hoặc Nhật ký nếu cần. */
function toastUndo(msg){ toast(msg); }
function undoTuToast(key){hoanTacOp(key,'');el('toast').className='toast';if(el('scrim').classList.contains('on'))closeSheet();render();toast('Đã hoàn tác.');}

/* ---------- Khởi động ---------- */
/* ---- Âm thanh & hiệu ứng khi chạm (lưu riêng theo máy: soxuong_sfx) ---- */
function sfxOn(){return localStorage.getItem('soxuong_sfx')!=='0';}
let _actx=null;
function sfx(kind){ if(!sfxOn())return;
  try{ _actx=_actx||new (window.AudioContext||window.webkitAudioContext)(); if(_actx.state==='suspended')_actx.resume();
    const t=_actx.currentTime,o=_actx.createOscillator(),g=_actx.createGain(); o.connect(g);g.connect(_actx.destination);
    const f=kind==='sel'?600:430; o.type='triangle'; o.frequency.setValueAtTime(f,t);
    if(kind==='sel')o.frequency.exponentialRampToValueAtTime(f*1.5,t+0.07);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(kind==='sel'?0.16:0.11,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.15); o.start(t); o.stop(t+0.17);
  }catch(e){} }
function toggleSfx(){const on=sfxOn(); localStorage.setItem('soxuong_sfx',on?'0':'1'); if(!on)sfx('sel'); modalCaiDat();}
function _tapRipple(node,x,y){ try{ const r=node.getBoundingClientRect(),sz=Math.max(r.width,r.height);
    const s=document.createElement('span'); s.className='tap-ripple'; s.style.width=s.style.height=sz+'px';
    s.style.left=(x-r.left-sz/2)+'px'; s.style.top=(y-r.top-sz/2)+'px';
    if(getComputedStyle(node).position==='static')node.style.position='relative'; node.style.overflow='hidden';
    node.appendChild(s); setTimeout(function(){s.remove();},480);
  }catch(e){} }
document.addEventListener('pointerdown',function(e){
  const tgt=e.target.closest?e.target.closest('.btn,.tabs button,#nav button,.chip,.hdr-gear,.sheet-x,.gate-btn,.order-card,.slip'):null;
  if(!tgt)return;
  const pick=tgt.matches('.tabs button,#nav button,.chip');
  sfx(pick?'sel':'tap');
  if(tgt.matches('.btn,.tabs button,#nav button,.chip,.hdr-gear,.sheet-x,.gate-btn'))_tapRipple(tgt,e.clientX,e.clientY);
},true);
function loadLocalOrSeed(){const saved=Store.load();window._cuMoi=false;
  if(saved&&saved.don&&saved.schema===SCHEMA){DB=saved;if(!DB.settings)DB.settings={tyLeChung:0.15,view:'don'};
    DB.phienGio=DB.phienGio||[];DB.phieuThao=DB.phieuThao||[];DB.mauSan=DB.mauSan||[];DB.chotBao=DB.chotBao||[];DB.giaoCong=DB.giaoCong||[];cur=DB.settings.view||'don';}
  else{
    if(saved&&saved.don){try{localStorage.setItem('soxuong_v2_cu',JSON.stringify(saved));}catch(e){}window._cuMoi=true;}
    seedDemo();
  }
  seedOpSeq();
  if(fixOpCollisions())Store.save();
  if(['home','thuchi','loinhuan'].includes(cur))cur='tongquan';
  if(!NAV.some(n=>n[0]===cur))cur='tongquan';}
function bootData(){loadLocalOrSeed();render();
  if(window._cuMoi)setTimeout(()=>toast('Đã cập nhật bản mới (mẫu theo chủ hàng). Dữ liệu cũ được cất ở bản sao lưu.'),400);}
/* ============================================================
   ĐỒNG BỘ ĐÁM MÂY (Supabase) — thêm vào sau cùng
   Mặc định app chạy máy lẻ (localStorage). Khi bật đồng bộ:
   dữ liệu đẩy lên Supabase, mọi máy đăng nhập cùng tài khoản
   sẽ dùng chung một sổ. Có chốt chống đè khi 2 máy đụng nhau.
   ============================================================ */
const CLOUD_KEY='soxuong_cloud';
const Cloud={sb:null,user:null,baseStamp:null,dirty:false,busy:false,status:'off',pushT:null};

function cloudCfg(){try{const r=localStorage.getItem(CLOUD_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function cloudConfigured(){const c=cloudCfg();return !!(c&&c.url&&c.key&&window.supabase);}
function cloudOn(){return !!(Cloud.sb&&Cloud.user);}

function cloudInit(){const c=cloudCfg();if(!c||!window.supabase)return false;
  try{Cloud.sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true}});return true;}
  catch(e){Cloud.sb=null;return false;}}

function normalizeDB(){if(!DB)return;if(!DB.settings)DB.settings={tyLeChung:0.15,view:'don'};
  DB.phienGio=DB.phienGio||[];DB.phieuThao=DB.phieuThao||[];DB.mauSan=DB.mauSan||[];
  cur=(DB.settings&&DB.settings.view)||cur||'don';
  seedOpSeq();
  if(fixOpCollisions())Store.save();
  if(['home','thuchi','loinhuan'].includes(cur))cur='tongquan';
  if(!NAV.some(n=>n[0]===cur))cur='tongquan';}

/* ---------- trạng thái + thanh dưới ---------- */
function cloudSetStatus(s){Cloud.status=s;renderCloudBar();}
function renderCloudBar(){const b=el('cloudbar');if(!b)return;
  if(Cloud.status==='conflict'){b.style.display='block';b.className='cloudbar warn';
    b.innerHTML='⚠ Máy kia vừa cập nhật sổ. <button onclick="cloudReloadNow()">Tải bản mới</button><button class="ghost" onclick="cloudForcePush()">Ghi đè</button>';return;}
  if(Cloud.status==='offline'){b.style.display='block';b.className='cloudbar off';
    b.innerHTML='○ Mất mạng — đã lưu trong máy, sẽ tự đồng bộ lại. <button onclick="cloudSyncNow()">Thử lại</button>';return;}
  b.style.display='none';b.innerHTML='';}

/* ---------- khởi động ---------- */
async function cloudGetSession(){try{const {data}=await Cloud.sb.auth.getSession();return (data&&data.session)?data.session:null;}catch(e){return null;}}

async function boot(){
  if(!cloudConfigured()){bootData();return;}
  if(!cloudInit()){bootData();toast('Chưa nối được đám mây — đang chạy trên máy này.',true);return;}
  const sess=await cloudGetSession();
  if(!sess){showLogin();return;}
  Cloud.user=sess.user;await afterLogin();}

async function cloudFetch(){const {data,error}=await Cloud.sb.from('soxuong').select('data,updated_at').eq('id','main').maybeSingle();if(error)throw error;return data;}

async function afterLogin(){
  hideGate();
  let remote=null,failed=false;
  try{remote=await cloudFetch();}catch(e){failed=true;}
  if(remote&&remote.data){DB=remote.data;Cloud.baseStamp=remote.updated_at;normalizeDB();render();cloudSetStatus('ok');}
  else if(failed){loadLocalOrSeed();render();cloudSetStatus('offline');}
  else{ /* mây trống: đưa sổ hiện tại của máy này lên */ loadLocalOrSeed();render();await cloudPush(true);}
  startCloudWatch();
  toast('Đã kết nối đám mây.');}

/* ---------- đẩy lên (có chốt chống đè) ---------- */
function scheduleCloudPush(){if(!cloudOn())return;Cloud.dirty=true;clearTimeout(Cloud.pushT);Cloud.pushT=setTimeout(()=>cloudPush(false),800);}

async function cloudPush(force){if(!cloudOn()||Cloud.busy)return;Cloud.busy=true;cloudSetStatus('saving');
  try{
    if(!force&&Cloud.baseStamp){
      const {data:cur,error:e1}=await Cloud.sb.from('soxuong').select('updated_at').eq('id','main').maybeSingle();
      if(!e1&&cur&&cur.updated_at&&new Date(cur.updated_at).getTime()>new Date(Cloud.baseStamp).getTime()){
        Cloud.busy=false;cloudSetStatus('conflict');return;}
    }
    const stamp=new Date().toISOString();
    const {data,error}=await Cloud.sb.from('soxuong').upsert({id:'main',data:DB,updated_at:stamp}).select('updated_at').maybeSingle();
    if(error)throw error;
    Cloud.baseStamp=(data&&data.updated_at)||stamp;Cloud.dirty=false;cloudSetStatus('ok');
  }catch(err){cloudSetStatus('offline');}
  Cloud.busy=false;}

/* ---------- kéo về ---------- */
async function cloudPull(){if(!cloudOn()||Cloud.busy)return;
  try{const r=await cloudFetch();
    if(r&&r.updated_at&&(!Cloud.baseStamp||new Date(r.updated_at).getTime()>new Date(Cloud.baseStamp).getTime())){
      if(Cloud.dirty){cloudSetStatus('conflict');return;}
      DB=r.data;Cloud.baseStamp=r.updated_at;normalizeDB();render();cloudSetStatus('ok');toast('Đã cập nhật từ máy kia.');
    }
  }catch(e){}}

function cloudReloadNow(){Cloud.dirty=false;Cloud.baseStamp=null;cloudSetStatus('ok');cloudPull();}
async function cloudForcePush(){cloudSetStatus('ok');await cloudPush(true);}
async function cloudSyncNow(){await cloudPull();if(Cloud.dirty)await cloudPush(false);toast('Đã đồng bộ.');}

let _cloudWatchStarted=false;
function startCloudWatch(){if(_cloudWatchStarted)return;_cloudWatchStarted=true;
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)cloudPull();});
  window.addEventListener('focus',()=>cloudPull());
  window.addEventListener('online',()=>{if(Cloud.dirty)cloudPush(false);else cloudPull();});
  window.addEventListener('offline',()=>cloudSetStatus('offline'));}

/* ---------- màn đăng nhập (che toàn màn hình) ---------- */
function showGate(html){const g=el('gate');g.innerHTML=html;g.style.display='flex';}
function hideGate(){const g=el('gate');g.style.display='none';g.innerHTML='';}

function showLogin(msg){showGate(
  '<div class="gate-card"><div class="gate-logo">🧵</div>'+
  '<div class="gate-title">Sổ Xưởng</div>'+
  '<div class="gate-sub">Đăng nhập để mở sổ chung</div>'+
  (msg?'<div class="gate-err">'+msg+'</div>':'')+
  '<input id="lg_email" type="email" placeholder="Email" autocomplete="username">'+
  '<input id="lg_pass" type="password" placeholder="Mật khẩu" autocomplete="current-password">'+
  '<button class="gate-btn" onclick="doLogin()">Đăng nhập</button>'+
  '<button class="gate-link" onclick="showConfigGate()">Đổi kết nối đám mây</button></div>');}

async function doLogin(){const email=((el('lg_email')||{}).value||'').trim();const pass=((el('lg_pass')||{}).value||'');
  if(!email||!pass){showLogin('Nhập email và mật khẩu.');return;}
  showGate('<div class="gate-card"><div class="gate-logo">🧵</div><div class="gate-title">Đang đăng nhập…</div></div>');
  try{const {data,error}=await Cloud.sb.auth.signInWithPassword({email:email,password:pass});
    if(error){showLogin('Sai email hoặc mật khẩu.');return;}
    Cloud.user=data.user;await afterLogin();
  }catch(e){showLogin('Không kết nối được. Kiểm tra mạng rồi thử lại.');}}

async function cloudLogout(){try{await Cloud.sb.auth.signOut();}catch(e){}Cloud.user=null;closeSheet();showLogin();}

/* ---------- cấu hình kết nối (URL + key) ---------- */
function showConfigGate(){const c=cloudCfg()||{};showGate(
  '<div class="gate-card"><div class="gate-title">Kết nối đám mây</div>'+
  '<div class="gate-sub">Dán 2 giá trị từ Supabase → Settings → API Keys</div>'+
  '<input id="cf_url" placeholder="https://xxxx.supabase.co" value="'+(c.url||'')+'">'+
  '<input id="cf_key" placeholder="sb_publishable_..." value="'+(c.key||'')+'">'+
  '<button class="gate-btn" onclick="luuKetNoiGate()">Lưu & đăng nhập</button>'+
  '<button class="gate-link" onclick="showLogin()">‹ Quay lại đăng nhập</button></div>');}

function _saveCfg(){const url=((el('cf_url')||{}).value||'').trim().replace(/\/+$/,'');const key=((el('cf_key')||{}).value||'').trim();
  if(!/^https:\/\/.+\.supabase\.co$/.test(url)){toast('URL chưa đúng dạng https://xxx.supabase.co',true);return false;}
  if(!key){toast('Chưa dán key.',true);return false;}
  if(!window.supabase){toast('Cần mạng để tải thư viện đồng bộ. Kiểm tra internet.',true);return false;}
  localStorage.setItem(CLOUD_KEY,JSON.stringify({url:url,key:key}));
  if(!cloudInit()){toast('Không khởi tạo được kết nối.',true);return false;}
  return true;}

function luuKetNoiGate(){if(_saveCfg())showLogin();}

function moKetNoiDamMay(){const c=cloudCfg()||{};const daNoi=cloudOn();
  let h='<div class="hint" style="margin-top:0">Dán 2 giá trị từ Supabase (<b>Settings → API Keys</b>). Dùng khóa <b>Publishable</b> (bắt đầu <code>sb_publishable_</code>) — <b>không</b> dùng khóa Secret.</div>'+
    '<div class="field"><label>Project URL</label><input id="cf_url" placeholder="https://xxxx.supabase.co" value="'+(c.url||'')+'"></div>'+
    '<div class="field"><label>Publishable key</label><input id="cf_key" placeholder="sb_publishable_..." value="'+(c.key||'')+'"></div>'+
    '<div class="hint" style="margin:0 0 10px">Khi kết nối: nếu trên mây đã có sổ, máy này lấy sổ đó về; nếu mây trống, sổ hiện tại của máy này được đưa lên.</div>'+
    '<button class="btn btn-tape" style="width:100%" onclick="luuKetNoiSheet()">'+(daNoi?'Lưu lại':'Kết nối & đăng nhập')+'</button>';
  if(daNoi){h+='<div style="height:12px"></div><div class="kv"><div class="k">Đang đăng nhập</div><div class="v">'+((Cloud.user&&Cloud.user.email)||'')+'</div></div>'+
    '<div style="height:8px"></div><button class="btn btn-ghost" style="width:100%" onclick="cloudSyncNow()">🔄 Đồng bộ ngay</button>'+
    '<div style="height:8px"></div><button class="btn btn-danger" style="width:100%" onclick="cloudLogout()">Đăng xuất</button>';}
  h+='<div style="height:8px"></div><button class="btn btn-ghost" style="width:100%" onclick="ngatKetNoi()">Ngắt đám mây (về máy lẻ)</button>';
  openSheet('Đồng bộ đám mây',h);}

function luuKetNoiSheet(){if(_saveCfg()){closeSheet();showLogin();}}
function ngatKetNoi(){if(!confirm('Ngắt đám mây? App sẽ quay lại dùng dữ liệu lưu trong máy này.'))return;
  localStorage.removeItem(CLOUD_KEY);Cloud.sb=null;Cloud.user=null;location.reload();}

/* ---------- gài đẩy-lên vào mỗi lần lưu ---------- */
if(typeof Store!=='undefined'&&Store&&typeof Store.save==='function'){
  const _origStoreSave=Store.save.bind(Store);
  Store.save=function(){_origStoreSave();scheduleCloudPush();};
}

/* ---------- bàn phím mobile: giữ ô đang nhập luôn hiện phía trên bàn phím ---------- */
(function(){
  var vv=window.visualViewport, root=document.documentElement;
  function syncVV(){
    if(!vv)return;
    root.style.setProperty('--ovl-h', Math.round(vv.height)+'px');
    root.style.setProperty('--ovl-top', Math.round(vv.offsetTop)+'px');
  }
  if(vv){ vv.addEventListener('resize',syncVV); vv.addEventListener('scroll',syncVV); syncVV(); }
  document.addEventListener('focusin',function(e){
    var t=e.target;
    if(!t||!t.tagName||!/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName))return;
    if(!t.closest||!t.closest('.sheet,.gate'))return;
    setTimeout(function(){
      try{ t.scrollIntoView({block:'center',behavior:'smooth'}); }
      catch(_){ try{ t.scrollIntoView(); }catch(__){} }
    },90);
  });
})();

/* ---------- chạy ---------- */
_installNavFrames();
boot();

</script>
