  if(on)sizesOf(don).forEach(s=>{const v=gvMax(don,s);if(v>0)gvState.giao[s]=v;});drawGiaoViec();}
function submitGiaoViec(){try{if(!gvState.sel.length)return toast('Chọn công đoạn đã.',true);
  if(sum(Object.values(gvState.giao))<=0)return toast('Chọn ít nhất một cỡ.',true);
  giaoViec({donId:gvState.donId,cds:gvState.sel,thoId:gvState.thoId,giao:gvState.giao});
  const _inline=gvInline;closeSheet();render();modalDon(gvState.donId,_inline?'giao':'chitiet');toast('Đã giao gói việc cho thợ.');}catch(e){toast(e.message,true)}}

/* ---------- Nhận về ---------- */
let nvLos=[],_nvSeq=0,_nvPid=null,_nvPending=null,nvShowHu=false,_nvBackTo=null;
/* ===================== ĐIỀU KIỆN (công thức) + NEO (mốc số lượng) =====================
   canTruoc=[[a,b],[c]] ⇔ (a VÀ b) HOẶC c.  Công thức = KHOÁ (được nhận hay chưa).
   Neo (giaiDoan) = HẠ TRẦN số lượng sau khi bước neo làm ra hàng; chưa xong thì trần=số đơn.
   X = hàm tra "đã xong bước n cỡ s" (dùng bản đã ghi, hoặc bản mô phỏng khi kiểm tra). */
function dkCts(don,n){const c=don.snapshotCD[n]&&don.snapshotCD[n].canTruoc;return Array.isArray(c)?c:[];}
function dkNeoOf(don,n){const g=don.snapshotCD[n]&&don.snapshotCD[n].giaiDoan;return(g==null||g==='')?null:g;}
function dkQtyCT(don,n,s,X){const cs=dkCts(don,n);if(!cs.length)return Infinity;let best=0;
  for(const ct of cs){let m=Infinity;for(const p of ct)m=Math.min(m,X(p,s));if(m===Infinity)m=0;best=Math.max(best,m);}return best;}
function dkCtHopLe(don,n,s,X){const cs=dkCts(don,n);for(let i=0;i<cs.length;i++){if(cs[i].every(p=>X(p,s)>=1))return i;}return -1;}
function dkNeoAllQty(don,k,s,X){const cs=dkCts(don,k);let m=Infinity;for(const ct of cs)for(const p of ct)m=Math.min(m,X(p,s));return m;}
function dkNeoLocked(don,k,s,X){const done=X(k,s);if(done<=0)return false;return dkNeoAllQty(don,k,s,X)>=done;}
function dkNeoCeil(don,n,s,X){const kn=dkNeoOf(don,n);const lim=(kn==null)?Infinity:kn;let best=null;
  for(let k=0;k<don.snapshotCD.length;k++){if(k===n)continue;const g=dkNeoOf(don,k);if(g==null)continue;if(!(g<lim))continue;
    if(!dkNeoLocked(don,k,s,X))continue;if(best===null||g>best.g)best={g,val:X(k,s)};}return best?best.val:null;}
/* trần TUYỆT ĐỐI cho "đã xong" của bước n (chưa trừ phần đã làm) */
function dkTran(don,n,s,X){let cap=capDon(don,s);const nc=dkNeoCeil(don,n,s,X);if(nc!=null)cap=Math.min(cap,nc);
  if(dkCts(don,n).length)cap=Math.min(cap,dkQtyCT(don,n,s,X));return cap;}
function dkNhanDuoc(don,n,s,X){if(!dkCts(don,n).length)return true;return dkQtyCT(don,n,s,X)>=1;}
function dkXcommit(don){return (n,s)=>xongCD(don,n,s);}
/* headroom: bước n cỡ s còn nhận thêm được bao nhiêu theo trần (chưa xét "còn ở thợ") */
function dkHeadroom(don,n,s,X){return Math.max(0,dkTran(don,n,s,X)-xongCD(don,n,s));}

/* trần của MỘT LÔ (tập bước 'ticked' cùng chảy qua) theo cỡ s:
   bước trong lô coi như đã thoả cho nhau; chỉ ràng buộc bởi bước NGOÀI lô + neo ngoài lô. */
function nvLoTranSize(p,ticked,s){const don=getDon(p.donId);
  const Xlo=(n,ss)=>ticked.indexOf(n)>=0?Infinity:xongCD(don,n,ss);
  let m=Infinity;for(const n of ticked)m=Math.min(m,dkHeadroom(don,n,s,Xlo));return m;}

/* KIỂM TRA điều kiện lúc GHI: dựng trạng thái SAU khi cộng mọi lô, mỗi bước phải ≤ trần của nó. */
function nvKiemTraDK(p,batches){const don=getDon(p.donId);const full=pCds(p);const delta={};
  for(const b of batches){const T=(b.cds&&b.cds.length)?b.cds:full;
    for(const n of T){const d=b.dat||{};for(const s in d){const v=d[s]||0;if(!v)continue;delta[n]=delta[n]||{};delta[n][s]=(delta[n][s]||0)+v;}}}
  const post=(n,s)=>xongCD(don,n,s)+((delta[n]||{})[s]||0);
  const ten=i=>don.snapshotCD[i]?don.snapshotCD[i].ten:('bước '+(i+1));
  for(const nk in delta){const n=+nk;for(const s in delta[nk]){
    const need=post(n,s);const tran=dkTran(don,n,s,post);if(need<=tran)continue;
    if(dkCts(don,n).length&&dkQtyCT(don,n,s,post)<1){
      const ct=dkCts(don,n)[0]||[];const thieu=ct.filter(x=>post(x,s)<1).map(ten);
      throw new Error('Cỡ '+s+': "'+ten(n)+'" chưa đủ điều kiện — cần xong '+(thieu.join(' và ')||'bước trước')+' trước.');}
    throw new Error('Cỡ '+s+': "'+ten(n)+'" chỉ được tối đa '+tran+' cái (đang khai '+need+') — bị bước trước/mốc khống chế. Bớt lại.');}}
}

/* Thông tin điều kiện hiển thị trong 1 lô: chỉ hiện bước có công thức HOẶC nằm sau một neo. */
function nvDKInfo(g){const p=DB.phieuGiao.find(x=>x.id===_nvPid);if(!p)return;const don=getDon(p.donId);
  const box=el('nvlDK_'+g);if(!box)return;const full=pCds(p);const sizes=pSizes(p);
  const ticked=full.filter(n=>{const e=el('nvlcd_'+g+'_'+n);return e&&e.checked;});
  const Xlo=(n,ss)=>ticked.indexOf(n)>=0?Infinity:xongCD(don,n,ss);
  const coNeoTruoc=n=>{for(let k=0;k<n;k++)if(dkNeoOf(don,k)!=null)return true;return false;};
  const ten=i=>don.snapshotCD[i]?don.snapshotCD[i].ten:('bước '+(i+1));
  const rows=[];
  for(const n of ticked){
    const chuaDu=sizes.filter(s=>!dkNhanDuoc(don,n,s,Xlo)&&capDon(don,s)>0);
    if(chuaDu.length){ const ct=dkCts(don,n)[0]||[];
      const thieu=ct.filter(x=>ticked.indexOf(x)<0&&sizes.some(s=>xongCD(don,x,s)<1)).map(ten);
      rows.push('<div style="color:#b3261e">🔴 '+ten(n)+': chưa đủ — cần '+(thieu.join(', ')||'bước trước')+(chuaDu.length<sizes.length?' (cỡ '+chuaDu.join(',')+')':'')+'</div>');
    }else{
      const tr=sizes.filter(s=>capDon(don,s)>0).map(s=>s+':'+dkHeadroom(don,n,s,Xlo)).join('  ');
      rows.push('<div style="color:#1f7a34">🟢 '+ten(n)+': đủ điều kiện — tối đa '+tr+'</div>');}
  }
  box.innerHTML=rows.length?('<div style="font-size:11.5px;line-height:1.6;margin-top:4px;padding-top:5px;border-top:1px dashed var(--line-2)">'+rows.join('')+'</div>'):'';
}
function nvDKInfoAll(){for(const g of nvLos)nvDKInfo(g);}

/* Điều hướng nhanh từ bảng đèn: nhảy sang GIAO / NHẬN bước cần trước rồi quay lại. */
function nvGuideGiao(donId,n){closeSheet();modalGiaoViec(donId);
  const t=(getDon(donId).snapshotCD[n]||{}).ten||'bước';toast('Giao "'+t+'" cho thợ, xong quay lại nhận tiếp.');}
function nvGuideNhan(donId,n,fromId){const don=getDon(donId);
  const cands=DB.phieuGiao.filter(p=>p.donId===donId&&p.trangThai==='MO'&&pLam(p,n)&&(pGiao(p)-pNhan(p))>0&&p.id!==fromId);
  const t=(don.snapshotCD[n]||{}).ten||'';
  if(cands.length){const c=cands[0];_nhanSel[donId]={thoId:c.thoId,phieuId:c.id};_nvBackTo=null;
    modalDon(donId,'nhan');
    toast('Đã chuyển sang '+getTho(c.thoId).ten+' — nhận "'+t+'".'+(cands.length>1?' (còn thợ khác cũng giữ bước này)':''));return;}
  modalDon(donId,'nhan');
  toast('Chưa thấy phiếu mở nào đang giữ "'+t+'".',true);}
function nvQuayLai(id){_nvBackTo=null;modalNhanVe(id);}

/* Bảng đèn TRẠNG THÁI CÔNG ĐOẠN (SPEC §17) — theo số đã xong hiện tại (committed). */
function nvBangCD(p){const don=getDon(p.donId);const sizes=pSizes(p);const cds=pCds(p);const X=dkXcommit(don);
  const ten=i=>don.snapshotCD[i]?don.snapshotCD[i].ten:('bước '+(i+1));
  const hasGiao=pp=>DB.phieuGiao.some(f=>f.donId===don.id&&pCds(f).indexOf(pp)>=0);
  const coCT=cds.some(n=>dkCts(don,n).length>0);const coNeo=cds.some(n=>dkNeoOf(don,n)!=null);
  if(!coCT&&!coNeo)return '';
  const live=sizes.filter(s=>capDon(don,s)>0);
  const cards=cds.map(n=>{const hasCT=dkCts(don,n).length>0;
    const okS=live.filter(s=>dkNhanDuoc(don,n,s,X)&&dkHeadroom(don,n,s,X)>0);
    const badS=live.filter(s=>!dkNhanDuoc(don,n,s,X));
    const ct0=dkCts(don,n)[0]||[];
    const giaoIdx=[],nhanIdx=[],tickIdx=[];
    ct0.forEach(pp=>{const tong=sizes.reduce((a,s)=>a+X(pp,s),0);if(tong>0)return;
      if(!hasGiao(pp)){giaoIdx.push(pp);return;}
      const khac=DB.phieuGiao.some(x=>x.id!==p.id&&x.donId===don.id&&x.trangThai==='MO'&&pLam(x,pp)&&(pGiao(x)-pNhan(x))>0);
      if(khac)nhanIdx.push(pp);else if(pLam(p,pp))tickIdx.push(pp);else nhanIdx.push(pp);});
    let den,label,color;
    if(!hasCT){den='🟢';label='Nhận được (chỉ neo giới hạn số)';color='#1f7a34';}
    else if(okS.length===0){ if(giaoIdx.length){den='🟠';label='Cần giao bước trước';color='#b26a00';}
      else{den='🔴';label='Chưa đủ điều kiện';color='#b3261e';} }
    else if(badS.length){den='🟡';label='Đủ một phần';color='#8a6d00';}
    else{den='🟢';label='Đủ điều kiện nhận';color='#1f7a34';}
    let chk='';
    if(hasCT){const iCT=dkCtHopLe(don,n,live[0]||sizes[0],X);const ct=(iCT>=0?dkCts(don,n)[iCT]:ct0);
      const items=ct.map(pp=>{const tong=sizes.reduce((a,s)=>a+X(pp,s),0);const giu=sizes.reduce((a,s)=>a+dangGiuCD(don,pp,s),0);
        let ic,tx; if(tong>0){ic='✓';tx='đã xong '+tong;} else if(giu>0||hasGiao(pp)){ic='⏳';tx='đã giao, chưa xong';} else {ic='📦';tx='chưa giao';}
        return '<div style="font-size:11.5px">'+ic+' '+ten(pp)+' — '+tx+'</div>';}).join('');
      const nCT=dkCts(don,n).length;
      chk='<div style="margin-top:2px">'+(nCT>1?'<div style="font-size:11px;color:var(--ink-2)">'+(iCT>=0?'Công thức '+(iCT+1)+' đang đủ':'Chưa công thức nào đủ')+' (trong '+nCT+')</div>':'')+items+'</div>';}
    let foot='';
    if(den==='🟢'||den==='🟡'){const tr=live.map(s=>s+':'+dkHeadroom(don,n,s,X)).join('  ');
      foot='<div style="font-size:11.5px;color:#1f7a34;margin-top:2px">→ Nhận được — tối đa '+tr+'</div>';
      if(badS.length)foot+='<div style="font-size:11px;color:#b3261e">cỡ '+badS.join(',')+' chưa đủ</div>';}
    else{const btn=(t,c)=>'<button class="btn btn-ghost btn-sm" style="margin:5px 5px 0 0;padding:4px 11px;font-size:12px" onclick="'+c+'">'+t+'</button>';
      const bs=[];
      giaoIdx.forEach(pp=>bs.push(btn('→ Giao '+ten(pp),"nvGuideGiao('"+don.id+"',"+pp+")")));
      nhanIdx.forEach(pp=>bs.push(btn('→ Nhận '+ten(pp)+' (thợ khác)',"nvGuideNhan('"+don.id+"',"+pp+",'"+p.id+"')")));
      foot=bs.length?('<div>'+bs.join('')+'</div>'):'';
      if(tickIdx.length)foot+='<div style="font-size:11px;color:var(--ink-3);margin-top:4px">Cần xong '+tickIdx.map(ten).join(', ')+' trước (tích ở lô bên dưới khi đủ điều kiện).</div>';}
    return '<div style="border:1px solid var(--line);border-left:3px solid '+color+';border-radius:8px;padding:6px 8px;margin-bottom:6px;background:#fff">'
      +'<div style="font-weight:700;font-size:12.5px;color:'+color+'">'+den+' '+(n+1)+'. '+ten(n)+' — '+label+'</div>'+chk+foot+'</div>';}).join('');
  return '<details style="margin-bottom:12px"><summary style="font-size:12px;color:var(--ink-2);cursor:pointer;margin-bottom:5px">▸ Tình trạng công đoạn (bấm để xem)</summary>'+cards+'</details>';}

/* ---------- Nhận hàng NHÚNG THẲNG vào tab "Nhận hàng" của chi tiết đơn:
   thanh chọn thợ ở trên (song song), tích thợ nào hiện form nhận của thợ ấy ---------- */
let _nhanSel={};
function nhanTabStyle(on){return `flex:0 0 auto;min-width:92px;text-align:center;padding:8px 12px;border-radius:11px;border:1.5px solid ${on?'var(--brand)':'var(--line)'};background:${on?'#fff':'var(--muslin)'};box-shadow:${on?'0 2px 8px rgba(27,42,74,.08)':'none'};cursor:pointer;line-height:1.15`;}
function nhanKhuVuc(donId){
  const groups=nhomPhieuMo(donId);
  if(!groups.length)return `<div class="divider-note" style="padding:14px">Chưa giao việc nào đang mở.</div>`;
  const sel=_nhanSel[donId];
  const g=(sel&&groups.find(x=>x.thoId===sel.thoId))||groups[0];
  const p=(sel&&sel.phieuId&&g.list.find(x=>x.id===sel.phieuId))||g.list[0];
  _nhanSel[donId]={thoId:g.thoId,phieuId:p.id};
  const tabs=groups.map(x=>{const on=x.thoId===g.thoId;const treo=days(x.ngay);
    return `<button onclick="nhanPickTho('${donId}','${x.thoId}')" style="${nhanTabStyle(on)}">
      <div style="font-weight:${on?'800':'700'};font-size:13.5px;color:${on?'var(--brand)':'var(--ink-2)'}">${x.tho.ten}</div>
      <div style="font-size:10.5px;font-weight:600;color:${on?'var(--brand)':'var(--ink-3)'};margin-top:1px">${x.conLai} cái${x.soViec>1?` · ${x.soViec} việc`:''}${treo>=3?` · giữ ${treo}n`:''}</div>
    </button>`;}).join('');
  let sub='';
  if(g.list.length>1){
    sub=`<div class="chipset" style="margin:2px 0 8px">`+g.list.map(q=>{const dn=getDon(q.donId);const on=q.id===p.id;
      return `<div class="chip ${on?'sel':''}" onclick="nhanPickPhieu('${donId}','${g.thoId}','${q.id}')">${tenDai(dn,q)}<small>còn ${pGiao(q)-pNhan(q)}</small></div>`;}).join('')
      +`</div><button class="btn btn-sage btn-sm" style="margin:0 0 10px" onclick="nhanDuNhom('${g.thoId}','${donId}')">✓ Nhận về tất cả việc của ${g.tho.ten}</button>`;
  }
  const nnC=nhanNhanhCount();
  const nnBtn=nhanNhanhCoViec()?`<button class="btn btn-primary btn-sm" style="width:100%;margin:0 0 10px" onclick="moNhanNhanhTuDon('${donId}')">⚡ Nhận nhanh toàn xưởng — ${nnC>0?nnC+' công đoạn đủ điều kiện':'xem công đoạn đang chờ'}</button>`:'';
  return `${nnBtn}<div style="position:sticky;top:96px;z-index:3;background:var(--muslin);display:flex;gap:7px;overflow-x:auto;padding:8px 0 9px;margin:0 0 2px;-webkit-overflow-scrolling:touch;box-shadow:0 7px 10px -8px rgba(27,42,74,.16)">${tabs}</div>${sub}
    <div id="nhanInlineForm" class="card" style="padding:12px">${nvFormHTML(p.id,true)}</div>`;
}
function nhanPickTho(donId,thoId){_nhanSel[donId]={thoId,phieuId:null};modalDon(donId,'nhan');}
function nhanPickPhieu(donId,thoId,phieuId){_nhanSel[donId]={thoId,phieuId};modalDon(donId,'nhan');}
function nvInlineInit(){if(!el('nhanInlineForm'))return;const p=DB.phieuGiao.find(x=>x.id===_nvPid);if(!p)return;
  if(pCds(p).length>1)nvAddLo(_nvPid,true);nvRecount();}
function nvFormHTML(phieuId,inline){const p=DB.phieuGiao.find(x=>x.id===phieuId);const don=getDon(p.donId);
  nvLos=[];_nvSeq=0;_nvPid=phieuId;_nvPending=null;nvShowHu=false;
  const sizes=pSizes(p);const cds=pCds(p);const multi=cds.length>1;const con=pGiao(p)-pNhan(p);
  let body;
  if(!multi){
    const n0=cds[0];const Xc=dkXcommit(don);
    const rows=sizes.map(s=>{const c=pConSize(p,s);
      return `<div class="nv-row"><div class="nv-lbl">Cỡ ${s}<small>giao ${pGiaoSize(p,s)} · còn ${pConSize(p,s)}</small></div>
        <div class="nv-ins">
          <div class="nv-in"><span>đạt</span><input type="number" id="nv_dat_${s}" value="${c>0?c:0}" onfocus="this.select()" oninput="nvRecount()"></div>
          <div class="nv-in nv-hu" id="nvhu_${s}" style="display:none"><span>hư</span><input type="number" id="nv_phe_${s}" value="0" onfocus="this.select()" oninput="nvRecount()"></div>
        </div></div>`;}).join('');
    let dkNote='';const coNeo=(function(){for(let k=0;k<n0;k++)if(dkNeoOf(don,k)!=null)return true;return false;})();
    if(dkCts(don,n0).length||coNeo){
      const bad=sizes.filter(s=>!dkNhanDuoc(don,n0,s,Xc)&&capDon(don,s)>0);
      if(bad.length){const ct=dkCts(don,n0)[0]||[];const thieu=ct.filter(x=>sizes.some(s=>xongCD(don,x,s)<1)).map(i=>don.snapshotCD[i].ten);
        dkNote='<div style="color:#b3261e;font-size:12px;margin-top:6px">🔴 Chưa đủ điều kiện — cần xong '+(thieu.join(', ')||'bước trước')+' trước'+(bad.length<sizes.length?' (cỡ '+bad.join(',')+')':'')+'</div>';}
      else{const tr=sizes.map(s=>s+':'+dkHeadroom(don,n0,s,Xc)).join('  ');
        dkNote='<div style="color:#1f7a34;font-size:12px;margin-top:6px">🟢 Tối đa '+tr+'</div>';}
    }
    body=`<div class="field"><label>Số cái nhận về theo cỡ</label>
      <div id="nvRows">${rows}</div>${dkNote}
      <button id="nvHuToggle" class="btn btn-ghost btn-sm" onclick="nvToggleHu()" style="margin-top:2px">+ Có hàng hư?</button>
      <div class="hint">Điền sẵn số còn lại — sửa nếu nhận thiếu, cỡ nào chưa nhận để <b>0</b>. Thợ nhận công phần đạt.</div></div>`;
  }else{
    body=`<details style="margin-bottom:10px"><summary class="hint" style="cursor:pointer">▸ Cách nhập nhiều bước (bấm xem)</summary><div class="hint" style="margin-top:6px">Mỗi <b>lô</b> = chọn <b>1 công đoạn</b> thợ vừa làm xong — số tự điền theo <b>trần</b> (mốc/điều kiện). Thợ làm xong bước khác nữa thì bấm <b>＋ Thêm lô</b>. <b>Hàng hư</b>: bật "+ Có hàng hư?" rồi nhập ở lô đang vướng.</div></details>
      <div id="nvLos"></div>
      <div style="margin-top:2px">
        <button class="btn btn-ghost btn-sm" onclick="nvAddLo('${phieuId}')">＋ Thêm lô (làm tới bước khác)</button>
        <button id="nvHuToggle" class="btn btn-ghost btn-sm" onclick="nvToggleHu()" style="margin-left:6px">+ Có hàng hư?</button>
      </div>`;
  }
  const head=inline
    ?`<div style="font-size:12.5px;color:var(--ink-2);margin:-2px 0 10px">${tenCds(don,cds)} · giao ${pGiao(p)} · ${sizes.map(s=>s+':'+pGiaoSize(p,s)).join(' ')}${pNhan(p)?` · đã nhận ${pNhan(p)}`:''} · còn ở thợ <b>${con}</b></div>`
    :`<div style="margin:-4px 0 12px"><div style="font-weight:700">${getTho(p.thoId).ten} · ${tenCds(don,cds)}</div>
      <div style="font-size:13px;color:var(--ink-2)">Giao ${pGiao(p)} cái · ${sizes.map(s=>s+':'+pGiaoSize(p,s)).join(' ')}${pNhan(p)?` · đã nhận ${pNhan(p)}`:''} · còn ở thợ <b>${con}</b></div></div>`;
  const backBtn=(!inline&&_nvBackTo&&_nvBackTo!==phieuId&&DB.phieuGiao.some(x=>x.id===_nvBackTo&&x.trangThai==='MO'))?`<button class="btn btn-ghost btn-sm" style="margin:-2px 0 10px;padding:5px 12px" onclick="nvQuayLai('${_nvBackTo}')">‹ Quay lại phiếu trước</button>`:'';
  return `${head}${backBtn}
    ${nvBangCD(p)}
    ${body}
    <div id="nvConLai" style="margin:8px 0 12px"></div>
    <div class="act-grid" style="grid-template-columns:1fr 1fr;gap:8px">
      <button class="btn btn-primary" onclick="nvNhanGiuMo('${phieuId}')">Nhận hàng</button>
      <button class="btn btn-sage" onclick="nvXong('${phieuId}')">Nhận &amp; đóng phiếu</button></div>
    <div class="hint" style="text-align:center;margin-top:6px"><b>Nhận hàng</b>: ghi nhận, giữ phiếu mở tới khi xong hết công đoạn đã giao. <b>Nhận &amp; đóng phiếu</b>: chốt phiếu ngay.</div>
    ${p.dongNhan.length?'':`<div style="height:10px"></div><div style="text-align:center"><button class="btn btn-ghost btn-sm" onclick="doHuyPhieu('${phieuId}')">Thợ chưa làm gì — hủy phiếu</button></div>`}`;
}
function modalNhanVe(phieuId,opts){const p=DB.phieuGiao.find(x=>x.id===phieuId);
  openSheet('Nhận hàng về',nvFormHTML(phieuId,false));
  if(pCds(p).length>1)nvAddLo(phieuId,true);
  nvRecount();
}
/* một LÔ: tập bước đã xong (mặc định đủ) + số cái đạt/hư từng cỡ */
/* chọn công đoạn mặc định cho lô: bước đầu tiên ĐỦ ĐIỀU KIỆN + còn ở thợ; không có thì bước đầu */
function nvDefStage(p){const don=getDon(p.donId);const full=pCds(p);const X=dkXcommit(don);const live=pSizes(p).filter(s=>capDon(don,s)>0);
  for(const n of full){if(live.some(s=>pGiuCD(p,n,s)>0&&dkNhanDuoc(don,n,s,X)&&dkHeadroom(don,n,s,X)>0))return n;}
  return full[0];}
/* chọn 1 bước (kiểu radio): bỏ tích các bước khác, rồi điền lại số theo trần của bước vừa chọn */
function nvLoPick(g,n){const p=DB.phieuGiao.find(x=>x.id===_nvPid);if(!p)return;const full=pCds(p);
  full.forEach(k=>{const e=el('nvlcd_'+g+'_'+k);if(e)e.checked=(k===n);});
  nvRefillLo(g);nvLoSync(g);}
/* điền số lượng của lô theo trần (mốc/điều kiện) của bước đang chọn, chặn bởi "còn ở thợ" */
function nvRefillLo(g){const p=DB.phieuGiao.find(x=>x.id===_nvPid);if(!p)return;const full=pCds(p);
  const ticked=full.filter(n=>{const e=el('nvlcd_'+g+'_'+n);return e&&e.checked;});
  if(ticked.length!==1)return;const n=ticked[0];
  pSizes(p).forEach(s=>{const e=el('nvl_'+g+'_'+s);if(e)e.value=Math.max(0,Math.min(pGiuCD(p,n,s),nvLoTranSize(p,[n],s)));});}
function nvAddLo(phieuId,prefill){const p=DB.phieuGiao.find(x=>x.id===phieuId);const don=getDon(p.donId);
  const g=++_nvSeq;nvLos.push(g);const full=pCds(p);const sizes=pSizes(p);const first=nvLos.length===1;
  const def=nvDefStage(p);
  const cdBoxes=full.map(n=>`<label class="chip" style="cursor:pointer"><input type="checkbox" id="nvlcd_${g}_${n}" ${n===def?'checked':''} onchange="nvLoPick(${g},${n})" style="margin-right:5px">${n+1}.${don.snapshotCD[n].ten}</label>`).join('');
  const datIns=sizes.map(s=>{const v=prefill?Math.max(0,Math.min(pGiuCD(p,def,s),nvLoTranSize(p,[def],s))):'';return `<div class="nv-in"><span>${s}</span><input type="number" id="nvl_${g}_${s}" value="${v}" placeholder="0" onfocus="this.select()" oninput="nvRecount()" style="width:56px"></div>`;}).join('');
  const pheIns=sizes.map(s=>`<div class="nv-in nv-hu" id="nvlhu_${g}_${s}" style="display:${nvShowHu?'':'none'}"><span>${s} hư</span><input type="number" id="nvlp_${g}_${s}" value="0" onfocus="this.select()" oninput="nvRecount()" style="width:48px"></div>`).join('');
  const html=`<div class="nvg-card" id="nvloCard_${g}" style="border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px;background:#fff">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <b id="nvloSum_${g}" style="flex:1;font-size:13px">Xong: ${don.snapshotCD[def].ten}</b>
      ${first?'':`<button class="btn btn-ghost btn-sm" onclick="nvDelLo(${g})" style="padding:4px 9px">✕</button>`}</div>
    <div style="font-size:11.5px;color:var(--ink-2);margin-bottom:4px">Chọn 1 công đoạn thợ vừa làm xong (số tự điền theo trần):</div>
    <div id="nvloCds_${g}" class="chipset" style="margin-bottom:8px">${cdBoxes}</div>
    <div class="nv-ins" style="flex-wrap:wrap;gap:6px">${datIns}${pheIns}</div>
    <div id="nvlDK_${g}"></div></div>`;
  const box=el('nvLos');if(box)box.insertAdjacentHTML('beforeend',html);nvLoSync(g);nvRecount();}
function nvLoToggle(g){const e=el('nvloCds_'+g);if(e)e.style.display=(e.style.display==='none'?'':'none');}
function nvLoSync(g){const p=DB.phieuGiao.find(x=>x.id===_nvPid);if(!p)return;const full=pCds(p);const don=getDon(p.donId);
  const ticked=full.filter(n=>{const e=el('nvlcd_'+g+'_'+n);return e&&e.checked;});
  pSizes(p).forEach(s=>{const e=el('nvlhu_'+g+'_'+s);if(e)e.style.display=nvShowHu?'':'none';});
  const b=el('nvloSum_'+g);if(!b){nvRecount();return;}
  if(!ticked.length)b.innerHTML='⚠ Chưa chọn công đoạn';
  else b.innerHTML='Xong: '+ticked.map(n=>don.snapshotCD[n].ten).join(', ');
  nvDKInfo(g);nvRecount();}
function nvDelLo(g){nvLos=nvLos.filter(x=>x!==g);const c=el('nvloCard_'+g);if(c)c.remove();nvRecount();}
function nvToggleHu(){const p=DB.phieuGiao.find(x=>x.id===_nvPid);if(!p)return;nvShowHu=!nvShowHu;const full=pCds(p);
  pSizes(p).forEach(s=>{const e=el('nvhu_'+s);if(e)e.style.display=nvShowHu?'':'none';});
  for(const g of nvLos){
    pSizes(p).forEach(s=>{const e=el('nvlhu_'+g+'_'+s);if(e)e.style.display=nvShowHu?'':'none';});}
  const b=el('nvHuToggle');if(b)b.textContent=nvShowHu?'– Ẩn cột hư':'+ Có hàng hư?';}
/* số CÒN CHƯA KHAI = số còn ở thợ − tổng đã gõ (đạt+hư, mọi lô) */
function nvRecount(){const p=DB.phieuGiao.find(x=>x.id===_nvPid);if(!p)return;const full=pCds(p);
  const box=el('nvConLai');if(!box)return;
  if(full.length<=1){let khai=0;pSizes(p).forEach(s=>{khai+=numVal('nv_dat_'+s)+numVal('nv_phe_'+s);});
    const con=pGiao(p)-pNhan(p);const conLai=con-khai;let bg,fg,txt;
    if(conLai<0){bg='#fdeaea';fg='#b3261e';txt='⚠ Vượt <b>'+(-conLai)+'</b> cái so với số còn ở thợ ('+con+') — bớt lại.';}
    else if(conLai===0){bg='#e8f5ea';fg='#1f7a34';txt='✓ Đã khai đủ '+con+' cái còn ở thợ.';}
    else{bg='#fdf3e3';fg='#8a5a00';txt='⏳ Còn chưa khai: <b>'+conLai+'</b> cái — bấm Xong sẽ hỏi phần này ở đâu.';}
    box.innerHTML='<div style="padding:9px 11px;border-radius:10px;font-size:13.5px;background:'+bg+';color:'+fg+'">'+txt+'</div>';return;}
  const con=pGiao(p)-pNhan(p);
  box.innerHTML=con>0
    ?'<div style="padding:8px 11px;border-radius:10px;font-size:13px;background:#f3f4f6;color:var(--ink-2)">Còn ở thợ (chưa xong hết gói): <b>'+con+'</b> cái. Ghi từng công đoạn — xong hết bước mới đóng phiếu.</div>'
    :'<div style="padding:8px 11px;border-radius:10px;font-size:13px;background:#e8f5ea;color:#1f7a34">✓ Đã xong hết gói.</div>';}
function stepIn(id,d){const e=el(id);e.value=Math.max(0,(+e.value||0)+d)}
/* đọc mọi lô -> batches {dat,phe,(cds nếu chỉ vài bước)}. Lô đủ bước = "cả gói" (không kèm cds, y như cũ). */
function nvReadLos(p){const full=pCds(p);const out=[];
  if(full.length<=1){const dat={},phe={};pSizes(p).forEach(s=>{const d=numVal('nv_dat_'+s);if(d>0)dat[s]=d;const f=numVal('nv_phe_'+s);if(f>0)phe[s]=f;});
    if(sum(Object.values(dat))+sum(Object.values(phe))>0)out.push({dat,phe});return out;}
  for(const g of nvLos){
    const ticked=full.filter(n=>{const e=el('nvlcd_'+g+'_'+n);return e&&e.checked;});
    const caGoi=ticked.length>=full.length;
    const dat={},phe={};pSizes(p).forEach(s=>{const d=numVal('nvl_'+g+'_'+s);if(d>0)dat[s]=d;const f=numVal('nvlp_'+g+'_'+s);if(f>0)phe[s]=f;});
    if(!sum(Object.values(dat))&&!sum(Object.values(phe)))continue;
    if(!ticked.length)throw new Error('Có lô chưa tích bước nào đã xong — tích bước hoặc xoá lô đó.');
    if(caGoi)out.push({dat,phe});
    else out.push({dat,phe,cds:ticked});}
  return out;}
function nvBatches(p){const all=nvReadLos(p);const full=pCds(p);const fin=finalCd(p);const don=getDon(p.donId);
  const ten=i=>don.snapshotCD[i]?don.snapshotCD[i].ten:('bước '+(i+1));
  for(const s of pSizes(p)){const giaoS=pGiaoSize(p,s);
    for(const n of full){let after=pXongBuocSize(p,n,s);
      for(const b of all){const T=(b.cds&&b.cds.length)?b.cds:full;if(T.indexOf(n)>=0)after+=(b.dat&&b.dat[s])||0;}
      if(n===fin){let phe=pPheSize(p,s);for(const b of all)phe+=(b.phe&&b.phe[s])||0;
        if(after+phe>giaoS)throw new Error('Cỡ '+s+': "'+ten(n)+'" xong '+after+' + hư '+phe+' vượt số giao ('+giaoS+'). Bớt lại.');}
      else if(after>giaoS)throw new Error('Cỡ '+s+': "'+ten(n)+'" nhận '+after+' vượt số giao ('+giaoS+'). Bớt lại.');}}
  nvKiemTraDK(p,all);
  return all;}
function doHuyPhieu(phieuId){try{const p=DB.phieuGiao.find(x=>x.id===phieuId);huyPhieu(phieuId);
  closeSheet();render();modalDon(p.donId,'nhan');toast('Đã hủy phiếu, trả hàng về hàng chờ.');}catch(e){toast(e.message,true)}}
/* MỘT nút "Xong": khai đủ -> đóng luôn; còn thiếu -> hỏi đúng 1 câu. */
/* đã nhận đủ MỌI công đoạn đã giao cho toàn bộ số cái chưa? (để nút "Nhận hàng" biết khi nào đóng) */
function pXongHetBuoc(p){const cds=pCds(p);
  for(const s of pSizes(p)){const target=pGiaoSize(p,s)-pPheSize(p,s);if(target<=0)continue;
    for(const n of cds){if(pXongBuocSize(p,n,s)<target)return false;}}
  return true;
}
/* NÚT "NHẬN HÀNG": ghi nhận (trả hàng về như thường), NHƯNG giữ phiếu MỞ nếu gói còn

function nvNhanGiuMo(phieuId){try{const p=DB.phieuGiao.find(x=>x.id===phieuId);if(!p)return;

  if(veBack)modalNhanVe(back);else if(_nhanNhanhBack){_nhanNhanhBack=false;moNhanNhanh();}else modalDon(p.donId,'nhan');

function nvXong(phieuId){try{const p=DB.phieuGiao.find(x=>x.id===phieuId);if(!p)return;
  const batches=nvBatches(p);
  const conLai=pConSauBatches(p,batches);
  const don=getDon(p.donId);const full=pCds(p);const sizeList=pSizes(p);const nhieu=sizeList.length>1;
  const perStr=m=>nhieu?' ('+sizeList.filter(s=>m[s]).map(s=>s+':'+m[s]).join(' ')+')':'';
  const cdList=cds=>cds.map(i=>(i+1)+'.'+(don.snapshotCD[i]?don.snapshotCD[i].ten:'?')).join(', ');
  let msg='';
  batches.forEach(b=>{const cds=(b.cds&&b.cds.length)?b.cds.slice().sort((x,y)=>x-y):full.slice();
    const dq=sum(Object.values(b.dat||{}));const hq=sum(Object.values(b.phe||{}));

    return;}
  _nvPending={phieuId,batches,conLai};
  openSheet('Còn '+conLai+' cái chưa khai — đang ở đâu?',`
    <div class="hint" style="margin-bottom:12px">Đã khai:${msg.replace(/\n/g,'<br>')}<br><br>Còn <b>${conLai} cái</b> chưa khai — chọn cách xử lý:</div>
    <button class="btn btn-primary" onclick="nvChonGiu()" style="margin-bottom:10px">🧵 Thợ giữ, làm tiếp — giữ phiếu mở</button>

}catch(e){toast(e.message,true)}}

/* ③ BỎ LUÔN — trừ số thiếu khỏi kế hoạch đơn (capDon giảm), KHÔNG ghi lỗ.

/* nhận đủ toàn bộ việc thợ đang giữ — chạy lần lượt từng phiếu, sổ vẫn ghi riêng */

/* ============================================================
   ⚡ NHẬN NHANH — gom mọi công đoạn ĐỦ ĐIỀU KIỆN NHẬN toàn xưởng.
   Bấm 1 dòng → nhảy thẳng vào form nhận (đã điền sẵn) rồi quay lại bảng;
   hoặc "Nhận hết" theo từng thợ / tất cả (chạy nền, không mở form).
   Số & điều kiện dùng đúng logic form: pGiuCD + dkNhanDuoc + dkHeadroom.
   ============================================================ */
let _nhanNhanhBack=false,_nnReturn=null,_sheetClose=null;
/* mở bảng Nhận nhanh TỪ trang nhận hàng của 1 đơn -> nhớ đường về đúng trang đó */
function moNhanNhanhTuDon(donId){_nnReturn={donId};moNhanNhanh();}
/* đóng bảng Nhận nhanh: nếu mở từ trang nhận hàng thì quay lại đúng trang đó, không thoát ra màn chính */
function nnThoat(){const r=_nnReturn;_nnReturn=null;_nhanNhanhBack=false;if(r&&getDon(r.donId))modalDon(r.donId,'nhan');else closeSheet();}
/* số cái sẵn sàng nhận ở bước n của phiếu p (đúng công thức điền sẵn của lô) */
function nnQtyBuoc(p,n){const don=getDon(p.donId);const live=pSizes(p).filter(s=>capDon(don,s)>0);
  return sum(live.map(s=>Math.max(0,Math.min(pGiuCD(p,n,s),nvLoTranSize(p,[n],s)))));}
/* các bước ĐỦ ĐIỀU KIỆN NHẬN của phiếu (thợ đang giữ + điều kiện/mốc cho phép + còn số) */
function nnBuocSan(p){const don=getDon(p.donId);const X=dkXcommit(don);const live=pSizes(p).filter(s=>capDon(don,s)>0);
  return pCds(p).filter(n=>live.some(s=>pGiuCD(p,n,s)>0&&dkNhanDuoc(don,n,s,X)&&dkHeadroom(don,n,s,X)>0)&&nnQtyBuoc(p,n)>0);}
/* CHUỖI BẬC của phiếu: 0 = nhận được ngay; 1 = còn 1 bước; 2 = còn 2 bước.
   Mô phỏng lần lượt hoàn thành bước sẵn sàng để mở khoá bước kế (đúng engine điều kiện). */
function nnPipeline(p){const don=getDon(p.donId);if(!don)return[];
  const live=pSizes(p).filter(s=>capDon(don,s)>0);const full=pCds(p);
  const add={};full.forEach(n=>add[n]={});
  const Xs=(n,s)=>xongCD(don,n,s)+((add[n]&&add[n][s])||0);
  const held=(n,s)=>Math.max(0,pGiuCD(p,n,s)-((add[n]&&add[n][s])||0));
  const ten=i=>don.snapshotCD[i]?don.snapshotCD[i].ten:('bước '+(i+1));
  const tier={},qty={};
  for(let d=0;d<=2;d++){
    const ready=full.filter(n=>!(n in tier)&&live.some(s=>held(n,s)>0&&dkNhanDuoc(don,n,s,Xs)&&dkHeadroom(don,n,s,Xs)>0));
    if(!ready.length)break;
    ready.forEach(n=>{tier[n]=d;qty[n]=sum(live.map(s=>Math.max(0,Math.min(held(n,s),d===0?nvLoTranSize(p,[n],s):held(n,s)))));});
    ready.forEach(n=>live.forEach(s=>{const h=held(n,s);if(h>0)add[n][s]=(add[n][s]||0)+h;}));
  }
  return Object.keys(tier).map(k=>+k).sort((a,b)=>tier[a]-tier[b]||a-b).map(n=>{
    const pre=(dkCts(don,n)[0]||[]).filter(x=>full.indexOf(x)>=0).map(ten);
    return {n,ten:ten(n),tier:tier[n],qty:qty[n]||0,pre};});}
/* quét toàn xưởng -> gộp theo thợ, sắp thợ giữ lâu nhất lên trên */
/* CHUỖI ĐỦ CÔNG ĐOẠN của ĐƠN, từ trên xuống:
   tier 0 = nhận được ngay (có thợ đang giữ + đủ điều kiện);
   tier 1,2,3… = các công đoạn còn lại chưa nhận được (chưa giao / chờ bước trước),
   đánh số "còn N bước" theo thứ tự sản xuất. Chỉ bỏ công đoạn đã xong hết. */
function nnDonPipeline(don){
  const live=sizesOf(don).filter(s=>capDon(don,s)>0);const X=dkXcommit(don);
  const ten=i=>don.snapshotCD[i]?don.snapshotCD[i].ten:('bước '+(i+1));
  const full=don.snapshotCD.map((_,i)=>i);
  const remaining=full.filter(n=>live.some(s=>xongCD(don,n,s)<capDon(don,s)));
  const recvNow=n=>live.some(s=>dangGiuCD(don,n,s)>0&&dkNhanDuoc(don,n,s,X)&&dkHeadroom(don,n,s,X)>0);
  let fut=0;
  return remaining.map(n=>{
    if(recvNow(n)){const holders=[];
      DB.phieuGiao.filter(p=>p.donId===don.id&&p.trangThai==='MO'&&pLam(p,n)&&(pGiao(p)-pNhan(p))>0).forEach(p=>{
        const q=sum(live.map(s=>Math.max(0,Math.min(pGiuCD(p,n,s),nvLoTranSize(p,[n],s)))));
        if(q>0)holders.push({phieuId:p.id,tho:getTho(p.thoId),qty:q});});
      if(holders.length)return {n,ten:ten(n),tier:0,holders,qty:sum(holders.map(h=>h.qty)),pre:[]};}
    fut++;const giu=live.some(s=>dangGiuCD(don,n,s)>0);
    const pre=(dkCts(don,n)[0]||[]).filter(x=>full.indexOf(x)>=0&&live.some(s=>xongCD(don,x,s)<1)).map(ten);
    return {n,ten:ten(n),tier:fut,holders:[],qty:0,pre,giu};});}
/* quét toàn xưởng -> gộp theo ĐƠN (chỉ đơn có ≥1 công đoạn nhận được ngay) */
function nhanNhanhScan(){const ids=[];
  DB.phieuGiao.filter(p=>p.trangThai==='MO'&&(pGiao(p)-pNhan(p))>0).forEach(p=>{if(ids.indexOf(p.donId)<0)ids.push(p.donId);});
  const out=[];
  ids.forEach(id=>{const don=getDon(id);if(!don)return;
    const pipe=nnDonPipeline(don);if(!pipe.length)return;
    const greens=pipe.filter(r=>r.tier===0);
    const openP=DB.phieuGiao.filter(p=>p.donId===id&&p.trangThai==='MO');
    const ngay=Math.min.apply(null,openP.map(p=>p.ngay));
    out.push({donId:id,don,donMa:don.ma,chuTen:(getChu(don.chuHangId)||{}).ten||'',pipe,greens,
      hasGreen:greens.length>0,soSan:sum(greens.map(g=>g.holders.length)),tongCai:sum(greens.map(g=>g.qty)),ngay,days:days(ngay)});});
  return out.sort((a,b)=>(a.hasGreen?0:1)-(b.hasGreen?0:1)||a.ngay-b.ngay);}
function nhanNhanhCount(){return sum(nhanNhanhScan().map(g=>g.soSan));}
function nhanNhanhCoViec(){return DB.phieuGiao.some(p=>p.trangThai==='MO'&&(pGiao(p)-pNhan(p))>0);}
/* dựng batch mặc định (đúng bước sẵn-sàng đầu tiên, số điền sẵn) để nhận nền */
function nhanNhanhBatches(p){const full=pCds(p);const n=nvDefStage(p);const don=getDon(p.donId);
  const live=pSizes(p).filter(s=>capDon(don,s)>0);const dat={};
  live.forEach(s=>{const q=Math.max(0,Math.min(pGiuCD(p,n,s),nvLoTranSize(p,[n],s)));if(q>0)dat[s]=q;});
  if(!sum(Object.values(dat)))return[];
  return full.length<=1?[{dat,phe:{}}]:[{dat,phe:{},cds:[n]}];}
/* nhận nền 1 phiếu (bước sẵn sàng đầu tiên); đóng phiếu nếu đã xong hết gói */
function nhanNhanhChay(phieuId){const p=DB.phieuGiao.find(x=>x.id===phieuId);
  if(!p||p.trangThai!=='MO')return false;const batches=nhanNhanhBatches(p);if(!batches.length)return false;
  nhanVe({phieuId,batches});
  if(pXongHetBuoc(p)){p.hut=0;p.lyDoHut=null;p.thoTra=Math.max(0,pGiao(p)-pNhan(p));p.trangThai='DONG';}
  return true;}
/* bấm 1 dòng -> mở form nhận (đã điền sẵn), nhận xong quay lại bảng Nhận nhanh */
function nhanNhanhVao(phieuId){_nhanNhanhBack=true;modalNhanVe(phieuId);_sheetClose=()=>{_nhanNhanhBack=false;moNhanNhanh();};}
/* nhận LIÊN TIẾP cả chuỗi bước của 1 phiếu: xong bước này mở khoá bước sau, nhận tiếp */
function nhanNhanhChayChuoi(phieuId){let k=0,guard=0;
  while(guard++<40){if(!nhanNhanhChay(phieuId))break;k++;
    const p=DB.phieuGiao.find(x=>x.id===phieuId);if(!p||p.trangThai!=='MO')break;}

/* nhận liên tiếp mọi công đoạn sẵn sàng của 1 ĐƠN */
function nhanNhanhDon(donId){const g=nhanNhanhScan().find(x=>x.donId===donId);
  if(!g)return toast('Đơn này không còn công đoạn sẵn sàng.',true);
  const pids=[];g.greens.forEach(r=>r.holders.forEach(h=>{if(pids.indexOf(h.phieuId)<0)pids.push(h.phieuId);}));
  xacNhan('Đơn '+g.donMa+' — nhận liên tiếp '+g.soSan+' công đoạn đủ điều kiện?\nTiền công phần đạt sẽ ghi ngay.',()=>{

/* nhận hết tất cả công đoạn sẵn sàng toàn xưởng */
function nhanNhanhTatCa(){const gs=nhanNhanhScan();if(!gs.length)return;
  const soDon=gs.length,soCD=sum(gs.map(g=>g.soSan));const pids=[];
  gs.forEach(g=>g.greens.forEach(r=>r.holders.forEach(h=>{if(pids.indexOf(h.phieuId)<0)pids.push(h.phieuId);})));
  xacNhan('Nhận liên tiếp mọi công đoạn đủ điều kiện của '+soDon+' đơn ('+soCD+' công đoạn)?\nTiền công phần đạt sẽ ghi ngay.',()=>{

/* mở bảng Nhận nhanh (bottom-sheet) — gom theo ĐƠN, liệt kê ĐỦ chuỗi công đoạn từ trên xuống */
function moNhanNhanh(){const gs=nhanNhanhScan();
  const nnBack=(_nnReturn&&getDon(_nnReturn.donId))?`<button class="btn btn-ghost btn-sm" style="width:100%;margin:-2px 0 10px;padding:7px 12px;text-align:left" onclick="nnThoat()">‹ Quay lại nhận hàng ${getDon(_nnReturn.donId).ma}</button>`:'';
  if(!gs.length){openSheet('⚡ Nhận nhanh',nnBack+`<div class="empty" style="padding:34px"><div class="ic">✅</div><b>Không có hàng nào đang ở thợ</b>Khi thợ nhận việc, các công đoạn sẽ hiện ở đây.</div>`);if(_nnReturn)_sheetClose=nnThoat;return;}
  const soCD=sum(gs.map(g=>g.soSan));const coXanh=gs.some(g=>g.hasGreen);
  let h=nnBack+`<div class="hint" style="margin:-2px 2px 10px">Mỗi đơn liệt kê <b>đủ công đoạn từ trên xuống</b>: 🟢 nhận được ngay (bấm để nhận, số điền sẵn) rồi các bước <b>chưa tới lượt</b> (⚪ còn N bước). Nhận xong bước xanh, bước kế tự lên xanh để bấm liên tiếp.</div>`;
  if(soCD>1)h+=`<button class="btn btn-sage" style="margin-bottom:12px" onclick="nhanNhanhTatCa()">✓ Nhận hết tất cả (${soCD} công đoạn)</button>`;
  let daChen=false;
  h+=gs.map(g=>{
    let sep='';
    if(!g.hasGreen&&!daChen){daChen=true;sep=`<div class="section-h" style="margin:10px 2px 6px;color:var(--ink-3)">Đang chờ — chưa tới lượt nhận</div>`;}
    const rows=g.pipe.map(r=>{
      if(r.tier===0){
        return r.holders.map(hd=>`<div class="slip" onclick="nhanNhanhVao('${hd.phieuId}')">
          <div style="flex:1;display:flex;justify-content:space-between;gap:8px;align-items:center">
            <span style="font-size:13px;font-weight:600">🟢 ${r.ten}${hd.tho?` · <span style="color:var(--ink-2);font-weight:500">${hd.tho.ten}</span>`:''}</span>
            <b style="color:#1f7a34;white-space:nowrap">${hd.qty} cái · nhận được ngay</b></div>
          <span style="color:var(--ink-3);align-self:center;margin-left:6px">›</span></div>`).join('');
      }
      const ly=r.pre&&r.pre.length?`cần ${r.pre.join(', ')}`:(r.giu?'thợ đang giữ, chờ bước trước':'chưa giao thợ');
      return `<div class="slip" style="opacity:.6">
        <div style="flex:1;display:flex;justify-content:space-between;gap:8px;align-items:center">
          <span style="font-size:12.5px">⚪ ${r.ten}</span>
          <span style="color:var(--ink-3);white-space:nowrap;font-size:11.5px">còn ${r.tier} bước · ${ly}</span></div></div>`;
    }).join('');
    const meta=g.hasGreen?`${g.soSan} công đoạn nhận được ngay · ${g.tongCai} cái`:`đang chờ · ${g.pipe.length} công đoạn`;
    return `${sep}<div class="pg-group"><div class="pg-head">
        <div><div class="who">${g.donMa}${g.chuTen?` · ${g.chuTen}`:''}</div>
          <div class="meta">${meta}</div></div>
        ${g.days>=3?`<div class="pg-warn">giữ ${g.days} ngày</div>`:''}</div>
      ${rows}
      ${g.soSan>1?`<div class="pg-foot"><button class="btn btn-sage btn-sm" onclick="nhanNhanhDon('${g.donId}')">✓ Nhận hết đơn ${g.donMa}</button></div>`:''}</div>`;}).join('');

function thoGioThieuGio(don){
  const ids=[...new Set(DB.phieuGiao.filter(p=>p.donId===don.id&&p.trangThai!=='HUY').map(p=>p.thoId))]
    .filter(id=>{const t=getTho(id);return t&&t.loai==='gio';});
  return ids.filter(id=>!(DB.phienGio||[]).some(x=>x.donId===don.id&&x.thoId===id)).map(id=>getTho(id));
}
function confirmDongDon(donId){const don=getDon(donId);const conLai=coTheGiaoTong(don);

  const soChuaRo=sum(hutChuaRo.map(p=>p.hut));

  const closeBlock=thieuGio.length?
    `<div style="display:flex;flex-direction:column;gap:8px">${thieuGio.map(t=>`<button class="btn btn-tape" onclick="modalChamGio('${donId}','${t.id}')">⏱️ Nhập giờ cho ${t.ten}</button>`).join('')}</div>

    ${thieuGio.length?`<div class="warn-box" style="background:var(--thread-soft);border-color:var(--thread);color:var(--thread)">⏱️ Đơn có <b>thợ tính giờ chưa nhập số giờ</b>: <b>${tenGio}</b>. Nhập giờ trước khi đóng, nếu không lãi sẽ <b>thiếu tiền công thợ</b> (lãi ảo).</div>`:''}

    <div class="warn-box">${conLai>0?`Còn <b>${conLai} cái</b> đã xong chưa giao. Đóng đơn = không giao số này nữa.`:'Tất cả hàng đã giao. Sẵn sàng chốt lãi.'}</div>
    <div class="hint" style="margin-bottom:16px">Sau khi đóng, đơn khóa lại và hiện <b>lãi ròng ước tính</b>.</div>

/* Danh sách ngày (bao gồm 2 đầu) giữa tu..den, mỗi phần tử 'YYYY-MM-DD' */
function gbsDays(tu,den){const out=[];const a=tu.split('-').map(Number),b=den.split('-').map(Number);
  let d=new Date(a[0],a[1]-1,a[2]);const e=new Date(b[0],b[1]-1,b[2]);const p=n=>String(n).padStart(2,'0');
  while(d<=e){out.push(d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()));d.setDate(d.getDate()+1);if(out.length>400)break;}
  return out;}
/* Ghi cùng một khoản cho nhiều ngày liên tiếp (lương bao / chi phí cố định…) */
function submitGhiBoSungLap(loai,s){try{
  let tu=(el('gbs_tu')||{}).value||'',den=(el('gbs_den')||{}).value||'';
  if(!tu||!den)return toast('Chọn từ ngày và đến ngày.',true);
  if(tu>den){const t=tu;tu=den;den=t;}
  if(kmTs(den)>now())return toast('Không ghi cho ngày chưa tới.',true);
  let thoId='',kind='com';
  if(loai==='congls'||loai==='psth'||loai==='tra'||loai==='ung'){thoId=(el('gbs_tho')||{}).value||'';if(!thoId)return toast('Chọn thợ.',true);}
  if(loai==='psth')kind=(el('gbs_pskind')||{}).value||'com';
  const dg=(el('gbs_dg')&&el('gbs_dg').value)?el('gbs_dg').value.trim():'';
  const paid=(loai==='congls'&&el('gbs_paid')&&el('gbs_paid').checked);
  const days=gbsDays(tu,den);
  if(DB.settings.kyKhoa&&DB.settings.kyKhoaTime&&days.some(ds=>kmTs(ds)<=DB.settings.kyKhoaTime))
    return toast('Khoảng ngày chạm kỳ đã khóa — không ghi được.',true);
  let n=0;
  days.forEach(ds=>{const ts=kmTs(ds);if(ts>now())return;
    if(loai==='chi')chiPhiXuong({soTien:s,dienGiai:dg||'chi phí xưởng',ngay:ts});
    else if(loai==='tra')traLuong({thoId,soTien:s,ngay:ts});
    else if(loai==='ung')ungLuong({thoId,soTien:s,ngay:ts});
    else if(loai==='psth')phatSinhTho({thoId,soTien:s,kind,dienGiai:dg,ngay:ts});
    else if(loai==='congls'){congThoLichSu({thoId,soTien:s,ngay:ts});if(paid)traLuong({thoId,soTien:s,ngay:ts});}
    _csDayOpen[ds]=true;n++;});
  if(!n)return toast('Không có ngày hợp lệ.',true);
  const nd=new Date();
  const allSameMonth=days.every(ds=>{const q=ds.split('-').map(Number);return q[0]===nd.getFullYear()&&(q[1]-1)===nd.getMonth();});
  _csFilter=allSameMonth?'thang':'all';
  const a=tu.split('-').map(Number),b=den.split('-').map(Number);
  closeSheet();render();
  toast('Đã ghi '+n+' ngày ('+a[2]+'/'+a[1]+'–'+b[2]+'/'+b[1]+'). Xóa từng ngày ở Chốt sổ nếu cần.');
}catch(e){toast(e.message,true)}}

/* ============ KẾ MỤC THỢ — máy tính công theo ngày (chức năng TẠM, lưu riêng theo máy) ============
   Không ghi vào sổ kế toán, không vào sao lưu/đám mây. Chỉ để bấm tính công nhanh. */
const KM_KEY='soxuong_kemuc';
function kmToday(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function kmTs(dstr){const p=(dstr||'').split('-').map(Number);if(dstr===kmToday())return now();return new Date(p[0],(p[1]||1)-1,p[2]||1,12,0,0,0).getTime();}
function kmNewDay(){return {thoId:'',ngay:kmToday(),lines:[{sl:'',dg:''}],daLuu:false,luuTien:0};}
let kmDays=[kmNewDay()];
let kmCpMode='xuong',kmCpKind='com',kmCpSl='',kmCpDg='',kmCpNgay='',kmCpTho='';
function kmCpSync(){const a=el('km_cp_sl');if(a)kmCpSl=a.value;const b=el('km_cp_dg');if(b)kmCpDg=b.value;const c=el('km_cp_ngay');if(c)kmCpNgay=c.value;const t=el('km_cp_tho');if(t)kmCpTho=t.value;}
function kmCpSetMode(m){kmCpSync();kmCpMode=m;kmRedraw();}
function kmCpSetKind(k){kmCpSync();kmCpKind=k;kmRedraw();}
function kmF(x){return (Math.round(x)||0).toLocaleString('vi-VN');}
function kmNum(id){const e=el(id);if(!e)return 0;return +(''+e.value).replace(/[^\d]/g,'')||0;}
/* Di cư shape cũ (ngày = mảng dòng) → object có thợ/ngày/đã lưu */
function kmNorm(){
  if(!Array.isArray(kmDays))kmDays=[kmNewDay()];
  kmDays=kmDays.map(day=>{
    if(Array.isArray(day))return {thoId:'',ngay:kmToday(),lines:day.length?day:[{sl:'',dg:''}],daLuu:false,luuTien:0};
    if(!day||typeof day!=='object')return kmNewDay();
    day.lines=(Array.isArray(day.lines)&&day.lines.length)?day.lines:[{sl:'',dg:''}];
    if(day.thoId==null)day.thoId='';
    if(!day.ngay)day.ngay=kmToday();
    if(day.daLuu==null)day.daLuu=false;
    if(day.luuTien==null)day.luuTien=0;
    return day;});
  if(!kmDays.length)kmDays=[kmNewDay()];
}
function kmLoad(){try{const r=localStorage.getItem(KM_KEY);if(r){const a=JSON.parse(r);if(Array.isArray(a)&&a.length)kmDays=a;}}catch(e){}kmNorm();}
function kmSave(){try{localStorage.setItem(KM_KEY,JSON.stringify(kmDays));}catch(e){}}
function kmSync(){kmDays.forEach((day,d)=>{
  if(day.daLuu)return;
  const th=el('km_tho_'+d);if(th)day.thoId=th.value;
  const ng=el('km_ngay_'+d);if(ng)day.ngay=ng.value;
  day.lines.forEach((ln,i)=>{const s=el('km_'+d+'_'+i+'_sl'),g=el('km_'+d+'_'+i+'_dg');if(s)ln.sl=s.value;if(g)ln.dg=g.value;});
});}
function kmDayTong(d){const day=kmDays[d];if(day.daLuu)return day.luuTien||0;let t=0;day.lines.forEach((ln,i)=>{t+=kmNum('km_'+d+'_'+i+'_sl')*kmNum('km_'+d+'_'+i+'_dg');});return t;}
function kmCalc(){let grand=0;
  kmDays.forEach((day,d)=>{let t=0;
    if(day.daLuu){t=day.luuTien||0;}
    else day.lines.forEach((ln,i)=>{const sl=kmNum('km_'+d+'_'+i+'_sl'),dg=kmNum('km_'+d+'_'+i+'_dg');
      const s=el('km_'+d+'_'+i+'_sl'),g=el('km_'+d+'_'+i+'_dg');if(s)ln.sl=s.value;if(g)ln.dg=g.value;
      const tt=sl*dg;t+=tt;const te=el('km_'+d+'_'+i+'_tt');if(te)te.textContent=tt?kmF(tt):'';});
    grand+=t;const de=el('km_day_'+d);if(de)de.textContent=kmF(t);
    const lb=el('km_luubtn_'+d);if(lb)lb.disabled=!(t>0&&((el('km_tho_'+d)||{}).value||day.thoId));});
  const ge=el('km_grand');if(ge)ge.textContent=kmF(grand);kmSave();}
function viewKeMuc(m){kmLoad();
  m.innerHTML=`<div class="view-title">Tính sổ<small>Tính công · lưu tạm vào sổ</small></div><div id="kmWrap">${kmBodyHtml()}</div>`;
  el('fab').innerHTML='';kmCalc();}
function kmRedraw(){const w=el('kmWrap');if(w){w.innerHTML=kmBodyHtml();kmCalc();}}
function kmThoOpts(sel){return DB.tho.filter(t=>!t.isOwner).map(t=>`<option value="${t.id}" ${sel===t.id?'selected':''}>${t.ten}${t.nghi?' (nghỉ)':''}</option>`).join('');}

      </div></div>`;
      return;
    }
    let rows='';
    day.lines.forEach((ln,i)=>{rows+=`<div style="display:flex;align-items:center;gap:5px;margin-bottom:5px">
      <span class="mc-wrap" style="flex:1;min-width:0;display:block">
        <input type="text" inputmode="numeric" id="km_${d}_${i}_sl" value="${ln.sl||''}" placeholder="SL" oninput="kmCalc()" onfocus="this.select()" style="width:100%;padding:9px 8px 9px 40px;border:1.5px solid var(--line);border-radius:9px;text-align:right;font-weight:600">

/* ---------- Máy tính mini cho ô nhập (cộng trừ nhân chia rồi điền vào ô) ---------- */
let _mcTarget=null,_mcExpr='';
function mcEval(expr){
  const s=(''+(expr||'')).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  const toks=s.match(/(\d+\.?\d*|[+\-*/])/g);
  if(!toks)return 0;
  const t=toks.slice();
  while(t.length&&/^[+\-*/]$/.test(t[t.length-1]))t.pop();
  if(!t.length)return 0;
  if(/^[+\-*/]$/.test(t[0]))t.unshift('0');
  let acc=[parseFloat(t[0])||0];
  for(let k=1;k+1<=t.length;k+=2){const op=t[k],n=parseFloat(t[k+1]);if(isNaN(n))break;
    if(op==='*')acc[acc.length-1]*=n;
    else if(op==='/')acc[acc.length-1]=n?acc[acc.length-1]/n:0;
    else if(op==='+')acc.push(n);
    else if(op==='-')acc.push(-n);}
  const r=acc.reduce((a,b)=>a+b,0);
  return isFinite(r)?r:0;}
function mcOpen(targetId,label){
  _mcTarget=targetId;const e=el(targetId);
  _mcExpr=e?(''+e.value).replace(/[^\d]/g,''):'';
  if(e&&e.blur)e.blur();
  const K=(t,cls,act)=>`<button type="button" class="mc-k ${cls||''}" onclick="${act}">${t}</button>`;
  let g='';
  g+=K('C','mc-fn','mcClear()')+K('⌫','mc-fn','mcBack()')+K('÷','mc-op',"mcOp('÷')")+K('×','mc-op',"mcOp('×')");
  g+=K('7','',"mcD('7')")+K('8','',"mcD('8')")+K('9','',"mcD('9')")+K('−','mc-op',"mcOp('−')");
  g+=K('4','',"mcD('4')")+K('5','',"mcD('5')")+K('6','',"mcD('6')")+K('+','mc-op',"mcOp('+')");
  g+=K('1','',"mcD('1')")+K('2','',"mcD('2')")+K('3','',"mcD('3')")+K('000','mc-000',"mcD('000')");
  g+=K('0','mc-zero',"mcD('0')");
  openSheet('Máy tính'+(label?' — '+label:''),
    `<div class="mc-disp"><div class="mc-expr" id="mc_expr">&nbsp;</div><div class="mc-res" id="mc_res">0</div></div>
     <div class="mc-grid">${g}</div>
     <div style="height:12px"></div>
     <button class="btn btn-primary" style="width:100%" onclick="mcUse()">✓ Điền vào ô${label?' '+label:''}</button>`);
  mcRender();}
function mcRender(){const r=mcEval(_mcExpr);
  if(el('mc_expr'))el('mc_expr').textContent=_mcExpr?_mcExpr.replace(/-/g,'−'):'';
  if(el('mc_res'))el('mc_res').textContent=kmF(r);}
function mcD(ch){if(ch==='000'){_mcExpr+=/(^|[+\-×÷])$/.test(_mcExpr)?'0':'000';}else _mcExpr+=ch;mcRender();}
function mcOp(op){if(!_mcExpr){if(op==='−')_mcExpr='−';mcRender();return;}
  if(/[+\-×÷−]$/.test(_mcExpr))_mcExpr=_mcExpr.slice(0,-1)+op;else _mcExpr+=op;mcRender();}
function mcBack(){_mcExpr=_mcExpr.slice(0,-1);mcRender();}
function mcClear(){_mcExpr='';mcRender();}
function mcUse(){if(!_mcExpr){closeSheet();return;}
  const r=Math.round(mcEval(_mcExpr)),e=el(_mcTarget);
  if(e){e.value=kmF(r);e.dispatchEvent(new Event('input',{bubbles:true}));}
  closeSheet();}

/* ============================================================
   QUẢN LÝ CHỐT SỔ — sổ thu/chi theo NGÀY, thu gọn ↔ sổ dài
   Đọc thẳng từ nhật ký bút toán (nguồn thật), gom 3 tầng:
   Ngày ▸ Thợ/Chủ/Mục ▸ từng công đoạn / từng dòng.
   ============================================================ */
let _csFilter='thang';   /* 'today' | '7d' | 'thang' | 'all' */
let _csDayOpen={};       /* dayKey -> đang mở */
let _csNatOpen={};       /* dayKey|nature -> đang mở (4 mục: công/DT/vào/ra) */
let _csGrpOpen={};       /* dayKey|gkey -> đang mở */
function csInRange(t){const N=now();
  if(_csFilter==='today')return sameDay(t,N);
  if(_csFilter==='7d')return N-t<7*86400000;
  if(_csFilter==='thang'){const a=new Date(t),b=new Date(N);return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth();}
  return true;}
function csItemLabel(s){
  if(/^Nhận hàng về/.test(s)){const m=s.match(/\(([^)]*)\)/);return m?m[1]:'nhận hàng';}
  if(/^Chấm công thợ giờ/.test(s))return 'chấm công giờ';
  if(/^Giao hàng/.test(s))return s.replace(/^Giao hàng — /,'giao: ').replace(/^Giao hàng$/,'giao hàng');
  if(/^Tháo/.test(s))return 'tháo hàng';
  if(/^Chốt lương/.test(s))return s.replace(/^Chốt lương /,'chốt ').replace(/\s*\([^)]*\)/,'');
  return s;}
/* Phân loại 1 bút toán vào 1 nhóm hiển thị. Trả null = bỏ qua (nội bộ). */
function csGroupOf(bt){
  if(bt.dao_cua||bt.daDao)return null;               /* bỏ bút toán đảo & bản đã sửa */
  const s=bt.suKien;
  const meta=k=>{for(const d of bt.dong)if(d[k]!=null)return d[k];return null;};
  const thoId=meta('thoId'),chuId=meta('chuHangId'),donId=meta('donId');
  const don=donId?getDon(donId):null;const donPre=don?don.ma+' · ':'';
  const q=bt.dong.reduce((a,d)=>a+(d.tk===TK.QUY?(d.chieu==='NO'?d.soTien:-d.soTien):0),0);
  const wipNo=bt.dong.filter(d=>d.tk===TK.WIP&&d.chieu==='NO').reduce((a,d)=>a+d.soTien,0);
  const dt=bt.dong.reduce((a,d)=>a+(d.tk===TK.DOANH_THU?(d.chieu==='CO'?d.soTien:-d.soTien):0),0);
  const ptt=bt.dong.reduce((a,d)=>a+(d.tk===TK.PHAI_TRA_THO?(d.chieu==='CO'?d.soTien:-d.soTien):0),0);
  /* 1) Công thợ khi nhận hàng / chấm giờ / thợ chạy giao / tháo (xưởng·chủ trả công) */
  if(/^Nhận hàng về|^Chấm công thợ giờ|^Giao hàng|^Tháo — (xưởng trả công|trả công thợ)/.test(s)){
    const t=thoId?getTho(thoId):null;
    return {nature:'cong',gkey:'tho_'+(thoId||'owner'),icon:'🧵',title:(t?t.ten:'Chủ xưởng'),amount:wipNo,sub:donPre+csItemLabel(s)};}
  /* 2) Chốt lương bao / theo giờ — công thợ bao·giờ ghi một cục */
  if(/^Chốt lương/.test(s)){
    const t=thoId?getTho(thoId):null;
    return {nature:'cong',gkey:'tho_'+(thoId||'owner'),icon:'🧵',title:(t?t.ten:'Thợ'),amount:ptt,sub:csItemLabel(s)};}
  /* 2b) Công thợ nhập lại lịch sử — không qua WIP, tính bằng phần nợ lương ghi thêm */
  if(/^Công thợ \(lịch sử\)/.test(s)){
    const t=thoId?getTho(thoId):null;
    return {nature:'cong',gkey:'tho_'+(thoId||'owner'),icon:'🧵',title:(t?t.ten:'Thợ'),amount:ptt,sub:'công (lịch sử)'};}
  /* 3b) Doanh thu nhập lại lịch sử */
  if(/^Doanh thu \(lịch sử\)/.test(s)){
    const c=chuId?getChu(chuId):null;
    const dl=bt.dong.find(d=>d.tk===TK.DOANH_THU)||{};
    return {nature:'dt',gkey:'dt_'+(chuId||'x'),icon:'📦',title:(c?c.ten:'Chủ hàng')+' — giao hàng',amount:dt,sub:'đơn đã xong'+(dl.ghiChu?' · '+dl.ghiChu:'')+' (lịch sử)'};}
  /* 3) Doanh thu — giao thành phẩm / tháo thu chủ / đảo trả lại */
  if(/^Giao thành phẩm|^Tháo — thu công|^Hàng bị trả lại — đảo doanh thu/.test(s)){
    const c=chuId?getChu(chuId):null;
    return {nature:'dt',gkey:'dt_'+(chuId||'x'),icon:'📦',title:(c?c.ten:'Chủ hàng')+' — giao hàng',amount:dt,sub:donPre+(dt<0?'đảo trả lại':'giao thành phẩm')};}
  /* 4) Thu tiền mặt của chủ hàng */
  if(/^Chủ hàng trả tiền/.test(s)){
    const c=chuId?getChu(chuId):null;
    return {nature:'vao',gkey:'thu_'+(chuId||'x'),icon:'💵',title:(c?c.ten:'Chủ hàng')+' — trả tiền',amount:q,sub:'thu tiền mặt'};}
  /* 5) Trả / ứng lương — tiền ra */
  if(/^Trả lương|^Ứng lương/.test(s)){
    const t=thoId?getTho(thoId):null;const ung=/^Ứng/.test(s);
    return {nature:'ra',gkey:'luong_'+(thoId||'x'),icon:'👛',title:(t?t.ten:'Thợ')+' — '+(ung?'ứng lương':'trả lương'),amount:q,sub:ung?'ứng trước':'trả lương'};}
  /* 6) Chi tiền xưởng / chi phí đơn / ship / đền — tiền ra */
  if(/^Phát sinh thợ/.test(s)){
    const t=thoId?getTho(thoId):null;
    const l=bt.dong.find(d=>d.tk===TK.RO_CHUNG&&d.loai==='PHAT_SINH_THO')||{};
    const kd=PS_KIND[l.kind]||'phát sinh';
    return {nature:'ra',gkey:'ps_'+(thoId||'x'),icon:'🍚',title:(t?t.ten:'Thợ')+' — phát sinh',amount:q,sub:kd+(l.ghiChu?' · '+l.ghiChu:'')};}
  if(/^Chi tiền/.test(s))return {nature:'ra',gkey:'chi_xuong',icon:'🧾',title:'Chi tiền xưởng',amount:q,sub:s.replace(/^Chi tiền:\s*/,'')||'chi khác'};
  if(/^Chi phí đơn/.test(s))return {nature:'ra',gkey:'chi_don',icon:'🧾',title:'Chi phí đơn',amount:q,sub:donPre+s.replace(/^Chi phí đơn:\s*/,'')};
  if(/^Ship cắt châm/.test(s))return {nature:'ra',gkey:'chi_don',icon:'🧾',title:'Chi phí đơn',amount:q,sub:donPre+'ship cắt châm'};
  if(/^Tiền đền/.test(s))return {nature:'ra',gkey:'chi_den',icon:'💸',title:'Đền hàng hư',amount:q,sub:donPre+'đền hàng hư'};
  if(/^Chi khác/.test(s))return {nature:'ra',gkey:'chi_khac',icon:'🧾',title:'Chi khác (ship, đền…)',amount:q,sub:s.replace(/^Chi khác:\s*/,'')||'ship/đền'};
  /* 7) Vốn — chủ rút / bỏ thêm */
  if(/^Chủ rút tiền|^Chủ bỏ thêm/.test(s))return {nature:q>0?'vao':'ra',gkey:'von',icon:'🏠',title:'Rút / bỏ vốn',amount:q,sub:s.replace(/:.*$/,'')};
  /* 8) Số dư đầu kỳ (chỉ phần chạm tiền) */
  if(/^Số dư đầu kỳ/.test(s))return {nature:q>0?'vao':'ra',gkey:'dauky',icon:'🏁',title:'Số dư đầu kỳ',amount:q,sub:s.replace(/^Số dư đầu kỳ — /,'')};
  /* còn lại: chi phí chung phân bổ, kết chuyển giá vốn, đóng/hủy đơn, khóa kỳ, xóa nợ... = nội bộ, bỏ */
  return null;}
/* Gom theo ngày → nhóm → dòng, kèm tổng theo bản chất */
function csRows(){
  const days={},order=[];const tot={cong:0,dt:0,vao:0,ra:0};
  DB.butToan.forEach(bt=>{
    if(!csInRange(bt.thoiDiem))return;
    const g=csGroupOf(bt);if(!g)return;
    const amt=Math.round(g.amount||0);if(!amt)return;
    const dk=dayKey(bt.thoiDiem);
    if(!days[dk]){days[dk]={dk,t:bt.thoiDiem,groups:{},gorder:[],tot:{cong:0,dt:0,vao:0,ra:0}};order.push(dk);}
    const D=days[dk];if(bt.thoiDiem>D.t)D.t=bt.thoiDiem;
    if(!D.groups[g.gkey]){D.groups[g.gkey]={gkey:g.gkey,icon:g.icon,title:g.title,nature:g.nature,total:0,items:[]};D.gorder.push(g.gkey);}
    const G=D.groups[g.gkey];G.total+=amt;
    let _sk=null;if(/^Phát sinh thợ/.test(bt.suKien))_sk='ps';else if(/^Doanh thu \(lịch sử\)/.test(bt.suKien))_sk='dtls';
    else if(/^Chủ bỏ thêm|^Chủ rút tiền|^Trả lương|^Ứng lương|^Chi tiền|^Chi khác|^Chủ hàng trả tiền/.test(bt.suKien))_sk='khoan';
    G.items.push({sub:g.sub,amount:amt,t:bt.thoiDiem,btId:bt.id,suaKind:_sk});
    if(g.nature==='cong'){D.tot.cong+=amt;tot.cong+=amt;}
    else if(g.nature==='dt'){D.tot.dt+=amt;tot.dt+=amt;}
    else if(g.nature==='vao'){D.tot.vao+=amt;tot.vao+=amt;}
    else if(g.nature==='ra'){D.tot.ra+=-amt;tot.ra+=-amt;}
  });
  const natOrder={cong:0,dt:1,vao:2,ra:3};
  const dayArr=order.map(dk=>{const D=days[dk];
    const gs=D.gorder.map(k=>D.groups[k]);
    gs.sort((a,b)=>((natOrder[a.nature]??9)-(natOrder[b.nature]??9))||(Math.abs(b.total)-Math.abs(a.total)));
    gs.forEach(G=>G.items.sort((a,b)=>a.t-b.t));
    /* gom 4 mục theo bản chất — khớp với 4 số ở đầu ngày */
    const natCfg=[['cong','🧵','Công thợ'],['dt','📦','Doanh thu (giao hàng)'],['vao','💵','Tiền vào két'],['ra','👛','Tiền ra khỏi két']];
    const nats=natCfg.map(([nat,icon,label])=>({nat,icon,label,total:D.tot[nat],groups:gs.filter(G=>G.nature===nat)}))
                     .filter(n=>n.groups.length);
    const d=new Date(D.t);
    return {dk,t:D.t,wd:d.toLocaleDateString('vi-VN',{weekday:'long'}),dkLabel:d.toLocaleDateString('vi-VN'),groups:gs,nats,tot:D.tot};
  }).sort((a,b)=>b.t-a.t);
  return {days:dayArr,tot};}

/* ---- Xóa cả một ngày (tiện lúc chạy thử) ---- */
function xoaNgay(dk){
  if(DB.settings&&DB.settings.kyKhoa){toast('Kỳ đang khóa — mở khóa mới xóa được ngày.',true);return;}
  const dayBts=DB.butToan.filter(b=>dayKey(b.thoiDiem)===dk);
  if(!dayBts.length){toast('Ngày này không có gì để xóa.');return;}
  /* --- lưu 1 bản tạm để hồi phục (ghi đè bản cũ nếu có) --- */
  const lbl=new Date(dk+'T00:00:00').toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
  delete DB._xoaTam;                     /* không lồng snapshot vào snapshot */
  const snap=JSON.stringify(DB);         /* trạng thái ngay trước khi xóa */
  DB._xoaTam={dk,label:lbl,ts:now(),soMuc:dayBts.length,snap};
  /* khôi phục dấu vết cấu trúc mà các bút toán trong ngày đã tạo (giống hoàn tác trong 5') */
  dayBts.forEach(b=>{
    if(b.phienGioId)DB.phienGio=(DB.phienGio||[]).filter(x=>x.id!==b.phienGioId);
    if(b.giaoCongId)DB.giaoCong=(DB.giaoCong||[]).filter(x=>x.id!==b.giaoCongId);
    if(b.restoreSlip)DB.giaoTP=(DB.giaoTP||[]).filter(x=>x.id!==b.restoreSlip);
    if(b.prevTT!==undefined&&b.restoreDonId){const d=getDon(b.restoreDonId);if(d)d.trangThai=b.prevTT;}
  });
  const ids=new Set(dayBts.map(b=>b.id));
  DB.butToan=DB.butToan.filter(b=>!ids.has(b.id));
  /* gỡ dòng nhận hàng ghi trong ngày; phiếu nào mất dòng thì mở lại để hàng về hàng chờ */
  (DB.phieuGiao||[]).forEach(p=>{
    if(!p.dongNhan||!p.dongNhan.length)return;
    const truoc=p.dongNhan.length;
    p.dongNhan=p.dongNhan.filter(r=>dayKey(r.ngay)!==dk);
    if(p.dongNhan.length!==truoc&&p.trangThai==='DONG'){p.trangThai='MO';p.hut=0;p.lyDoHut=null;}
  });
  /* dọn các bản ghi phụ đề ngày đó (nếu còn sót, không gắn bút toán) */
  DB.giaoTP=(DB.giaoTP||[]).filter(g=>dayKey(g.ngay)!==dk);
  DB.giaoCong=(DB.giaoCong||[]).filter(g=>dayKey(g.ngay)!==dk);
  DB.chotBao=(DB.chotBao||[]).filter(c=>dayKey(c.ngay||c.thoiDiem||0)!==dk);
  DB.phienGio=(DB.phienGio||[]).filter(s=>dayKey(s.ngay||s.thoiDiem||0)!==dk);
  Store.save();render();
  toast('Đã xóa sổ ngày '+new Date(dk+'T00:00:00').toLocaleDateString('vi-VN')+' — bấm Hồi phục nếu cần.');
}
function hoiPhucNgay(){
  const s=DB._xoaTam;if(!s){toast('Không có ngày nào để hồi phục.');return;}
  try{DB=JSON.parse(s.snap);}catch(e){toast('Bản tạm hỏng, không hồi phục được.',true);return;}
  seedOpSeq();Store.save();render();
  toast('Đã hồi phục ngày '+new Date(s.dk+'T00:00:00').toLocaleDateString('vi-VN')+'.');
}
function boXoaTam(){

  xacNhan('Bỏ hẳn bản tạm đã xóa? Sau đó không hồi phục lại được nữa.',()=>{DB._xoaTam=null;Store.save();render();toast('Đã bỏ bản tạm.');},{ok:'Bỏ hẳn',nguyHiem:true,title:'Bỏ bản tạm'});

function askXoaNgay(dk){
  const n=DB.butToan.filter(b=>dayKey(b.thoiDiem)===dk).length;

/* ---------- LÃI TẠM (tab kế Chốt sổ) ----------
   Xem nhanh khi app CHƯA dùng đủ (chưa nhập đơn/giao hàng).
   Cơ sở TIỀN MẶT: tiền chủ hàng đưa − tiền đã chi ra. KHÔNG tính bỏ/rút vốn.
   Đây KHÔNG phải lãi kế toán thật (lãi thật ghi nhận lúc giao hàng — xem Tổng quan → Lãi & Tiền). */
let ltMode='thang';   // 'ngay' | 'tuan' | 'thang' | 'all'
let ltRef=0;          // mốc thời gian trong kỳ đang xem; 0 = dùng hôm nay
function ltAnchor(){return ltRef||now();}
function ltPeriod(){  // {from,to,label,atNow} theo ltMode + ltRef
  const A=new Date(ltAnchor());const p=n=>String(n).padStart(2,'0');
  if(ltMode==='all')return {from:-Infinity,to:Infinity,label:'Từ trước tới nay',atNow:true};
  if(ltMode==='ngay'){
    const s=new Date(A);s.setHours(0,0,0,0);const e=new Date(s);e.setDate(e.getDate()+1);
    const wd=s.toLocaleDateString('vi-VN',{weekday:'long'});
    return {from:s.getTime(),to:e.getTime()-1,label:wd.charAt(0).toUpperCase()+wd.slice(1)+', '+s.toLocaleDateString('vi-VN'),atNow:sameDay(s.getTime(),now())};
  }
  if(ltMode==='tuan'){
    const s=new Date(A);s.setHours(0,0,0,0);const g=(s.getDay()+6)%7;s.setDate(s.getDate()-g); // về thứ 2
    const e=new Date(s);e.setDate(e.getDate()+7);const eS=new Date(e.getTime()-1);
    return {from:s.getTime(),to:e.getTime()-1,label:'Tuần '+p(s.getDate())+'/'+p(s.getMonth()+1)+' – '+p(eS.getDate())+'/'+p(eS.getMonth()+1)+'/'+eS.getFullYear(),atNow:weekKey(s.getTime())===weekKey(now())};
  }
  const s=new Date(A.getFullYear(),A.getMonth(),1);const e=new Date(A.getFullYear(),A.getMonth()+1,1);const N=new Date(now());
  return {from:s.getTime(),to:e.getTime()-1,label:'Tháng '+(s.getMonth()+1)+'/'+s.getFullYear(),atNow:(s.getFullYear()===N.getFullYear()&&s.getMonth()===N.getMonth())};
}
function ltSetMode(mo){ltMode=mo;ltRef=0;render();}   // đổi kiểu kỳ → nhảy về kỳ hiện tại
function ltNav(dir){                                    // lùi/tới 1 kỳ (không cho vượt kỳ hiện tại)
  if(ltMode==='all')return;const P=ltPeriod();if(dir>0&&P.atNow)return;
  const A=new Date(ltAnchor());
  if(ltMode==='ngay')A.setDate(A.getDate()+dir);
  else if(ltMode==='tuan')A.setDate(A.getDate()+dir*7);
  else A.setMonth(A.getMonth()+dir);
  ltRef=A.getTime();render();
}
function ltClass(bt){ // ĐỐI CHIẾU 1-1 VỚI CHỐT SỔ: dùng chung bộ phân loại csGroupOf.
  // Chỉ tính khoản chạm tiền thật (cash basis). Khoản nào Chốt sổ không hiện thì Lãi tạm cũng bỏ
  // (không tự bịa "Chi khác") — đúng nguyên tắc: không đối chiếu được thì không ghi vào.
  let q=0;bt.dong.forEach(d=>{if(d.tk===TK.QUY)q+=(d.chieu==='NO'?d.soTien:-d.soTien);});
  if(!q)return null;
  const g=csGroupOf(bt);if(!g)return null;
  const k=g.gkey;
  if(k.indexOf('thu_')===0)return {loai:'thu',q};
  if(k==='von')return {loai:q>0?'vonvao':'vonra',q};
  if(k==='dauky')return {loai:'dauky',q};
  if(k.indexOf('luong_')===0)return {loai:'luong',q};
  if(k.indexOf('ps_')===0)return {loai:'psth',q};
  if(k==='chi_xuong')return {loai:'cpxuong',q};
  if(k==='chi_don')return {loai:'chidon',q};
  if(k==='chi_den')return {loai:'chiden',q};
  if(k==='chi_khac')return {loai:'chikhac',q};
  return null;
}

function ltDetail(loai){

  const P=ltPeriod();

    if(!byKey[key])byKey[key]={key,bt,tien:0,t:bt.thoiDiem};
    byKey[key].tien+=Math.abs(c.q);

  const rows=Object.values(byKey).sort((a,b)=>b.t-a.t);

  const dg=(bt)=>{const s=bt.suKien||'';const m=s.split(/:|·/);return m.length>1?m.slice(1).join('·').trim():'';};
  const kyLbl=P.label;

  body+=`<div class="card">`+rows.map(r=>{const bt=r.bt;const d=new Date(r.t).toLocaleDateString('vi-VN');

function nangSuat(thoId){
  const ps=DB.phieuGiao.filter(p=>p.thoId===thoId&&p.trangThai!=='HUY');
  let tongCai=0,congSP=0,tongPhe=0;
  ps.forEach(p=>{const dat=pDat(p);tongCai+=dat;congSP+=congPhieu(p);tongPhe+=pPhe(p);});
  const pg=DB.phienGio.filter(x=>x.thoId===thoId);const tongGio=sum(pg.map(x=>x.gio));const tienGio=sum(pg.map(x=>x.tien));
  return {tongCai,congSP,tienGio,tongCong:congSP+tienGio,tongPhe,tongGio};
}
/* tiền lương bao thực trả (để đối chiếu với giá trị công đoạn) — bao: giá ngày × số ngày; giờ: tổng tiền giờ đã chấm */
function tienTraBao(t){const ns=nangSuat(t.id);
  return t.loai==='bao'?(t.donGiaNgay||0)*soNgayBao(t.id,0):t.loai==='gio'?ns.tienGio:0;}
function congThoEvents(thoId){
  const ev=[];
  DB.phieuGiao.filter(p=>p.thoId===thoId&&p.trangThai!=='HUY').forEach(p=>{
    const don=getDon(p.donId);
    (p.dongNhan||[]).forEach(dn=>{const sl=sum(Object.values(dn.dat||{}));if(sl<=0)return;
      const bc=batchCds(p,dn);
      ev.push({ngay:dn.ngay,don:don.ma,mo:tenCds(don,bc),soCai:sl,tien:sl*donGiaCds(don,bc)});});});
  DB.phienGio.filter(x=>x.thoId===thoId).forEach(pg=>{const don=getDon(pg.donId);
    ev.push({ngay:pg.ngay,don:don?don.ma:'—',mo:'Công giờ '+pg.gio+'h',soCai:0,tien:pg.tien});});
  (DB.phieuThao||[]).forEach(pt=>{const don=getDon(pt.donId);
    (pt.dong||[]).forEach(l=>{if(l.thoId!==thoId||l.aiChiu==='THO')return;const tien=l.sl*l.donGia;if(tien<=0)return;
      ev.push({ngay:pt.ngay,don:don?don.ma:'—',mo:'Tháo · '+(don?don.snapshotCD[l.congDoanIdx].ten:''),soCai:l.sl,tien});});});
  (DB.giaoCong||[]).filter(g=>g.thoId===thoId).forEach(g=>{const don=getDon(g.donId);
    ev.push({ngay:g.ngay,don:don?don.ma:'—',mo:'🚚 Giao hàng'+(g.dienGiai?' · '+g.dienGiai:''),soCai:0,tien:g.soTien,giaoCongId:g.id,laGiao:true,coButToan:g.coButToan});});
  ev.sort((a,b)=>a.ngay-b.ngay);
  let tra=bal(TK.PHAI_TRA_THO,d=>d.thoId===thoId).no; // đã trả + ứng
  ev.forEach(e=>{if(tra>=e.tien){e.daTinh=true;tra-=e.tien;}else{e.daTinh=false;if(tra>0){e.tinhMotPhan=tra;tra=0;}}});
  return ev;
}
/* ---- Lịch sử trả/ứng của thợ ---- */
function traUngList(thoId){const out=[];
  DB.butToan.forEach(bt=>bt.dong.forEach(d=>{if(d.tk===TK.PHAI_TRA_THO&&d.thoId===thoId&&d.chieu==='NO'){
    out.push({ngay:bt.thoiDiem,loai:bt.suKien,tien:d.soTien});}}));

}

function soCongRows(filtTho,filtLoc){const rows=[];

function thoConThieu(t){let no=luongNoTho(t.id);const wm=baoWatermark(t.id);
  if(t.loai==='bao')no+=(t.donGiaNgay||0)*soNgayBao(t.id,wm);

function baoWatermark(thoId){DB.chotBao=DB.chotBao||[];const cs=DB.chotBao.filter(c=>c.thoId===thoId);

/* gộp công đoạn thợ đã làm theo NGÀY -> [{ngay,label,lines:[{mo,sl,dg,tt}],tong}] */
function soCongNgay(thoId,tuNgay){const ev=congThoEvents(thoId).filter(e=>e.ngay>(tuNgay||0));const map={};
  ev.forEach(e=>{const key=new Date(e.ngay).toLocaleDateString('vi-VN');
    (map[key]=map[key]||{ngay:e.ngay,label:key,lines:[],tong:0});
    const dg=e.soCai>0?Math.round(e.tien/e.soCai):e.tien;
    map[key].lines.push({mo:(e.don?e.don+' · ':'')+e.mo,sl:e.soCai||0,dg,tt:e.tien,giaoCongId:e.giaoCongId,xoaDuoc:e.laGiao&&!e.coButToan});
    map[key].tong+=e.tien;});
  return Object.values(map).sort((a,b)=>a.ngay-b.ngay);}
function soCongTong(thoId,tuNgay){return sum(congThoEvents(thoId).filter(e=>e.ngay>(tuNgay||0)).map(e=>e.tien));}
function soNgayBao(thoId,tuNgay){const set=new Set();

function _khoanKind(bt){const s=bt.suKien||'';
  if(/^Chủ bỏ thêm/.test(s))return 'vonvao';
  if(/^Chủ rút tiền/.test(s))return 'vonra';
  if(/^Trả lương/.test(s))return 'luongtra';
  if(/^Ứng lương/.test(s))return 'luongung';
  if(/^Chi tiền/.test(s))return 'chi';
  if(/^Chi khác/.test(s))return 'chikhac';
  if(/^Chủ hàng trả tiền/.test(s))return 'thu';
  return null;}
function _khoanQuy(bt){return Math.abs(bt.dong.reduce((a,d)=>a+(d.tk===TK.QUY?(d.chieu==='NO'?d.soTien:-d.soTien):0),0));}
function _khoanNote(bt){const s=bt.suKien||'';let m;
  if(m=s.match(/^Chi tiền:\s*(.*)$/))return m[1];
  if(m=s.match(/^Chi khác:\s*(.*)$/))return m[1];
  if(m=s.match(/^Chủ bỏ thêm tiền vào xưởng:\s*(.*)$/))return m[1];
  if(m=s.match(/^Chủ rút tiền về nhà:\s*(.*)$/))return m[1];
  return '';}

function suaKhoan({btId,soTien,dienGiai}){const bt=DB.butToan.find(b=>b.id===btId);if(!bt)throw new Error('Không tìm thấy khoản.');

/* ---- Xuất / nhập dữ liệu ---- */
function escHtml(x){return (''+x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function downloadFile(name,text,mime){try{
  const blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';a.rel='noopener';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{try{document.body.removeChild(a);}catch(_){}try{URL.revokeObjectURL(url);}catch(_){}},1500);
  return true;}catch(e){return false;}}
function copyText(id){const e=el(id);if(!e)return;e.focus();e.select();try{e.setSelectionRange(0,999999);}catch(_){}
  let ok=false;try{ok=document.execCommand('copy');}catch(_){}
  if(navigator.clipboard&&navigator.clipboard.writeText){try{navigator.clipboard.writeText(e.value);ok=true;}catch(_){}}
  toast(ok?'Đã sao chép — dán vào ghi chú/Excel hoặc phần Phục hồi.':'Đã bôi chọn — nhấn giữ để Copy.');}

      <button class="btn btn-ghost" onclick="copyText('exp_txt')">📋 Sao chép</button></div>

}
function taiCSV(name,rows){
  const NL=String.fromCharCode(13,10),BOM=String.fromCharCode(0xFEFF),LF=String.fromCharCode(10);
  const csv=BOM+rows.map(r=>r.map(c=>{c=(''+c).replace(/"/g,'""');return (/[",;]/.test(c)||c.indexOf(LF)>=0)?'"'+c+'"':c;}).join(',')).join(NL);
  exportModal('Xuất CSV',name+'-'+new Date().toISOString().slice(0,10)+'.csv',csv,'text/csv;charset=utf-8','Bảng CSV mở được bằng Excel / Google Sheets. Tải file hoặc sao chép.');
}
function importAny(text){const stripped=(''+text).replace(/^\uFEFF/,'');const t=stripped.replace(/^\s+/,'');
  if(t.charAt(0)!=='{')throw new Error('cần file sao lưu JSON (.json)');
  applyImport(JSON.parse(t));}

function xuatSoCongCSV(all){const rows=[['Thợ','Đơn','Công đoạn','Ngày','Số cái','Tiền','Trạng thái sổ']];

/* ---- Sửa / xóa đơn ---- */
function donCoButToan(donId){return DB.butToan.some(bt=>bt.dong.some(d=>d.donId===donId));}
function donCoPhatSinh(donId){return donCoButToan(donId)||DB.phieuGiao.some(p=>p.donId===donId);}
function suaDon({donId,mauId,ma,sizes,giaGiaCong}){
  const don=getDon(donId);
  if(don.trangThai==='DA_GIAO_DU'||don.trangThai==='DA_HUY')throw new Error('Đơn đã đóng/hủy — không sửa được.');
  if(mauId&&mauId!==don.mauId){
    if(donCoPhatSinh(donId))throw new Error('Đơn đã có phát sinh — không đổi mẫu. Hãy hủy và tạo đơn mới.');
    const mau=getMau(mauId);don.mauId=mauId;don.snapshotCD=mau.congDoan.map(c=>({ten:c.ten,donGia:c.donGia,canTruoc:normCT(c.canTruoc),giaiDoan:normGD(c.giaiDoan)}));
    don.sizeList=(mau.sizeList&&mau.sizeList.length)?mau.sizeList.slice():SIZES.slice();don.gioDinhMuc=mau.gioDinhMuc||0;
    don.giaGiaCong=mau.giaGiaCong||don.giaGiaCong;const ns={};don.sizeList.forEach(x=>ns[x]=don.sizes[x]||0);don.sizes=ns;}
  if(sizes){for(const x of Object.keys(sizes)){const q=sizes[x]||0;const daRa=daDungSize(don,x);
    if(q<daRa)throw new Error('Cỡ '+x+' đang có '+daRa+' cái trong sản xuất (gồm cả hàng châm/quay lại) — không hạ dưới mức này.');}
    don.sizes={...sizes};}
  if(ma)don.ma=ma;
  if(giaGiaCong!=null&&giaGiaCong>0)don.giaGiaCong=giaGiaCong;
  Store.save();
}
function xoaDon(donId){if(donCoPhatSinh(donId))throw new Error('Đơn đã có phát sinh — dùng "Hủy đơn" thay vì xóa.');
  DB.don=DB.don.filter(d=>d.id!==donId);Store.save();}
/* ---- Xóa HẲN đơn đã hủy (thao tác nhầm) ----
   Gỡ trọn mọi ghi chép của đơn khỏi sổ (bỏ nguyên từng bút toán vốn đã cân
   → tổng Nợ=Có và cầu nối luôn giữ). Chặn nếu phiếu giao của đơn đã được chủ
   hàng trả tiền/xóa nợ (khi đó phải hoàn tác lần thu tiền đó trước). */
function slipCuaDon(donId){const ids=new Set();
  (DB.giaoTP||[]).forEach(g=>{if(g.donId===donId)ids.add(g.id);});
  DB.butToan.forEach(bt=>bt.dong.forEach(d=>{if(d.donId===donId&&d.tk===TK.PHAI_THU&&d.phieuGiaoId)ids.add(d.phieuGiaoId);}));
  return ids;}
function donDaThuTien(donId){const ids=slipCuaDon(donId);if(!ids.size)return false;
  return DB.butToan.some(bt=>{if(bt.dong.some(d=>d.donId===donId))return false;
    return bt.dong.some(d=>d.tk===TK.PHAI_THU&&d.phieuGiaoId&&ids.has(d.phieuGiaoId));});}
function tomTatXoaDon(donId){let soBT=0,tienHoan=0,congTho=0,loDao=0;
  DB.butToan.forEach(bt=>{if(!bt.dong.some(d=>d.donId===donId))return;soBT++;
    bt.dong.forEach(d=>{const s=d.chieu==='CO'?d.soTien:-d.soTien;
      if(d.tk===TK.QUY)tienHoan+=s;
      if(d.tk===TK.PHAI_TRA_THO)congTho+=s;
      if(d.tk===TK.LO_KHAC)loDao+=(-s);});});
  return {soBT,tienHoan,congTho,loDao};}
function xoaHanDon(donId){const don=getDon(donId);if(!don)throw new Error('Không thấy đơn.');
  if(donDaThuTien(donId))throw new Error('Đơn này có phiếu đã được chủ hàng trả tiền. Hãy hoàn tác lần thu tiền đó trước rồi xóa lại.');
  const rm=new Set(DB.butToan.filter(bt=>bt.dong.some(d=>d.donId===donId)).map(b=>b.id));
  DB.butToan=DB.butToan.filter(b=>!rm.has(b.id));
  DB.phieuGiao=DB.phieuGiao.filter(p=>p.donId!==donId);
  DB.phienGio=(DB.phienGio||[]).filter(s=>s.donId!==donId);
  DB.phieuThao=(DB.phieuThao||[]).filter(t=>t.donId!==donId);
  DB.giaoTP=(DB.giaoTP||[]).filter(g=>g.donId!==donId);
  DB.don=DB.don.filter(d=>d.id!==donId);Store.save();}

}
function sdMau(donId,mauId){try{suaDon({donId,mauId});closeSheet();modalSuaDon(donId);toast('Đã đổi mẫu.');}catch(e){toast(e.message,true)}}

function confirmXoaHanDon(donId){const don=getDon(donId);if(!don)return;

/* ===========================================================
   NHẬT KÝ NHẬP — gom bút toán theo thao tác (op), xem theo ngày, hoàn tác/sửa
   =========================================================== */
const UNDO_DANGER=['Giao thành phẩm','Kết chuyển giá vốn','Đóng đơn','Hủy đơn','Hàng bị trả lại','Khóa kỳ','Số dư đầu kỳ','Ship cắt châm','Nhận hàng về','Tháo'];
function opGroups(){
  const m={};
  DB.butToan.forEach(bt=>{const k=(bt.op!=null?'o'+bt.op:'b'+bt.id);(m[k]=m[k]||[]).push(bt);});
  return Object.keys(m).map(k=>{const bts=m[k].slice().sort((a,b)=>a.thoiDiem-b.thoiDiem);
    const isRev=bts.every(b=>b.dao_cua);
    const daDao=bts.some(b=>b.daDao);
    const t=bts[0].thoiDiem;
    const quy=sum(bts.map(b=>b.dong.filter(d=>d.tk===TK.QUY).reduce((s,d)=>s+(d.chieu==='NO'?d.soTien:-d.soTien),0)));
    const danger=bts.some(b=>UNDO_DANGER.some(p=>b.suKien.startsWith(p)));
    const handled=bts.some(b=>b.prevTT!==undefined||b.restoreSlip!==undefined); // thao tác gắn đơn có khôi phục trạng thái
    const within=bts.every(b=>now()-b.thoiDiem<HUY_WINDOW);
    const allMoney=!danger;
    const undoNow=!daDao&&within&&(allMoney||handled);   // xóa hẳn ngay (an toàn)
    const undoLater=!daDao&&!within&&allMoney;           // quá 5 phút: chỉ đảo op tiền
    return {key:k,bts,isRev,daDao,t,quy,within,allMoney,handled,undoNow,undoLater,undoable:undoNow||undoLater,label:friendlyOp(bts),ic:opIcon(bts)};
  }).filter(g=>!g.isRev).sort((a,b)=>(b.t-a.t)||((b.bts[0].op||0)-(a.bts[0].op||0)));
}
function friendlyOp(bts){
  const main=bts.find(b=>!/^Chi phí chung/.test(b.suKien))||bts[0];let s=main.suKien;
  const meta=(key)=>{for(const b of bts)for(const d of b.dong)if(d[key])return d[key];return null;};
  const chuId=meta('chuHangId'),thoId=meta('thoId'),donId=meta('donId');const extra=[];
  if(donId&&getDon(donId))extra.push(getDon(donId).ma);
  if(chuId&&getChu(chuId))extra.push(getChu(chuId).ten);else if(thoId&&getTho(thoId))extra.push(getTho(thoId).ten);
  return s+(extra.length?' · '+extra.join(' · '):'');
}
function opIcon(bts){const s=bts.map(b=>b.suKien).join(' ');
  if(/Chủ rút tiền|Chủ bỏ thêm/.test(s))return '🏠';
  if(/trả tiền/.test(s))return '💵';if(/Trả lương|Ứng lương/.test(s))return '👛';
  if(/Giao thành phẩm/.test(s))return '📦';if(/Nhận hàng/.test(s))return '🧵';
  if(/Chấm công/.test(s))return '⏱';if(/Tháo/.test(s))return '🔧';
  if(/Chi tiền|Chi phí/.test(s))return '🧾';if(/nợ xấu|ứng thợ/.test(s))return '✖️';
  if(/Đóng đơn/.test(s))return '✅';if(/trả lại/.test(s))return '↩';if(/đền/.test(s))return '💸';
  if(/đầu kỳ/.test(s))return '🏁';if(/Khóa kỳ/.test(s))return '🔒';return '•';}
function hoanTacOp(key,lyDo){
  const g=opGroups().find(x=>x.key===key);if(!g||g.daDao)return;
  const within=g.bts.every(b=>now()-b.thoiDiem<HUY_WINDOW);
  if(within){
    // gỡ dấu vết cấu trúc kèm theo
    g.bts.forEach(b=>{
      if(b.phienGioId)DB.phienGio=DB.phienGio.filter(x=>x.id!==b.phienGioId);
      if(b.giaoCongId)DB.giaoCong=(DB.giaoCong||[]).filter(x=>x.id!==b.giaoCongId);
      if(b.restoreSlip)DB.giaoTP=DB.giaoTP.filter(x=>x.id!==b.restoreSlip);
      if(b.prevTT!==undefined&&b.restoreDonId){const d=getDon(b.restoreDonId);if(d)d.trangThai=b.prevTT;}
    });
    const ids=new Set(g.bts.map(b=>b.id));DB.butToan=DB.butToan.filter(b=>!ids.has(b.id));
  }else{
    // quá cửa sổ: chỉ cho đảo op tiền thuần
    if(!g.allMoney)return;
    beginOp();g.bts.forEach(bt=>{const dong=bt.dong.map(d=>Object.assign({},d,{chieu:d.chieu==='NO'?'CO':'NO'}));
      if(bt.giaoCongId)DB.giaoCong=(DB.giaoCong||[]).filter(x=>x.id!==bt.giaoCongId);
      DB.butToan.push({id:uid(),suKien:'Sửa: '+bt.suKien,thoiDiem:now(),op:curOp(),dong,dao_cua:bt.id,lyDo});bt.daDao=true;});
  }
  Store.save();
}
/* ---- Hoàn tác nhanh từ header: khoản VỪA NHẬP gần nhất (mã op lớn nhất) ----
   Nút cố định trên đầu trang, không biến mất như toast. Có hộp xác nhận trước khi hoàn tác. */
function opGanNhat(){
  const gs=opGroups().filter(g=>g.undoable&&!g.daDao);
  if(!gs.length)return null;
  return gs.slice().sort((a,b)=>((b.bts[0].op||0)-(a.bts[0].op||0)))[0];
}
function renderHdrUndo(){const b=el('hdrUndo');if(!b)return;const g=opGanNhat();
  if(g){b.style.display='';b.setAttribute('title','Hoàn tác: '+g.label);}else{b.style.display='none';}}
function hoanTacGanNhat(){const g=opGanNhat();
  if(!g){toast('Chưa có khoản nào để hoàn tác.');return;}
  const tien=g.quy?((g.quy>0?'+':'−')+fmt(Math.abs(g.quy))):'';
  const ngay=new Date(g.t).toLocaleDateString('vi-VN');
  const cach=g.within?'Khoản này sẽ được xóa hẳn khỏi sổ.':'Khoản đã lâu — máy ghi một bút toán đảo để giữ dấu vết, số sẽ về như cũ.';
  xacNhan('Hoàn tác khoản vừa nhập gần nhất?\n\n'+g.ic+' '+g.label+(tien?'  '+tien:'')+'\nNgày '+ngay+'\n\n'+cach,
    ()=>{hoanTacOp(g.key,'');render();toast('Đã hoàn tác.');},
    {ok:'Hoàn tác',nguyHiem:true,title:'Hoàn tác'});
}
function sameDay(a,b){const x=new Date(a),y=new Date(b);return x.getFullYear()===y.getFullYear()&&x.getMonth()===y.getMonth()&&x.getDate()===y.getDate();}
function tkTen(tk){return {QUY:'Quỹ tiền',PHAI_THU:'Phải thu',WIP:'Hàng dở',RO_CHUNG:'Rổ chung',PHAI_TRA_THO:'Nợ lương',CONG_CHU_XUONG:'Công chủ',DOANH_THU:'Doanh thu',GIA_VON:'Giá vốn',LO_KHAC:'Lỗ khác',VON:'Vốn'}[tk]||tk;}
let nkFilter='today';
function bcNhatKy(){
  const gs=opGroups();const now2=now();
  const inF=(t)=>nkFilter==='today'?sameDay(t,now2):nkFilter==='7d'?(now2-t<7*86400000):true;
  const fg=gs.filter(g=>inF(g.t));
  const chips=[['today','Hôm nay'],['7d','7 ngày'],['all','Tất cả']].map(([k,l])=>`<div class="chip ${nkFilter===k?'sel':''}" onclick="nkFilter='${k}';render()">${l}</div>`).join('');
  let h=`<div class="filter-row">${chips}</div>`;
  if(!fg.length)return h+`<div class="empty"><div class="ic">🗒️</div><b>Chưa có phát sinh</b>Khoảng thời gian này chưa nhập gì.</div>`;
  const byDay={},order=[];fg.forEach(g=>{const dk=new Date(g.t).toLocaleDateString('vi-VN');if(!byDay[dk]){byDay[dk]=[];order.push(dk);}byDay[dk].push(g);});
  order.forEach(dk=>{const list=byDay[dk];const wd=new Date(list[0].t).toLocaleDateString('vi-VN',{weekday:'long'});const tienNgay=sum(list.map(g=>g.quy));
    h+=`<div class="section-h" style="display:flex;justify-content:space-between;align-items:baseline"><span>${wd}, ${dk} · ${list.length} phát sinh</span>
      <span class="${tienNgay>=0?'money-pos':'money-neg'}" style="text-transform:none;letter-spacing:0;font-weight:800">${tienNgay>=0?'+':''}${fmtShort(tienNgay)}</span></div><div class="card">`;
    h+=list.map(g=>{const tm=new Date(g.t).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
      return `<div class="slip" onclick="modalOp('${g.key}')" style="${g.daDao?'opacity:.5':''}">
        <div style="display:flex;gap:11px;align-items:flex-start"><div style="font-size:17px;line-height:1.2">${g.ic}</div>

function bcLai(){
