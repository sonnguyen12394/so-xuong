/* Danh sách ngày (bao gồm 2 đầu) giữa tu..den, mỗi phần tử 'YYYY-MM-DD' */
function gbsDays(tu,den){const out=[];const a=tu.split('-').map(Number),b=den.split('-').map(Number);
  let d=new Date(a[0],a[1]-1,a[2]);const e=new Date(b[0],b[1]-1,b[2]);const p=n=>String(n).padStart(2,'0');
  while(d<=e){out.push(d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()));d.setDate(d.getDate()+1);if(out.length>400)break;}
  return out;}
/* Ghi cùng một khoản cho nhiều ngày liên tiếp (lương bao / chi phí cố định…) */
function submitGhiBoSungLap(loai,s){try{
  let tu=(el('gbs_tu')||{}).value||'',den=(el('gbs_den')||{}).value||'';
  if(!tu||!den)return toast('Chọn từ ngày và đến ngày.',true);
  if(tu>den){const t=tu;tu=den;den=t;}
  if(kmTs(den)>now())return toast('Không ghi cho ngày chưa tới.',true);
  let thoId='',kind='com';
  if(loai==='congls'||loai==='psth'||loai==='tra'||loai==='ung'){thoId=(el('gbs_tho')||{}).value||'';if(!thoId)return toast('Chọn thợ.',true);}
  if(loai==='psth')kind=(el('gbs_pskind')||{}).value||'com';
  const dg=(el('gbs_dg')&&el('gbs_dg').value)?el('gbs_dg').value.trim():'';
  const paid=(loai==='congls'&&el('gbs_paid')&&el('gbs_paid').checked);
  const qy=readQuy('gbs');
  const days=gbsDays(tu,den);
  if(DB.settings.kyKhoa&&DB.settings.kyKhoaTime&&days.some(ds=>kmTs(ds)<=DB.settings.kyKhoaTime))
    return toast('Khoảng ngày chạm kỳ đã khóa — không ghi được.',true);
  let n=0;
  days.forEach(ds=>{const ts=kmTs(ds);if(ts>now())return;
    if(loai==='chi')chiPhiXuong({soTien:s,dienGiai:dg||'chi phí xưởng',ngay:ts,quy:qy});
    else if(loai==='tra')traLuong({thoId,soTien:s,ngay:ts,quy:qy});
    else if(loai==='ung')ungLuong({thoId,soTien:s,ngay:ts,quy:qy});
    else if(loai==='psth')phatSinhTho({thoId,soTien:s,kind,dienGiai:dg,ngay:ts,quy:qy});
    else if(loai==='congls'){congThoLichSu({thoId,soTien:s,ngay:ts});if(paid)traLuong({thoId,soTien:s,ngay:ts,quy:qy});}
    _csDayOpen[ds]=true;n++;});
  if(!n)return toast('Không có ngày hợp lệ.',true);
  const nd=new Date();
  const allSameMonth=days.every(ds=>{const q=ds.split('-').map(Number);return q[0]===nd.getFullYear()&&(q[1]-1)===nd.getMonth();});
  csMode=allSameMonth?'thang':'all';csRef=0;
  const a=tu.split('-').map(Number),b=den.split('-').map(Number);
  navCloseAll();render();
  toast('Đã ghi '+n+' ngày ('+a[2]+'/'+a[1]+'–'+b[2]+'/'+b[1]+'). Xóa từng ngày ở Chốt sổ nếu cần.');
}catch(e){toast(e.message,true)}}

/* ============ KẾ MỤC THỢ — máy tính công theo ngày (chức năng TẠM, lưu riêng theo máy) ============
   Không ghi vào sổ kế toán, không vào sao lưu/đám mây. Chỉ để bấm tính công nhanh. */
const KM_KEY='soxuong_kemuc';
function kmToday(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function kmTs(dstr){const p=(dstr||'').split('-').map(Number);if(dstr===kmToday())return now();return new Date(p[0],(p[1]||1)-1,p[2]||1,12,0,0,0).getTime();}
function kmNewDay(){return {thoId:'',ngay:kmToday(),lines:[{sl:'',dg:''}],daLuu:false,luuTien:0};}
let kmDays=[kmNewDay()];
let kmCpMode='xuong',kmCpKind='com',kmCpSl='',kmCpDg='',kmCpNgay='',kmCpTho='';
function kmCpSync(){const a=el('km_cp_sl');if(a)kmCpSl=a.value;const b=el('km_cp_dg');if(b)kmCpDg=b.value;const c=el('km_cp_ngay');if(c)kmCpNgay=c.value;const t=el('km_cp_tho');if(t)kmCpTho=t.value;}
function kmCpSetMode(m){kmCpSync();kmCpMode=m;kmRedraw();}
function kmCpSetKind(k){kmCpSync();kmCpKind=k;kmRedraw();}
function kmF(x){return (Math.round(x)||0).toLocaleString('vi-VN');}
function kmNum(id){const e=el(id);if(!e)return 0;return +(''+e.value).replace(/[^\d]/g,'')||0;}
/* Di cư shape cũ (ngày = mảng dòng) → object có thợ/ngày/đã lưu */
function kmNorm(){
  if(!Array.isArray(kmDays))kmDays=[kmNewDay()];
  kmDays=kmDays.map(day=>{
    if(Array.isArray(day))return {thoId:'',ngay:kmToday(),lines:day.length?day:[{sl:'',dg:''}],daLuu:false,luuTien:0};
    if(!day||typeof day!=='object')return kmNewDay();
    day.lines=(Array.isArray(day.lines)&&day.lines.length)?day.lines:[{sl:'',dg:''}];
    if(day.thoId==null)day.thoId='';
    if(!day.ngay)day.ngay=kmToday();
    if(day.daLuu==null)day.daLuu=false;
    if(day.luuTien==null)day.luuTien=0;
    return day;});
  if(!kmDays.length)kmDays=[kmNewDay()];
}
function kmLoad(){try{const r=localStorage.getItem(KM_KEY);if(r){const a=JSON.parse(r);if(Array.isArray(a)&&a.length)kmDays=a;}}catch(e){}kmNorm();}
function kmSave(){try{localStorage.setItem(KM_KEY,JSON.stringify(kmDays));}catch(e){}}
function kmSync(){kmDays.forEach((day,d)=>{
  if(day.daLuu)return;
  const th=el('km_tho_'+d);if(th)day.thoId=th.value;
  const ng=el('km_ngay_'+d);if(ng)day.ngay=ng.value;
  day.lines.forEach((ln,i)=>{const s=el('km_'+d+'_'+i+'_sl'),g=el('km_'+d+'_'+i+'_dg');if(s)ln.sl=s.value;if(g)ln.dg=g.value;});
});}
function kmDayTong(d){const day=kmDays[d];if(day.daLuu)return day.luuTien||0;let t=0;day.lines.forEach((ln,i)=>{t+=kmNum('km_'+d+'_'+i+'_sl')*kmNum('km_'+d+'_'+i+'_dg');});return t;}
function kmCalc(){let grand=0;
  kmDays.forEach((day,d)=>{let t=0;
    if(day.daLuu){t=day.luuTien||0;}
    else day.lines.forEach((ln,i)=>{const sl=kmNum('km_'+d+'_'+i+'_sl'),dg=kmNum('km_'+d+'_'+i+'_dg');
      const s=el('km_'+d+'_'+i+'_sl'),g=el('km_'+d+'_'+i+'_dg');if(s)ln.sl=s.value;if(g)ln.dg=g.value;
      const tt=sl*dg;t+=tt;const te=el('km_'+d+'_'+i+'_tt');if(te)te.textContent=tt?kmF(tt):'';});
    grand+=t;const de=el('km_day_'+d);if(de)de.textContent=kmF(t);
    const lb=el('km_luubtn_'+d);if(lb)lb.disabled=!(t>0&&((el('km_tho_'+d)||{}).value||day.thoId));});
  const ge=el('km_grand');if(ge)ge.textContent=kmF(grand);kmSave();}
function viewKeMuc(m){kmLoad();
  m.innerHTML=`<div class="view-title">Tính sổ<small>Máy tính công · tính nhanh</small></div><div id="kmWrap">${kmBodyHtml()}</div>`;
  el('fab').innerHTML='';kmCalc();}
function kmRedraw(){const w=el('kmWrap');if(w){w.innerHTML=kmBodyHtml();kmCalc();}}
function kmThoOpts(sel){return DB.tho.filter(t=>!t.isOwner).map(t=>`<option value="${t.id}" ${sel===t.id?'selected':''}>${escHtml(t.ten)}${t.nghi?' (nghỉ)':''}</option>`).join('');}
function kmBodyHtml(){let h='';

        <div class="kv" style="margin-top:6px;border-top:1px dashed var(--line-2);padding-top:6px"><div class="k">Công đã vào sổ</div><div class="v big-num" id="km_day_${d}">${kmF(day.luuTien)}</div></div>

      </div></div>`;
      return;
    }
    let rows='';
    day.lines.forEach((ln,i)=>{rows+=`<div style="display:flex;align-items:center;gap:5px;margin-bottom:5px">
      <span class="mc-wrap" style="flex:1;min-width:0;display:block">

      <span class="mc-wrap" style="flex:1;min-width:0;display:block">
        <input type="text" inputmode="numeric" id="km_${d}_${i}_dg" value="${ln.dg||''}" placeholder="đơn giá" oninput="kmCalc()" onfocus="this.select()" style="width:100%;padding:9px 8px 9px 40px;border:1.5px solid var(--line);border-radius:9px;text-align:right;font-weight:600">
        <button type="button" class="mc-open" tabindex="-1" onclick="mcOpen('km_${d}_${i}_dg','đơn giá')">🧮</button></span>
      <span style="color:var(--ink-3)">=</span>
      <b id="km_${d}_${i}_tt" style="min-width:62px;text-align:right;font-size:13px"></b>
      ${day.lines.length>1?`<button class="mini-btn" onclick="kmDelLine(${d},${i})">✕</button>`:'<span style="width:22px;display:inline-block"></span>'}</div>`;});
    h+=`<div class="card" style="margin-bottom:10px"><div class="card-pad">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <b style="font-size:14px">Ngày ${d+1}</b>
        ${kmDays.length>1?`<button class="mini-btn" onclick="kmDelDay(${d})">✕ xóa ngày</button>`:''}</div>
      ${rows}
      <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:2px" onclick="kmAddLine(${d})">＋ Thêm dòng</button>
      <div class="kv" style="margin-top:8px;border-top:1px dashed var(--line-2);padding-top:8px"><div class="k">Tổng công ngày ${d+1}</div><div class="v big-num" id="km_day_${d}">0</div></div>
    </div></div>`;});
  h+=`<button class="btn btn-primary" style="width:100%;margin-bottom:12px" onclick="kmAddDay()">＋ Tạo ngày mới</button>`;
  h+=`<div class="reveal" style="background:linear-gradient(160deg,#2F7A63,#256452);margin-bottom:12px"><div class="lbl" style="color:#CDEBE0">Tổng công tất cả ngày</div><div class="amt" id="km_grand">0</div></div>`;
  /* (Đã bỏ 2 thẻ: “Chi phí liên quan” và “Khoản tiền khác” theo yêu cầu) */
  h+=`<div class="act-grid"><button class="btn btn-ghost" onclick="kmChot()">📋 Bảng tính (sao chép)</button><button class="btn btn-ghost" onclick="kmReset()">Xóa hết máy tính</button></div>`;
  h+=`<div class="hint" style="text-align:center;margin-top:8px">Máy tính nhanh, lưu trong máy này (không kèm sao lưu, không ghi vào sổ). Dùng <b>Bảng tính (sao chép)</b> để lấy kết quả. Ghi công/lương thật ở tab <b>Thợ</b>.</div>`;
  return h;}
function kmAddLine(d){kmSync();kmDays[d].lines.push({sl:'',dg:''});kmRedraw();}
function kmDelLine(d,i){kmSync();kmDays[d].lines.splice(i,1);if(!kmDays[d].lines.length)kmDays[d].lines.push({sl:'',dg:''});kmRedraw();}
function kmAddDay(){kmSync();kmDays.push(kmNewDay());kmRedraw();}
function kmDelDay(d){kmSync();kmDays.splice(d,1);if(!kmDays.length)kmDays.push(kmNewDay());kmRedraw();}
function kmAnDaLuu(d){kmSync();kmDays.splice(d,1);if(!kmDays.length)kmDays.push(kmNewDay());kmSave();kmRedraw();toast('Đã ẩn khỏi máy tính (vẫn còn trong sổ).');}
function kmReset(){xacNhan('Xóa hết máy tính đang tính? (Không đụng tới số đã lưu vào sổ.)',()=>{kmDays=[kmNewDay()];kmSave();kmRedraw();},{ok:'Xóa hết',nguyHiem:true,title:'Xóa máy tính'});}
function kmLuuCong(d){kmSync();

  const dstr=day.ngay||kmToday(),p=dstr.split('-').map(Number);
  const ts=kmTs(dstr);
  if(ts>now())return toast('Không lưu cho ngày chưa tới.',true);
  if(DB.settings.kyKhoa&&DB.settings.kyKhoaTime&&ts<=DB.settings.kyKhoaTime)return toast('Ngày này đã khóa sổ — không lưu được.',true);
  const ten=(getTho(thoId)||{}).ten||'thợ';
  xacNhan('Lưu công của '+ten+' — ngày '+p[2]+'/'+p[1]+':\n'+kmF(tong)+' đ\n\nSố này vào sổ thật (Tổng quan → Chốt sổ), sửa/xóa được tới khi khóa kỳ.',()=>{
    try{congThoLichSu({thoId,soTien:tong,ngay:ts});
      day.daLuu=true;day.luuTien=tong;kmSave();

/* ---------- Máy tính mini cho ô nhập (cộng trừ nhân chia rồi điền vào ô) ---------- */
let _mcTarget=null,_mcExpr='';
function mcEval(expr){
  const s=(''+(expr||'')).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  const toks=s.match(/(\d+\.?\d*|[+\-*/])/g);
  if(!toks)return 0;
  const t=toks.slice();
  while(t.length&&/^[+\-*/]$/.test(t[t.length-1]))t.pop();
  if(!t.length)return 0;
  if(/^[+\-*/]$/.test(t[0]))t.unshift('0');
  let acc=[parseFloat(t[0])||0];
  for(let k=1;k+1<=t.length;k+=2){const op=t[k],n=parseFloat(t[k+1]);if(isNaN(n))break;
    if(op==='*')acc[acc.length-1]*=n;
    else if(op==='/')acc[acc.length-1]=n?acc[acc.length-1]/n:0;
    else if(op==='+')acc.push(n);
    else if(op==='-')acc.push(-n);}
  const r=acc.reduce((a,b)=>a+b,0);
  return isFinite(r)?r:0;}
function mcOpen(targetId,label){
  _mcTarget=targetId;const e=el(targetId);
  _mcExpr=e?(''+e.value).replace(/[^\d]/g,''):'';
  if(e&&e.blur)e.blur();
  const K=(t,cls,act)=>`<button type="button" class="mc-k ${cls||''}" onclick="${act}">${t}</button>`;
  let g='';
  g+=K('C','mc-fn','mcClear()')+K('⌫','mc-fn','mcBack()')+K('÷','mc-op',"mcOp('÷')")+K('×','mc-op',"mcOp('×')");
  g+=K('7','',"mcD('7')")+K('8','',"mcD('8')")+K('9','',"mcD('9')")+K('−','mc-op',"mcOp('−')");
  g+=K('4','',"mcD('4')")+K('5','',"mcD('5')")+K('6','',"mcD('6')")+K('+','mc-op',"mcOp('+')");
  g+=K('1','',"mcD('1')")+K('2','',"mcD('2')")+K('3','',"mcD('3')")+K('000','mc-000',"mcD('000')");
  g+=K('0','mc-zero',"mcD('0')");
  openSheet('Máy tính'+(label?' — '+label:''),
    `<div class="mc-disp"><div class="mc-expr" id="mc_expr">&nbsp;</div><div class="mc-res" id="mc_res">0</div></div>
     <div class="mc-grid">${g}</div>
     <div style="height:12px"></div>
     <button class="btn btn-primary" style="width:100%" onclick="mcUse()">✓ Điền vào ô${label?' '+label:''}</button>`);
  mcRender();}
function mcRender(){const r=mcEval(_mcExpr);
  if(el('mc_expr'))el('mc_expr').textContent=_mcExpr?_mcExpr.replace(/-/g,'−'):'';
  if(el('mc_res'))el('mc_res').textContent=kmF(r);}
function mcD(ch){if(ch==='000'){_mcExpr+=/(^|[+\-×÷])$/.test(_mcExpr)?'0':'000';}else _mcExpr+=ch;mcRender();}
function mcOp(op){if(!_mcExpr){if(op==='−')_mcExpr='−';mcRender();return;}
  if(/[+\-×÷−]$/.test(_mcExpr))_mcExpr=_mcExpr.slice(0,-1)+op;else _mcExpr+=op;mcRender();}
function mcBack(){_mcExpr=_mcExpr.slice(0,-1);mcRender();}
function mcClear(){_mcExpr='';mcRender();}
function mcUse(){if(!_mcExpr){closeSheet();return;}
  const r=Math.round(mcEval(_mcExpr)),e=el(_mcTarget);
  if(e){e.value=kmF(r);e.dispatchEvent(new Event('input',{bubbles:true}));}
  closeSheet();}

/* Phân loại 1 bút toán vào 1 nhóm hiển thị. Trả null = bỏ qua (nội bộ). */
function csGroupOf(bt){
  if(bt.dao_cua||bt.daDao)return null;               /* bỏ bút toán đảo & bản đã sửa */
  const s=bt.suKien;
  /* backfill "nhập lại lịch sử" (đơn cũ đã xong ngoài app) KHÔNG phải thu/chi phát sinh trong ngày
     → không liệt vào Sổ thu chi. Nợ lương thợ / doanh thu vẫn nằm nguyên ở Thợ · Chủ hàng · Lãi. */
  if(/^Công thợ \(lịch sử\)|^Doanh thu \(lịch sử\)/.test(s))return null;
  const meta=k=>{for(const d of bt.dong)if(d[k]!=null)return d[k];return null;};
  const thoId=meta('thoId'),chuId=meta('chuHangId'),donId=meta('donId');
  const don=donId?getDon(donId):null;const donPre=don?don.ma+' · ':'';
  const q=bt.dong.reduce((a,d)=>a+(d.tk===TK.QUY?(d.chieu==='NO'?d.soTien:-d.soTien):0),0);
  const wipNo=bt.dong.filter(d=>d.tk===TK.WIP&&d.chieu==='NO').reduce((a,d)=>a+d.soTien,0);
  const dt=bt.dong.reduce((a,d)=>a+(d.tk===TK.DOANH_THU?(d.chieu==='CO'?d.soTien:-d.soTien):0),0);
  const ptt=bt.dong.reduce((a,d)=>a+(d.tk===TK.PHAI_TRA_THO?(d.chieu==='CO'?d.soTien:-d.soTien):0),0);
  /* 1) Công thợ khi nhận hàng / chấm giờ / thợ chạy giao / tháo (xưởng·chủ trả công) */
  if(/^Nhận hàng về|^Chấm công thợ giờ|^Giao hàng|^Tháo — (xưởng trả công|trả công thợ)/.test(s)){
    const t=thoId?getTho(thoId):null;

  if(/^Chốt lương/.test(s)){

  /* 3) Doanh thu — giao thành phẩm / tháo thu chủ / đảo trả lại */

    const c=chuId?getChu(chuId):null;

  /* 4) Thu tiền mặt của chủ hàng */

  /* 5) Trả / ứng lương — tiền ra */

  /* 6) Chi tiền xưởng / chi phí đơn / ship / đền — tiền ra */
  if(/^Phát sinh thợ/.test(s)){
    const t=thoId?getTho(thoId):null;
    const l=bt.dong.find(d=>d.tk===TK.RO_CHUNG&&d.loai==='PHAT_SINH_THO')||{};

    return {nature:'ra',gkey:'ps_'+(thoId||'x'),icon:'🍚',title:(t?t.ten:'Thợ')+' — phát sinh',amount:q,sub:kd+(l.ghiChu?' · '+l.ghiChu:'')};}
  if(/^Chi tiền/.test(s))return {nature:'ra',gkey:'chi_xuong',icon:'🧾',title:'Chi tiền xưởng',amount:q,sub:s.replace(/^Chi tiền:\s*/,'')||'chi khác'};
  if(/^Chi phí đơn/.test(s))return {nature:'ra',gkey:'chi_don',icon:'🧾',title:'Chi phí đơn',amount:q,sub:donPre+s.replace(/^Chi phí đơn:\s*/,'')};
  if(/^Ship cắt châm/.test(s))return {nature:'ra',gkey:'chi_don',icon:'🧾',title:'Chi phí đơn',amount:q,sub:donPre+'ship cắt châm'};
  if(/^Tiền đền/.test(s))return {nature:'ra',gkey:'chi_den',icon:'💸',title:'Đền hàng hư',amount:q,sub:donPre+'đền hàng hư'};
  if(/^Chi khác/.test(s)){const cx=(bt.dong.find(d=>d.chuHangId!=null)||{}).chuHangId;const cn=cx?((getChu(cx)||{}).ten||''):'';const base=s.replace(/^Chi khác:\s*/,'')||'ship/đền';return {nature:'ra',gkey:'chi_khac',icon:'🧾',title:'Chi khác (ship, đền…)',amount:q,sub:cn?(base+' · '+cn):base};}
  /* 7) Vốn — chủ rút / bỏ thêm */
  if(/^Chủ rút tiền|^Chủ bỏ thêm/.test(s))return {nature:q>0?'vao':'ra',gkey:'von',icon:'🏠',title:'Rút / bỏ vốn',amount:q,sub:s.replace(/:.*$/,'')};

/* Nhãn quỹ cho từng dòng tiền vào/ra trong nhật ký — để đối chiếu 2 túi (quỹ chính vs quỹ phụ) */
function csQuyTag(bt){let chi=0,chinh=0;for(const d of bt.dong){if(d.tk!==TK.QUY)continue;const v=(d.chieu==='NO'?d.soTien:-d.soTien);if(d.quy==='chi')chi+=v;else chinh+=v;}

/* Gom theo ngày → nhóm → dòng, kèm tổng theo bản chất */
function csRows(){
  const days={},order=[];const tot={cong:0,dt:0,vao:0,ra:0,chuyen:0};
  DB.butToan.forEach(bt=>{
    if(!csInRange(bt.thoiDiem))return;
    const g=csGroupOf(bt);if(!g)return;
    const amt=Math.round(g.amount||0);if(!amt)return;
    const dk=dayKey(bt.thoiDiem);
    if(!days[dk]){days[dk]={dk,t:bt.thoiDiem,groups:{},gorder:[],tot:{cong:0,dt:0,vao:0,ra:0,chuyen:0}};order.push(dk);}
    const D=days[dk];if(bt.thoiDiem>D.t)D.t=bt.thoiDiem;
    if(!D.groups[g.gkey]){D.groups[g.gkey]={gkey:g.gkey,icon:g.icon,title:g.title,nature:g.nature,total:0,items:[]};D.gorder.push(g.gkey);}
    const G=D.groups[g.gkey];G.total+=amt;
    let _sk=null;if(/^Phát sinh thợ/.test(bt.suKien))_sk='ps';else if(/^Doanh thu \(lịch sử\)/.test(bt.suKien))_sk='dtls';
    else if(/^Chủ bỏ thêm|^Chủ rút tiền|^Trả lương|^Ứng lương|^Chi tiền|^Chi khác|^Chủ hàng trả tiền/.test(bt.suKien))_sk='khoan';
    let _subx=g.sub;if(g.nature==='vao'||g.nature==='ra'){const _ql=csQuyLabel(bt);if(_ql)_subx=(_subx?_subx+' · ':'')+_ql;}
    G.items.push({sub:_subx,amount:amt,t:bt.thoiDiem,btId:bt.id,suaKind:_sk});
    if(g.nature==='cong'){D.tot.cong+=amt;tot.cong+=amt;}
    else if(g.nature==='dt'){D.tot.dt+=amt;tot.dt+=amt;}
    else if(g.nature==='vao'){D.tot.vao+=amt;tot.vao+=amt;}
    else if(g.nature==='ra'){D.tot.ra+=-amt;tot.ra+=-amt;}
    else if(g.nature==='chuyen'){D.tot.chuyen+=amt;tot.chuyen+=amt;}
  });
  const natOrder={cong:0,dt:1,vao:2,ra:3,chuyen:4};
  const dayArr=order.map(dk=>{const D=days[dk];
    const gs=D.gorder.map(k=>D.groups[k]);
    gs.sort((a,b)=>((natOrder[a.nature]??9)-(natOrder[b.nature]??9))||(Math.abs(b.total)-Math.abs(a.total)));
    gs.forEach(G=>G.items.sort((a,b)=>a.t-b.t));
    /* gom 4 mục theo bản chất — khớp với 4 số ở đầu ngày */
    const natCfg=[['cong','🧵','Công thợ'],['dt','📦','Doanh thu (giao hàng)'],['vao','💵','Tiền vào két'],['ra','👛','Tiền ra khỏi két'],['chuyen','🔄','Chuyển giữa 2 quỹ']];
    const nats=natCfg.map(([nat,icon,label])=>({nat,icon,label,total:D.tot[nat],groups:gs.filter(G=>G.nature===nat)}))
                     .filter(n=>n.groups.length);

    return {dk,t:D.t,wd:d.toLocaleDateString('vi-VN',{weekday:'long'}),dkLabel:d.toLocaleDateString('vi-VN'),groups:gs,nats,tot:D.tot};
  }).sort((a,b)=>b.t-a.t);
  return {days:dayArr,tot};}

/* ---- Xóa cả một ngày (tiện lúc chạy thử) ---- */
function xoaNgay(dk){
  if(DB.settings&&DB.settings.kyKhoa){toast('Kỳ đang khóa — mở khóa mới xóa được ngày.',true);return;}

  /* khôi phục dấu vết cấu trúc mà các bút toán trong ngày đã tạo (giống hoàn tác trong 5') */
  dayBts.forEach(b=>{
    if(b.phienGioId)DB.phienGio=(DB.phienGio||[]).filter(x=>x.id!==b.phienGioId);
    if(b.giaoCongId)DB.giaoCong=(DB.giaoCong||[]).filter(x=>x.id!==b.giaoCongId);
    if(b.restoreSlip)DB.giaoTP=(DB.giaoTP||[]).filter(x=>x.id!==b.restoreSlip);
    if(b.prevTT!==undefined&&b.restoreDonId){const d=getDon(b.restoreDonId);if(d)d.trangThai=b.prevTT;}
  });
  const ids=new Set(dayBts.map(b=>b.id));
  DB.butToan=DB.butToan.filter(b=>!ids.has(b.id));
  /* gỡ dòng nhận hàng ghi trong ngày; phiếu nào mất dòng thì mở lại để hàng về hàng chờ */
  (DB.phieuGiao||[]).forEach(p=>{
    if(!p.dongNhan||!p.dongNhan.length)return;
    const truoc=p.dongNhan.length;
    p.dongNhan=p.dongNhan.filter(r=>dayKey(r.ngay)!==dk);
    if(p.dongNhan.length!==truoc&&p.trangThai==='DONG'){p.trangThai='MO';p.hut=0;p.lyDoHut=null;}
  });
  /* dọn các bản ghi phụ đề ngày đó (nếu còn sót, không gắn bút toán) */
  DB.giaoTP=(DB.giaoTP||[]).filter(g=>dayKey(g.ngay)!==dk);
  DB.giaoCong=(DB.giaoCong||[]).filter(g=>dayKey(g.ngay)!==dk);
  DB.chotBao=(DB.chotBao||[]).filter(c=>dayKey(c.ngay||c.thoiDiem||0)!==dk);
  DB.phienGio=(DB.phienGio||[]).filter(s=>dayKey(s.ngay||s.thoiDiem||0)!==dk);
  Store.save();render();
  toast('Đã xóa sổ ngày '+new Date(dk+'T00:00:00').toLocaleDateString('vi-VN')+' — bấm Hồi phục nếu cần.');
}
function hoiPhucNgay(){

  try{DB=JSON.parse(s.snap);}catch(e){toast('Bản tạm hỏng, không hồi phục được.',true);return;}

function csAmtHTML(nature,amount){
  const mag=fmtShort(Math.abs(amount));
  if(nature==='chuyen')return `<span style="color:var(--ink-2);font-weight:700">${mag}</span>`; /* chuyển túi: không phải lời/lỗ → trung tính */
  if(nature==='vao')return `<span class="money-pos">+ ${mag}</span>`;
  if(nature==='ra')return `<span class="money-neg">− ${mag}</span>`;
  if(nature==='dt')return `<span class="money-pos">${amount<0?'− ':''}${mag}</span>`;
  return `<span class="money-neg">${mag}</span>`; /* công thợ: giá trị phải trả */
}
/* ---------- LÃI TẠM (tab kế Chốt sổ) ----------
   Xem nhanh khi app CHƯA dùng đủ (chưa nhập đơn/giao hàng).
   Cơ sở TIỀN MẶT: tiền chủ hàng đưa − tiền đã chi ra. KHÔNG tính bỏ/rút vốn.
   Đây KHÔNG phải lãi kế toán thật (lãi thật ghi nhận lúc giao hàng — xem Tổng quan → Lãi & Tiền). */
let ltMode='thang';   // 'ngay' | 'tuan' | 'thang' | 'all'
let ltRef=0;          // mốc thời gian trong kỳ đang xem; 0 = dùng hôm nay
function ltPeriod(){return perRange(ltMode,ltRef);}
function ltSetMode(mo){ltMode=mo;ltRef=0;render();}   // đổi kiểu kỳ → nhảy về kỳ hiện tại
function ltNav(dir){if(ltMode==='all')return;const P=ltPeriod();if(dir>0&&P.atNow)return;ltRef=perNav(ltMode,ltRef,dir);render();}
function ltClass(bt){ // ĐỐI CHIẾU 1-1 VỚI CHỐT SỔ: dùng chung bộ phân loại csGroupOf.
  // Chỉ tính khoản chạm tiền thật (cash basis). Khoản nào Chốt sổ không hiện thì Lãi tạm cũng bỏ
  // (không tự bịa "Chi khác") — đúng nguyên tắc: không đối chiếu được thì không ghi vào.
  let q=0;bt.dong.forEach(d=>{if(d.tk===TK.QUY)q+=(d.chieu==='NO'?d.soTien:-d.soTien);});
  if(!q)return null;
  const g=csGroupOf(bt);if(!g)return null;
  const k=g.gkey;
  if(k.indexOf('thu_')===0)return {loai:'thu',q};
  if(k==='von')return {loai:q>0?'vonvao':'vonra',q};
  if(k==='dauky')return {loai:'dauky',q};
  if(k.indexOf('luong_')===0)return {loai:'luong',q};
  if(k.indexOf('ps_')===0)return {loai:'psth',q};
  if(k==='chi_xuong')return {loai:'cpxuong',q};
  if(k==='chi_don')return {loai:'chidon',q};
  if(k==='chi_den')return {loai:'chiden',q};
  if(k==='chi_khac')return {loai:'chikhac',q};
  return null;
}
/* Thu (chủ hàng đưa) vs Chi sản xuất trong [from,to] cho biểu đồ Lãi tạm — dùng chung ltClass để khớp số */
function ltChartEvents(from,to){const ev=[];DB.butToan.forEach(bt=>{if(bt.thoiDiem<from||bt.thoiDiem>to)return;const c=ltClass(bt);if(!c)return;
  if(c.loai==='thu'||c.loai==='thukhac')ev.push({t:bt.thoiDiem,thu:Math.abs(c.q),chi:0});
  else if(['cpxuong','luong','psth','chidon','chiden','chikhac'].includes(c.loai))ev.push({t:bt.thoiDiem,thu:0,chi:Math.abs(c.q)});});
  return ev;}
function bcLaiTam(){
  const P=ltPeriod();
  const inKy=(t)=>t>=P.from&&t<=P.to;
  let thu=0,cpXuong=0,luong=0,psth=0,chiDon=0,chiDen=0,chiKhac=0,thuKhac=0,vonVao=0,vonRa=0,dauKy=0,tongVao=0,tongRa=0;
  DB.butToan.forEach(bt=>{if(!inKy(bt.thoiDiem))return;
    let q=0;bt.dong.forEach(d=>{if(d.tk===TK.QUY)q+=(d.chieu==='NO'?d.soTien:-d.soTien);});
    if(!q)return;
    if(q>0)tongVao+=q;else tongRa+=-q;
    const c=ltClass(bt);if(!c)return;
    if(c.loai==='thu')thu+=c.q;
    else if(c.loai==='cpxuong')cpXuong+=-c.q;
    else if(c.loai==='luong')luong+=-c.q;
    else if(c.loai==='psth')psth+=-c.q;
    else if(c.loai==='chidon')chiDon+=-c.q;
    else if(c.loai==='chiden')chiDen+=-c.q;
    else if(c.loai==='chikhac')chiKhac+=-c.q;
    else if(c.loai==='thukhac')thuKhac+=c.q;
    else if(c.loai==='vonvao')vonVao+=c.q;
    else if(c.loai==='vonra')vonRa+=-c.q;
    else if(c.loai==='dauky')dauKy+=c.q;});
  const chenhKet=tongVao-tongRa;                        /* khớp Chốt sổ "Vào − ra khỏi két" + Tiền trong két */
  const tongThu=thu+thuKhac;
  const chiSx=cpXuong+luong+psth+chiDon+chiDen+chiKhac; /* chi cho sản xuất (không gồm vốn / đầu kỳ) */
  const lai=tongThu-chiSx;                              /* LÃI TẠM — số chính */
  const kyTxt=P.label;
  const rowT=(k,v,neg,loai)=>`<div class="kv" ${loai?`style="cursor:pointer" onclick="ltDetail('${loai}')"`:''}><div class="k">${k}${loai?' <span style="color:var(--ink-3)">›</span>':''}</div><div class="v ${neg?'money-neg':'money-pos'}">${neg?'− ':'+ '}${fmt(Math.abs(v))}</div></div>`;
  let h=`<div class="section-h" style="margin-top:2px">Lãi tạm — tiền mặt theo kỳ</div>
  <div class="hint" style="margin:-4px 4px 10px">Khác "Lãi thật" ở trên: tiền chủ đưa trừ tiền đã chi trong kỳ · khớp Chốt sổ.</div>`;
  h+=perBar(ltMode,ltRef,'ltSetMode','ltNav','');
  h+=`<div class="hint" style="text-align:center;margin:-6px 4px 12px;font-weight:800;color:var(--ink-2)">🗓 Thu/chi trong kỳ: ${perRangeText(P)}</div>`;
  /* SỐ CHÍNH: LÃI TẠM */
  h+=`<div class="reveal" style="background:linear-gradient(160deg,${lai>=0?'#2F7A63,#256452':'#B4472F,#8E3320'})">
    <div class="lbl" style="color:#ECEFF1">Lãi tạm · ${kyTxt}</div><div class="amt">${(lai>=0?'+ ':'− ')+fmt(Math.abs(lai))}</div>
    <div class="note">Tiền chủ hàng đưa trừ tiền chi cho sản xuất · chưa tính bỏ/rút vốn</div></div>`;
  h+=miniThuChi(P.from,P.to,ltChartEvents(P.from,P.to),{thuLbl:'Chủ hàng đưa',chiLbl:'Chi sản xuất',buckets:ltMode==='thang'?monthWeekBuckets(P.from):null,pager:ltMode==='tuy'?{id:'lt',reCall:'render()'}:null});
  /* Chủ hàng đưa */
  h+=`<div class="card"><div class="card-pad">
    <div class="kv" style="cursor:pointer" onclick="ltDetail('thu')"><div class="k" style="font-weight:800">Tiền chủ hàng đưa <span style="color:var(--ink-3)">›</span></div><div class="v big-num money-pos">+ ${fmt(tongThu)}</div></div>
    ${thuKhac?rowT('gồm khoản thu khác',thuKhac,false,'thukhac'):''}
    <div class="hint" style="margin:4px 0 0">Kỳ ${ltMode==='ngay'?'ngày':ltMode==='tuan'?'tuần':ltMode==='thang'?'tháng':'tất cả'}: ${perRangeText(P)}</div></div></div>`;
  /* Chi cho sản xuất */
  h+=`<div class="section-h" style="margin-bottom:2px">Chi cho sản xuất</div>
    <div class="hint" style="margin:0 4px 8px">🗓 ${perRangeText(P)}</div>
    <div class="card"><div class="card-pad">
    ${cpXuong?rowT('Chi phí xưởng (điện, kim chỉ…)',cpXuong,true,'cpxuong'):''}
    ${luong?rowT('Trả / ứng lương thợ',luong,true,'luong'):''}
    ${psth?rowT('Cơm, bồi dưỡng thợ',psth,true,'psth'):''}
    ${chiDon?rowT('Chi phí đơn (ship…)',chiDon,true,'chidon'):''}
    ${chiDen?rowT('Đền hàng hư',chiDen,true,'chiden'):''}
    ${chiKhac?rowT('Chi khác (ship, đền…)',chiKhac,true,'chikhac'):''}
    ${chiSx===0?`<div class="divider-note" style="padding:8px 0">Chưa chi khoản nào.</div>`:''}
    <div class="cs-stat-div" style="margin:8px 0"></div>
    <div class="kv"><div class="k" style="font-weight:800">Tổng chi sản xuất</div><div class="v big-num money-neg">− ${fmt(chiSx)}</div></div></div></div>`;
  /* = Lãi tạm */
  h+=`<div class="card"><div class="card-pad">
    <div class="kv"><div class="k" style="font-weight:800">= Lãi tạm <span style="color:var(--ink-3);font-weight:600">(${perRangeText(P)})</span></div><div class="v big-num ${lai>=0?'money-pos':'money-neg'}">${(lai>=0?'+ ':'− ')+fmt(Math.abs(lai))}</div></div>
    <div class="hint" style="margin:6px 0 0">Số này có thể âm khi hàng đã làm nhưng chủ chưa trả tiền — chưa phải lãi cuối cùng. <b>Lãi thật</b> (tính lúc giao hàng) là phần ở trên.</div></div></div>`;
  /* Vốn — tách riêng */
  if(vonVao||vonRa){h+=`<div class="section-h">Vốn (không tính vào lãi)</div><div class="card"><div class="card-pad">
    ${vonVao?rowT('Bỏ thêm vốn vào xưởng',vonVao,false,'vonvao'):''}
    ${vonRa?rowT('Rút tiền về nhà',vonRa,true,'vonra'):''}</div></div>`;}
  h+=`<div class="hint" style="text-align:center;margin-top:8px">Bấm một dòng để xem các lần nhập bên trong, sửa hoặc hoàn tác.</div>`;
  return h;
}

/* Danh sách giao dịch con của một mục Lãi tạm — bấm tiếp một dòng để sửa/hoàn tác (modalOp) */
const LT_META={thu:['💵','Tiền chủ hàng đưa',false],thukhac:['💵','Khoản thu khác',false],
  cpxuong:['🧾','Chi phí xưởng',true],luong:['👛','Trả / ứng lương thợ',true],
  psth:['🍚','Cơm, bồi dưỡng thợ',true],chidon:['🧾','Chi phí đơn (ship…)',true],chiden:['💸','Đền hàng hư',true],chikhac:['🧾','Chi khác (ship, đền…)',true],
  vonvao:['🏠','Bỏ thêm vốn vào xưởng',false],vonra:['🏠','Rút tiền về nhà',true],dauky:['🏁','Số dư đầu kỳ',false]};
function ltDetail(loai){
  const meta=LT_META[loai];if(!meta)return;const ic=meta[0],ten=meta[1],neg=meta[2];
  const P=ltPeriod();
  const inKy=(t)=>t>=P.from&&t<=P.to;
  const byKey={};
  DB.butToan.forEach(bt=>{if(!inKy(bt.thoiDiem))return;const c=ltClass(bt);if(!c||c.loai!==loai)return;
    const key=(bt.op!=null?'o'+bt.op:'b'+bt.id);
    if(!byKey[key])byKey[key]={key,bt,tien:0,t:bt.thoiDiem};
    byKey[key].tien+=Math.abs(c.q);
    if(bt.thoiDiem<byKey[key].t){byKey[key].t=bt.thoiDiem;byKey[key].bt=bt;}});
  const rows=Object.values(byKey).sort((a,b)=>b.t-a.t);
  const tong=rows.reduce((s,r)=>s+r.tien,0);
  const phu=(bt)=>{for(const d of bt.dong){if(d.chuHangId&&getChu(d.chuHangId))return getChu(d.chuHangId).ten;if(d.thoId&&getTho(d.thoId))return getTho(d.thoId).ten;}return '';};
  const dg=(bt)=>{const s=bt.suKien||'';const m=s.split(/:|·/);return m.length>1?m.slice(1).join('·').trim():'';};
  const kyLbl=P.label;
  let body=`<div style="margin:-4px 0 10px"><div style="font-weight:700">${ic} ${ten}</div>
    <div style="font-size:12.5px;color:var(--ink-2)">${kyLbl} · ${rows.length} lần · <b class="${neg?'money-neg':'money-pos'}">${neg?'− ':'+ '}${fmt(tong)}</b></div></div>`;
  if(!rows.length){body+=`<div class="empty"><div class="ic">🗒️</div><b>Chưa có khoản nào</b>Kỳ này chưa ghi mục này.</div>`;openSheet(ten,body);return;}
  body+=`<div class="card">`+rows.map(r=>{const bt=r.bt;const d=new Date(r.t).toLocaleDateString('vi-VN');
    const p=phu(bt),g=dg(bt);const sub=[d,g].filter(Boolean).join(' · ');
    return `<div class="slip" onclick="modalOp('${r.key}')">
      <div><div class="who" style="font-size:14px">${p||g||ten}</div><div class="meta">${sub||d}</div></div>
      <div style="text-align:right;white-space:nowrap"><div class="big-num ${neg?'money-neg':'money-pos'}" style="font-size:14px">${neg?'− ':'+ '}${fmtShort(r.tien)}</div><span style="color:var(--ink-3)"> ›</span></div>
    </div>`;}).join('')+`</div>`;
  body+=`<div class="hint" style="text-align:center">Bấm một dòng để xem chi tiết, hoàn tác hoặc sửa lại.</div>`;
  openSheet(ten,body);
}

function nangSuat(thoId){
  const ps=DB.phieuGiao.filter(p=>p.thoId===thoId&&p.trangThai!=='HUY');
  let tongCai=0,congSP=0,tongPhe=0,tongDiem=0;
  ps.forEach(p=>{const dat=pDat(p);tongCai+=dat;congSP+=congPhieu(p);tongPhe+=pPhe(p);tongDiem+=diemPhieu(p);});
  const pg=DB.phienGio.filter(x=>x.thoId===thoId);const tongGio=sum(pg.map(x=>x.gio));const tienGio=sum(pg.map(x=>x.tien));
  return {tongCai,congSP,tienGio,tongCong:congSP+tienGio,tongPhe,tongGio,tongDiem};
}
/* tiền lương bao thực trả (để đối chiếu với giá trị công đoạn) — bao: giá ngày × số ngày; giờ: tổng tiền giờ đã chấm */
function tienTraBao(t){const ns=nangSuat(t.id);
  return t.loai==='bao'?(t.donGiaNgay||0)*soNgayBao(t.id,0):t.loai==='gio'?ns.tienGio:0;}
function congThoEvents(thoId){
  const ev=[];
  DB.phieuGiao.filter(p=>p.thoId===thoId&&p.trangThai!=='HUY').forEach(p=>{
    const don=getDon(p.donId);
    (p.dongNhan||[]).forEach(dn=>{const sl=sum(Object.values(dn.dat||{}));if(sl<=0)return;
      const bc=batchCds(p,dn);
      ev.push({ngay:dn.ngay,don:don.ma,mo:tenCds(don,bc),soCai:sl,tien:sl*donGiaCds(don,bc)});});});
  DB.phienGio.filter(x=>x.thoId===thoId).forEach(pg=>{const don=getDon(pg.donId);
    ev.push({ngay:pg.ngay,don:don?don.ma:'—',mo:'Công giờ '+pg.gio+'h',soCai:0,tien:pg.tien});});
  (DB.phieuThao||[]).forEach(pt=>{const don=getDon(pt.donId);
    (pt.dong||[]).forEach(l=>{if(l.thoId!==thoId||l.aiChiu==='THO')return;const tien=l.sl*l.donGia;if(tien<=0)return;
      ev.push({ngay:pt.ngay,don:don?don.ma:'—',mo:'Tháo · '+(don?don.snapshotCD[l.congDoanIdx].ten:''),soCai:l.sl,tien});});});
  (DB.giaoCong||[]).filter(g=>g.thoId===thoId).forEach(g=>{const don=getDon(g.donId);
    ev.push({ngay:g.ngay,don:don?don.ma:'—',mo:'🚚 Giao hàng'+(g.dienGiai?' · '+g.dienGiai:''),soCai:0,tien:g.soTien,giaoCongId:g.id,laGiao:true,coButToan:g.coButToan});});
  ev.sort((a,b)=>a.ngay-b.ngay);
  let tra=bal(TK.PHAI_TRA_THO,d=>d.thoId===thoId).no; // đã trả + ứng
  ev.forEach(e=>{if(tra>=e.tien){e.daTinh=true;tra-=e.tien;}else{e.daTinh=false;if(tra>0){e.tinhMotPhan=tra;tra=0;}}});
  return ev;
}
/* ---- Lịch sử trả/ứng của thợ ---- */
function traUngList(thoId){const out=[];
  DB.butToan.forEach(bt=>{if(bt.dao_cua||bt.daDao)return;      /* bỏ bút toán đảo & bản đã sửa — không liệt kê khống */

}

/* ================= Sổ công của thợ (kiểu Kế mục) + Chốt sổ 3 cách ================= */
function thoLoaiTen(t){return t.loai==='gio'?'Bao giờ · '+fmt(t.donGiaGio)+'/h':t.loai==='bao'?'Bao ngày · '+fmt(t.donGiaNgay)+'/ngày':'Tính sản phẩm';}
/* Tiền xưởng còn thiếu thợ — gồm phần đã ghi nợ (PHAI_TRA_THO) + ước tính kỳ chưa chốt cho thợ bao/giờ */
function thoConThieu(t){let no=luongNoTho(t.id);const wm=baoWatermark(t.id);
  if(t.loai==='bao')no+=(t.donGiaNgay||0)*soNgayBao(t.id,wm);
  else if(t.loai==='gio')no+=(t.donGiaGio||0)*soGioChua(t.id,wm);
  return no;}
function baoWatermark(thoId){DB.chotBao=DB.chotBao||[];const cs=DB.chotBao.filter(c=>c.thoId===thoId);
  return cs.length?Math.max(...cs.map(c=>c.denNgay||c.ngay||0)):0;}
/* gộp công đoạn thợ đã làm theo NGÀY -> [{ngay,label,lines:[{mo,sl,dg,tt}],tong}] */
function soCongNgay(thoId,tuNgay){const ev=congThoEvents(thoId).filter(e=>e.ngay>(tuNgay||0));const map={};
  ev.forEach(e=>{const key=new Date(e.ngay).toLocaleDateString('vi-VN');
    (map[key]=map[key]||{ngay:e.ngay,label:key,lines:[],tong:0});
    const dg=e.soCai>0?Math.round(e.tien/e.soCai):e.tien;
    map[key].lines.push({mo:(e.don?e.don+' · ':'')+e.mo,sl:e.soCai||0,dg,tt:e.tien,giaoCongId:e.giaoCongId,xoaDuoc:e.laGiao&&!e.coButToan});
    map[key].tong+=e.tien;});
  return Object.values(map).sort((a,b)=>a.ngay-b.ngay);}
function soCongTong(thoId,tuNgay){return sum(congThoEvents(thoId).filter(e=>e.ngay>(tuNgay||0)).map(e=>e.tien));}
/* Danh sách NGÀY CÔNG của thợ bao (chưa chốt nếu truyền watermark):
   gộp MỌI hoạt động trong ngày (auto) + ngày CHẤM TAY, dedupe theo ngày lịch. */
function dayStart0(ts){const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime();}
/* mốc bắt đầu tính công bao ngày: field ngayBatDau, fallback = ngày hoạt động sớm nhất, cuối cùng = hôm nay */
function baoStartTs(thoId){const t=getTho(thoId);
  if(t&&t.ngayBatDau)return dayStart0(t.ngayBatDau);
  const ev=congThoEvents(thoId);
  if(ev.length)return dayStart0(Math.min(...ev.map(e=>e.ngay)));
  return dayStart0(now());}
/* mốc kết thúc: còn hoạt động -> hôm nay; đã tạm nghỉ -> ngày bắt đầu nghỉ (nghiTuNgay) */
function baoUpperTs(thoId){const t=getTho(thoId);
  if(t&&t.nghi){if(t.nghiTuNgay)return dayStart0(t.nghiTuNgay);
    const ev=congThoEvents(thoId);return dayStart0(ev.length?Math.max(...ev.map(e=>e.ngay)):now());}
  return dayStart0(now());}
function baoNghiSet(thoId){return new Set((DB.ngayNghiBao||[]).filter(x=>x.thoId===thoId).map(x=>new Date(x.ngay).toLocaleDateString('vi-VN')));}
function baoActSet(thoId){const s=new Set();
  congThoEvents(thoId).forEach(e=>s.add(new Date(e.ngay).toLocaleDateString('vi-VN')));
  (DB.chamCongBao||[]).filter(x=>x.thoId===thoId).forEach(x=>s.add(new Date(x.ngay).toLocaleDateString('vi-VN')));
  return s;}
/* các ngày ĐÃ CHỐT có lưu ngày cụ thể (bản ghi mới) */
function baoDaChotSet(thoId){const s=new Set();
  (DB.chotBao||[]).filter(c=>c.thoId===thoId&&(c.kieu==='bao'||!c.kieu)).forEach(c=>(c.ngayCong||[]).forEach(k=>s.add(k)));
  return s;}
/* số ngày đã chốt NHƯNG không lưu ngày cụ thể (bản ghi cũ, hoặc chốt dư ngày) -> trừ theo số lượng */
function baoDaChotCountLegacy(thoId){return (DB.chotBao||[]).filter(c=>c.thoId===thoId&&(c.kieu==='bao'||!c.kieu))
  .reduce((s,c)=>s+Math.max(0,(c.soDVi||0)-((c.ngayCong||[]).length)),0);}
/* NGÀY CÔNG CHƯA CHỐT của thợ bao — NỐI với quản lý chốt sổ:
   quét mốc bắt đầu -> nay, trừ ngày nghỉ, TRỪ các ngày đã chốt (theo ngày cụ thể + theo số lượng bản ghi cũ).
   Trả {list (mới->cũ), daChot, tong}. */
function baoNgayCong(thoId){const t=getTho(thoId);const start=baoStartTs(thoId),upper=baoUpperTs(thoId);
  const off=baoNghiSet(thoId),act=baoActSet(thoId),done=baoDaChotSet(thoId);
  const chua=[];let g=0;
  for(let d=upper;d>=start&&g<800;d-=86400000,g++){const k=new Date(d).toLocaleDateString('vi-VN');
    if(off.has(k)&&!act.has(k))continue;    // ngày nghỉ (không có việc) -> bỏ
    if(done.has(k))continue;                 // đã chốt (lưu đúng ngày) -> không còn "chưa trả"
    chua.push({key:k,ngay:d,auto:act.has(k)});}
  // trừ thêm ngày đã chốt kiểu cũ (không lưu ngày) + ngày đã TRẢ TIỀN vượt phần đã chốt (trả lương thường)
  const dg=t&&t.donGiaNgay?t.donGiaNgay:0;
  const b=bal(TK.PHAI_TRA_THO,x=>x.thoId===thoId);const traDuTien=Math.max(0,b.no-b.co);
  const traDuNgay=dg>0?Math.floor(traDuTien/dg):0;
  const legacy=baoDaChotCountLegacy(thoId)+traDuNgay;
  const list=legacy>0?chua.slice(0,Math.max(0,chua.length-legacy)):chua;
  const tong=chua.length+done.size;                 // ngày công THỰC đã diễn ra (mốc→nay, trừ nghỉ)
  const daChotRaw=done.size+legacy;                 // gồm cả phần trả DƯ quy ra ngày
  const daChot=Math.min(tong,daChotRaw);            // hiển thị KHÔNG vượt số ngày thực làm
  const duNgay=Math.max(0,daChotRaw-tong);          // số ngày đã trả DƯ (ứng trước)
  return {list,daChot,tong,duNgay,duTien:duNgay*dg};}
function soNgayBao(thoId){return baoNgayCong(thoId).list.length;}
function soGioChua(thoId,tuNgay){return sum((DB.phienGio||[]).filter(x=>x.thoId===thoId&&x.ngay>(tuNgay||0)).map(x=>x.gio));}
/* ---- Chấm NGÀY NGHỈ cho thợ bao (ngoại lệ; KHÔNG bút toán) ---- */
function chamNghiBao({thoId,ngay}){DB.ngayNghiBao=DB.ngayNghiBao||[];const ts=ngay||now();
  const k=new Date(ts).toLocaleDateString('vi-VN');
  if(DB.ngayNghiBao.some(x=>x.thoId===thoId&&new Date(x.ngay).toLocaleDateString('vi-VN')===k))return {trung:true};
  DB.ngayNghiBao.push({id:uid(),thoId,ngay:ts});Store.save();return {trung:false};}
function xoaNghiBao(id){DB.ngayNghiBao=(DB.ngayNghiBao||[]).filter(x=>x.id!==id);Store.save();}
function modalNgayNghiBao(thoId){const t=getTho(thoId);const info=baoNgayCong(thoId);const cong=info.list;const dg=t.donGiaNgay||0;

    <div class="card"><div class="card-pad">
      <div class="kv"><div class="k">Mốc bắt đầu làm</div><div class="v">${new Date(start).toLocaleDateString('vi-VN')} <button class="btn btn-ghost btn-sm" style="margin-left:6px;padding:2px 8px" onclick="modalDoiMocBao('${thoId}')">Đổi</button></div></div>
      ${info.daChot>0?`<div class="kv"><div class="k">Đã chốt / đã trả</div><div class="v">${info.daChot} ngày</div></div>`:''}
      ${info.duNgay>0?`<div class="kv"><div class="k">Đã trả dư (ứng trước)<br><small style="color:var(--ink-3)">${info.duNgay} ngày × ${fmt(dg)}</small></div><div class="v money-neg">${fmt(info.duTien)}</div></div>`:''}

      <div class="kv"><div class="k">Ước tiền công chưa trả</div><div class="v big-num money-neg">${fmt(cong.length*dg)}</div></div></div></div>
    <div class="field"><label>Chấm ngày nghỉ (hôm không đi làm)</label><input type="date" id="ccb_ngay" value="${dayKey(now())}" max="${dayKey(now())}"></div>
    <button class="btn btn-ghost wide" onclick="submitNghiBao('${thoId}')">🌙 Đánh dấu ngày nghỉ</button>
    <div class="section-h" style="margin-top:14px">Ngày nghỉ đã chấm · ${offs.length}</div><div class="card">`;
  h+=offs.length?offs.map(x=>`<div class="slip"><div><div class="who">${new Date(x.ngay).toLocaleDateString('vi-VN')}</div><div class="meta">nghỉ — không tính công</div></div><button onclick="delNghiBao('${x.id}','${thoId}')" style="border:none;background:none;color:var(--rose,#c0392b);font-size:16px;cursor:pointer">✕</button></div>`).join(''):`<div class="divider-note" style="padding:14px">Chưa chấm ngày nghỉ nào.</div>`;
  h+=`</div>`;
  openSheet('Ngày công · '+t.ten,h);}
function submitNghiBao(thoId){const nv=(el('ccb_ngay')||{}).value;const ts=nv?new Date(nv+'T12:00:00').getTime():now();
  const r=chamNghiBao({thoId,ngay:ts});if(r.trung)return toast('Ngày này đã chấm nghỉ rồi.',true);

function delNghiBao(id,thoId){xoaNghiBao(id);modalNgayNghiBao(thoId);render();toast('Đã bỏ ngày nghỉ.');}

  suaTho(thoId,{ngayBatDau:new Date(nv+'T12:00:00').getTime()});modalNgayNghiBao(thoId);render();toast('Đã đổi mốc bắt đầu.');}

  let h=`<div class="hint" style="margin:-4px 0 10px">Sổ công tự sinh từ giao–nhận — không nhập tay. Mỗi dòng: công đoạn · số lượng × đơn giá.</div>`;

  if(!thoId){const list=DB.tho.filter(t=>!t.isOwner);
    if(!list.length)return toast('Chưa có thợ.',true);

  const t=getTho(thoId);csState={thoId,kieu:(t.loai==='bao'||t.loai==='gio')?t.loai:'sp'};drawChotSo();}
function csPick(k){csState.kieu=k;drawChotSo();}

  h+=`<div class="chipset" style="margin-bottom:10px">`+modes.map(([k,l])=>`<div class="chip ${kieu===k?'sel':''}" onclick="csPick('${k}')">${l}</div>`).join('')+`</div>`;
  h+=`<button class="btn btn-ghost btn-sm" style="width:100%;margin-bottom:10px" onclick="modalSoCongTho('${csState.thoId}')">📋 Xem sổ công chi tiết</button>`;
  if(kieu==='sp'){const no=luongNoTho(csState.thoId);

      <div class="field"><label>Số tiền trả kỳ này</label><input type="text" inputmode="numeric" class="sep" id="cs_tra" value="${sepStr(lamTronLe(Math.max(0,no)))}" onfocus="this.select()"></div>
      <button class="btn btn-sage wide" onclick="submitChotSoSP('${csState.thoId}')">Chốt & ghi đã trả</button>`;
  } else if(kieu==='bao'){const _bnc=baoNgayCong(csState.thoId);const ngayList=_bnc.list;const ngay=ngayList.length;
    h+=`<div class="card"><div class="card-pad">
      <div style="display:flex;gap:8px"><div class="field" style="margin:0;flex:1"><label>Đơn giá / ngày</label><input type="text" inputmode="numeric" class="sep" id="cs_dg" value="${sepStr(t.donGiaNgay||0)}" oninput="csCalc()" onfocus="this.select()"></div>
      <div class="field" style="margin:0;flex:1"><label>Số ngày (tự đếm)</label><input type="text" inputmode="numeric" id="cs_dv" value="${ngay}" oninput="csCalc()" onfocus="this.select()"></div></div>
      <div class="kv" style="margin-top:8px"><div class="k">Lương bao phải trả</div><div class="v big-num money-neg" id="cs_pay">0</div></div>
      <div class="kv"><div class="k">Giá trị công đoạn (đối chiếu)</div><div class="v">${fmt(giaTri)}</div></div>
      <div class="kv"><div class="k" id="cs_cl_k">Chênh lệch</div><div class="v" id="cs_cl">0</div></div></div></div>
      <div class="section-h" style="margin-top:4px">Những ngày tính công (chưa chốt · tự điền)${_bnc.daChot>0?` <small style="font-weight:600;color:var(--ink-3)">· đã chốt trước đó ${_bnc.daChot} ngày</small>`:''}</div>
      <div class="card"><div class="card-pad" style="padding-top:6px;padding-bottom:6px">
      ${ngay?ngayList.map(d=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px"><span>${d.key} <small style="color:var(--ink-3)">· ${d.auto?'có việc':'tính công'}</small></span><b>${fmt(t.donGiaNgay||0)}</b></div>`).join(''):`<div class="divider-note" style="padding:10px">${_bnc.daChot>0?'Đã chốt hết các ngày công. Không còn ngày chưa trả.':'Chưa đếm được ngày nào. Đặt mốc bắt đầu ở nút bên dưới.'}</div>`}</div></div>
      <button class="btn btn-ghost btn-sm" style="width:100%;margin-bottom:10px" onclick="modalNgayNghiBao('${csState.thoId}')">🌙 Ngày nghỉ / đổi mốc bắt đầu</button>
      ${ngay?`<label style="display:flex;align-items:flex-start;gap:9px;padding:10px 12px;margin-bottom:10px;background:var(--sage-soft);border-radius:12px;cursor:pointer;font-size:13px;line-height:1.4">
        <input type="checkbox" id="cs_dantrai" ${DB.settings.danTraiBao?'checked':''} onchange="csSetDanTrai(this.checked)" style="width:18px;height:18px;flex:none;margin-top:1px">

      <div class="field"><label>Số tiền trả kỳ này</label><input type="text" inputmode="numeric" class="sep" id="cs_tra" oninput="this.dataset.touched=1" onfocus="this.select()"></div>

  } else {const gioMac=soGioChua(csState.thoId,wm);

      <div class="field" style="margin:0;flex:1"><label>Tổng giờ</label><input type="text" inputmode="numeric" id="cs_dv" value="${gioMac||''}" placeholder="nhập giờ" oninput="csCalc()" onfocus="this.select()"></div></div>

      <div class="kv"><div class="k" id="cs_cl_k">Chênh lệch</div><div class="v" id="cs_cl">0</div></div></div></div>
      <div class="field"><label>Số tiền trả kỳ này</label><input type="text" inputmode="numeric" class="sep" id="cs_tra" oninput="this.dataset.touched=1" onfocus="this.select()"></div>
      <button class="btn btn-sage wide" onclick="submitChotSoBao('${csState.thoId}','gio')">Chốt & ghi đã trả</button>`;
  }
  openSheet('Chốt sổ · '+t.ten,h);if(kieu!=='sp')csCalc();}
function csCalc(){const dg=numVal('cs_dg');const dvE=el('cs_dv');const dv=dvE?(+((''+dvE.value).replace(/[^\d]/g,''))||0):0;
  const pay=Math.round(dg*dv);const pe=el('cs_pay');if(pe)pe.textContent=fmt(pay);
  const tr=el('cs_tra');if(tr&&!tr.dataset.touched)tr.value=sepStr(lamTronLe(pay));
  const cl=_csGiaTri-pay;const ce=el('cs_cl');if(ce){ce.textContent=(cl>=0?'+':'')+fmt(cl);ce.className='v '+(cl>=0?'money-pos':'money-neg');}
  const ck=el('cs_cl_k');if(ck)ck.textContent=cl>=0?'Chênh lệch — làm dư hơn tiền bao (lời)':'Chênh lệch — làm ít hơn tiền bao (lỗ)';}
function csSetDanTrai(v){DB.settings=DB.settings||{};DB.settings.danTraiBao=!!v;Store.save();}
function submitChotSoSP(thoId){try{const val=numVal('cs_tra');if(val<=0)return toast('Nhập số tiền.',true);
  traLuong({thoId,soTien:val});closeSheet();render();toast('Đã chốt & ghi trả lương.');}catch(e){toast(e.message,true)}}
function submitChotSoBao(thoId,kieu){try{
  const dg=numVal('cs_dg');const dvE=el('cs_dv');const dv=dvE?(+((''+dvE.value).replace(/[^\d]/g,''))||0):0;
  const pay=Math.round(dg*dv);const tra=numVal('cs_tra');
  if(pay<=0)return toast('Nhập đơn giá và số '+(kieu==='bao'?'ngày':'giờ')+'.',true);
  if(tra>pay+Math.max(0,luongNoTho(thoId)))return toast('Tiền trả nhiều hơn mức phải trả.',true);
  let ngayCong=null,ngayObjs=null;
  if(kieu==='bao'){const chua=baoNgayCong(thoId).list;/* mới->cũ */const pick=dv>0?chua.slice(-dv):[];ngayCong=pick.map(d=>d.key);ngayObjs=pick.map(d=>({key:d.key,ngay:d.ngay}));}
  const danTrai=kieu==='bao'&&!!(el('cs_dantrai')&&el('cs_dantrai').checked);
  chotSoBao({thoId,kieu,donGia:dg,soDVi:dv,payable:pay,giaTriCD:_csGiaTri,tienTra:tra,ngayCong,ngayObjs,danTrai});
  closeSheet();render();toast('Đã chốt sổ & ghi lương bao.');}catch(e){toast(e.message,true)}}
function chotSoBao({thoId,kieu,donGia,soDVi,payable,giaTriCD,tienTra,ngayCong,ngayObjs,danTrai}){DB.chotBao=DB.chotBao||[];beginOp();
  const ten=getTho(thoId).ten;
  if(payable>0){
    if(danTrai&&kieu==='bao'&&ngayObjs&&ngayObjs.length){
      /* Dàn trải: mỗi ngày công 1 bút toán, ghi ĐÚNG ngày làm; đơn giá/ngày, ngày cuối gánh phần lẻ để khớp tổng */
      const n=ngayObjs.length;let conLai=payable;
      ngayObjs.forEach((o,i)=>{const m=(i===n-1)?conLai:Math.round(donGia);conLai-=m;if(m<=0)return;
        ghi('Chốt lương bao ngày ('+ten+')',[
          {tk:TK.RO_CHUNG,chieu:'NO',soTien:m},
          {tk:TK.PHAI_TRA_THO,chieu:'CO',soTien:m,thoId}],{thoiDiem:(o.ngay||now())});});
    } else {
      ghi('Chốt lương '+(kieu==='bao'?'bao ngày':'theo giờ')+' ('+ten+')',[
        {tk:TK.RO_CHUNG,chieu:'NO',soTien:payable},
        {tk:TK.PHAI_TRA_THO,chieu:'CO',soTien:payable,thoId}]);
    }
  }
  if(tienTra>0)ghi('Trả lương thợ',[
    {tk:TK.PHAI_TRA_THO,chieu:'NO',soTien:tienTra,thoId},{tk:TK.QUY,chieu:'CO',soTien:tienTra}]);
  DB.chotBao.push({id:uid(),thoId,kieu,ngay:now(),denNgay:now(),donGia,soDVi,payable,giaTriCD,tienTra,ngayCong:ngayCong||null,danTrai:!!danTrai});
  Store.save();}

/* ========== NĂNG SUẤT — 3 tab: Năng suất · Thưởng · Mục tiêu ==========
   Kiến trúc dữ liệu-hoá: chương trình thưởng (DB.settings.thuongCT) và
   chỉ số mục tiêu (DB.settings.mucTieuCT) đều là danh sách tạo/sửa/xoá được. */
let nsTab='ns';let nsYm=null;let ctEdit=null;let mtEdit=null;
const CT_LOAI={chuyenCan:'Chuyên cần',sanLuong:'Sản lượng',chatLuong:'Chất lượng',caiThien:'Cải thiện',daKyNang:'Đa kỹ năng'};
const CT_TA={chuyenCan:'Đủ số ngày công/tháng → thưởng',sanLuong:'Đạt bậc điểm → thưởng theo bậc',chatLuong:'Tỉ lệ phế thấp → thưởng (có thể làm cửa khóa)',caiThien:'Tháng này hơn tháng trước → thưởng',daKyNang:'Làm được nhiều công đoạn → thưởng'};
const MT_DO={cai:'Tổng số cái ra hàng',diem:'Tổng điểm năng suất',nangSuat:'Năng suất (điểm ÷ ngày công)',ngayCong:'Tổng ngày công (đi làm đều)',tyLePhe:'Tỉ lệ phế toàn xưởng',gio:'Tổng giờ công',giaTriCong:'Tổng giá trị công',soThoLam:'Số thợ có làm',thuongDaChi:'Tiền thưởng đã chi'};
const MT_LAY={soThoDat:'Số thợ đạt',tyLeDat:'Tỉ lệ thợ đạt (%)',tongThuong:'Tổng tiền thưởng (tính)'};
const MT_HUONG_MAC={cai:'cao',diem:'cao',nangSuat:'cao',ngayCong:'cao',tyLePhe:'thap',gio:'cao',giaTriCong:'cao',soThoLam:'cao',thuongDaChi:'trungTinh'};
/* ---- Kho mẫu thưởng: hình dạng (chỉ số + kiểu tính) & chu kỳ ---- */
const CT_CHUKY={ngay:'Theo ngày',tuan:'Theo tuần',thang:'Theo tháng'};
const CT_CHUKY_DVI={ngay:'ngày',tuan:'tuần',thang:'tháng'};
const CT_CHUKY_CHO={chuyenCan:['tuan','thang'],sanLuong:['ngay','tuan','thang'],chatLuong:['thang'],caiThien:['thang'],daKyNang:['thang']};
const CT_META={chuyenCan:{do:'Số ngày công',tinh:'Đạt ngưỡng'},sanLuong:{do:'Điểm năng suất',tinh:'Bậc thang'},chatLuong:{do:'Tỉ lệ phế',tinh:'Ngưỡng + cửa khóa'},caiThien:{do:'Điểm/cái so kỳ trước',tinh:'Tăng ≥ %'},daKyNang:{do:'Số công đoạn',tinh:'Đạt ngưỡng'}};
/* ---- MỤC TIÊU: thiết kế thưởng theo "muốn thợ làm gì", tự chọn cơ chế + chu kỳ + cảnh báo bẫy ---- */
const MUC_TIEU={
  diLamDeu:{icon:'🗓️',ten:'Thợ đi làm đều',moTa:'Thưởng khi đủ số ngày công — nên tính theo tuần.',loai:'chuyenCan',chuKy:'tuan',
    bay:'Đừng đặt mốc theo tháng: nghỉ vài bữa đầu tháng là thợ buông cả tháng. Theo tuần thì mỗi tuần là ván mới.',theoDoi:'ngayCong',huong:'cao'},
  itHu:{icon:'✅',ten:'Ít hàng hư',moTa:'Thưởng dương khi tỉ lệ phế thấp.',loai:'chatLuong',chuKy:'thang',
    bay:'KHÔNG dùng cửa khóa/phạt phế — thợ sẽ giấu hàng hư, tuồn xuống công đoạn sau, hại hơn.',theoDoi:'tyLePhe',huong:'thap'},
  lamNhieu:{icon:'📈',ten:'Làm ra nhiều',moTa:'Thưởng bậc thang theo điểm sản lượng.',loai:'sanLuong',chuKy:'thang',
    bay:'Ép nhanh dễ tăng hư — nên bật kèm một chương trình "Ít hàng hư" để giữ chất lượng.',theoDoi:'cai',huong:'cao'},
  linhHoat:{icon:'🧵',ten:'Chịu nhiều công đoạn',moTa:'Thưởng thợ làm được nhiều công đoạn khác nhau.',loai:'daKyNang',chuKy:'thang',
    bay:'Đây là thưởng linh hoạt chung. Muốn đẩy MỘT công đoạn khó cụ thể thì chỉnh đơn giá công đoạn (nơi khác), không phải ở đây.',theoDoi:null,huong:'cao'},
  vuotChinhMinh:{icon:'➕',ten:'Kỳ sau hơn kỳ trước',moTa:'Thưởng khi thợ vượt chính mình tháng trước.',loai:'caiThien',chuKy:'thang',
    bay:'Hợp khi chưa biết đặt mốc bao nhiêu — lấy chính thợ tháng trước làm mốc.',theoDoi:'diem',huong:'cao'}};
const LOAI_MUCTIEU={chuyenCan:'diLamDeu',chatLuong:'itHu',sanLuong:'lamNhieu',daKyNang:'linhHoat',caiThien:'vuotChinhMinh'};
function goalOf(x){const k=(x&&x.mucTieu)||LOAI_MUCTIEU[x&&x.loai]||null;return k?MUC_TIEU[k]:null;}
function ctChuKyOf(p){const allow=CT_CHUKY_CHO[p.loai]||['thang'];const c=p.chuKy||'thang';return allow.indexOf(c)>=0?c:'thang';}
function startOfWeekTs(t){const d=new Date(t);const wd=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-wd);return d.getTime();}
function chuKyPeriods(chuKy,from,to){const DAY=86400000;
  if(chuKy!=='tuan'&&chuKy!=='ngay')return [{from,to}];
  const out=[];
  if(chuKy==='ngay'){for(let d=from;d<=to;d+=DAY)out.push({from:d,to:Math.min(to,d+DAY-1)});return out;}
  for(let mon=startOfWeekTs(from);mon<=to;mon+=7*DAY){const pf=Math.max(from,mon),pt=Math.min(to,mon+7*DAY-1);if(pf<=pt)out.push({from:pf,to:pt});}
  return out;}

/* ---------- thời gian: kỳ = tháng ---------- */
function nsCurYm(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function nsPrevYm(ym){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function nsMonthRange(ym){const [y,m]=ym.split('-').map(Number);const from=new Date(y,m-1,1,0,0,0,0).getTime();const to=new Date(y,m,1,0,0,0,0).getTime()-1;return {from,to};}
function prevMonthRange(from){const d=new Date(from);const pf=new Date(d.getFullYear(),d.getMonth()-1,1).getTime();const pt=new Date(d.getFullYear(),d.getMonth(),1).getTime()-1;return {from:pf,to:pt};}
function nsWin(){if(!nsYm)nsYm=nsCurYm();const c=nsMonthRange(nsYm);const p=nsMonthRange(nsPrevYm(nsYm));return {from:c.from,to:c.to,pfrom:p.from,pto:p.to};}
function nsShiftYm(d){const [y,m]=nsYm.split('-').map(Number);const dt=new Date(y,m-1+d,1);nsYm=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');nsRender();}
function nsYmLabel(ym){const [y,m]=ym.split('-');return 'Tháng '+(+m)+'/'+y;}

/* ---------- số liệu MỘT thợ trong [from,to] ---------- */
function nsKy(thoId,from,to){let diem=0,cai=0,phe=0,gio=0,tien=0;const days=new Set();
  DB.phieuGiao.filter(p=>p.thoId===thoId&&p.trangThai!=='HUY').forEach(p=>{const don=getDon(p.donId);
    (p.dongNhan||[]).forEach(x=>{if(x.ngay<from||x.ngay>to)return;const bc=batchCds(p,x);
      const sl=sum(Object.values(x.dat||{}));const ph=sum(Object.values(x.phe||{}));
      if(sl<=0&&ph<=0)return;cai+=sl;phe+=ph;if(don){diem+=sl*diemCds(don,bc);tien+=sl*donGiaCds(don,bc);}days.add(dayKey(x.ngay));});});
  DB.phienGio.filter(x=>x.thoId===thoId).forEach(pg=>{if(pg.ngay<from||pg.ngay>to)return;gio+=(pg.gio||0);tien+=(pg.tien||0);days.add(dayKey(pg.ngay));});
  const tong=cai+phe;const tyle=tong>0?phe/tong*100:0;
  return {diem,cai,phe,gio,tien,ngayCong:days.size,tyle};}
function nsSoCongDoan(thoId,from,to){const s=new Set();
  DB.phieuGiao.filter(p=>p.thoId===thoId&&p.trangThai!=='HUY').forEach(p=>{const don=getDon(p.donId);
    (p.dongNhan||[]).forEach(x=>{if(x.ngay<from||x.ngay>to)return;const sl=sum(Object.values(x.dat||{}));if(sl<=0)return;
      batchCds(p,x).forEach(n=>{const cd=don&&don.snapshotCD&&don.snapshotCD[n];s.add(cd&&cd.ten?cd.ten:('cd'+n));});});});
  return s.size;}

/* ---------- KHO MẪU THƯỞNG (hình dạng, dùng lại) ---------- */
function mauThuongList(){DB.settings=DB.settings||{};
  if(!DB.settings.thuongMau){DB.settings.thuongMau=[
    {id:uid(),ten:'Thợ đi làm đều',loai:'chuyenCan',chuKy:'tuan',mucTieu:'diLamDeu'},
    {id:uid(),ten:'Ít hàng hư',loai:'chatLuong',chuKy:'thang',mucTieu:'itHu'},
    {id:uid(),ten:'Làm ra nhiều',loai:'sanLuong',chuKy:'thang',mucTieu:'lamNhieu'}];Store.save();}
  /* backfill mucTieu cho mẫu cũ theo loại */
  let d=false;DB.settings.thuongMau.forEach(m=>{if(!m.mucTieu&&LOAI_MUCTIEU[m.loai]){m.mucTieu=LOAI_MUCTIEU[m.loai];d=true;}});if(d)Store.save();
  return DB.settings.thuongMau;}
function mauThuongById(id){return mauThuongList().find(m=>m.id===id);}
function soCtDungMau(mauId){return ctList().filter(p=>p.mauId===mauId).length;}
/* ---------- CHƯƠNG TRÌNH THƯỞNG (bản chạy = điền số vào mẫu) ---------- */
function ctList(){DB.settings=DB.settings||{};
  if(!DB.settings.thuongCT){const old=DB.settings.thuong||{};const a=[];
    a.push({id:uid(),ten:'Chuyên cần',loai:'chuyenCan',chuKy:'thang',on:(old.chuyenCan?old.chuyenCan.on!==false:true),phamVi:{kieu:'tatCa',loai:['sp','bao','gio']},mocNgay:(old.chuyenCan&&old.chuyenCan.mocNgay)||22,tien:(old.chuyenCan&&old.chuyenCan.tien)||0});
    a.push({id:uid(),ten:'Sản lượng',loai:'sanLuong',chuKy:'thang',on:(old.sanLuong?old.sanLuong.on!==false:true),phamVi:{kieu:'loai',loai:['sp']},bac:(old.sanLuong&&old.sanLuong.bac)||[]});
    a.push({id:uid(),ten:'Chất lượng',loai:'chatLuong',chuKy:'thang',on:(old.chatLuong?old.chatLuong.on!==false:true),phamVi:{kieu:'tatCa',loai:['sp','bao','gio']},nguong:(old.chatLuong&&old.chatLuong.nguong)||3,tien:(old.chatLuong&&old.chatLuong.tien)||0,cua:!!(old.chatLuong&&old.chatLuong.cua)});
    DB.settings.thuongCT=a;Store.save();}
  /* migration: bản cũ thiếu chuKy / mauId → gắn mẫu tương ứng theo loại (idempotent) */
  const mus=mauThuongList();let dirty=false;
  DB.settings.thuongCT.forEach(p=>{if(!p.chuKy){p.chuKy='thang';dirty=true;}
    if(!p.mauId){let mu=mus.find(m=>m.loai===p.loai);if(!mu){mu={id:uid(),ten:CT_LOAI[p.loai]||'Mẫu',loai:p.loai,chuKy:'thang',mucTieu:LOAI_MUCTIEU[p.loai]||null};mus.push(mu);}p.mauId=mu.id;dirty=true;}
    if(!p.mucTieu){const mu=mus.find(m=>m.id===p.mauId);p.mucTieu=(mu&&mu.mucTieu)||LOAI_MUCTIEU[p.loai]||null;if(p.mucTieu)dirty=true;}});
  if(dirty)Store.save();
  return DB.settings.thuongCT;}
function ctById(id){return ctList().find(c=>c.id===id);}
function ctMacDinh(loai){const base={id:uid(),ten:CT_LOAI[loai],loai,on:true,phamVi:{kieu:'tatCa',loai:['sp','bao','gio']}};
  if(loai==='chuyenCan')return Object.assign(base,{mocNgay:22,tien:0});
  if(loai==='sanLuong')return Object.assign(base,{bac:[],phamVi:{kieu:'loai',loai:['sp']}});
  if(loai==='chatLuong')return Object.assign(base,{nguong:3,tien:0,cua:false});
  if(loai==='caiThien')return Object.assign(base,{chiSo:'diem',mocPhanTram:10,tien:0});
  if(loai==='daKyNang')return Object.assign(base,{mocSo:2,tien:0,phamVi:{kieu:'loai',loai:['sp']}});
  return base;}
function ctFromMau(mau){const loai=mau.loai;const base={id:uid(),ten:mau.ten||CT_LOAI[loai],loai,mauId:mau.id,chuKy:mau.chuKy||'thang',mucTieu:mau.mucTieu||LOAI_MUCTIEU[loai]||null,on:true,phamVi:{kieu:'tatCa',loai:['sp','bao','gio']}};
  if(loai==='chuyenCan')return Object.assign(base,{mocNgay:(mau.chuKy==='tuan'?6:22),tien:0});
  if(loai==='sanLuong')return Object.assign(base,{bac:[],phamVi:{kieu:'loai',loai:['sp']}});
  if(loai==='chatLuong')return Object.assign(base,{nguong:3,tien:0,cua:false});
  if(loai==='caiThien')return Object.assign(base,{chiSo:'diem',mocPhanTram:10,tien:0});
  if(loai==='daKyNang')return Object.assign(base,{mocSo:2,tien:0,phamVi:{kieu:'loai',loai:['sp']}});
  return base;}
function thoTrongPhamVi(prog){let ws=DB.tho.filter(t=>!t.isOwner);const pv=prog.phamVi||{kieu:'tatCa'};
  if(pv.kieu==='loai')ws=ws.filter(t=>(pv.loai||[]).indexOf(t.loai)>=0);
  return ws;}
/* Tính 1 chương trình cho 1 thợ trong [from,to]; tự lấy tháng trước khi cần (caiThien) */
function ctTinh(prog,thoId,from,to){const k=nsKy(thoId,from,to);
  if(prog.loai==='chuyenCan'){const dat=prog.mocNgay>0&&k.ngayCong>=prog.mocNgay;return {dat,tien:dat?(prog.tien||0):0,mo:k.ngayCong+'/'+(prog.mocNgay||'—')+' ngày công'};}
  if(prog.loai==='sanLuong'){const bac=(prog.bac||[]).slice().sort((a,b)=>a.moc-b.moc);let hit=null;bac.forEach(b=>{if(k.diem>=b.moc)hit=b;});
    return {dat:!!hit,tien:hit?(hit.tien||0):0,mo:sepStr(k.diem)+' điểm'+(hit?' · đạt bậc '+sepStr(hit.moc):(bac.length?' · chưa tới '+sepStr(bac[0].moc):' · chưa đặt bậc'))};}
  if(prog.loai==='chatLuong'){const co=(k.cai+k.phe)>0;const dat=co&&k.tyle<=prog.nguong;
    return {dat,tien:dat?(prog.tien||0):0,cuaFail:!!(prog.cua&&co&&k.tyle>prog.nguong),mo:co?('phế '+k.tyle.toFixed(1)+'% ≤ '+(prog.nguong||0)+'%'):'chưa có hàng'};}
  if(prog.loai==='caiThien'){const pr=prevMonthRange(from);const kp=nsKy(thoId,pr.from,pr.to);
    const cur=prog.chiSo==='cai'?k.cai:k.diem;const prev=prog.chiSo==='cai'?kp.cai:kp.diem;
    const pct=prev>0?(cur-prev)/prev*100:(cur>0?100:0);const dat=cur>0&&pct>=prog.mocPhanTram;
    return {dat,tien:dat?(prog.tien||0):0,mo:(prog.chiSo==='cai'?'cái':'điểm')+' '+(pct>=0?'+':'')+pct.toFixed(0)+'% so tháng trước (mốc '+prog.mocPhanTram+'%)'};}
  if(prog.loai==='daKyNang'){const n=nsSoCongDoan(thoId,from,to);const dat=prog.mocSo>0&&n>=prog.mocSo;
    return {dat,tien:dat?(prog.tien||0):0,mo:n+'/'+(prog.mocSo||'—')+' công đoạn'};}
  return {dat:false,tien:0,mo:''};}
/* Tổng thưởng 1 thợ = mọi chương trình bật & có thợ trong phạm vi; áp cửa khóa chất lượng */
/* Cộng dồn 1 chương trình cho 1 thợ theo chu kỳ trong [from,to] */
function ctAccrue(prog,thoId,from,to){const ck=ctChuKyOf(prog);const periods=chuKyPeriods(ck,from,to);
  let tien=0,datCnt=0,lastMo='',cuaFail=false;
  periods.forEach(pr=>{const r=ctTinh(prog,thoId,pr.from,pr.to);if(r.cuaFail)cuaFail=true;
    if(r.dat){datCnt++;tien+=r.tien;}lastMo=r.mo;});
  const mo=(ck==='thang')?lastMo:(datCnt+'/'+periods.length+' '+CT_CHUKY_DVI[ck]+' đạt');
  return {dat:datCnt>0,tien,mo,chuKy:ck,datCnt,kyCnt:periods.length,cuaFail};}
function thuongThoTong(thoId,from,to){const items=[];let tong=0,gateFail=false;
  ctList().filter(p=>p.on).forEach(prog=>{if(thoTrongPhamVi(prog).indexOf(getTho(thoId))<0)return;
    const a=ctAccrue(prog,thoId,from,to);if(a.cuaFail)gateFail=true;
    items.push({prog,dat:a.dat,tien:a.tien,mo:a.mo,chuKy:a.chuKy,datCnt:a.datCnt,kyCnt:a.kyCnt});tong+=a.tien;});
  if(gateFail){tong=0;items.forEach(it=>{it.tien=0;it.khoa=true;});}
  return {items,tong,gateFail};}
function daTraThuong(ym,thoId){return sum((DB.thuongTra||[]).filter(x=>x.ym===ym&&x.thoId===thoId).map(x=>x.tien));}

/* ---------- Thưởng của MỘT thợ ở mọi chương trình (mở từ chi tiết thợ) ---------- */
function modalThoThuong(thoId){const t=getTho(thoId);if(!t)return;const w=nsWin();const r=thuongThoTong(thoId,w.from,w.to);
  let h=`<div class="hint" style="margin-top:0">Thưởng ${nsYmLabel(nsYm).toLowerCase()} — tiến độ của thợ ở từng chương trình. Bấm một chương trình để xem/sửa mốc.</div>`;
  if(!r.items.length){h+=`<div class="divider-note" style="padding:16px">Chưa có chương trình thưởng nào áp dụng cho thợ này.</div>`;openSheet('Thưởng — '+t.ten,h);return;}
  h+=`<div class="card">`;
  r.items.forEach(it=>{const right=it.khoa?`<span style="color:var(--thread);font-size:12px">🔒 khóa</span>`:it.dat?`<b style="color:var(--brand)">+${fmt(it.tien)}</b>`:`<span style="color:var(--ink-3);font-size:12px">chưa đạt</span>`;
    h+=`<div class="slip" style="cursor:pointer" onclick="modalThuongCT('${it.prog.id}')">
      <div style="min-width:0;flex:1"><div class="who">${escHtml(it.prog.ten)} <span style="font-size:11px;color:var(--ink-3)">· ${CT_LOAI[it.prog.loai]}</span></div>
        <div class="meta">${it.mo}</div></div>
      <div style="text-align:right;margin-left:8px">${right}</div></div>`;});
  h+=`</div><div class="card"><div class="card-pad"><div class="kv"><div class="k">Tổng thưởng tháng này</div><div class="v big-num" style="color:var(--brand)">${fmt(r.tong)}</div></div></div></div>`;
  openSheet('Thưởng — '+t.ten,h);}
/* ---------- ĐIỀU HƯỚNG TAB ---------- */
function modalNangSuatXep(tab){nsTab=tab||nsTab||'ns';if(!nsYm)nsYm=nsCurYm();nsRender();}
function nsSwitch(k){nsTab=k;nsRender();}
function nsRender(){if(!nsYm)nsYm=nsCurYm();
  const tabs=[['ns','Năng suất'],['thuong','Thưởng'],['muctieu','Mục tiêu']];
  let h=`<div class="chipset" style="margin:-4px 0 12px">`+tabs.map(([k,l])=>`<div class="chip ${nsTab===k?'sel':''}" onclick="nsSwitch('${k}')">${l}</div>`).join('')+`</div>`;
  h+=nsTab==='thuong'?nsTabThuong():nsTab==='muctieu'?nsTabMucTieu():nsTabNS();
  openSheet('Năng suất thợ',h);}
function nsKyNav(){return `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px">
    <button class="btn btn-ghost btn-sm" onclick="nsShiftYm(-1)" style="min-width:44px">‹</button>
    <b style="font-size:15px">${nsYmLabel(nsYm)}</b>
    <button class="btn btn-ghost btn-sm" onclick="nsShiftYm(1)" style="min-width:44px">›</button></div>`;}

/* ---------- TAB 1: NĂNG SUẤT ---------- */
function nsTabNS(){
  const rows=DB.tho.filter(t=>!t.isOwner).map(t=>({t,ns:nangSuat(t.id)})).sort((a,b)=>b.ns.tongDiem-a.ns.tongDiem);
  let h=`<div class="hint" style="margin:-2px 0 12px">Điểm năng suất = Σ (số cái × điểm công đoạn), cộng dồn từ đầu. Bấm vào một thợ để xem chi tiết.</div>`;
  if(!rows.length)return h+`<div class="divider-note" style="padding:16px">Chưa có thợ.</div>`;
  const max=Math.max(1,rows[0].ns.tongDiem);
  h+=`<div class="card">`;
  rows.forEach((r,i)=>{const d=r.ns.tongDiem;const pct=Math.max(2,Math.round(d/max*100));
    const hạng=i===0?'🥇':i===1?'🥈':i===2?'🥉':`<b style="display:inline-block;min-width:20px;color:var(--ink-3)">${i+1}.</b>`;
    const nghi=r.t.nghi?` · <span style="color:var(--ink-3)">tạm nghỉ</span>`:'';
    h+=`<div class="slip" onclick="modalThoChiTiet('${r.t.id}')">
      <div style="min-width:0;flex:1">
        <div class="who">${hạng} ${escHtml(r.t.ten)}${nghi}</div>
        <div class="meta">${sepStr(r.ns.tongCai)} cái · ${thoLoaiTen(r.t)}</div>
        <div style="height:5px;background:var(--line-2);border-radius:4px;margin-top:7px;overflow:hidden"><div style="height:100%;width:${d>0?pct:0}%;background:var(--brand)"></div></div>
      </div>
      <div class="slip-right" style="text-align:right;margin-left:10px"><b style="font-size:16px">${sepStr(d)}</b><div style="font-size:10px;color:var(--ink-3)">điểm</div></div></div>`;});
  h+=`</div>`;return h;}

/* ---------- TAB 2: THƯỞNG ---------- */
function nsSetupBar(txt,fn){return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin:-2px 0 12px">
  <div class="hint" style="margin:0;flex:1">${txt}</div>
  <button class="btn btn-ghost btn-sm" style="white-space:nowrap" onclick="${fn}()">⚙ Thiết lập</button></div>`;}
function nsTabThuong(){const {from,to}=nsWin();const workers=DB.tho.filter(t=>!t.isOwner);
  let h=nsKyNav()+nsSetupBar('Chọn kiểu thưởng & đặt mốc trong Thiết lập.','modalThietLapThuong');
  const progs=ctList().filter(p=>p.on);
  if(!progs.length)h+=`<div class="divider-note" style="padding:16px">Chưa có chương trình nào bật. Bấm ⚙ Thiết lập để thêm.</div>`;
  progs.forEach(prog=>{const ws=thoTrongPhamVi(prog);const ckp=ctChuKyOf(prog);
    h+=`<div class="card" style="margin-bottom:12px"><div class="card-pad">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px">
        <b style="font-size:15px">${escHtml(prog.ten)} <span style="font-size:11px;color:var(--ink-3);font-weight:600">· ${CT_CHUKY[ckp].toLowerCase()}</span></b>
        <button class="btn btn-ghost btn-sm" style="white-space:nowrap" onclick="modalThuongCT('${prog.id}')">✎ Sửa</button></div>
      <div class="hint" style="margin:0 0 6px">${escHtml(ctMoTa(prog))}</div>`;
    ws.forEach(t=>{const r=thuongThoTong(t.id,from,to);const it=r.items.find(x=>x.prog.id===prog.id);if(!it)return;
      const right=it.khoa?`<span style="color:var(--thread);font-size:11.5px">🔒 khóa</span>`
        :it.dat?`<b style="color:var(--brand);white-space:nowrap">+${fmt(it.tien)}</b>`
        :`<span style="color:var(--ink-3);font-size:12px">chưa đạt</span>`;
      h+=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line-2)">
        <div style="min-width:0"><div style="font-weight:600;font-size:13.5px">${escHtml(t.ten)}</div>
          <div style="font-size:11.5px;color:var(--ink-3)">${it.mo}</div></div>
        <div style="text-align:right">${right}</div></div>`;});
    h+=`</div></div>`;});
  const tongKy=sum(workers.map(t=>thuongThoTong(t.id,from,to).tong));const daTra=sum(workers.map(t=>daTraThuong(nsYm,t.id)));
  h+=`<div class="card"><div class="card-pad">
    <div class="kv"><div class="k">Tổng thưởng ${nsYmLabel(nsYm).toLowerCase()}</div><div class="v big-num">${fmt(tongKy)}</div></div>
    <div class="kv"><div class="k">Đã trả</div><div class="v">${fmt(daTra)}</div></div>
    <div class="kv"><div class="k">Còn phải trả</div><div class="v big-num money-neg">${fmt(Math.max(0,tongKy-daTra))}</div></div></div></div>
    <div class="act-grid" style="margin-top:8px"><button class="btn btn-sage wide" onclick="modalTraThuongKy()">💵 Trả thưởng tháng này</button></div>`;
  return h;}
function ctMoTa(p){const ck=ctChuKyOf(p);const dvi=CT_CHUKY_DVI[ck];
  if(p.loai==='chuyenCan')return p.mocNgay>0?`Đủ ${p.mocNgay} ngày công/${dvi} → ${fmt(p.tien)}`:'Chưa đặt mốc.';
  if(p.loai==='sanLuong'){const b=(p.bac||[]).slice().sort((a,b)=>a.moc-b.moc);const s=b.length?('Bậc: '+b.map(x=>sepStr(x.moc)+'đ→'+fmtShort(x.tien)).join(' · ')):'Chưa đặt bậc.';return ck==='thang'?s:(s+` · mỗi ${dvi}`);}
  if(p.loai==='chatLuong')return (p.nguong>0||p.tien>0)?`Phế ≤ ${p.nguong}% → ${fmt(p.tien)}${p.cua?' · cửa khóa':''}`:'Chưa đặt ngưỡng.';
  if(p.loai==='caiThien')return `${p.chiSo==='cai'?'Số cái':'Điểm'} tăng ≥ ${p.mocPhanTram}% so tháng trước → ${fmt(p.tien)}`;
  if(p.loai==='daKyNang')return `Làm ≥ ${p.mocSo} công đoạn → ${fmt(p.tien)}`;return '';}

/* ---------- THIẾT LẬP THƯỞNG ---------- */
function modalThietLapThuong(){const list=ctList();
  let h=`<div class="hint" style="margin-top:0">Chương trình = một <b>mẫu thưởng</b> đã điền mốc &amp; tiền. Bật/tắt bằng công tắc, bấm để sửa.</div>
    <button class="btn btn-ghost btn-sm" style="width:100%;margin-bottom:12px" onclick="modalKhoThuong()">🗂 Kho mẫu thưởng (${mauThuongList().length})</button>`;
  if(list.length){h+=`<div class="card">`;list.forEach(p=>{const ck=ctChuKyOf(p);
    h+=`<div class="slip">
      <div style="min-width:0;flex:1;cursor:pointer" onclick="modalThuongCT('${p.id}')">
        <div class="who">${escHtml(p.ten)} <span style="font-size:11px;color:var(--ink-3)">· ${CT_CHUKY[ck].toLowerCase()}</span></div>
        <div class="meta">${escHtml(ctMoTa(p))}</div></div>
      <label style="display:flex;align-items:center;margin-left:8px" onclick="event.stopPropagation()">
        <input type="checkbox" ${p.on?'checked':''} onchange="ctToggle('${p.id}')" style="width:20px;height:20px"></label></div>`;});
    h+=`</div>`;}
  else h+=`<div class="divider-note" style="padding:16px">Chưa có chương trình nào.</div>`;
  h+=`<div class="act-grid" style="margin-top:8px"><button class="btn btn-primary wide" onclick="modalThuongCT()">＋ Thêm chương trình</button></div>`;
  openSheet('Thiết lập thưởng',h);}
function ctToggle(id){const p=ctById(id);if(!p)return;p.on=!p.on;Store.save();modalThietLapThuong();}
function ctXoa(id){const p=ctById(id);if(!p)return;
  xacNhan(`Xoá chương trình "${escHtml(p.ten)}"?`,()=>{DB.settings.thuongCT=ctList().filter(x=>x.id!==id);Store.save();closeSheet();toast('Đã xoá.');},{ok:'Xoá',warn:true});}
function modalThuongCT(id){ctEdit=id?JSON.parse(JSON.stringify(ctById(id))):null;drawThuongCT();}
function ctPick(loai){ctEdit=ctMacDinh(loai);drawThuongCT();}
function ctPickMau(mauId){const m=mauThuongById(mauId);if(!m)return;ctEdit=ctFromMau(m);drawThuongCT();}
function ctAddBac(){ctEdit.bac=ctEdit.bac||[];ctEdit.bac.push({moc:0,tien:0});drawThuongCT();}
function ctDelBac(i){ctEdit.bac.splice(i,1);drawThuongCT();}
function drawThuongCT(){
  if(!ctEdit){const mus=mauThuongList();
    let h=`<div class="hint" style="margin-top:0">Chọn một <b>mẫu thưởng</b> trong kho để tạo chương trình:</div><div class="card"><div class="card-pad" style="padding-top:6px;padding-bottom:6px">`;
    h+= mus.length? mus.map(m=>`<div class="slip" style="cursor:pointer" onclick="ctPickMau('${m.id}')">
      <div style="flex:1"><div class="who">${escHtml(m.ten)}</div><div class="meta">đo ${CT_META[m.loai].do.toLowerCase()} · ${CT_CHUKY[m.chuKy||'thang'].toLowerCase()}</div></div>
      <div style="color:var(--ink-3)">›</div></div>`).join('') : `<div class="divider-note" style="padding:12px">Kho mẫu trống — thêm mẫu trước.</div>`;
    h+=`</div></div><button class="btn btn-ghost btn-sm" style="width:100%" onclick="modalKhoThuong()">🗂 Kho mẫu thưởng</button>`;
    openSheet('Thêm chương trình',h);return;}
  const p=ctEdit;const inSt=`padding:11px;border:1.5px solid var(--line);border-radius:11px;font-weight:600;text-align:right;box-sizing:border-box;width:100%`;
  const pv=p.phamVi||{kieu:'tatCa',loai:['sp','bao','gio']};
  const ckP=ctChuKyOf(p);const mauP=mauThuongById(p.mauId);const gP=goalOf(p);
  let body=`<div class="card" style="margin-bottom:12px"><div class="card-pad" style="padding:10px 12px">
    <div style="font-size:12px;color:var(--ink-3)">${gP?'<b style="color:var(--ink)">'+gP.icon+' Nhắm: '+escHtml(gP.ten)+'</b> · ':''}${escHtml(mauP?mauP.ten:CT_LOAI[p.loai])} · <b style="color:var(--brand)">${CT_CHUKY[ckP].toLowerCase()}</b></div></div></div>`;
  if(gP&&gP.bay)body+=`<div style="display:flex;gap:9px;padding:11px 12px;margin-bottom:12px;background:var(--tape-soft,#FFF3E6);border-radius:12px;font-size:12.5px;line-height:1.45">
    <span style="flex:none">⚠️</span><span><b>Bẫy:</b> ${gP.bay}</span></div>`;
  body+=`<div class="field"><label>Tên chương trình</label><input type="text" id="ct_ten" value="${escHtml(p.ten||'')}" style="padding:11px;border:1.5px solid var(--line);border-radius:11px;font-weight:600;box-sizing:border-box;width:100%"></div>`;
  // phạm vi
  body+=`<div class="field"><label>Áp dụng cho</label>
    <select id="ct_pv" onchange="ctEdit.phamVi.kieu=this.value;drawThuongCT()" style="${inSt};text-align:left">
      <option value="tatCa" ${pv.kieu==='tatCa'?'selected':''}>Tất cả thợ</option>
      <option value="loai" ${pv.kieu==='loai'?'selected':''}>Theo loại thợ</option></select></div>`;
  if(pv.kieu==='loai'){const has=x=>(pv.loai||[]).indexOf(x)>=0;
    body+=`<div class="field"><div style="display:flex;gap:8px;flex-wrap:wrap">
      ${[['sp','Tính sản phẩm'],['bao','Bao ngày'],['gio','Bao giờ']].map(([v,l])=>`<label style="display:flex;align-items:center;gap:6px;padding:8px 11px;border:1.5px solid var(--line);border-radius:10px;font-size:13px">
        <input type="checkbox" ${has(v)?'checked':''} onchange="ctPvLoai('${v}',this.checked)" style="width:16px;height:16px">${l}</label>`).join('')}
    </div></div>`;}
  // tham số theo loại
  if(p.loai==='chuyenCan'){body+=`<div class="field"><label>Số ngày công tối thiểu / ${CT_CHUKY_DVI[ckP]}</label><input type="text" inputmode="numeric" id="ct_mocNgay" value="${p.mocNgay||''}" style="${inSt}"></div>
    <div class="field"><label>Tiền thưởng khi đạt</label><input type="text" inputmode="numeric" class="sep" id="ct_tien" value="${sepStr(p.tien||0)}" style="${inSt}"></div>`;}
  else if(p.loai==='chatLuong'){body+=`<div class="field"><label>Tỉ lệ phế tối đa (%)</label><input type="number" step="0.1" id="ct_nguong" value="${p.nguong||0}" style="${inSt}"></div>
    <div class="field"><label>Tiền thưởng khi đạt</label><input type="text" inputmode="numeric" class="sep" id="ct_tien" value="${sepStr(p.tien||0)}" style="${inSt}"></div>
    <label style="display:flex;align-items:flex-start;gap:9px;padding:11px 12px;margin-bottom:12px;background:var(--tape-soft,#FFF3E6);border-radius:12px;font-size:13px;line-height:1.4">
      <input type="checkbox" id="ct_cua" ${p.cua?'checked':''} style="width:18px;height:18px;flex:none;margin-top:1px">
      <span><b>Cửa khóa</b> — phế vượt ngưỡng thì thợ mất <b>toàn bộ</b> thưởng tháng. <b style="color:var(--thread)">Nên để TẮT:</b> phạt phế dễ khiến thợ giấu hàng hư.</span></label>`;}
  else if(p.loai==='caiThien'){body+=`<div class="field"><label>So sánh chỉ số</label>
      <select id="ct_chiSo" style="${inSt};text-align:left"><option value="diem" ${p.chiSo==='diem'?'selected':''}>Điểm năng suất</option><option value="cai" ${p.chiSo==='cai'?'selected':''}>Số cái</option></select></div>
    <div class="field"><label>Tăng tối thiểu so tháng trước (%)</label><input type="number" step="1" id="ct_mocPhanTram" value="${p.mocPhanTram||0}" style="${inSt}"></div>
    <div class="field"><label>Tiền thưởng khi đạt</label><input type="text" inputmode="numeric" class="sep" id="ct_tien" value="${sepStr(p.tien||0)}" style="${inSt}"></div>`;}
  else if(p.loai==='daKyNang'){body+=`<div class="field"><label>Số công đoạn khác nhau tối thiểu</label><input type="text" inputmode="numeric" id="ct_mocSo" value="${p.mocSo||''}" style="${inSt}"></div>
    <div class="field"><label>Tiền thưởng khi đạt</label><input type="text" inputmode="numeric" class="sep" id="ct_tien" value="${sepStr(p.tien||0)}" style="${inSt}"></div>`;}
  else if(p.loai==='sanLuong'){body+=`<div class="section-h" style="margin-top:0">Bậc thang theo điểm</div><div class="card"><div class="card-pad" style="padding:8px">
    ${(p.bac||[]).length?(p.bac||[]).map((b,i)=>`<div style="display:grid;grid-template-columns:1.2fr 1.3fr auto;gap:6px;margin-bottom:6px;align-items:center">
      <input type="text" inputmode="numeric" value="${b.moc||''}" placeholder="mốc điểm" oninput="ctEdit.bac[${i}].moc=+((''+this.value).replace(/[^\\d]/g,''))||0" style="${inSt}">
      <input type="text" inputmode="numeric" class="sep" value="${sepStr(b.tien||0)}" placeholder="thưởng" oninput="ctEdit.bac[${i}].tien=+((''+this.value).replace(/[^\\d]/g,''))||0" style="${inSt}">
      <button class="btn btn-ghost btn-sm" onclick="ctDelBac(${i})" style="padding:8px 12px">✕</button></div>`).join(''):`<div class="divider-note" style="padding:8px">Chưa có bậc.</div>`}
    </div></div><button class="btn btn-ghost btn-sm" style="width:100%;margin-bottom:12px" onclick="ctAddBac()">＋ Thêm bậc</button>`;}
  let foot=`<div class="act-grid" style="margin-top:8px"><button class="btn btn-primary wide" onclick="submitThuongCT()">Lưu</button></div>`;
  if(p._saved)foot+=`<div class="act-grid" style="margin-top:6px"><button class="btn btn-ghost wide" style="color:var(--thread)" onclick="ctXoa('${p.id}')">Xoá chương trình</button></div>`;
  openSheet(p._saved?'Sửa chương trình':'Thêm chương trình',body+foot);}
function ctPvLoai(v,on){ctEdit.phamVi.loai=ctEdit.phamVi.loai||[];const i=ctEdit.phamVi.loai.indexOf(v);
  if(on&&i<0)ctEdit.phamVi.loai.push(v);if(!on&&i>=0)ctEdit.phamVi.loai.splice(i,1);}
function submitThuongCT(){try{const p=ctEdit;const g=id=>el(id);
  p.ten=(g('ct_ten').value||CT_LOAI[p.loai]).trim();
  if(p.loai==='chuyenCan'){p.mocNgay=numVal('ct_mocNgay');p.tien=numVal('ct_tien');}
  else if(p.loai==='chatLuong'){p.nguong=Math.max(0,+((''+((g('ct_nguong')||{}).value||'0')).replace(/[^\d.]/g,''))||0);p.tien=numVal('ct_tien');p.cua=g('ct_cua').checked;}
  else if(p.loai==='caiThien'){p.chiSo=g('ct_chiSo').value;p.mocPhanTram=Math.max(0,+((''+(g('ct_mocPhanTram').value||'0')).replace(/[^\d.]/g,''))||0);p.tien=numVal('ct_tien');}
  else if(p.loai==='daKyNang'){p.mocSo=numVal('ct_mocSo');p.tien=numVal('ct_tien');}
  else if(p.loai==='sanLuong'){p.bac=(p.bac||[]).filter(b=>b.moc>0).sort((a,b)=>a.moc-b.moc);}
  const list=ctList();const idx=list.findIndex(x=>x.id===p.id);delete p._saved;
  if(idx>=0)list[idx]=p;else list.push(p);
  DB.settings.thuongCT=list;Store.save();closeSheet();toast('Đã lưu chương trình.');}catch(e){toast(e.message,true)}}

/* ---------- KHO MẪU THƯỞNG — giao diện ---------- */
let mtuEdit=null;
function modalKhoThuong(){const mus=mauThuongList();
  let h=`<div class="hint" style="margin-top:0">Mỗi mẫu <b>nhắm một mục tiêu</b>: muốn thợ làm gì → hệ chọn sẵn cách thưởng &amp; chu kỳ. Mốc &amp; tiền điền bên "Thêm chương trình".</div><div class="card">`;

        <div class="meta">${escHtml(g?'nhắm: '+g.ten.toLowerCase():CT_LOAI[m.loai])} · ${CT_CHUKY[m.chuKy||'thang'].toLowerCase()}${n?' · '+n+' chương trình':''}</div></div>
