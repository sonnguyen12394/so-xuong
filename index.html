  h+=`</div><button class="btn btn-primary" onclick="modalThemMauThuong()">＋ Thêm mẫu thưởng</button>`;
  openSheet('Kho mẫu thưởng ('+mus.length+')',h);}
function modalThemMauThuong(){mtuEdit=null;drawMauThuong();}
function modalSuaMauThuong(id){const m=mauThuongById(id);if(!m)return;mtuEdit=JSON.parse(JSON.stringify(m));drawMauThuong();}
function mtuPickGoal(key){const g=MUC_TIEU[key];if(!g)return;mtuEdit={id:'',ten:g.ten,loai:g.loai,chuKy:g.chuKy,mucTieu:key};drawMauThuong();}
function mtuSetCk(v){if(mtuEdit){mtuEdit.chuKy=v;drawMauThuong();}}
function drawMauThuong(){
  if(!mtuEdit){let h=`<div class="hint" style="margin-top:0"><b>Anh muốn thợ làm gì?</b> Chọn mục tiêu — hệ tự chọn cách thưởng đúng cho mục tiêu đó.</div><div class="card"><div class="card-pad" style="padding-top:6px;padding-bottom:6px">`;
    Object.keys(MUC_TIEU).forEach(key=>{const g=MUC_TIEU[key];h+=`<div class="slip" style="cursor:pointer" onclick="mtuPickGoal('${key}')">
      <div style="flex:1"><div class="who">${g.icon} ${escHtml(g.ten)}</div><div class="meta">${escHtml(g.moTa)}</div></div>
      <div style="color:var(--ink-3)">›</div></div>`;});
    h+=`</div></div>`;openSheet('Thêm mẫu thưởng',h);return;}
  const m=mtuEdit;const cho=CT_CHUKY_CHO[m.loai]||['thang'];const saved=!!m.id;const g=goalOf(m);
  const inSt=`padding:11px;border:1.5px solid var(--line);border-radius:11px;font-weight:600;box-sizing:border-box;width:100%`;
  let body='';
  if(g)body+=`<div class="card" style="margin-bottom:12px"><div class="card-pad" style="padding:11px 12px">

    <div style="font-size:12px;color:var(--ink-3);margin-top:3px">Cách thưởng: ${CT_META[m.loai].do.toLowerCase()} · ${CT_META[m.loai].tinh.toLowerCase()}</div></div></div>`;
  if(g&&g.bay)body+=`<div style="display:flex;gap:9px;padding:11px 12px;margin-bottom:12px;background:var(--tape-soft,#FFF3E6);border-radius:12px;font-size:12.5px;line-height:1.45">
    <span style="flex:none">⚠️</span><span><b>Bẫy cần tránh:</b> ${g.bay}</span></div>`;
  body+=`<div class="field"><label>Tên mẫu</label><input type="text" id="mtu_ten" value="${escHtml(m.ten||'')}" placeholder="VD: Đi đều theo tuần" style="${inSt}"></div>`;

function themChiSoTheoDoi(doKey,huong){const list=mtList();

function submitMauThuong(){try{const m=mtuEdit;const ten=(el('mtu_ten').value||(goalOf(m)?goalOf(m).ten:CT_LOAI[m.loai])).trim();

function xoaMauThuong(id){const n=soCtDungMau(id);

/* ---------- TRẢ THƯỞNG ---------- */
function _thuongDienGiai(ten){const [y,m]=nsYm.split('-');return 'Thưởng năng suất ('+ten+') · T'+(+m)+'/'+y;}
function modalTraThuongKy(){const {from,to}=nsWin();const workers=DB.tho.filter(t=>!t.isOwner);
  const rows=workers.map(t=>({t,con:Math.max(0,thuongThoTong(t.id,from,to).tong-daTraThuong(nsYm,t.id))})).filter(x=>x.con>0);

function traThuongTho(thoId){const {from,to}=nsWin();const con=Math.max(0,thuongThoTong(thoId,from,to).tong-daTraThuong(nsYm,thoId));

function doTraThuong(thoId,con){try{beginOp();const t=getTho(thoId);
  ghi(_thuongDienGiai(t.ten),[{tk:TK.RO_CHUNG,chieu:'NO',soTien:con},{tk:TK.QUY,chieu:'CO',soTien:con}]);
  DB.thuongTra=DB.thuongTra||[];DB.thuongTra.push({id:uid(),ym:nsYm,thoId,tien:con,ngay:now()});
  Store.save();render();closeSheet();toast('Đã trả & ghi sổ thưởng.');}catch(e){toast(e.message,true)}}
function traThuongTatCa(){const {from,to}=nsWin();const workers=DB.tho.filter(t=>!t.isOwner);
  const rows=workers.map(t=>({t,con:Math.max(0,thuongThoTong(t.id,from,to).tong-daTraThuong(nsYm,t.id))})).filter(x=>x.con>0);
  if(!rows.length)return toast('Không còn thưởng để trả.',true);const tong=sum(rows.map(r=>r.con));

    try{beginOp();DB.thuongTra=DB.thuongTra||[];
      rows.forEach(({t,con})=>{ghi(_thuongDienGiai(t.ten),[{tk:TK.RO_CHUNG,chieu:'NO',soTien:con},{tk:TK.QUY,chieu:'CO',soTien:con}]);
        DB.thuongTra.push({id:uid(),ym:nsYm,thoId:t.id,tien:con,ngay:now()});});
      Store.save();render();closeSheet();toast('Đã trả & ghi sổ toàn bộ thưởng.');}catch(e){toast(e.message,true)}

/* ---------- CHỈ SỐ MỤC TIÊU (danh sách, có công thức) ---------- */
function mtList(){DB.settings=DB.settings||{};
  if(!DB.settings.mucTieuCT){DB.settings.mucTieuCT=[
    {id:uid(),ten:'Tổng cái ra hàng',nguon:'sanXuat',do:'cai',huongTot:'cao'},
    {id:uid(),ten:'Tổng điểm năng suất',nguon:'sanXuat',do:'diem',huongTot:'cao'},
    {id:uid(),ten:'Tổng ngày công (đi làm đều)',nguon:'sanXuat',do:'ngayCong',huongTot:'cao'},
    {id:uid(),ten:'Số thợ có làm',nguon:'sanXuat',do:'soThoLam',huongTot:'cao'},
    {id:uid(),ten:'Tỉ lệ phế toàn xưởng',nguon:'sanXuat',do:'tyLePhe',huongTot:'thap'}];
    Store.save();}
  return DB.settings.mucTieuCT;}
function mtById(id){return mtList().find(m=>m.id===id);}
function nsAggBase(from,to){const ws=DB.tho.filter(t=>!t.isOwner);let cai=0,diem=0,phe=0,ngay=0,gio=0,tien=0,thoLam=0;
  ws.forEach(t=>{const k=nsKy(t.id,from,to);cai+=k.cai;diem+=k.diem;phe+=k.phe;ngay+=k.ngayCong;gio+=k.gio;tien+=k.tien;if(k.ngayCong>0||k.cai>0)thoLam++;});
  const tyle=(cai+phe)>0?phe/(cai+phe)*100:0;const ns=ngay>0?diem/ngay:0;
  return {cai,diem,phe,ngayCong:ngay,gio,giaTriCong:tien,soThoLam:thoLam,tyLePhe:tyle,nangSuat:ns};}
function mtFmt(key,v){if(key==='cai')return sepStr(Math.round(v))+' cái';if(key==='diem')return sepStr(Math.round(v));
  if(key==='nangSuat')return v.toFixed(1);if(key==='ngayCong')return sepStr(Math.round(v))+' ngày';
  if(key==='tyLePhe')return v.toFixed(1)+'%';if(key==='gio')return sepStr(Math.round(v))+' h';
  if(key==='giaTriCong'||key==='thuongDaChi'||key==='tongThuong')return fmt(v);
  if(key==='soThoLam'||key==='soThoDat')return sepStr(Math.round(v))+' người';if(key==='tyLeDat')return v.toFixed(0)+'%';return sepStr(Math.round(v));}
function mtTinh1(mt,from,to){
  if(mt.nguon==='chuongTrinh'){const prog=ctById(mt.ctId);if(!prog)return 0;const ws=thoTrongPhamVi(prog);
    let dat=0,tong=0;ws.forEach(t=>{const r=ctAccrue(prog,t.id,from,to);if(r.dat)dat++;tong+=r.tien;});
    if(mt.lay==='soThoDat')return dat;if(mt.lay==='tyLeDat')return ws.length?dat/ws.length*100:0;return tong;}
  if(mt.do==='thuongDaChi'){const [y,m]=[new Date(from).getFullYear(),new Date(from).getMonth()+1];const ym=y+'-'+String(m).padStart(2,'0');
    return sum(DB.tho.filter(t=>!t.isOwner).map(t=>daTraThuong(ym,t.id)));}
  const a=nsAggBase(from,to);return a[mt.do]||0;}
function mtKey(mt){return mt.nguon==='chuongTrinh'?mt.lay:mt.do;}
function nsKpiRow(label,curTxt,delta,huong,onclick){const arrow=delta>0?'▲':delta<0?'▼':'▬';
  let col='var(--ink-3)';if(delta!==0&&huong!=='trungTinh'){const good=(delta>0&&huong==='cao')||(delta<0&&huong==='thap');col=good?'var(--brand)':'var(--thread)';}
  const tap=onclick?` style="cursor:pointer" onclick="${onclick}"`:'';const ed=onclick?' <span style="color:var(--ink-3);font-size:11px">✎</span>':'';
  return `<div class="kv"${tap}><div class="k">${label}${ed}</div><div class="v" style="text-align:right"><b>${curTxt}</b> <span style="font-size:11px;color:${col}">${arrow}</span></div></div>`;}
/* ---------- MỤC TIÊU: kỳ (tháng/tuần) + vạch chuẩn + nhãn đánh giá ---------- */
let mtKy='thang';let mtOff=0;
function _ddmm(ts){const d=new Date(ts);return d.getDate()+'/'+(d.getMonth()+1);}
function mtPeriod(off){const now=new Date();
  if(mtKy==='tuan'){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());const dow=(d.getDay()+6)%7;
    const mon=new Date(d);mon.setDate(d.getDate()-dow+off*7);
    const from=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate(),0,0,0,0).getTime();
    const sun=new Date(mon);sun.setDate(mon.getDate()+6);
    const to=new Date(sun.getFullYear(),sun.getMonth(),sun.getDate(),23,59,59,999).getTime();
    return {from,to,label:'Tuần '+_ddmm(from)+'–'+_ddmm(to)};}
  const base=new Date(now.getFullYear(),now.getMonth()+off,1);
  const ym=base.getFullYear()+'-'+String(base.getMonth()+1).padStart(2,'0');const r=nsMonthRange(ym);
  return {from:r.from,to:r.to,label:nsYmLabel(ym)};}
function mtCur(){return mtPeriod(mtOff);}
function mtPrev(){return mtPeriod(mtOff-1);}
function mtShift(d){mtOff+=d;nsRender();}
function mtSetKy(k){if(mtKy!==k){mtKy=k;mtOff=0;}nsRender();}
function thuongChiTrongKhoang(from,to){return sum((DB.thuongTra||[]).filter(x=>x.ngay>=from&&x.ngay<=to).map(x=>x.tien));}
/* vạch chuẩn: mức thường từ 4 kỳ liền trước (theo kỳ đang xem) */
function vcOf(mtId){return (DB.settings&&DB.settings.vachChuan&&DB.settings.vachChuan[mtId])||null;}
function mtChup(mtId,ev){if(ev&&ev.stopPropagation)ev.stopPropagation();chupVachChuan(mtId);}
function chupVachChuan(mtId){const mt=mtById(mtId);if(!mt)return;const k=4;
  xacNhan(`Chụp vạch chuẩn "${escHtml(mt.ten)}" từ ${k} ${mtKy==='tuan'?'tuần':'tháng'} liền trước kỳ đang xem?\nLấy mức thường + biên dao động để sau này biết chương trình có kéo chỉ số ra khỏi mức thường không. Nên chụp trước khi bật thưởng.`,()=>{
    const vals=[];for(let i=1;i<=k;i++){const p=mtPeriod(mtOff-i);vals.push(mtTinh1(mt,p.from,p.to));}
    const gia=sum(vals)/k;const lo=Math.min.apply(null,vals);const hi=Math.max.apply(null,vals);
    DB.settings=DB.settings||{};DB.settings.vachChuan=DB.settings.vachChuan||{};
    DB.settings.vachChuan[mtId]={gia,lo,hi,n:k,ky:mtKy,tu:mtPeriod(mtOff-k).from,den:mtPeriod(mtOff-1).to,luc:now()};
    Store.save();nsRender();toast('Đã chụp vạch chuẩn.');
  },{ok:'Chụp'});}
/* nhãn đánh giá: dựa vạch chuẩn + hướng tốt + giữ ≥2 kỳ */
function danhGiaMt(mt,cur,prev){const huong=mt.huongTot||MT_HUONG_MAC[mtKey(mt)]||'cao';
  if(huong==='trungTinh')return {mau:'var(--ink-3)',text:'theo dõi',band:''};
  const vc=vcOf(mt.id);
  if(!vc)return {mau:'var(--ink-3)',text:'',band:'',need:true};
  if(vc.ky&&vc.ky!==mtKy)return {mau:'var(--ink-3)',text:'vạch theo '+(vc.ky==='tuan'?'tuần':'tháng'),band:''};
  const key=mtKey(mt);const band='thường '+mtFmt(key,vc.lo)+'–'+mtFmt(key,vc.hi);
  const beyond=v=>huong==='cao'?v>vc.hi:v<vc.lo;
  const better=v=>huong==='cao'?v>vc.gia:v<vc.gia;
  if(beyond(cur)&&beyond(prev))return {mau:'var(--brand)',text:'Đạt · giữ ≥2 kỳ',band};
  if(beyond(cur))return {mau:'var(--tape)',text:'Vượt · chờ xác nhận',band};
  if(better(cur))return {mau:'var(--tape)',text:'Nhích · còn trong dao động',band};
  return {mau:'var(--ink-3)',text:'chưa đổi',band};}
function nsTabMucTieu(){const c=mtCur();const p=mtPrev();const from=c.from,to=c.to,pfrom=p.from,pto=p.to;
  let h=`<div class="chipset" style="margin:-4px 0 10px"><div class="chip ${mtKy==='thang'?'sel':''}" onclick="mtSetKy('thang')">Tháng</div><div class="chip ${mtKy==='tuan'?'sel':''}" onclick="mtSetKy('tuan')">Tuần</div></div>`;
  h+=`<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px">
    <button class="btn btn-ghost btn-sm" onclick="mtShift(-1)" style="min-width:44px">‹</button>
    <b style="font-size:15px">${c.label}</b>
    <button class="btn btn-ghost btn-sm" onclick="mtShift(1)" style="min-width:44px">›</button></div>`;
  h+=nsSetupBar('Nhãn = so mức thường (vạch chuẩn). Chưa có vạch → bấm "đặt". Mũi tên so '+p.label.toLowerCase()+'.','modalThietLapMucTieu');
  const mts=mtList();
  if(!mts.length)h+=`<div class="divider-note" style="padding:16px">Chưa có chỉ số nào. Bấm ⚙ Thiết lập để thêm.</div>`;
  else{h+=`<div class="card"><div class="card-pad">`;
    mts.forEach(mt=>{const cur=mtTinh1(mt,from,to);const prev=mtTinh1(mt,pfrom,pto);const key=mtKey(mt);
      const huong=mt.huongTot||MT_HUONG_MAC[key]||'cao';const dg=danhGiaMt(mt,cur,prev);
      const dlt=cur-prev;const arrow=dlt>0?'▲':dlt<0?'▼':'▬';let acol='var(--ink-3)';
      if(dlt!==0&&huong!=='trungTinh'){const good=(dlt>0&&huong==='cao')||(dlt<0&&huong==='thap');acol=good?'var(--brand)':'var(--thread)';}
      const badge=dg.need
        ? `<button class="btn btn-ghost btn-sm" style="padding:3px 9px;font-size:11px" onclick="mtChup('${mt.id}',event)">＋ đặt vạch chuẩn</button>`
        : `<span style="color:${dg.mau};font-weight:700;font-size:11px">${dg.text}</span> <button class="btn btn-ghost btn-sm" style="padding:2px 7px;font-size:11px" title="chụp lại" onclick="mtChup('${mt.id}',event)">↻</button>`;
      h+=`<div class="kv" style="cursor:pointer;align-items:flex-start" onclick="modalMucTieuCT('${mt.id}')">
        <div class="k">${escHtml(mt.ten)} <span style="color:var(--ink-3);font-size:11px">✎</span>${dg.band?`<br><small style="color:var(--ink-3)">${dg.band}</small>`:''}</div>
        <div class="v" style="text-align:right"><b>${mtFmt(key,cur)}</b> <span style="font-size:11px;color:${acol}">${arrow}</span><br>${badge}</div></div>`;});
    h+=`</div></div>`;}
  const a=nsAggBase(from,to);const ap=nsAggBase(pfrom,pto);
  const thuongKy=thuongChiTrongKhoang(from,to);const dCai=a.cai-ap.cai;
  h+=`<div class="section-h" style="margin-top:4px">Thưởng có đáng tiền không</div><div class="card"><div class="card-pad">`;
  h+=`<div class="kv"><div class="k">Tiền thưởng đã chi (kỳ này)</div><div class="v">${fmt(thuongKy)}</div></div>`;
  if(thuongKy>0){const perK=dCai/(thuongKy/1000);
    h+=`<div class="kv"><div class="k">Hiệu quả thưởng<br><small style="color:var(--ink-3)">cái tăng thêm so kỳ trước ÷ mỗi 1.000đ</small></div>
      <div class="v" style="text-align:right"><b style="color:${dCai>0?'var(--brand)':'var(--thread)'}">${dCai>0?'+':''}${perK.toFixed(1)} cái</b></div></div>`;
    h+=`<div class="hint" style="margin:6px 0 0">Số này lẫn ảnh hưởng lượng hàng nhận — đọc kèm "Tổng cái", chỉ so giữa các kỳ hàng ngang nhau.</div>`;}
  else h+=`<div class="hint" style="margin:6px 0 0">Chưa chi thưởng kỳ này nên chưa tính được hiệu quả.</div>`;
  h+=`</div></div>`;
  h+=`<div class="hint">Cách đọc nhãn: <b>Đạt · giữ ≥2 kỳ</b> = chỉ số ra ngoài mức thường theo hướng tốt và giữ ít nhất 2 kỳ liền (đáng tin). <b>Vượt · chờ xác nhận</b> = mới 1 kỳ, có thể may. <b>Nhích</b> = hơn trung bình nhưng còn trong dao động cũ (chưa chắc do thưởng). Muốn chắc: chụp vạch chuẩn TRƯỚC khi bật thưởng, bật lệch giờ từng chương trình.</div>`;
  return h;}

/* ---- Chi tiết năng suất: từng dòng góp vào mỗi chỉ số (bấm vào chỉ số để xem) ---- */
function nsChiTietRows(thoId){const out=[];
  DB.phieuGiao.filter(p=>p.thoId===thoId&&p.trangThai!=='HUY').forEach(p=>{const don=getDon(p.donId);
    (p.dongNhan||[]).forEach(x=>{const bc=batchCds(p,x);
      const sl=sum(Object.values(x.dat||{}));const phe=sum(Object.values(x.phe||{}));
      if(sl<=0&&phe<=0)return;
      out.push({ngay:x.ngay,ma:don?don.ma:'—',mo:tenCds(don,bc),
        soCai:sl,tien:sl*donGiaCds(don,bc),diem:sl*diemCds(don,bc),phe,laGio:false});});});
  DB.phienGio.filter(x=>x.thoId===thoId).forEach(pg=>{const don=getDon(pg.donId);
    out.push({ngay:pg.ngay,ma:don?don.ma:'—',mo:'Công giờ '+pg.gio+'h',
      soCai:0,tien:pg.tien,diem:0,phe:0,laGio:true,gio:pg.gio});});
  out.sort((a,b)=>b.ngay-a.ngay);return out;}

function _khoanKind(bt){const s=bt.suKien||'';
  if(/^Chủ bỏ thêm/.test(s))return 'vonvao';
  if(/^Chủ rút tiền/.test(s))return 'vonra';
  if(/^Trả lương/.test(s))return 'luongtra';
  if(/^Ứng lương/.test(s))return 'luongung';
  if(/^Chi tiền/.test(s))return 'chi';
  if(/^Chi khác/.test(s))return 'chikhac';
  if(/^Chủ hàng trả tiền/.test(s))return 'thu';

function suaKhoan({btId,soTien,dienGiai,quy,ngay}){const bt=DB.butToan.find(b=>b.id===btId);if(!bt)throw new Error('Không tìm thấy khoản.');
  _psGuardKhoa(bt);const kind=_khoanKind(bt);if(!kind)throw new Error('Khoản này không sửa nhanh được.');
  const ng=ngay||bt.thoiDiem;const thoId=(bt.dong.find(d=>d.thoId!=null)||{}).thoId;const chuId=(bt.dong.find(d=>d.chuHangId!=null)||{}).chuHangId;
  if(quy!=='chi'&&quy!=='chinh')quy=((bt.dong.find(d=>d.tk===TK.QUY)||{}).quy==='chi')?'chi':'chinh';
  _psGoOld(bt);
  if(kind==='vonvao')boVon({soTien,dienGiai,ngay:ng});
  else if(kind==='vonra')rutVon({soTien,dienGiai,ngay:ng});
  else if(kind==='luongtra')traLuong({thoId,soTien,ngay:ng,quy});
  else if(kind==='luongung')ungLuong({thoId,soTien,ngay:ng,quy});
  else if(kind==='chi')chiPhiXuong({soTien,dienGiai:dienGiai||'chi phí xưởng',ngay:ng,quy});
  else if(kind==='chikhac')chiKhac({soTien,dienGiai:dienGiai||'ship/đền',ngay:ng,chuHangId:chuId||null,quy});
  else if(kind==='thu')thuTien({chuHangId:chuId,soTien,ngay:ng});
  Store.save();
}

function escHtml(x){return (''+x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function downloadFile(name,text,mime){try{
  const blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';a.rel='noopener';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{try{document.body.removeChild(a);}catch(_){}try{URL.revokeObjectURL(url);}catch(_){}},1500);
  return true;}catch(e){return false;}}
function copyText(id){const e=el(id);if(!e)return;e.focus();e.select();try{e.setSelectionRange(0,999999);}catch(_){}
  let ok=false;try{ok=document.execCommand('copy');}catch(_){}
  if(navigator.clipboard&&navigator.clipboard.writeText){try{navigator.clipboard.writeText(e.value);ok=true;}catch(_){}}
  toast(ok?'Đã sao chép — dán vào ghi chú/Excel hoặc phần Phục hồi.':'Đã bôi chọn — nhấn giữ để Copy.');}

}
function taiCSV(name,rows){
  const NL=String.fromCharCode(13,10),BOM=String.fromCharCode(0xFEFF),LF=String.fromCharCode(10);
  const csv=BOM+rows.map(r=>r.map(c=>{c=(''+c).replace(/"/g,'""');return (/[",;]/.test(c)||c.indexOf(LF)>=0)?'"'+c+'"':c;}).join(',')).join(NL);
  exportModal('Xuất CSV',name+'-'+new Date().toISOString().slice(0,10)+'.csv',csv,'text/csv;charset=utf-8','Bảng CSV mở được bằng Excel / Google Sheets. Tải file hoặc sao chép.');
}
function importAny(text){const stripped=(''+text).replace(/^\uFEFF/,'');const t=stripped.replace(/^\s+/,'');
  if(t.charAt(0)!=='{')throw new Error('cần file sao lưu JSON (.json)');
  applyImport(JSON.parse(t));}

  DB.chuHang.forEach(c=>{slipList(c.id).forEach(sl=>{const d=sl.donId?getDon(sl.donId):null;
    rows.push([c.ten,d?d.ma:'—',sl.loai||'GIAO',new Date(sl.ngay).toLocaleDateString('vi-VN'),sl.giaTri,sl.daThu,sl.conLai,days(sl.ngay)]);});});

function xuatSoCongCSV(all){const rows=[['Thợ','Đơn','Công đoạn','Ngày','Số cái','Tiền','Trạng thái sổ']];

/* ---- Sửa / xóa đơn ---- */
function donCoButToan(donId){return DB.butToan.some(bt=>bt.dong.some(d=>d.donId===donId));}
function donCoPhatSinh(donId){return donCoButToan(donId)||DB.phieuGiao.some(p=>p.donId===donId);}
function suaDon({donId,mauId,ma,sizes,giaGiaCong}){
  const don=getDon(donId);
  if(don.trangThai==='DA_GIAO_DU'||don.trangThai==='DA_HUY')throw new Error('Đơn đã đóng/hủy — không sửa được.');
  if(mauId&&mauId!==don.mauId){
    if(donCoPhatSinh(donId))throw new Error('Đơn đã có phát sinh — không đổi mẫu. Hãy hủy và tạo đơn mới.');
    const mau=getMau(mauId);don.mauId=mauId;don.snapshotCD=mau.congDoan.map(c=>({ten:c.ten,donGia:c.donGia,diem:c.diem||0,nhom:c.nhom||null,nhomId:c.nhomId||null,canTruoc:normCT(c.canTruoc),giaiDoan:normGD(c.giaiDoan)}));
    don.sizeList=(mau.sizeList&&mau.sizeList.length)?mau.sizeList.slice():SIZES.slice();don.gioDinhMuc=mau.gioDinhMuc||0;
    don.giaGiaCong=mau.giaGiaCong||don.giaGiaCong;const ns={};don.sizeList.forEach(x=>ns[x]=don.sizes[x]||0);don.sizes=ns;}
  if(sizes){for(const x of Object.keys(sizes)){const q=sizes[x]||0;const daRa=daDungSize(don,x);
    if(q<daRa)throw new Error('Cỡ '+x+' đang có '+daRa+' cái trong sản xuất (gồm cả hàng châm/quay lại) — không hạ dưới mức này.');}
    don.sizes={...sizes};}
  if(ma)don.ma=ma;
  if(giaGiaCong!=null&&giaGiaCong>0)don.giaGiaCong=giaGiaCong;
  Store.save();
}
/* ===== ĐỔI MẪU cho đơn ĐÃ có phát sinh: làm mới toàn bộ giao/nhận/chấm (GIỮ chi phí lô) rồi nạp mẫu mới =====
   Nguyên tắc: bỏ trọn từng bút toán công/giờ/tháo/chung của đơn (mỗi bút toán vốn đã cân → Σ Nợ=Có & cầu nối giữ);
   giữ lại các khoản dính QUỸ (chi phí lô đã chi tiền thật). Chặn nếu đơn đã giao TP / đã thu tiền / dính kỳ khóa. */
function _btDon(donId){return DB.butToan.filter(bt=>bt.dong.some(d=>d.donId===donId));}
function _btDonReset(donId){return _btDon(donId).filter(bt=>!bt.dong.some(d=>d.tk===TK.QUY));}
function donDoiMauDuoc(donId){const don=getDon(donId);
  if(['DA_GIAO_DU','DA_HUY','BI_TRA_LAI','DA_GIAO_MOT_PHAN'].includes(don.trangThai))
    return {ok:false,ly:'Đơn đã giao thành phẩm/đóng/hủy — không đổi mẫu.'};
  if((DB.giaoTP||[]).some(g=>g.donId===donId)||donDaThuTien(donId))
    return {ok:false,ly:'Đơn đã giao thành phẩm/đã thu tiền — không đổi mẫu.'};
  if(DB.settings.kyKhoa&&DB.settings.kyKhoaTime&&_btDonReset(donId).some(bt=>bt.thoiDiem<=DB.settings.kyKhoaTime))
    return {ok:false,ly:'Có ghi chép trong kỳ đã khóa sổ — không đổi mẫu.'};
  return {ok:true,ly:''};}
function doiMauTomTat(donId){const congTho={};let chung=0,chiLo=0;
  _btDon(donId).forEach(bt=>{
    if(bt.dong.some(d=>d.tk===TK.QUY)){bt.dong.forEach(d=>{if(d.tk===TK.WIP&&d.donId===donId&&d.chieu==='NO')chiLo+=d.soTien;});return;}
    bt.dong.forEach(d=>{const s=(d.chieu==='CO'?d.soTien:-d.soTien);
      if(d.tk===TK.PHAI_TRA_THO)congTho[d.thoId]=(congTho[d.thoId]||0)+s;
      else if(d.tk===TK.CONG_CHU_XUONG)congTho['__me']=(congTho['__me']||0)+s;
      else if(d.tk===TK.RO_CHUNG)chung+=s;});});
  return {congTho,chung,chiLo};}
function doiMauLamMoi(donId,mauId){const can=donDoiMauDuoc(donId);if(!can.ok)throw new Error(can.ly);
  const don=getDon(donId);const mau=getMau(mauId);if(!mau)throw new Error('Không thấy mẫu.');
  const rm=new Set(_btDonReset(donId).map(b=>b.id));
  DB.butToan=DB.butToan.filter(b=>!rm.has(b.id));
  DB.phieuGiao=DB.phieuGiao.filter(p=>p.donId!==donId);
  DB.phienGio=(DB.phienGio||[]).filter(s=>s.donId!==donId);
  DB.phieuThao=(DB.phieuThao||[]).filter(t=>t.donId!==donId);
  don.chamList=[];don.trangThai='DANG_CHAY';
  don.mauId=mauId;
  don.snapshotCD=mau.congDoan.map(c=>({ten:c.ten,donGia:c.donGia,diem:c.diem||0,nhom:c.nhom||null,nhomId:c.nhomId||null,canTruoc:normCT(c.canTruoc),giaiDoan:normGD(c.giaiDoan)}));
  don.sizeList=(mau.sizeList&&mau.sizeList.length)?mau.sizeList.slice():SIZES.slice();
  don.gioDinhMuc=mau.gioDinhMuc||0;don.giaGiaCong=mau.giaGiaCong||don.giaGiaCong;
  const ns={};don.sizeList.forEach(x=>ns[x]=don.sizes[x]||0);don.sizes=ns;
  Store.save();}
function sdMauReset(donId,mauId){const don=getDon(donId);if(mauId===don.mauId)return;
  const can=donDoiMauDuoc(donId);if(!can.ok)return toast(can.ly,true);

  if(!dsCong)dsCong='• (chưa có công thợ đã nhận)';
  const msg='Đổi sang mẫu «'+mau.ten+'».\n\n'

    +dsCong+(t.chung?'\n• Chi phí chung đã phân bổ: '+fmt(Math.abs(t.chung)):'')

  xacNhan(msg,()=>{try{doiMauLamMoi(donId,mauId);closeSheet();render();modalDon(donId);toast('Đã đổi mẫu & làm mới đơn.');}catch(e){toast(e.message,true)}},

function xoaDon(donId){if(donCoPhatSinh(donId))throw new Error('Đơn đã có phát sinh — dùng "Hủy đơn" thay vì xóa.');

/* ---- Xóa HẲN đơn đã hủy (thao tác nhầm) ----
   Gỡ trọn mọi ghi chép của đơn khỏi sổ (bỏ nguyên từng bút toán vốn đã cân
   → tổng Nợ=Có và cầu nối luôn giữ). Chặn nếu phiếu giao của đơn đã được chủ
   hàng trả tiền/xóa nợ (khi đó phải hoàn tác lần thu tiền đó trước). */
function slipCuaDon(donId){const ids=new Set();
  (DB.giaoTP||[]).forEach(g=>{if(g.donId===donId)ids.add(g.id);});
  DB.butToan.forEach(bt=>bt.dong.forEach(d=>{if(d.donId===donId&&d.tk===TK.PHAI_THU&&d.phieuGiaoId)ids.add(d.phieuGiaoId);}));
  return ids;}
function donDaThuTien(donId){const ids=slipCuaDon(donId);if(!ids.size)return false;
  return DB.butToan.some(bt=>{if(bt.dong.some(d=>d.donId===donId))return false;
    return bt.dong.some(d=>d.tk===TK.PHAI_THU&&d.phieuGiaoId&&ids.has(d.phieuGiaoId));});}
function tomTatXoaDon(donId){let soBT=0,tienHoan=0,congTho=0,loDao=0;
  DB.butToan.forEach(bt=>{if(!bt.dong.some(d=>d.donId===donId))return;soBT++;
    bt.dong.forEach(d=>{const s=d.chieu==='CO'?d.soTien:-d.soTien;
      if(d.tk===TK.QUY)tienHoan+=s;
      if(d.tk===TK.PHAI_TRA_THO)congTho+=s;
      if(d.tk===TK.LO_KHAC)loDao+=(-s);});});
  return {soBT,tienHoan,congTho,loDao};}
function xoaHanDon(donId){const don=getDon(donId);if(!don)throw new Error('Không thấy đơn.');
  if(donDaThuTien(donId))throw new Error('Đơn này có phiếu đã được chủ hàng trả tiền. Hãy hoàn tác lần thu tiền đó trước rồi xóa lại.');
  const rm=new Set(DB.butToan.filter(bt=>bt.dong.some(d=>d.donId===donId)).map(b=>b.id));
  DB.butToan=DB.butToan.filter(b=>!rm.has(b.id));
  DB.phieuGiao=DB.phieuGiao.filter(p=>p.donId!==donId);
  DB.phienGio=(DB.phienGio||[]).filter(s=>s.donId!==donId);
  DB.phieuThao=(DB.phieuThao||[]).filter(t=>t.donId!==donId);
  DB.giaoTP=(DB.giaoTP||[]).filter(g=>g.donId!==donId);
  DB.don=DB.don.filter(d=>d.id!==donId);Store.save();}

}

function doXoaHanDon(donId){try{xoaHanDon(donId);closeSheet();render();go('don');toast('Đã xóa hẳn đơn.');}catch(e){toast(e.message,true)}}

/* ===========================================================
   NHẬT KÝ NHẬP — gom bút toán theo thao tác (op), xem theo ngày, hoàn tác/sửa
   =========================================================== */
const UNDO_DANGER=['Giao thành phẩm','Kết chuyển giá vốn','Đóng đơn','Hủy đơn','Hàng bị trả lại','Khóa kỳ','Số dư đầu kỳ','Ship cắt châm','Nhận hàng về','Tháo'];
function opGroups(){
  const m={};
  DB.butToan.forEach(bt=>{const k=(bt.op!=null?'o'+bt.op:'b'+bt.id);(m[k]=m[k]||[]).push(bt);});
  return Object.keys(m).map(k=>{const bts=m[k].slice().sort((a,b)=>a.thoiDiem-b.thoiDiem);
    const isRev=bts.every(b=>b.dao_cua);
    const daDao=bts.some(b=>b.daDao);
    const t=bts[0].thoiDiem;
    const quy=sum(bts.map(b=>b.dong.filter(d=>d.tk===TK.QUY).reduce((s,d)=>s+(d.chieu==='NO'?d.soTien:-d.soTien),0)));
    const danger=bts.some(b=>UNDO_DANGER.some(p=>b.suKien.startsWith(p)));
    const handled=bts.some(b=>b.prevTT!==undefined||b.restoreSlip!==undefined); // thao tác gắn đơn có khôi phục trạng thái
    const within=bts.every(b=>now()-b.thoiDiem<HUY_WINDOW);
    const allMoney=!danger;
    const undoNow=!daDao&&within&&(allMoney||handled);   // xóa hẳn ngay (an toàn)
    const undoLater=!daDao&&!within&&allMoney;           // quá 5 phút: chỉ đảo op tiền
    return {key:k,bts,isRev,daDao,t,quy,within,allMoney,handled,undoNow,undoLater,undoable:undoNow||undoLater,label:friendlyOp(bts),ic:opIcon(bts)};
  }).filter(g=>!g.isRev).sort((a,b)=>(b.t-a.t)||((b.bts[0].op||0)-(a.bts[0].op||0)));
}
function friendlyOp(bts){
  const main=bts.find(b=>!/^Chi phí chung/.test(b.suKien))||bts[0];let s=main.suKien;
  const meta=(key)=>{for(const b of bts)for(const d of b.dong)if(d[key])return d[key];return null;};
  const chuId=meta('chuHangId'),thoId=meta('thoId'),donId=meta('donId');const extra=[];
  if(donId&&getDon(donId))extra.push(getDon(donId).ma);
  if(chuId&&getChu(chuId))extra.push(getChu(chuId).ten);else if(thoId&&getTho(thoId))extra.push(getTho(thoId).ten);
  return s+(extra.length?' · '+extra.join(' · '):'');
}
function opIcon(bts){const s=bts.map(b=>b.suKien).join(' ');
  if(/Chủ rút tiền|Chủ bỏ thêm/.test(s))return '🏠';
  if(/trả tiền/.test(s))return '💵';if(/Trả lương|Ứng lương/.test(s))return '👛';
  if(/Giao thành phẩm/.test(s))return '📦';if(/Nhận hàng/.test(s))return '🧵';
  if(/Chấm công/.test(s))return '⏱';if(/Tháo/.test(s))return '🔧';
  if(/Chi tiền|Chi phí/.test(s))return '🧾';if(/nợ xấu|ứng thợ/.test(s))return '✖️';
  if(/Đóng đơn/.test(s))return '✅';if(/trả lại/.test(s))return '↩';if(/đền/.test(s))return '💸';
  if(/đầu kỳ/.test(s))return '🏁';if(/Khóa kỳ/.test(s))return '🔒';return '•';}
function hoanTacOp(key,lyDo){
  const g=opGroups().find(x=>x.key===key);if(!g||g.daDao)return;
  const within=g.bts.every(b=>now()-b.thoiDiem<HUY_WINDOW);
  if(within){
    // gỡ dấu vết cấu trúc kèm theo
    g.bts.forEach(b=>{
      if(b.phienGioId)DB.phienGio=DB.phienGio.filter(x=>x.id!==b.phienGioId);
      if(b.giaoCongId)DB.giaoCong=(DB.giaoCong||[]).filter(x=>x.id!==b.giaoCongId);
      if(b.restoreSlip)DB.giaoTP=DB.giaoTP.filter(x=>x.id!==b.restoreSlip);
      if(b.prevTT!==undefined&&b.restoreDonId){const d=getDon(b.restoreDonId);if(d)d.trangThai=b.prevTT;}
    });
    const ids=new Set(g.bts.map(b=>b.id));DB.butToan=DB.butToan.filter(b=>!ids.has(b.id));
  }else{
    // quá cửa sổ: chỉ cho đảo op tiền thuần
    if(!g.allMoney)return;
    beginOp();g.bts.forEach(bt=>{const dong=bt.dong.map(d=>Object.assign({},d,{chieu:d.chieu==='NO'?'CO':'NO'}));
      if(bt.giaoCongId)DB.giaoCong=(DB.giaoCong||[]).filter(x=>x.id!==bt.giaoCongId);
      DB.butToan.push({id:uid(),suKien:'Sửa: '+bt.suKien,thoiDiem:now(),op:curOp(),dong,dao_cua:bt.id,lyDo});bt.daDao=true;});
  }
  Store.save();
}
/* ===== #1: TÁCH 2 NÚT — Hồi phục (đảo, giữ dấu vết) vs Xoá hẳn (bay khỏi sổ) =====
   Chỉ cho khoản TIỀN THUẦN (allMoney && !handled): thu/chi/lương/vốn/nạp/điều chỉnh.
   Khoản dính hàng hoá giữ luật cũ (sửa qua màn Đơn). Cả hai KHÔNG phụ thuộc 5 phút. */
function _opTienThuan(g){return !!(g&&g.allMoney&&!g.handled);}
function _opKhoaGuard(g){if(DB.settings.kyKhoa&&DB.settings.kyKhoaTime&&g.bts.some(b=>b.thoiDiem<=DB.settings.kyKhoaTime))throw new Error('Kỳ đã khóa sổ — không sửa được.');}
function hoiPhucOp(key){
  const g=opGroups().find(x=>x.key===key);if(!g)throw new Error('Không thấy khoản.');
  if(g.daDao)throw new Error('Khoản này đã hồi phục rồi.');
  if(!_opTienThuan(g))throw new Error('Khoản dính hàng hoá — sửa ở màn Đơn.');
  _opKhoaGuard(g);
  beginOp();g.bts.forEach(bt=>{const dong=bt.dong.map(d=>Object.assign({},d,{chieu:d.chieu==='NO'?'CO':'NO'}));
    DB.butToan.push({id:uid(),suKien:'Hồi phục: '+bt.suKien,thoiDiem:now(),op:curOp(),dong,dao_cua:bt.id});bt.daDao=true;});
  Store.save();
}
function xoaHanOp(key){
  const g=opGroups().find(x=>x.key===key);if(!g)throw new Error('Không thấy khoản.');
  if(!_opTienThuan(g))throw new Error('Khoản dính hàng hoá — sửa ở màn Đơn.');
  _opKhoaGuard(g);
  const ids=new Set(g.bts.map(b=>b.id)); // gỡ cả bút toán gốc lẫn bút toán đảo (nếu đã hồi phục trước đó)
  DB.butToan=DB.butToan.filter(b=>!ids.has(b.id)&&!(b.dao_cua&&ids.has(b.dao_cua)));
  Store.save();
}
function doHoiPhuc(key){const g=opGroups().find(x=>x.key===key);if(!g)return;const tien=g.quy?(' · '+fmt(Math.abs(g.quy))):'';
  xacNhan('Hồi phục khoản này?\n'+g.ic+' '+g.label+tien+'\n\nSố tiền/quỹ trở lại như trước. Khoản vẫn nằm trong nhật ký (đánh dấu đã hồi phục) để giữ dấu vết.',
    ()=>{try{hoiPhucOp(key);closeSheet();render();toast('Đã hồi phục — số về như trước.');}catch(e){toast(e.message,true)}},
    {ok:'Hồi phục',title:'Hồi phục'});}
function doXoaHan(key){const g=opGroups().find(x=>x.key===key);if(!g)return;const tien=g.quy?(' · '+fmt(Math.abs(g.quy))):'';
  xacNhan('Xoá hẳn khoản này khỏi nhật ký?\n'+g.ic+' '+g.label+tien+'\n\nCoi như chưa từng nhập — không còn dấu vết. Số dư tự tính lại.',
    ()=>{try{xoaHanOp(key);closeSheet();render();toast('Đã xoá hẳn khoản.');}catch(e){toast(e.message,true)}},
    {ok:'Xoá hẳn',nguyHiem:true,title:'Xoá hẳn'});}
/* ---- Hoàn tác nhanh từ header: khoản VỪA NHẬP gần nhất (mã op lớn nhất) ----
   Nút cố định trên đầu trang, không biến mất như toast. Có hộp xác nhận trước khi hoàn tác. */
function opGanNhat(){
  const gs=opGroups().filter(g=>g.undoable&&!g.daDao);
  if(!gs.length)return null;
  return gs.slice().sort((a,b)=>((b.bts[0].op||0)-(a.bts[0].op||0)))[0];
}
function renderHdrUndo(){const b=el('hdrUndo');if(!b)return;const g=opGanNhat();
  if(g){b.style.display='';b.setAttribute('title','Hoàn tác: '+g.label);}else{b.style.display='none';}}
function hoanTacGanNhat(){const g=opGanNhat();
  if(!g){toast('Chưa có khoản nào để hoàn tác.');return;}
  const tien=g.quy?((g.quy>0?'+':'−')+fmt(Math.abs(g.quy))):'';
  const ngay=new Date(g.t).toLocaleDateString('vi-VN');
  const cach=g.within?'Khoản này sẽ được xóa hẳn khỏi sổ.':'Khoản đã lâu — máy ghi một bút toán đảo để giữ dấu vết, số sẽ về như cũ.';
  xacNhan('Hoàn tác khoản vừa nhập gần nhất?\n\n'+g.ic+' '+g.label+(tien?'  '+tien:'')+'\nNgày '+ngay+'\n\n'+cach,
    ()=>{hoanTacOp(g.key,'');render();toast('Đã hoàn tác.');},
    {ok:'Hoàn tác',nguyHiem:true,title:'Hoàn tác'});
}
function sameDay(a,b){const x=new Date(a),y=new Date(b);return x.getFullYear()===y.getFullYear()&&x.getMonth()===y.getMonth()&&x.getDate()===y.getDate();}
function tkTen(tk){return {QUY:'Quỹ tiền',PHAI_THU:'Phải thu',WIP:'Hàng dở',RO_CHUNG:'Rổ chung',PHAI_TRA_THO:'Nợ lương',CONG_CHU_XUONG:'Công chủ',DOANH_THU:'Doanh thu',GIA_VON:'Giá vốn',LO_KHAC:'Lỗ khác',VON:'Vốn'}[tk]||tk;}
let nkMode='ngay',nkRef=0;
function nkSetMode(mo){nkMode=mo;nkRef=0;render();}
function nkNav(dir){if(nkMode==='all')return;const P=perRange(nkMode,nkRef);if(dir>0&&P.atNow)return;nkRef=perNav(nkMode,nkRef,dir);render();}
function bcNhatKy(){
  const gs=opGroups();
  const P=perRange(nkMode,nkRef);const inF=(t)=>t>=P.from&&t<=P.to;
  const fg=gs.filter(g=>inF(g.t));
  let h=perBar(nkMode,nkRef,'nkSetMode','nkNav','');
  if(!fg.length)return h+`<div class="empty"><div class="ic">🗒️</div><b>Chưa có phát sinh</b>Khoảng thời gian này chưa nhập gì.</div>`;
  const byDay={},order=[];fg.forEach(g=>{const dk=new Date(g.t).toLocaleDateString('vi-VN');if(!byDay[dk]){byDay[dk]=[];order.push(dk);}byDay[dk].push(g);});
  order.forEach(dk=>{const list=byDay[dk];const wd=new Date(list[0].t).toLocaleDateString('vi-VN',{weekday:'long'});const tienNgay=sum(list.map(g=>g.quy));
    h+=`<div class="section-h" style="display:flex;justify-content:space-between;align-items:baseline"><span>${wd}, ${dk} · ${list.length} phát sinh</span>
      <span class="${tienNgay>=0?'money-pos':'money-neg'}" style="text-transform:none;letter-spacing:0;font-weight:800">${tienNgay>=0?'+':''}${fmtShort(tienNgay)}</span></div><div class="card">`;
    h+=list.map(g=>{const tm=new Date(g.t).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
      return `<div class="slip" onclick="modalOp('${g.key}')" style="${g.daDao?'opacity:.5':''}">
        <div style="display:flex;gap:11px;align-items:flex-start"><div style="font-size:17px;line-height:1.2">${g.ic}</div>
        <div><div class="who" style="font-size:13.5px">${g.label}${g.daDao?' <span style="color:var(--thread)">· đã sửa</span>':''}</div>
        <div class="meta">${tm}${g.undoable&&!g.daDao?' · sửa được':''}</div></div></div>
        <div style="text-align:right;white-space:nowrap">${g.quy?`<div class="big-num ${g.quy>0?'money-pos':'money-neg'}" style="font-size:14px">${g.quy>0?'+':''}${fmtShort(g.quy)}</div>`:''}<span style="color:var(--ink-3)">›</span></div></div>`;}).join('');
    h+=`</div>`;});
  h+=`<div class="hint" style="text-align:center">Mỗi dòng là một lần nhập. Bấm vào để xem chi tiết, hoàn tác hoặc sửa lại.</div>`;
  return h;
}
function modalOp(key){
  const g=opGroups().find(x=>x.key===key);if(!g)return;
  const tm=new Date(g.t).toLocaleString('vi-VN');
  const lines=g.bts.map(b=>`<div class="slip"><div><div class="who" style="font-size:13px">${b.suKien}</div>
    <div class="meta">${b.dong.map(d=>(d.chieu==='NO'?'Nợ ':'Có ')+tkTen(d.tk)+' '+fmtShort(d.soTien)).join(' · ')}</div></div></div>`).join('');
  let actions='';
  const pure=_opTienThuan(g);
  if(g.daDao){
    actions=`<div class="check-ok">Khoản này đã hồi phục — số đã trở về như trước; bản gốc giữ lại để truy vết.</div>`;
    if(pure)actions+=`<div style="height:10px"></div><button class="btn btn-danger btn-sm" style="width:100%" onclick="doXoaHan('${key}')">🗑 Xoá hẳn khỏi nhật ký</button>
      <div class="hint" style="text-align:center;margin-top:8px">Muốn xoá luôn cả dấu vết thì bấm — coi như chưa từng nhập.</div>`;
  }
  else if(pure){
    actions=`<button class="btn btn-sage" onclick="doHoiPhuc('${key}')">↩ Hồi phục — trả số về như trước</button>
      <div class="hint" style="text-align:center;margin-top:6px">Số tiền/quỹ về đúng như trước khi nhập. Khoản vẫn nằm trong nhật ký (đánh dấu <b>đã hồi phục</b>) để giữ dấu vết.</div>
      <div style="height:12px"></div>
      <button class="btn btn-danger" onclick="doXoaHan('${key}')">🗑 Xoá hẳn — xoá khỏi nhật ký</button>
      <div class="hint" style="text-align:center;margin-top:6px">Bay khỏi nhật ký, coi như <b>chưa từng nhập</b>. Không còn dấu vết.</div>`;
  }
  else if(g.undoNow)actions=`<button class="btn btn-danger" onclick="doHoanTac('${key}')">↩ Hoàn tác — xóa phát sinh này</button>
    <div class="hint" style="text-align:center;margin-top:8px">Vừa nhập trong 5 phút nên xóa hẳn được${g.handled?', đơn trở lại như trước':''}.</div>`;
  else actions=`<div class="warn-box">Phát sinh này gắn với hàng hóa (giao hàng, nhận về, tháo, đóng đơn...). Để sửa mà không lệch tồn kho, mở <b>Đơn</b> → chọn đơn → dùng thao tác tương ứng (giao lại, hàng bị trả lại, hủy phiếu...).</div>`;
  openSheet('Chi tiết phát sinh',`
    <div style="margin:-4px 0 12px"><div style="font-weight:700">${g.ic} ${g.label}</div>
      <div style="font-size:12.5px;color:var(--ink-2)">${tm}${g.quy?' · tiền '+(g.quy>0?'+':'')+fmt(g.quy):''}</div></div>
    <div class="section-h" style="margin-top:0">Máy đã ghi gì</div><div class="card">${lines}</div>
    ${actions}`);
}
function doHoanTac(key){hoanTacOp(key,'');closeSheet();render();toast('Đã hoàn tác phát sinh.');}
function doDaoOp(key){const ly=((el('op_ly')&&el('op_ly').value)||'').trim();if(!ly)return toast('Ghi lý do sửa đã.',true);

/* ---------- TỔNG QUAN (gộp Hôm nay + Thu/Chi + Lợi nhuận) ---------- */
let tqTab='home';
let xhMode='thang'; /* biểu đồ: 'thang' | 'ngay' */
const TQ_MAIN=[['home','Hôm nay'],['laitien','Lãi & Tiền'],['chotso','Chốt sổ']];
const TQ_HIDDEN={nhatky:'Nhật ký nhập',xuhuong:'Biểu đồ',khoaky:'Khóa kỳ'};
/* ===========================================================
   SỔ THU CHI RIÊNG — gắn theo TỪNG THỢ (mọi loại thợ, kể cả chủ).
   Tách biệt với sổ xưởng: KHÔNG bút toán, KHÔNG đụng két/Lãi tạm/Chốt sổ.
   =========================================================== */
let _srId=null,_srLoai='chi',_srTho=null,_srKy='thang',_srRef=0;
/* Dựng mọi dòng của kỳ hiện tại cho một thợ — dùng chung cho phần tóm tắt và các sheet mục con. */
function srBuildRows(thoId){
  const ky=_srKy||'thang'; const rg=perRange(ky,_srRef);
  const t=getTho(thoId); const owner=t&&t.isOwner;
  const inRg=ts=>ts>=rg.from&&ts<=rg.to;
  // 1) thu/chi NGOÀI (tự nhập)
  const rowsSR=srListTho(thoId).filter(x=>inRg(x.thoiDiem)).map(r=>({
    ngay:r.thoiDiem, icon:r.loai==='thu'?'📥':'📤', label:r.dienGiai||(r.loai==='thu'?'Thu ngoài':'Chi ngoài'),
    sub:'tự nhập · sửa được', amount:r.soTien, sign:r.loai==='thu'?1:-1,
    onclick:`_srLoai='${r.loai}';modalSoRieng('${thoId}','${r.id}')`}));
  // 2) lương xưởng ĐÃ TRẢ / ỨNG (tiền vào của thợ) — bấm sửa như Chốt sổ
  const rowsTU=owner?[]:traUngList(thoId).filter(x=>inRg(x.ngay)).map(x=>({
    ngay:x.ngay, icon:'🧵', label:x.loai, sub:x.canEdit?'từ xưởng · sửa được':'từ xưởng',
    amount:x.tien, sign:1, onclick:x.canEdit?`modalSuaKhoan('${x.id}')`:''}));
  // 3) phát sinh cơm/hỗ trợ (xưởng lo cho thợ) — không tính vào Còn lại, bấm sửa được
  const rowsPS=owner?[]:psList(thoId).filter(x=>inRg(x.ngay)).map(x=>({
    ngay:x.ngay, icon:'🍚', label:(PS_KIND[x.kind]||'Khác')+(x.ghiChu?' · '+x.ghiChu:''),
    sub:'xưởng lo · sửa được', amount:x.tien, sign:0, onclick:`modalSuaPhatSinh('${x.id}')`}));
  const rows=rowsSR.concat(rowsTU,rowsPS).sort((a,b)=>b.ngay-a.ngay);
  // tổng: GIỮ NGUYÊN — tiền vào = lương xưởng + thu ngoài; tiền ra = chi ngoài
  const luongX=luongXuongThoRange(thoId,rg.from,rg.to);
  const thuNgoai=sum(rowsSR.filter(r=>r.sign>0).map(r=>r.amount));
  const chiNgoai=sum(rowsSR.filter(r=>r.sign<0).map(r=>r.amount));
  const psTot=sum(rowsPS.map(r=>r.amount));
  const thu=luongX+thuNgoai, chi=chiNgoai, con=thu-chi;
  return {ky,rg,owner,rowsSR,rowsTU,rowsPS,rows,luongX,thuNgoai,chiNgoai,psTot,thu,chi,con};
}
/* Một dòng khoản — bấm mở sheet xem & sửa (nếu có onclick). */

function srSectionHtml(thoId){

  h+=`<div class="card" style="border:1.5px solid var(--sage)"><div class="card-pad">
    ${kvTap('con','Còn lại',(con>=0?'':'−')+fmt(Math.abs(con)).replace('−',''),'big-num '+(con>=0?'money-pos':'money-neg'))}
    ${kvTap('thu','Tiền vào (thu)',fmt(thu),'money-pos')}

    ${psTot>0?kvTap('ps','<span style="color:var(--ink-3)">Xưởng lo cơm·hỗ trợ</span>',fmt(psTot),'','<br><small style="color:var(--ink-3)">không tính vào còn lại</small>'):''}</div>`;
  h+=`<div class="act-grid" style="margin:0 10px 10px">
      <button class="btn btn-sage btn-sm" onclick="_srLoai='thu';modalSoRieng('${thoId}',null)">📥 Thu ngoài</button>
      <button class="btn btn-primary btn-sm" onclick="_srLoai='chi';modalSoRieng('${thoId}',null)">📤 Chi ngoài</button></div>`;
  const CAP=80; const shown=ky==='all'?rows.slice(0,CAP):rows;
  h+=(rows.length?shown.map(srRowHtml).join('')
    :`<div class="divider-note" style="padding:14px">${ky==='all'?'Chưa có khoản nào.':'Chưa có khoản nào trong kỳ này.'}</div>`);
  if(ky==='all'&&rows.length>CAP)h+=`<div class="divider-note" style="padding:10px 14px">Chỉ hiện ${CAP} khoản gần nhất — chọn Tháng / Tuần / Ngày để xem theo kỳ.</div>`;
  h+=`</div>`;
  return h;
}

function phucHoi(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{importAny(r.result);closeSheet();}catch(e){toast('File không hợp lệ ('+e.message+').',true);}};r.readAsText(f);}
function phucHoiText(){try{const t=((el('imp_txt')&&el('imp_txt').value)||'').trim();if(!t)return toast('Chưa dán nội dung.',true);
  importAny(t);closeSheet();}catch(e){toast('Nội dung không hợp lệ ('+e.message+').',true);}}
function modalPhucHoi(){openSheet('Phục hồi & hiển thị lại',`
  <div class="warn-box">Phục hồi sẽ <b>thay toàn bộ</b> dữ liệu hiện tại bằng dữ liệu trong file/đoạn dán. Nhận cả <b>JSON sao lưu</b> lẫn <b>CSV toàn bộ</b>.</div>
  <button class="btn btn-ghost" style="margin-bottom:10px" onclick="el('imp').click()">⬆ Chọn file .json / .csv từ máy</button>
  <input type="file" id="imp" accept="application/json,.json,.csv,text/csv,text/plain" style="display:none" onchange="phucHoi(event)">
  <div class="divider-note">hoặc dán nội dung sao lưu vào đây</div>
  <textarea id="imp_txt" placeholder="Dán nội dung JSON đã sao lưu..." style="width:100%;height:160px;font-family:monospace;font-size:11px;border:1.5px solid var(--line);border-radius:11px;padding:10px;background:var(--card)"></textarea>
  <div style="height:10px"></div>
  <button class="btn btn-primary" onclick="phucHoiText()">Phục hồi & hiển thị</button>`);}

/* Form mẫu của chủ hàng.
   THÊM MỚI: bắt buộc chọn trong Kho mẫu sẵn — không gõ tên, không thêm/bớt công đoạn.
   SỬA    : đổi ảnh · tên · cỡ · giá · ĐƠN GIÁ công đoạn (tạo phiên bản giá mới),
            nhưng không thêm/bớt công đoạn — bộ công đoạn nằm trong Kho. */

  const id=mauCtx.id,chu=mauCtx.chuId?getChu(mauCtx.chuId):null,ks=dsMauSan();
  const anhBox=`<div class="field"><label>Ảnh mẫu <span style="font-weight:500;color:var(--ink-3)">(để nhìn là biết mẫu nào)</span></label>
      ${mauCtx.anh?`<div class="mau-anh-wrap"><img src="${mauCtx.anh}" class="mau-anh-xem"><button class="mau-anh-xoa" onclick="mauXoaAnh()">✕</button></div>`:'<div class="mau-anh-trong">Chưa có ảnh</div>'}

        <label class="btn btn-ghost btn-sm" style="text-align:center;cursor:pointer;margin:0">📷 Chụp<input type="file" accept="image/*" capture="environment" onchange="mauAnhChon(this)" style="display:none"></label>
        <label class="btn btn-ghost btn-sm" style="text-align:center;cursor:pointer;margin:0">🖼️ Chọn ảnh<input type="file" accept="image/*" onchange="mauAnhChon(this)" style="display:none"></label></div>
      <div class="hint">Ảnh được thu nhỏ và lưu ngay trong máy. Bản sao lưu JSON có kèm ảnh; bản CSV thì không.</div></div>`;
  const coBox=`<div class="field"><label>Các cỡ (cách nhau dấu phẩy)</label>
      <input id="mau_sizes" value="${(mauCtx.sizeList||[]).join(', ')}" placeholder="VD: S, M, L, XL hoặc Freesize" oninput="mauCtx.sizeList=this.value.split(',').map(x=>x.trim()).filter(Boolean)">

  const gioBox=`<div class="field"><label>Giờ định mức / 100 cái (nếu có khâu tính giờ)</label>
      <input type="number" id="mau_gio" value="${mauCtx.gio||0}" step="0.1" oninput="mauCtx.gio=+this.value||0"></div>`;
  const cdXem=`<div class="field"><label>Công đoạn (lấy nguyên từ Kho mẫu sẵn)</label>
      <div style="border:1.5px solid var(--line);border-radius:11px;overflow:hidden">
        ${cdEdit.map((c,i)=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line-2);font-size:13.5px;font-weight:600"><span>${i+1}. ${escHtml(c.ten)}</span><span>${fmt(c.donGia)}</span></div>`).join('')}
      </div><div class="hint">Muốn thêm/bớt công đoạn thì sửa trong 🧵 Kho mẫu sẵn.</div></div>`;
  const cdSua=`<div class="field"><label>Đơn giá công/cái từng công đoạn</label>
      ${cdEdit.map((c,i)=>`<div class="sizegrid" style="grid-template-columns:2fr 1.3fr;gap:6px;margin-bottom:6px">

  let b=chu?`<div class="hint" style="margin:-4px 0 12px">Thuộc chủ hàng: <b>${escHtml(chu.ten)}</b></div>`:'';
  if(!id){
    b+=`<div class="field"><label>Chọn mẫu trong kho</label>
      <select id="mau_kho" onchange="apDungMauSan(this.value)">

        ${ks.map(k=>`<option value="${k.id}"${mauCtx.tuKho===k.id?' selected':''}>${escHtml(k.ten)} · ${k.congDoan.length} công đoạn</option>`).join('')}
      </select>
      <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px" onclick="modalThemMauSan('${mauCtx.chuId}')">＋ Mẫu chưa có trong kho — tạo mẫu sẵn mới</button></div>`;
    if(!ks.length)return openSheet('Thêm mẫu',b+`<div class="warn-box">Kho mẫu sẵn đang trống. Tạo mẫu sẵn (tên · cỡ · công đoạn) <b>một lần</b>, sau đó mọi chủ hàng chỉ việc chọn.</div>`);
    if(!mauCtx.tuKho)return openSheet('Thêm mẫu',b+`<div class="warn-box">Chọn một mẫu trong kho để tiếp tục — mẫu và công đoạn chỉ tạo trong 🧵 Kho mẫu sẵn.</div>`);
    b+=`<div class="card" style="margin-bottom:12px"><div class="card-pad"><div class="kv"><div class="k">Mẫu đã chọn</div><div class="v">${escHtml(mauCtx.ten)}</div></div></div></div>`;
    b+=anhBox+coBox+giaBox+cdXem+gioBox;
    b+=`<button class="btn btn-primary" onclick="submitMau('')">Lưu mẫu</button>`;
    return openSheet('Thêm mẫu',b);
  }
  b+=anhBox+`<div class="field"><label>Tên mẫu</label><input id="mau_ten" value="${escHtml(mauCtx.ten||'')}" oninput="mauCtx.ten=this.value"></div>`;
  b+=coBox+giaBox+cdSua+gioBox;
  b+=`<div class="warn-box">Sửa đơn giá tạo <b>phiên bản mới</b>. Đơn đang chạy vẫn giữ giá cũ đã chốt.</div>
    <button class="btn btn-danger" style="margin-bottom:10px" onclick="doXoaMau('${id}')">Xóa mẫu này</button>
    <button class="btn btn-primary" onclick="submitMau('${id}')">Lưu mẫu</button>`;
  openSheet('Sửa mẫu',b);
}
function redrawMau(){drawMauForm();}
function mauAnhChon(inp){const f=inp.files&&inp.files[0];if(!f)return;
  if(!/^image\//.test(f.type))return toast('Chọn tệp ảnh.',true);
  const rd=new FileReader();
  rd.onload=e=>{const img=new Image();
    img.onload=()=>{const MAX=820;let w=img.width,h=img.height;
      if(w>=h&&w>MAX){h=Math.round(h*MAX/w);w=MAX;}else if(h>w&&h>MAX){w=Math.round(w*MAX/h);h=MAX;}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);
      let data;try{data=cv.toDataURL('image/jpeg',0.7);}catch(err){return toast('Không đọc được ảnh này.',true);}
      mauCtx.anh=data;redrawMau();
      const kb=Math.round(data.length*3/4/1024);toast('Đã thêm ảnh (~'+kb+' KB).');};
    img.onerror=()=>toast('Ảnh lỗi, thử ảnh khác.',true);
    img.src=e.target.result;};
  rd.onerror=()=>toast('Không đọc được tệp.',true);
  rd.readAsDataURL(f);}
function mauXoaAnh(){mauCtx.anh='';redrawMau();}
function doXoaMau(id){try{xoaMau(id);closeSheet();render();toast('Đã xóa mẫu.');}catch(e){toast(e.message,true)}}
function submitMau(id){
  const ten=(mauCtx.ten||'').trim();
  if(!id&&!mauCtx.tuKho)return toast('Chọn một mẫu trong kho.',true);
  if(!ten)return toast('Mẫu chưa có tên.',true);
  const cd=cdEdit.filter(c=>c.ten.trim()&&c.donGia>0);
  if(!cd.length)return toast('Mẫu này chưa có công đoạn có giá — sửa trong Kho mẫu sẵn.',true);
  const gio=mauCtx.gio||0,gia=mauCtx.gia||0;
  const sizeList=(mauCtx.sizeList&&mauCtx.sizeList.length)?mauCtx.sizeList:SIZES.slice();
  const anh=mauCtx.anh||'';
  if(id)suaMauGia(id,{ten,congDoan:cd,gioDinhMuc:gio,giaGiaCong:gia,sizeList,anh});
  else{themMau(mauCtx.chuId,{ten,congDoan:cd,gioDinhMuc:gio,giaGiaCong:gia,sizeList,anh});
    const c=getChu(mauCtx.chuId),mm=c.mau[c.mau.length-1];mm.tuKho=mauCtx.tuKho;dungMauSan(mauCtx.tuKho);Store.save();}
  closeSheet();render();toast('Đã lưu mẫu.');}

/* ================= KHO MẪU SẴN — giao diện ================= */
let msCtx={};
let msPropCtx=null;
function apDungMauSan(v){mauCtx.tuKho=v||'';
  if(!v){cdEdit=[];mauCtx.ten='';drawMauForm();return;}
  const k=getMauSan(v);if(!k)return;
  cdEdit=(k.congDoan||[]).map(c=>({...c}));
  mauCtx.sizeList=(k.sizeList&&k.sizeList.length)?k.sizeList.slice():SIZES.slice();
  mauCtx.ten=k.ten;mauCtx.gia=k.giaGiaCong||0;mauCtx.gio=k.gioDinhMuc||0;
  drawMauForm();}

/* ================= DANH MỤC CÔNG ĐOẠN THEO NHÓM MÁY =================
   Nguồn CHUẨN cho khai mẫu: chọn công đoạn từ đây, kéo theo tên+đơn giá+điểm.
   Chỉ là danh mục (metadata) — KHÔNG sinh bút toán, không đụng kế toán. */
let dmCtx={};
function dmSeed(){return [
  {id:uid(),ten:'Vắt sổ',cd:[]},
  {id:uid(),ten:'1 kim',cd:[]},
  {id:uid(),ten:'Kansai',cd:[
    {id:uid(),ten:'Kansai tay',donGia:200,diem:1},
    {id:uid(),ten:'Kansai cổ',donGia:300,diem:2}
  ]},
  {id:uid(),ten:'Thùa – đính',cd:[]},
  {id:uid(),ten:'Cắt chỉ – hoàn thiện',cd:[]}
];}
function dmList(){if(!DB.dmNhom){DB.dmNhom=dmSeed();Store.save();}return DB.dmNhom;}
function dmNhomGet(id){return dmList().find(n=>n.id===id)||null;}
function dmCdGet(nhomId,cdId){const n=dmNhomGet(nhomId);return n?((n.cd||[]).find(c=>c.id===cdId)||null):null;}
function dmThemNhom(ten){ten=(ten||'').trim();if(!ten)return null;const n={id:uid(),ten,cd:[]};dmList().push(n);Store.save();return n;}
function dmSuaNhom(id,ten){const n=dmNhomGet(id);if(n){ten=(ten||'').trim();if(ten)n.ten=ten;Store.save();}}
function dmXoaNhom(id){DB.dmNhom=dmList().filter(n=>n.id!==id);Store.save();}
function dmThemCd(nhomId,o){const n=dmNhomGet(nhomId);if(!n)return;n.cd=n.cd||[];n.cd.push({id:uid(),ten:(o.ten||'').trim(),donGia:o.donGia||0,diem:o.diem||0});Store.save();}
function dmSuaCd(nhomId,cdId,o){const c=dmCdGet(nhomId,cdId);if(!c)return;if(o.ten!=null){const t=(o.ten||'').trim();if(t)c.ten=t;}if(o.donGia!=null)c.donGia=o.donGia||0;if(o.diem!=null)c.diem=o.diem||0;Store.save();}
function dmXoaCd(nhomId,cdId){const n=dmNhomGet(nhomId);if(n){n.cd=(n.cd||[]).filter(c=>c.id!==cdId);Store.save();}}

function modalDanhMuc(){
  const ns=dmList();
  let h=`<div class="hint" style="margin:-4px 0 12px">Mỗi <b>nhóm máy</b> chứa các công đoạn chuẩn (tên · đơn giá · điểm). Khai mẫu thì chọn từ đây — không gõ tay nữa.</div>`;
  h+= ns.length? ns.map(n=>{
    const cds=((n.cd||[]).length?(n.cd||[]).map(c=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line-2)">
        <div style="flex:1;min-width:0"><div style="font-weight:650;font-size:13.5px">${escHtml(c.ten)}</div>
          <div style="font-size:11.5px;color:var(--ink-3);margin-top:1px">${fmt(c.donGia||0)}/cái · ${c.diem||0} điểm</div></div>
        <button class="mini-btn" style="color:var(--ink-2)" onclick="modalCdForm('${n.id}','${c.id}')">✎</button>
        <button class="mini-btn" onclick="dmDelCd('${n.id}','${c.id}')">✕</button>
      </div>`).join(''):'<div class="hint" style="margin:6px 0 0">Nhóm này chưa có công đoạn nào.</div>');
    return `<div class="card"><div class="card-pad">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
        <div style="flex:1;font-weight:800;font-size:15px">${escHtml(n.ten)} <span style="font-weight:600;color:var(--ink-3);font-size:12px">· ${(n.cd||[]).length} công đoạn</span></div>
        <button class="mini-btn" style="color:var(--ink-2)" onclick="modalNhomForm('${n.id}')">✎ tên</button>
        <button class="mini-btn" onclick="dmDelNhom('${n.id}')">✕</button>
      </div>
      ${cds}
      <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:10px" onclick="modalCdForm('${n.id}','')">＋ Thêm công đoạn</button>
    </div></div>`;
  }).join('') : `<div class="divider-note" style="padding:14px">Chưa có nhóm máy nào.</div>`;
  h+=`<button class="btn btn-primary" onclick="modalNhomForm('')">＋ Thêm nhóm máy</button>`;
  openSheet('Danh mục công đoạn',h);
}
function dmDelNhom(id){const n=dmNhomGet(id);if(!n)return;xacNhan('Xóa nhóm «'+n.ten+'» và toàn bộ công đoạn trong đó?\n\nMẫu đã tạo trước đó KHÔNG bị ảnh hưởng.',()=>{dmXoaNhom(id);modalDanhMuc();toast('Đã xóa nhóm.');},{ok:'Xóa nhóm',nguyHiem:true,title:'Xóa nhóm máy'});}
function dmDelCd(nhomId,cdId){const c=dmCdGet(nhomId,cdId);if(!c)return;xacNhan('Xóa công đoạn «'+c.ten+'» khỏi danh mục?',()=>{dmXoaCd(nhomId,cdId);modalDanhMuc();toast('Đã xóa công đoạn.');},{ok:'Xóa',nguyHiem:true,title:'Xóa công đoạn'});}

function modalNhomForm(id){const n=id?dmNhomGet(id):null;dmCtx={nhomId:id||''};
  openSheet(id?'Sửa tên nhóm':'Thêm nhóm máy',`
    <div class="field"><label>Tên nhóm máy</label><input id="dm_nhom_ten" value="${n?escHtml(n.ten):''}" placeholder="VD: Kansai, Vắt sổ, 1 kim…"></div>
    <button class="btn btn-primary" onclick="submitNhom('${id||''}')">Lưu</button>`);
  setTimeout(()=>{const e=el('dm_nhom_ten');if(e)e.focus();},60);
}
function submitNhom(id){const ten=(el('dm_nhom_ten')?el('dm_nhom_ten').value:'').trim();if(!ten)return toast('Nhập tên nhóm.',true);
  if(id)dmSuaNhom(id,ten);else dmThemNhom(ten);modalDanhMuc();toast('Đã lưu nhóm.');}

function modalCdForm(nhomId,cdId){const n=dmNhomGet(nhomId);if(!n)return;const c=cdId?dmCdGet(nhomId,cdId):null;
  openSheet((cdId?'Sửa công đoạn':'Thêm công đoạn')+' · '+escHtml(n.ten),`
    <div class="field"><label>Tên công đoạn</label><input id="dm_cd_ten" value="${c?escHtml(c.ten):''}" placeholder="VD: Kansai cổ"></div>
    <div class="field"><label>Đơn giá công / 1 cái</label><input type="text" inputmode="numeric" class="sep" id="dm_cd_gia" value="${c?sepStr(c.donGia||0):''}" placeholder="VD: 300"></div>
    <div class="field"><label>Điểm</label><input type="text" inputmode="numeric" class="sep" id="dm_cd_diem" value="${c?sepStr(c.diem||0):''}" placeholder="VD: 2"></div>
    <button class="btn btn-primary" onclick="submitCd('${nhomId}','${cdId||''}')">Lưu công đoạn</button>`);
  setTimeout(()=>{const e=el('dm_cd_ten');if(e)e.focus();},60);
}
function submitCd(nhomId,cdId){const ten=(el('dm_cd_ten')?el('dm_cd_ten').value:'').trim();if(!ten)return toast('Nhập tên công đoạn.',true);
  const gia=numVal('dm_cd_gia'),diem=numVal('dm_cd_diem');
  if(cdId)dmSuaCd(nhomId,cdId,{ten,donGia:gia,diem});else dmThemCd(nhomId,{ten,donGia:gia,diem});
  modalDanhMuc();toast('Đã lưu công đoạn.');}

/* Bộ chọn công đoạn cho mẫu — thêm từ danh mục, chọn nhiều, xong quay lại form. */
function modalChonCD(){msSaveFields();const ns=dmList();
  let h=`<div class="hint" style="margin:-4px 0 12px">Bấm <b>＋ Thêm</b> để đưa công đoạn vào mẫu. Chọn được nhiều. Xong thì bấm nút dưới cùng.</div>`;
  h+= ns.length? ns.map(n=>{
    const cds=((n.cd||[]).length?(n.cd||[]).map(c=>`<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line-2)">
        <div style="flex:1;min-width:0"><div style="font-weight:650;font-size:13.5px">${escHtml(c.ten)}</div>
          <div style="font-size:11.5px;color:var(--ink-3);margin-top:1px">${fmt(c.donGia||0)}/cái · ${c.diem||0} điểm</div></div>
        <button class="btn btn-sage btn-sm" style="white-space:nowrap" onclick="chonCD('${n.id}','${c.id}')">＋ Thêm</button>
      </div>`).join(''):'<div class="hint" style="margin:6px 0 0">Nhóm này chưa có công đoạn.</div>');
    return `<div class="card"><div class="card-pad">
      <div style="font-weight:800;font-size:15px;margin-bottom:2px">${escHtml(n.ten)}</div>${cds}</div></div>`;
  }).join('') : `<div class="warn-box">Chưa có nhóm máy nào. Mở 📂 Danh mục để tạo trước.</div>`;
  h+=`<button class="btn btn-ghost btn-sm" style="width:100%;margin-bottom:10px" onclick="modalDanhMuc()">📂 Mở danh mục (thêm/sửa nhóm & công đoạn)</button>`;
  h+=`<button class="btn btn-primary" onclick="chonCDXong()">Xong — đã chọn ${cdEdit.length} công đoạn</button>`;
  openSheet('Chọn công đoạn',h);
}
function chonCD(nhomId,cdId){const n=dmNhomGet(nhomId),c=dmCdGet(nhomId,cdId);if(!c)return;
  cdEdit.push({ten:c.ten,donGia:c.donGia||0,diem:c.diem||0,nhom:n?n.ten:null,nhomId:n?n.id:null,canTruoc:[],giaiDoan:null});
  toast('Đã thêm: '+c.ten);modalChonCD();}
function chonCDXong(){navBack();}
let msLive=false;
function modalKhoMau(){msLive=false;const ks=dsMauSan();
  let h=`<div class="hint" style="margin:-4px 0 12px">Mẫu sẵn = <b>bộ công đoạn + đơn giá</b> dùng chung cho mọi chủ hàng. Vào chủ hàng thêm mẫu thì chọn ở đây, khỏi gõ lại từng công đoạn.</div><div class="card">`;
  h+=ks.length?ks.map(k=>`<div class="slip" onclick="modalSuaMauSan('${k.id}')">
      <div style="min-width:0"><div class="who">${escHtml(k.ten)} ✎</div>
        <div class="meta">cỡ ${(k.sizeList||SIZES).join('/')} · ${k.congDoan.length} công đoạn · giá ${fmt(k.giaGiaCong||0)}/cái${k.soLan?' · đã dùng '+k.soLan+' lần':''}</div></div>
      <div class="slip-right"><span style="color:var(--ink-3)">›</span></div></div>`).join('')
    :`<div class="divider-note" style="padding:14px">Chưa có mẫu sẵn nào.</div>`;
  h+=`</div><button class="btn btn-ghost btn-sm" style="width:100%;margin-bottom:10px" onclick="modalDanhMuc()">📂 Danh mục công đoạn theo nhóm máy (${dmList().length} nhóm)</button>`;
  h+=`<button class="btn btn-primary" onclick="modalThemMauSan()">＋ Thêm mẫu sẵn</button>`;
  openSheet('Kho mẫu sẵn ('+ks.length+')',h);}
function modalThemMauSan(veChu){if(!(msLive&&msCtx&&msCtx.__new)){cdEdit=[];msCtx={id:'',sizeList:SIZES.slice(),veChu:veChu||'',__new:true,ten:'',gio:0,gia:0};msLive=true;}drawMauSanForm(msCtx.id||'',msCtx.ten||'',msCtx.gio||0,msCtx.gia||0);}
function modalSuaMauSan(id){const k=getMauSan(id);if(!k)return;
  if(!(msLive&&msCtx&&msCtx.id===id&&!msCtx.__new)){
    cdEdit=(k.congDoan||[]).map(c=>({...c,canTruoc:migCT(c.canTruoc)}));
    msCtx={id,sizeList:(k.sizeList&&k.sizeList.length)?k.sizeList.slice():SIZES.slice(),ten:k.ten||'',gio:k.gioDinhMuc||0,gia:k.giaGiaCong||0};
    msLive=true;
  }
  drawMauSanForm(id,(msCtx.ten!=null?msCtx.ten:(k.ten||'')),msCtx.gio||0,msCtx.gia||0);}
function msTabBar(active){
  const kd=cdEdit.filter(c=>normCT(c.canTruoc).length).length;
  const gd=cdEdit.filter(c=>c.giaiDoan!=null&&c.giaiDoan!=='').length;
  const tab=(v,label,badge)=>`<button onclick="msTab('${v}')" style="flex:1;padding:10px 5px;border:none;background:${active===v?'#fff':'transparent'};border-bottom:2.5px solid ${active===v?'var(--brand)':'transparent'};font-weight:${active===v?'800':'600'};color:${active===v?'var(--brand)':'var(--ink-3)'};font-size:12px;cursor:pointer">${label}${badge?` <span style="font-size:11px;color:var(--ink-3)">${badge}</span>`:''}</button>`;
  return `<div style="display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--muslin);margin:-4px 0 14px">${tab('form','① Giá &amp; CĐ','')}${tab('dk','② Điều kiện',kd?('· '+kd):'')}${tab('neo','③ Mốc giai đoạn',gd?('· '+gd):'')}</div>`;
}
function msTab(v){const cur=(msCtx&&msCtx.view)||'form';if(v===cur)return;if(v==='dk')modalDKMauSan();else if(v==='neo')modalNeoMauSan();else dkXong();}
function drawMauSanForm(id,ten,gio,gia){
  msCtx.ten=ten||'';msCtx.view='form';
  const rows=cdEdit.length?cdEdit.map((c,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 11px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:6px;background:var(--card)">
    <div style="flex:1;min-width:0">
      <div style="font-weight:700;font-size:13.5px">${i+1}. ${escHtml(c.ten||'(chưa đặt tên)')}</div>
      <div style="font-size:11.5px;color:var(--ink-3);margin-top:2px">${c.nhom?`<b style="color:var(--sage)">${escHtml(c.nhom)}</b> · `:'<span style="color:var(--thread)">chưa phân nhóm</span> · '}${fmt(c.donGia||0)}/cái · ${c.diem||0} điểm</div>
    </div>
    <button class="mini-btn" style="align-self:center" onclick="cdEdit.splice(${i},1);redrawMauSan()">✕</button></div>`).join('')
    :`<div class="hint" style="margin:0 0 8px">Chưa có công đoạn — bấm nút dưới để chọn từ danh mục nhóm máy.</div>`;
  openSheet(ten?escHtml(ten):(id?'Sửa mẫu sẵn':'Thêm mẫu sẵn'),`
    ${msTabBar('form')}
    <div class="hint" style="margin:-4px 0 12px">Mẫu sẵn không kèm ảnh — ảnh chụp riêng cho từng chủ hàng lúc thêm mẫu.</div>
    <div class="field"><label>Tên mẫu</label><input id="ms_ten" value="${ten||''}" placeholder="VD: Áo thun basic"></div>
    <div class="field"><label>Các cỡ (cách nhau dấu phẩy)</label>
      <input id="ms_sizes" value="${(msCtx.sizeList||[]).join(', ')}" placeholder="VD: S, M, L, XL hoặc Freesize" oninput="msCtx.sizeList=this.value.split(',').map(x=>x.trim()).filter(Boolean)"></div>
    <div class="field"><label>Giá gia công gợi ý / 1 cái</label><input type="text" inputmode="numeric" class="sep" id="ms_gia" value="${sepStr(gia)}">
      <div class="hint">Chỉ là số gợi ý — mỗi chủ hàng trả khác nhau thì sửa lại lúc thêm mẫu.</div></div>
    <div class="field"><label>Công đoạn (chọn từ danh mục nhóm máy)</label>${rows}
      <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:4px" onclick="modalChonCD()">＋ Chọn công đoạn từ danh mục</button>
      <div class="hint" style="margin-top:6px">Tên · đơn giá · điểm lấy nguyên từ danh mục, không sửa tại đây. Sửa thông số thì vào 📂 Danh mục công đoạn.</div></div>
    <div class="field"><label>Giờ định mức / 100 cái (nếu có khâu tính giờ)</label><input type="number" id="ms_gio" value="${gio||0}" step="0.1"></div>
    ${id?`<div class="hint" style="margin-bottom:10px">Sửa ở đây <b>không</b> đổi mẫu đã tạo cho chủ hàng — mẫu bên đó là bản riêng, đơn đang chạy vẫn giữ giá cũ.</div>
      <button class="btn btn-danger" style="margin-bottom:10px" onclick="doXoaMauSan('${id}')">Xóa mẫu sẵn này</button>`:''}
    <button class="btn btn-primary" onclick="submitMauSan('${id||''}')">Lưu mẫu sẵn</button>`);}
function redrawMauSan(){drawMauSanForm(msCtx.id,el('ms_ten').value,+el('ms_gio').value||0,numVal('ms_gia'));}
function redrawMS(){if(msCtx&&msCtx.view==='dk')drawDKForm();else redrawMauSan();}
function msSaveFields(){if(el('ms_ten'))msCtx.ten=el('ms_ten').value;if(el('ms_gia'))msCtx.gia=numVal('ms_gia');if(el('ms_gio'))msCtx.gio=+el('ms_gio').value||0;}
function modalDKMauSan(){msSaveFields();msCtx.view='dk';drawDKForm();}
function dkXong(){msCtx.view='form';drawMauSanForm(msCtx.id||'',msCtx.ten||'',msCtx.gio||0,msCtx.gia||0);}
/* ---- TAB ③ GIAI ĐOẠN NEO ---- */
function neoChain(){const a=[];cdEdit.forEach((c,i)=>{if(c.giaiDoan!=null&&c.giaiDoan!=='')a.push({i,g:c.giaiDoan});});return a;}
function neoTenB(i){return escHtml(((cdEdit[i]&&cdEdit[i].ten||'').trim())||('Công đoạn '+(i+1)));}
function modalNeoMauSan(){msSaveFields();msCtx.view='neo';drawNeoForm();}
function neoSet(i,val){const n=parseInt(val,10);cdEdit[i].giaiDoan=(val===''||isNaN(n)||n<1)?null:n;drawNeoForm();}
function drawNeoForm(){msCtx.view='neo';openSheet(msCtx.ten?escHtml(msCtx.ten):'Mốc giai đoạn',`
    ${msTabBar('neo')}
    <div class="hint" style="margin-top:0;margin-bottom:12px"><b>Mốc giai đoạn</b> = đánh số thứ tự vài bước làm <b>mốc</b>. Bước-mốc làm xong bao nhiêu cái thì các bước <b>sau</b> nó chỉ nhận tối đa bấy nhiêu (trần hạ dần theo mốc). Bước-mốc phải xong <b>đủ hết công thức</b> mới được chốt làm mốc. Khoá "được nhận hay chưa" là việc của tab ② Điều kiện — neo chỉ giới hạn <b>số lượng</b>. Để trống = không phải mốc.</div>
    ${buildNeoHtml()}
    <div style="height:14px"></div>
    <button class="btn btn-primary" onclick="submitMauSan('${msCtx.id||''}')">Lưu mẫu sẵn</button>`);}
function buildNeoHtml(){
  const rows=cdEdit.map((c,i)=>{
    const v=(c.giaiDoan!=null&&c.giaiDoan!=='')?c.giaiDoan:'';
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line-2)">
      <div style="flex:1;min-width:0;font-weight:600;font-size:13px">${i+1}. ${neoTenB(i)}</div>
      <input type="text" inputmode="numeric" value="${v}" placeholder="—" onchange="neoSet(${i},this.value)" style="width:52px;text-align:center;padding:9px 6px;border:1.5px solid ${v!==''?'var(--brand)':'var(--line)'};border-radius:9px;font-weight:800;color:${v!==''?'var(--brand)':'var(--ink)'}">
      ${v!==''?`<b onclick="neoSet(${i},'')" style="cursor:pointer;color:#c0392b;font-size:12px;min-width:26px">bỏ</b>`:'<span style="min-width:26px"></span>'}
    </div>`;}).join('');
  return rows+neoTomTat();
}
function neoTomTat(){
  const a=neoChain();
  if(!a.length)return '<div class="hint" style="margin:12px 0 0">Chưa đánh mốc — chỉ là nhãn, không ảnh hưởng tính toán.</div>';
  const chain=a.map(x=>`<b style="color:var(--brand)">${x.g}·${neoTenB(x.i)}</b>`).join(' &nbsp;·&nbsp; ');
  return `<div style="margin-top:12px;padding:11px;border-radius:11px;background:var(--muslin);border:1.5px solid var(--line)">
    <div style="font-size:12px;color:var(--ink-3);margin-bottom:4px">Các mốc đã đánh:</div>
    <div style="font-size:13px">${chain}</div></div>`;
}
function drawDKForm(){msCtx.view='dk';openSheet(msCtx.ten?escHtml(msCtx.ten):'Điều kiện hoàn thành',`
    ${msTabBar('dk')}
    <div class="hint" style="margin-top:0;margin-bottom:12px">Điều kiện hoàn thành = bước này chỉ may được khi các bước cần trước đã xong. Mỗi công đoạn có thể có <b>nhiều công thức</b> — xong <b>một</b> là làm được (HOẶC); trong một công thức phải xong <b>cả</b> (VÀ). Để trống = làm lúc nào cũng được.</div>
    ${buildDKHtml()}
    <div style="height:14px"></div>
    <button class="btn btn-primary" onclick="submitMauSan('${msCtx.id||''}')">Lưu mẫu sẵn</button>`);}
function buildDKHtml(){
  const n=cdEdit.length;
  if(n<2)return '<div class="hint" style="margin:0">Thêm từ 2 công đoạn trở lên (ở màn mẫu) rồi mới xếp điều kiện.</div>';
  const tenB=(i)=>escHtml(((cdEdit[i]&&cdEdit[i].ten||'').trim())||('Công đoạn '+(i+1)));
  const selHtml=(i,gi,exclude)=>{const opts=[];for(let a=0;a<n;a++){if(a===i)continue;if(exclude.includes(a))continue;if(cdDependsOn(a,i))continue;opts.push(a);}
    if(!opts.length)return'';
    return `<select onchange="if(this.value!==''){cdThemDK(${i},${gi},+this.value)}" style="padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;background:#fff"><option value="">+ cần bước…</option>${opts.map(a=>`<option value="${a}">${a+1}. ${tenB(a)}</option>`).join('')}</select>`;};
  const chipHtml=(i,gi,a)=>`<span style="display:inline-flex;align-items:center;gap:4px;background:#eef1f5;border-radius:8px;padding:3px 8px;font-size:12.5px">${a+1}. ${tenB(a)} <b onclick="cdBoDK(${i},${gi},${a})" style="cursor:pointer;color:#c0392b">✕</b></span>`;
  return cdEdit.map((c,i)=>{
    const gs=migCT(c.canTruoc);
    let inner;
    if(!gs.length){
      inner=`<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center"><span style="font-size:12px;color:var(--ink-3)">cần:</span><span style="font-size:12px;color:var(--ink-3)">— (làm lúc nào cũng được)</span> ${selHtml(i,0,[])}</div>`;
    }else{
      inner=gs.map((g,gi)=>{
        const chips=g.map(a=>chipHtml(i,gi,a)).join(' ');
        const del=`<b onclick="cdXoaCT(${i},${gi})" style="cursor:pointer;color:#999;font-size:11.5px;margin-left:2px">✕ bỏ</b>`;
        const lbl=gs.length>1?`<span style="font-size:11px;color:var(--brand);font-weight:800;min-width:52px">CT ${gi+1}${gi>0?' (hoặc)':''}</span>`:'<span style="font-size:12px;color:var(--ink-3)">cần:</span>';
        return `<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:5px">${lbl}${chips||'<span style="font-size:12px;color:var(--ink-3)">—</span>'} ${selHtml(i,gi,g)}${del}</div>`;
      }).join('');
    }
    const themCT=gs.length?`<button class="btn btn-ghost btn-sm" style="padding:3px 10px;font-size:12px;margin-top:1px" onclick="cdThemCT(${i})">＋ Thêm công thức (hoặc)</button>`:'';
    return `<div style="padding:8px 0;border-bottom:1px solid var(--line-2)"><div style="font-weight:600;font-size:13px;margin-bottom:5px">${i+1}. ${tenB(i)}</div>${inner}${themCT}</div>`;
  }).join('');
}
function migCT(ct){if(!Array.isArray(ct)||!ct.length)return[];if(ct.every(x=>Array.isArray(x)))return ct.map(g=>g.slice());return [ct.filter(x=>typeof x==='number')];}
function normCT(ct){return migCT(ct).map(g=>g.filter(x=>typeof x==='number')).filter(g=>g.length);}
function normGD(v){const n=parseInt(v,10);return (v==null||v===''||isNaN(n)||n<1)?null:n;}
function ctOf(i){const gs=migCT(cdEdit[i].canTruoc);cdEdit[i].canTruoc=gs;return gs;}
function cdDependsOn(a,target,seen){seen=seen||{};if(a===target)return true;if(seen[a])return false;seen[a]=1;const gs=migCT(cdEdit[a]&&cdEdit[a].canTruoc);for(const g of gs)for(const x of g){if(cdDependsOn(x,target,seen))return true;}return false;}
function cdThemDK(i,gi,a){if(i===a)return;if(cdDependsOn(a,i))return toast('Không được — sẽ tạo vòng lặp điều kiện.',true);const gs=ctOf(i);while(gs.length<=gi)gs.push([]);if(!gs[gi].includes(a))gs[gi].push(a);redrawMS();}
function cdBoDK(i,gi,a){const gs=ctOf(i);if(gs[gi])gs[gi]=gs[gi].filter(x=>x!==a);redrawMS();}
function cdThemCT(i){const gs=ctOf(i);gs.push([]);redrawMS();}
function cdXoaCT(i,gi){const gs=ctOf(i);gs.splice(gi,1);redrawMS();}
function submitMauSan(id){const ten=((el('ms_ten')?el('ms_ten').value:(msCtx.ten||''))).trim();if(!ten)return toast('Nhập tên mẫu.',true);
  const keep=cdEdit.map((c,i)=>({c,i})).filter(o=>o.c.ten.trim()&&o.c.donGia>0);
  if(!keep.length)return toast('Thêm ít nhất một công đoạn có giá.',true);
  const o2n={};keep.forEach((o,ni)=>{o2n[o.i]=ni;});
  const cd=keep.map(o=>({ten:o.c.ten.trim(),donGia:o.c.donGia,diem:o.c.diem||0,nhom:o.c.nhom||null,nhomId:o.c.nhomId||null,giaiDoan:normGD(o.c.giaiDoan),

let _nav=[];          // mỗi khung: {name,args,key}
let _navMode='push';  // 'push' bình thường | 're' khi đang dựng lại khung cũ lúc back
function _navKey(name,args){try{return name+'|'+JSON.stringify(args);}catch(e){return name+'|?';}}
function _frame(name,args){
  if(_navMode==='re'){_navMode='push';return;}            // đang re-render khung cũ → không đụng stack
  while(_nav.length&&/^confirm/.test(_nav[_nav.length-1].name))_nav.pop(); // bỏ hộp xác nhận tạm khi mở khung thật đè lên
  const key=_navKey(name,args);
  const i=_nav.findIndex(f=>f.key===key);
  if(i>=0)_nav.length=i;                                  // quay lại đúng khung đã có: bỏ mọi khung phía trên
  _nav.push({name,args,key});
}
function _reopenTop(){
  const f=_nav[_nav.length-1];if(!f)return false;
  _navMode='re';
  try{window[f.name].apply(null,f.args);return true;}
  catch(e){_navMode='push';_nav.pop();return _reopenTop();} // khung hỏng (dữ liệu đã đổi) → lùi tiếp
}
function navBack(){
  if(_nav.length>1){_nav.pop();if(_reopenTop())return;}

let _actx=null;
function sfx(kind){ if(!sfxOn())return;
  try{ _actx=_actx||new (window.AudioContext||window.webkitAudioContext)(); if(_actx.state==='suspended')_actx.resume();
    const t=_actx.currentTime,o=_actx.createOscillator(),g=_actx.createGain(); o.connect(g);g.connect(_actx.destination);
    const f=kind==='sel'?600:430; o.type='triangle'; o.frequency.setValueAtTime(f,t);
    if(kind==='sel')o.frequency.exponentialRampToValueAtTime(f*1.5,t+0.07);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(kind==='sel'?0.16:0.11,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.15); o.start(t); o.stop(t+0.17);
  }catch(e){} }

    s.style.left=(x-r.left-sz/2)+'px'; s.style.top=(y-r.top-sz/2)+'px';
    if(getComputedStyle(node).position==='static')node.style.position='relative'; node.style.overflow='hidden';
    node.appendChild(s); setTimeout(function(){s.remove();},480);
  }catch(e){} }

/* Đồng nhất "mọi đơn thuộc một lô": đơn cũ chưa có maLo → gán maLo = ma (lô 1 mẫu). Idempotent. */
function migrateQuyChi(){if(!DB||!DB.butToan)return false;let ch=false;
  // Gắn nhãn quỹ theo TÀI KHOẢN ĐỐI ỨNG (chuẩn hơn tên sự kiện, xử đúng cả bút toán đảo):
  //  • đối ứng chi phí/lương (RO_CHUNG, GIA_VON, WIP, PHAI_TRA_THO) → Quỹ phụ (nhãn 'chi')
  //  • đối ứng VON (bỏ vốn/rút) hoặc PHAI_THU (thu chủ hàng) → Quỹ chính (không nhãn)
  // CHỈ đụng dòng CHƯA có nhãn → không đè lựa chọn quỹ thủ công của người dùng. Idempotent.
  const Q2SET={RO_CHUNG:1,GIA_VON:1,WIP:1,PHAI_TRA_THO:1};
  for(const bt of DB.butToan){
    const isExpense=bt.dong.some(d=>Q2SET[d.tk]);
    const hasVon=bt.dong.some(d=>d.tk===TK.VON);
    for(const d of bt.dong){if(d.tk!==TK.QUY)continue;
      if(isExpense){if(d.quy===undefined){d.quy='chi';ch=true;}}
      // Bỏ vốn/rút: mặc định Quỹ chính (không nhãn); nếu người dùng CHỦ ĐÍCH bỏ thẳng Quỹ phụ (quy:'chi') thì GIỮ nguyên.
    }
  }
  return ch;}
function migrateLo(){let ch=false;
  if(DB&&DB.don)for(const d of DB.don){if(!d.maLo){d.maLo=d.ma||('ĐH-'+d.id);ch=true;}}
  if(migrateQuyChi())ch=true;
  return ch;}

  if(remote&&remote.data){DB=remote.data;Cloud.baseStamp=remote.updated_at;normalizeDB();render();cloudSetStatus('ok');try{runSelfCheck('cloud');}catch(_){}}
  else if(failed){loadLocalOrSeed();render();cloudSetStatus('offline');}
  else{ /* mây trống: đưa sổ hiện tại của máy này lên */ loadLocalOrSeed();render();await cloudPush(true);}
  startCloudWatch();
  toast('Đã kết nối đám mây.');}

/* ---------- đẩy lên (có chốt chống đè) ---------- */
function scheduleCloudPush(){if(!cloudOn())return;Cloud.dirty=true;clearTimeout(Cloud.pushT);Cloud.pushT=setTimeout(()=>cloudPush(false),800);}

async function cloudPush(force){if(!cloudOn()||Cloud.busy)return;Cloud.busy=true;cloudSetStatus('saving');
  try{
    if(!force&&Cloud.baseStamp){
      const {data:cur,error:e1}=await Cloud.sb.from('soxuong').select('updated_at').eq('id','main').maybeSingle();
      if(!e1&&cur&&cur.updated_at&&new Date(cur.updated_at).getTime()>new Date(Cloud.baseStamp).getTime()){
        Cloud.busy=false;cloudSetStatus('conflict');return;}
    }
    const stamp=new Date().toISOString();
    const {data,error}=await Cloud.sb.from('soxuong').upsert({id:'main',data:DB,updated_at:stamp}).select('updated_at').maybeSingle();
    if(error)throw error;
    Cloud.baseStamp=(data&&data.updated_at)||stamp;Cloud.dirty=false;cloudSetStatus('ok');
  }catch(err){cloudSetStatus('offline');}
  Cloud.busy=false;}

/* ---------- kéo về ---------- */
async function cloudPull(){if(!cloudOn()||Cloud.busy)return;
  try{const r=await cloudFetch();
    if(r&&r.updated_at&&(!Cloud.baseStamp||new Date(r.updated_at).getTime()>new Date(Cloud.baseStamp).getTime())){
      if(Cloud.dirty){cloudSetStatus('conflict');return;}
      DB=r.data;Cloud.baseStamp=r.updated_at;normalizeDB();render();cloudSetStatus('ok');toast('Đã cập nhật từ máy kia.');
    }
  }catch(e){}}

function cloudReloadNow(){Cloud.dirty=false;Cloud.baseStamp=null;cloudSetStatus('ok');cloudPull();}
async function cloudForcePush(){cloudSetStatus('ok');await cloudPush(true);}
async function cloudSyncNow(){await cloudPull();if(Cloud.dirty)await cloudPush(false);toast('Đã đồng bộ.');}

let _cloudWatchStarted=false;
function startCloudWatch(){if(_cloudWatchStarted)return;_cloudWatchStarted=true;
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)cloudPull();});
  window.addEventListener('focus',()=>cloudPull());
  window.addEventListener('online',()=>{if(Cloud.dirty)cloudPush(false);else cloudPull();});
  window.addEventListener('offline',()=>cloudSetStatus('offline'));}

function _edFnOf(node){const oc=node&&node.getAttribute&&node.getAttribute('onclick');if(!oc)return null;const m=(''+oc).match(/^\s*([A-Za-z_$][\w$]*)\s*\(/);return m?m[1]:null;}
document.addEventListener('click',function(e){
  if(!edLockOn()||edUnlocked())return;                 // tính năng tắt, hoặc đang trong 1 phút mở khóa
  if(e.target.closest&&e.target.closest('#edlock_ovl'))return; // click trong chính ô mật mã
  const t=e.target.closest&&e.target.closest('[onclick]');
  if(!t)return;
  const fn=_edFnOf(t);
  if(!fn||!EDIT_FNS.has(fn))return;                     // không phải thao tác chỉnh sửa
  e.preventDefault();e.stopImmediatePropagation();
  askUnlock(function(){try{t.click();}catch(_){}}); // mở khóa xong thì tự chạm lại đúng nút
},true);

function nnToday(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}

function taoDonNhapNguoc({chuHangId,mauId,sl,donGia,maLo,ma,ngay}){

    trangThai:'DA_GIAO_DU',nhapNguoc:true,maLo:maLo||ma||''};
