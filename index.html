/* ---- doanh thu (tối đa 1 bút toán/đơn, đảo–ghi lại khi sửa) ---- */
function _btDTNguoc(donId){return DB.butToan.find(bt=>!bt.dao_cua&&!bt.daDao&&bt.nguocDT===donId);}
function _thuTrenDon(donId){return bal(TK.PHAI_THU,d=>d.phieuGiaoId===('RN-'+donId)&&d.chieu==='CO').co;}
function ghiDoanhThuNguoc(don){
  const rev=slNguoc(don)*don.giaGiaCong;
  const old=_btDTNguoc(don.id);
  if(old){if(_thuTrenDon(don.id)>0)return; daoButToan(old.id,'sửa doanh thu đơn nhập ngược');}
  if(rev>0){beginOp();const slip='RN-'+don.id;const mau=getMau(don.mauId);
    ghi('Doanh thu (nhập ngược)',[
      {tk:TK.PHAI_THU,chieu:'NO',soTien:rev,chuHangId:don.chuHangId,donId:don.id,phieuGiaoId:slip,ngay:don.ngay,loaiSlip:'GIAO',nhan:(mau?mau.ten:'đơn cũ'),mauId:don.mauId||null,sl:slNguoc(don),donGia:don.giaGiaCong},
      {tk:TK.DOANH_THU,chieu:'CO',soTien:rev,donId:don.id,loai:'GIA_CONG',mauId:don.mauId||null}
    ],{thoiDiem:don.ngay,nguocDT:don.id,nguocDon:don.id});}
  Store.save();
}
function luuDoanhThuNguoc(donId){try{const don=getDon(donId);if(!don)return;
  if(_thuTrenDon(donId)>0)return toast('Đã thu tiền đơn này — không sửa doanh thu được.',true);
  don.sizes={'Tổng':numVal('nn_e_sl')};don.giaGiaCong=numVal('nn_e_dg');
  ghiDoanhThuNguoc(don);Store.save();modalNhapNguoc(donId);toast('Đã lưu doanh thu.');
}catch(e){toast(e.message,true)}}
/* ---- gán mẫu (để nhập được công đoạn) ---- */
function ganMauNguoc(donId,mauId){const don=getDon(donId);if(!don||!mauId)return;const mau=getMau(mauId);if(!mau)return;
  don.mauId=mauId;don.snapshotCD=_snapMau(mau);ghiDoanhThuNguoc(don);Store.save();modalNhapNguoc(donId);toast('Đã gán mẫu.');}

/* ---- công thợ (sinh phiếu giao để có năng suất + giá vốn thật) ---- */
function themCongNguoc({donId,thoId,cds,sl,daTra}){
  const don=getDon(donId);if(!don)throw new Error('Không thấy đơn.');
  if(!don.snapshotCD.length)throw new Error('Đơn chưa gán mẫu — không nhập công đoạn được.');
  cds=(cds||[]).filter(i=>don.snapshotCD[i]);if(!cds.length)throw new Error('Chọn ít nhất 1 công đoạn.');
  const tho=getTho(thoId);if(!tho||tho.isOwner)throw new Error('Chọn thợ (không phải chủ xưởng).');
  sl=Math.round(+sl||0);if(sl<=0)throw new Error('Nhập số cái.');
  const tien=sl*_cdGia(don,cds);if(tien<=0)throw new Error('Công đoạn chưa có đơn giá.');
  const pg={id:uid(),donId,thoId,cds:cds.slice(),giao:{'Tổng':sl},
    dongNhan:[{ngay:don.ngay,dat:{'Tổng':sl},phe:{},cds:cds.slice()}],
    trangThai:'DONG',ngay:don.ngay,hut:0,lyDoHut:null,thoTra:0,nhapNguoc:true,daTra:!!daTra};
  DB.phieuGiao.push(pg);
  beginOp();
  ghi('Công thợ (nhập ngược · '+tho.ten+')',[
    {tk:TK.GIA_VON,chieu:'NO',soTien:tien,donId,thoId,loai:'LICH_SU',nguocCong:pg.id},
    {tk:TK.PHAI_TRA_THO,chieu:'CO',soTien:tien,thoId,nguocCong:pg.id}],{nguocDon:donId,nguocCong:pg.id});
  if(daTra)
    ghi('Tất toán công cũ bằng vốn ('+tho.ten+')',[
      {tk:TK.PHAI_TRA_THO,chieu:'NO',soTien:tien,thoId,nguocCong:pg.id},
      {tk:TK.VON,chieu:'CO',soTien:tien,nguocCong:pg.id}],{nguocDon:donId,nguocCong:pg.id});
  Store.save();
}
function xoaCongNguoc(pgId){const pg=DB.phieuGiao.find(p=>p.id===pgId);if(!pg)return;const donId=pg.donId;
  DB.butToan.filter(bt=>!bt.dao_cua&&!bt.daDao&&bt.nguocCong===pgId).slice().forEach(bt=>daoButToan(bt.id,'xóa công nhập ngược'));
  DB.phieuGiao=DB.phieuGiao.filter(p=>p.id!==pgId);Store.save();modalNhapNguoc(donId);toast('Đã xóa dòng công.');}

/* ---- chi phí (mặc định đã trả → đối ứng vốn) ---- */
function themChiPhiNguoc({donId,tien,moTa,tuVon}){
  tien=Math.round(+tien||0);if(tien<=0)throw new Error('Nhập số tiền chi phí.');
  beginOp();
  ghi('Chi phí (nhập ngược): '+(moTa||'chi phí'),[
    {tk:TK.GIA_VON,chieu:'NO',soTien:tien,donId,loai:'CHENH_LECH',psXong:true,nguocCP:true,dienGiai:(moTa||'')},
    (tuVon?{tk:TK.VON,chieu:'CO',soTien:tien}:{tk:TK.QUY,chieu:'CO',soTien:tien,quy:'chi'})
  ],{nguocDon:donId});
  Store.save();
}
/* chi phí CHUNG cả lô nhập ngược: chia theo tiền công từng mẫu (không công → theo số cái) */
function themChiPhiLoNguoc({maLo,tien,moTa,tuVon}){
  tien=Math.round(+tien||0);if(tien<=0)throw new Error('Nhập số tiền chi phí lô.');
  const dons=donsNguocLo(maLo);if(!dons.length)throw new Error('Lô không có đơn.');
  let base=dons.map(d=>{const g=laiDon(d);return g.congTho+g.congMinh;});let tot=sum(base);
  if(tot<=0){base=dons.map(d=>slNguoc(d));tot=sum(base);}
  if(tot<=0){base=dons.map(()=>1);tot=dons.length;}
  const raw=base.map(b=>tien*b/tot);const part=raw.map(x=>Math.floor(x));let rem=tien-sum(part);
  const ord=raw.map((x,i)=>({i,f:x-Math.floor(x)})).sort((a,b)=>b.f-a.f);
  for(let k=0;k<rem;k++)part[ord[k%ord.length].i]++;
  dons.forEach((d,i)=>{if(part[i]>0)themChiPhiNguoc({donId:d.id,tien:part[i],moTa:'[Lô '+maLo+'] '+(moTa||'ship/phụ liệu'),tuVon});});
}
function chiPhiNguocList(donId){return DB.butToan.filter(bt=>!bt.dao_cua&&!bt.daDao&&bt.nguocDon===donId&&bt.dong.some(d=>d.nguocCP));}
function xoaChiPhiNguoc(btId){const bt=DB.butToan.find(x=>x.id===btId);if(!bt)return;const dl=bt.dong.find(d=>d.donId);const donId=dl?dl.donId:null;
  daoButToan(btId,'xóa chi phí nhập ngược');Store.save();if(donId)modalNhapNguoc(donId);toast('Đã xóa chi phí.');}

/* ---- xóa cả đơn nhập ngược ---- */
function confirmXoaDonNguoc(donId){const don=getDon(donId);if(!don)return;
  xacNhan('Xóa đơn cũ này khỏi sổ?\nĐảo hết doanh thu / công / chi phí đã nhập cho nó. Không hoàn lại được.',
    ()=>xoaDonNguoc(donId),{ok:'Xóa',nguyHiem:true,title:'Xóa đơn cũ'});}
function xoaDonNguoc(donId){
  if(_thuTrenDon(donId)>0){toast('Đơn đã thu tiền — thu lại/hoàn trước khi xóa.',true);return;}
  DB.butToan.filter(bt=>!bt.dao_cua&&!bt.daDao&&bt.nguocDon===donId).slice().forEach(bt=>daoButToan(bt.id,'xóa đơn nhập ngược'));
  DB.phieuGiao=DB.phieuGiao.filter(p=>p.donId!==donId);
  DB.don=DB.don.filter(d=>d.id!==donId);
  Store.save();closeSheet();render();toast('Đã xóa đơn cũ.');
}

/* ---- màn TẠO đơn nhập ngược ---- */
function nnMauFill(){const sel=el('nn_mau');if(!sel)return;const c=getChu((el('nn_chu')||{}).value||'');const mau=(c&&c.mau)||[];
  sel.innerHTML='<option value="">— Không chọn mẫu —</option>'+mau.map(m=>`<option value="${m.id}">${escHtml(m.ten)}</option>`).join('');}
function modalTaoNguoc(chuId,maLo){
  const chuOpts=DB.chuHang.map(c=>`<option value="${c.id}">${escHtml(c.ten)}</option>`).join('');
  openSheet(maLo?'Thêm mẫu vào lô cũ':'Đơn cũ đã xong (nhập ngược)',`
  <div class="hint" style="margin-top:0;margin-bottom:12px">Tạo đơn <b>đã xong</b> để lấy dữ liệu. Điền bao nhiêu cũng được — bổ sung thợ, chi phí sau.</div>
  <div class="field"><label>Chủ hàng</label><select id="nn_chu" ${maLo?'disabled':''} onchange="nnMauFill()">${chuOpts}</select></div>
  <div class="field"><label>Mẫu <span style="font-weight:500;color:var(--ink-3)">(không bắt buộc — có mẫu mới nhập được công đoạn thợ)</span></label>
    <select id="nn_mau"><option value="">— Không chọn mẫu —</option></select></div>
  <div class="field"><label>Số lượng (cái) <span style="font-weight:500;color:var(--ink-3)">— để trống cũng được</span></label>
    <input type="text" inputmode="numeric" id="nn_sl" value="" placeholder="0" oninput="this.value=sepStr(this.value)" onfocus="this.select()"></div>
  <div class="field"><label>Đơn giá / cái <span style="font-weight:500;color:var(--ink-3)">— để trống cũng được</span></label>
    <input type="text" inputmode="numeric" id="nn_dg" value="" placeholder="0" oninput="this.value=sepStr(this.value)" onfocus="this.select()"></div>
  <div class="field"><label>Ngày</label><input type="date" id="nn_ngay" value="${nnToday()}" max="${nnToday()}"></div>
  <button class="btn btn-primary" onclick="submitTaoNguoc('${maLo||''}','${chuId||''}')">Tạo đơn rồi nhập tiếp →</button>`);
  const c=el('nn_chu');if(c&&chuId)c.value=chuId;
  nnMauFill();
}
function submitTaoNguoc(maLo,chuIdLock){try{
  const chuId=maLo?chuIdLock:((el('nn_chu')||{}).value||'');if(!chuId)return toast('Chọn chủ hàng.',true);
  const mauId=(el('nn_mau')||{}).value||'';
  const sl=numVal('nn_sl'),dg=numVal('nn_dg');
  const dstr=(el('nn_ngay')||{}).value||'';const ngay=dstr?kmTs(dstr):now();
  const ml=maLo||nextMaLo();
  const don=taoDonNhapNguoc({chuHangId:chuId,mauId:mauId||null,sl,donGia:dg,maLo:ml,ma:ml,ngay});
  modalNhapNguoc(don.id);toast('Đã tạo đơn cũ. Nhập tiếp thợ / chi phí bên dưới.');
}catch(e){toast(e.message,true)}}

/* ---- màn NHẬP TIẾP (editor) ---- */
function modalNhapNguoc(donId){const don=getDon(donId);if(!don){toast('Không thấy đơn.',true);return;}
  const chu=getChu(don.chuHangId);const mau=getMau(don.mauId);const maLo=don.maLo||don.ma;
  const sib=donsNguocLo(maLo);const l=laiDon(don);
  const laiLoTong=sib.reduce((a,d)=>a+laiDon(d).lai,0);
  const thoOpts=DB.tho.filter(t=>!t.isOwner).map(t=>`<option value="${t.id}">${escHtml(t.ten)}</option>`).join('');
  const mauChuOpts=(chu.mau||[]).map(m=>`<option value="${m.id}">${escHtml(m.ten)}</option>`).join('');
  let h='';
  /* Lô strip */
  h+=`<div class="section-h" style="margin-top:2px">Lô ${maLo} · ${escHtml(chu.ten)} (${sib.length} mẫu)</div>`;
  h+=`<div class="card card-pad">`;
  h+=sib.map(d=>{const cur=d.id===don.id;const nm=(getMau(d.mauId)||{}).ten||d.ma;const dl=laiDon(d);
    return `<div class="kv" style="cursor:pointer" onclick="modalNhapNguoc('${d.id}')">
      <div class="k" style="font-weight:${cur?800:600};color:${cur?'var(--cloth)':'var(--ink)'}">${cur?'▸ ':''}${nm}</div>
      <div class="v ${dl.lai>=0?'money-pos':'money-neg'}">lãi ${fmtShort(dl.lai)}</div></div>`;}).join('');
  h+=`<div class="kv"><div class="k" style="font-weight:800">Lãi ròng cả lô</div><div class="v big-num ${laiLoTong>=0?'money-pos':'money-neg'}">${fmt(laiLoTong)}</div></div>`;
  h+=`</div>`;
  h+=`<button class="btn btn-ghost btn-sm" style="width:100%;margin-bottom:14px" onclick="modalTaoNguoc('${don.chuHangId}','${maLo}')">＋ Thêm mẫu vào lô này</button>`;

  /* Đang sửa mẫu nào */
  h+=`<div class="section-h">Mẫu đang nhập: ${escHtml(mau?mau.ten:'(chưa gán mẫu)')}</div>`;
  h+=`<div class="card card-pad">`;
  /* Doanh thu */
  const thu=_thuTrenDon(donId)>0;
  h+=`<div class="nv-row"><div class="nv-lbl">Doanh thu</div>
    <div class="nv-ins">
      <div class="nv-in"><span>SL</span><input type="text" inputmode="numeric" id="nn_e_sl" value="${slNguoc(don)?sepStr(''+slNguoc(don)):''}" placeholder="0" oninput="this.value=sepStr(this.value)" onfocus="this.select()" ${thu?'disabled':''}></div>
      <div class="nv-in"><span>giá</span><input type="text" inputmode="numeric" id="nn_e_dg" value="${don.giaGiaCong?sepStr(''+don.giaGiaCong):''}" placeholder="0" oninput="this.value=sepStr(this.value)" onfocus="this.select()" ${thu?'disabled':''}></div>
    </div>
    ${thu?`<div class="hint" style="margin-top:8px">Đã thu tiền đơn này nên khóa sửa doanh thu.</div>`:`<button class="btn btn-sage btn-sm" style="width:100%;margin-top:10px" onclick="luuDoanhThuNguoc('${donId}')">Lưu doanh thu (${fmt(l.doanhThu)})</button>`}
  </div>`;
  h+=`</div>`;

  /* Công thợ */
  h+=`<div class="section-h">Công thợ · công đoạn</div><div class="card">`;
  const congs=DB.phieuGiao.filter(p=>p.donId===donId&&p.nhapNguoc);
  h+=congs.length?congs.map(p=>{const t=getTho(p.thoId)||{ten:'—'};const tenCD=(p.cds||[]).map(i=>(don.snapshotCD[i]||{}).ten).filter(Boolean).join(', ');
    const tien=congPhieu(p);const sl=pDat(p);
    return `<div class="slip"><div><div class="who">${escHtml(t.ten)} <span style="font-weight:600;font-size:11px;color:${p.daTra?'var(--sage)':'var(--thread)'}">· ${p.daTra?'đã trả':'còn nợ'}</span></div>
      <div class="meta">${tenCD||'—'} · ${sl} cái</div></div>
      <div class="slip-right"><div style="font-weight:700">${fmtShort(tien)}</div>
        <button class="mini-btn" style="margin-top:3px" onclick="xoaCongNguoc('${p.id}')">Xóa</button></div></div>`;}).join(''):`<div class="divider-note" style="padding:14px">Chưa có công thợ.</div>`;
  h+=`</div>`;
  if(!don.snapshotCD.length){
    h+=`<div class="card card-pad" style="margin-bottom:14px"><div class="field" style="margin:0"><label>Gán mẫu để nhập công đoạn</label>
      <select onchange="if(this.value)ganMauNguoc('${donId}',this.value)"><option value="">— Chọn mẫu của ${escHtml(chu.ten)} —</option>${mauChuOpts}</select></div></div>`;
  } else {
    h+=`<div class="card card-pad" style="margin-bottom:14px">
      <div class="field"><label>Thợ</label><select id="nn_c_tho"><option value="">— Chọn thợ —</option>${thoOpts}</select></div>
      <div class="field"><label>Công đoạn thợ này làm</label><div class="chipset" id="nn_c_cds">
        ${don.snapshotCD.map((c,i)=>`<label class="chip" style="cursor:pointer"><input type="checkbox" id="nncd_${i}" style="display:none" onchange="this.closest('.chip').classList.toggle('sel',this.checked)"> ${escHtml(c.ten)} <small>${fmt(c.donGia)}</small></label>`).join('')}</div></div>
      <div class="field"><label>Số cái</label><input type="text" inputmode="numeric" id="nn_c_sl" value="${slNguoc(don)?sepStr(''+slNguoc(don)):''}" placeholder="0" oninput="this.value=sepStr(this.value)" onfocus="this.select()"></div>
      <div class="field" style="margin-bottom:10px"><label style="display:flex;align-items:center;gap:9px;cursor:pointer;margin:0"><input type="checkbox" id="nn_c_datra" checked style="width:20px;height:20px"><span>Đã trả lương cho thợ này rồi (không tính vào nợ lương, không đụng két)</span></label></div>
      <button class="btn btn-primary btn-sm" style="width:100%" onclick="ngAddCong('${donId}')">＋ Thêm dòng công</button></div>`;
  }

  /* Chi phí */
  h+=`<div class="section-h">Chi phí thêm (ship, phụ liệu, đền…)</div><div class="card">`;
  const cps=chiPhiNguocList(donId);
  h+=cps.length?cps.map(bt=>{const d=bt.dong.find(x=>x.nguocCP)||{};const tuVon=bt.dong.some(x=>x.tk===TK.VON&&x.chieu==='CO');
    return `<div class="slip"><div><div class="who">${d.dienGiai||'Chi phí'}</div><div class="meta">${tuVon?'đã trả (từ trước)':'trả từ két'}</div></div>
      <div class="slip-right"><div style="font-weight:700">${fmtShort(d.soTien)}</div>
        <button class="mini-btn" style="margin-top:3px" onclick="xoaChiPhiNguoc('${bt.id}')">Xóa</button></div></div>`;}).join(''):`<div class="divider-note" style="padding:14px">Chưa có chi phí.</div>`;
  h+=`</div>`;
  h+=`<div class="card card-pad" style="margin-bottom:14px">
    <div class="field"><label>Nội dung</label><input id="nn_p_mota" placeholder="VD: tiền ship, phụ liệu"></div>
    <div class="field"><label>Số tiền</label><input type="text" inputmode="numeric" id="nn_p_tien" value="" placeholder="0" oninput="this.value=sepStr(this.value)" onfocus="this.select()"></div>
    <div class="field" style="margin-bottom:10px"><label style="display:flex;align-items:center;gap:9px;cursor:pointer;margin:0"><input type="checkbox" id="nn_p_datra" checked style="width:20px;height:20px"><span>Đã trả từ trước (không đụng két)</span></label></div>
    <div class="act-grid"><button class="btn btn-primary btn-sm" onclick="ngAddChiPhi('${donId}')">＋ Vào mẫu này</button>
      <button class="btn btn-ghost btn-sm" onclick="ngAddChiPhiLo('${maLo}')">Chia cả lô</button></div></div>`;

  /* Lãi mẫu */
  h+=`<div class="card"><div class="bridge-row head"><div class="bl">Lãi mẫu này</div><div class="bv">${fmt(l.lai)}</div></div>
    <div class="bridge-row"><div class="bl">Doanh thu</div><div class="bv money-pos">${fmt(l.doanhThu)}</div></div>
    <div class="bridge-row"><div class="bl">Giá vốn (công + chi phí)</div><div class="bv money-neg">${fmt(l.giaVon)}</div></div></div>`;
  h+=`<button class="btn btn-danger btn-sm" style="width:100%;margin-top:4px" onclick="confirmXoaDonNguoc('${donId}')">🗑 Xóa đơn cũ này</button>`;

  openSheet('Đơn cũ · '+(mau?mau.ten:chu.ten),h);
}
function ngAddCong(donId){try{const don=getDon(donId);
  const thoId=(el('nn_c_tho')||{}).value||'';if(!thoId)return toast('Chọn thợ.',true);
  const cds=[];don.snapshotCD.forEach((c,i)=>{const cb=el('nncd_'+i);if(cb&&cb.checked)cds.push(i);});
  themCongNguoc({donId,thoId,cds,sl:numVal('nn_c_sl'),daTra:(el('nn_c_datra')||{}).checked});
  modalNhapNguoc(donId);toast('Đã thêm công thợ.');
}catch(e){toast(e.message,true)}}
function ngAddChiPhi(donId){try{themChiPhiNguoc({donId,tien:numVal('nn_p_tien'),moTa:((el('nn_p_mota')||{}).value||'').trim(),tuVon:(el('nn_p_datra')||{}).checked});
  modalNhapNguoc(donId);toast('Đã thêm chi phí.');}catch(e){toast(e.message,true)}}
function ngAddChiPhiLo(maLo){try{themChiPhiLoNguoc({maLo,tien:numVal('nn_p_tien'),moTa:((el('nn_p_mota')||{}).value||'').trim(),tuVon:(el('nn_p_datra')||{}).checked});
  const first=donsNguocLo(maLo)[0];modalNhapNguoc(first?first.id:'');toast('Đã chia chi phí cả lô.');}catch(e){toast(e.message,true)}}
/* ================= HẾT NHẬP NGƯỢC ================= */


boot();

</script>
