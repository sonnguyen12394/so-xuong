  const pts=series.map((v,i)=>[X(i),Y(v),v]);
  out+=`<defs><clipPath id="${idP}"><rect x="0" y="0" width="${W}" height="${zeroY.toFixed(1)}"/></clipPath>`+
       `<clipPath id="${idN}"><rect x="0" y="${zeroY.toFixed(1)}" width="${W}" height="${(H-zeroY).toFixed(1)}"/></clipPath></defs>`;
  const polyArea=`<polygon points="${padX.toFixed(1)},${zeroY.toFixed(1)} ${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')} ${(W-padX).toFixed(1)},${zeroY.toFixed(1)}"`;
  out+=`${polyArea} fill="${posC}" opacity="0.13" clip-path="url(#${idP})"/>`;
  out+=`${polyArea} fill="${negC}" opacity="0.13" clip-path="url(#${idN})"/>`;
  // đường chính (2 lớp: xanh phần trên 0, đỏ phần dưới 0)
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  out+=`<path d="${line}" fill="none" stroke="${posC}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#${idP})"/>`;
  out+=`<path d="${line}" fill="none" stroke="${negC}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#${idN})"/>`;
  // chấm điểm cuối
  const last=pts[pts.length-1];if(last){out+=`<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="${last[2]>=0?posC:negC}"/>`;
    if(opts.showVal)out+=`<text x="${Math.min(last[0],W-padX-2).toFixed(1)}" y="${(last[1]-7).toFixed(1)}" font-size="9" text-anchor="end" fill="#5B6676" font-weight="700">${fmtShort(last[2])}</text>`;}
  // overlay
  if(ov){const op=ov.vals.map((v,i)=>[X(i),Y(v)]);
    const ol=op.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    out+=`<path d="${ol}" fill="none" stroke="${ov.color||'#B8862F'}" stroke-width="2" stroke-dasharray="4 3" stroke-linejoin="round"/>`;
    const lo=op[op.length-1];if(lo){out+=`<circle cx="${lo[0].toFixed(1)}" cy="${lo[1].toFixed(1)}" r="3" fill="${ov.color||'#B8862F'}"/>`;}}
  // nhãn trục X (thưa cho đỡ chật)
  const step=Math.ceil(n/6);
  labels.forEach((lb,i)=>{if(lb==='')return;if(i%step!==0&&i!==n-1)return;
    out+=`<text x="${X(i).toFixed(1)}" y="${H-6}" font-size="10" text-anchor="middle" fill="#8A94A3">${lb}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">${out}</svg>`;}

/* ---- biểu đồ TRÒN (donut) cho cơ cấu phần-trên-tổng ----
   parts:[{v,color,name}] (v ≥ 0). center: nhãn giữa (vd tổng). Trả '' nếu tổng=0. */
function svgDonut(parts,opts){opts=opts||{};parts=parts.filter(p=>p.v>0);
  const tot=parts.reduce((s,p)=>s+p.v,0);if(tot<=0)return '';
  const S=132,cx=S/2,cy=S/2,r=52,rin=32;let a0=-Math.PI/2,out='';
  const pol=(r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];
  parts.forEach(p=>{const a1=a0+p.v/tot*2*Math.PI;const big=(a1-a0)>Math.PI?1:0;
    const[x0,y0]=pol(r,a0),[x1,y1]=pol(r,a1),[x2,y2]=pol(rin,a1),[x3,y3]=pol(rin,a0);
    out+=`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${big} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)} A${rin} ${rin} 0 ${big} 0 ${x3.toFixed(1)} ${y3.toFixed(1)} Z" fill="${p.color}"/>`;
    a0=a1;});
  const cLbl=opts.center!=null?`<text x="${cx}" y="${cy-2}" font-size="10" text-anchor="middle" fill="#8A94A3">${opts.centerTop||'Tổng'}</text><text x="${cx}" y="${cy+13}" font-size="13" text-anchor="middle" font-weight="800" fill="#3A4453">${opts.center}</text>`:'';
  const svg=`<svg viewBox="0 0 ${S} ${S}" width="128" height="128" style="display:block;flex:0 0 auto">${out}${cLbl}</svg>`;
  const legend=`<div style="display:flex;flex-direction:column;gap:7px;flex:1;min-width:0">`+
    parts.map(p=>`<div style="display:flex;align-items:center;gap:7px;font-size:12px">
      <span style="width:11px;height:11px;border-radius:3px;background:${p.color};flex:0 0 auto"></span>
      <span style="color:var(--ink-2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</span>
      <b style="color:var(--ink-1)">${fmtShort(p.v)}</b>
      <span style="color:var(--ink-3);width:34px;text-align:right">${Math.round(p.v/tot*100)}%</span></div>`).join('')+`</div>`;
  return `<div style="display:flex;align-items:center;gap:14px">${svg}${legend}</div>`;}

/* ===========================================================
   KỲ THỜI GIAN DÙNG CHUNG — 1 kiểu duy nhất cho mọi màn:
   Ngày · Tuần · Tháng · Tất cả  + nút ‹ › lùi/tới kỳ.
   perRange: {from,to,label,atNow}. perBar: thanh chọn kỳ.
   =========================================================== */
let perTuy={from:null,to:null};   /* khoảng ngày tùy chọn dùng chung cho chế độ 'tuy' */
function perRange(mode,ref){
  const A=new Date(ref||now());const p=n=>String(n).padStart(2,'0');
  if(mode==='all')return {from:-Infinity,to:Infinity,label:'Từ trước tới nay',atNow:true};
  if(mode==='tuy'){if(perTuy.from==null||perTuy.to==null)return {from:-Infinity,to:Infinity,label:'Chọn ngày…',atNow:true};
    const a=new Date(perTuy.from).toLocaleDateString('vi-VN'),b=new Date(perTuy.to).toLocaleDateString('vi-VN');
    return {from:perTuy.from,to:perTuy.to,label:(a===b?a:a+' → '+b),atNow:true};}
  if(mode==='ngay'){const s=new Date(A);s.setHours(0,0,0,0);const e=new Date(s);e.setDate(e.getDate()+1);
    const wd=s.toLocaleDateString('vi-VN',{weekday:'long'});
    return {from:s.getTime(),to:e.getTime()-1,label:wd.charAt(0).toUpperCase()+wd.slice(1)+', '+s.toLocaleDateString('vi-VN'),atNow:sameDay(s.getTime(),now())};}
  if(mode==='tuan'){const s=new Date(A);s.setHours(0,0,0,0);const g=(s.getDay()+6)%7;s.setDate(s.getDate()-g);
    const e=new Date(s);e.setDate(e.getDate()+7);const eS=new Date(e.getTime()-1);
    return {from:s.getTime(),to:e.getTime()-1,label:'Tuần '+p(s.getDate())+'/'+p(s.getMonth()+1)+' – '+p(eS.getDate())+'/'+p(eS.getMonth()+1)+'/'+eS.getFullYear(),atNow:weekKey(s.getTime())===weekKey(now())};}
  const s=new Date(A.getFullYear(),A.getMonth(),1);const e=new Date(A.getFullYear(),A.getMonth()+1,1);const N=new Date(now());
  return {from:s.getTime(),to:e.getTime()-1,label:'Tháng '+(s.getMonth()+1)+'/'+s.getFullYear(),atNow:(s.getFullYear()===N.getFullYear()&&s.getMonth()===N.getMonth())};
}
function perNav(mode,ref,dir){const A=new Date(ref||now());
  if(mode==='ngay')A.setDate(A.getDate()+dir);else if(mode==='tuan')A.setDate(A.getDate()+dir*7);else if(mode==='thang')A.setMonth(A.getMonth()+dir);
  return A.getTime();}
function perBar(mode,ref,setFn,navFn,extra){extra=extra||'';
  const P=perRange(mode,ref);
  const B=[['ngay','Ngày'],['tuan','Tuần'],['thang','Tháng'],['tuy','Chọn ngày']];
  let h=`<div class="tabs">`+B.map(([k,l])=>{const oc=k==='tuy'?`perPick(function(){${setFn}('tuy'${extra})})`:`${setFn}('${k}'${extra})`;return `<button class="${mode===k?'on':''}" onclick="${oc}">${l}</button>`;}).join('')+`</div>`;
  if(mode!=='all'&&mode!=='tuy')h+=`<div style="display:flex;align-items:center;gap:8px;margin:2px 0 12px">
    <button class="btn btn-ghost" style="flex:0 0 auto;width:44px;padding:9px 0;font-size:18px;line-height:1" onclick="${navFn}(-1${extra})">‹</button>
    <div style="flex:1;text-align:center;font-weight:800;font-size:14.5px">${P.label}</div>
    <button class="btn btn-ghost" style="flex:0 0 auto;width:44px;padding:9px 0;font-size:18px;line-height:1;${P.atNow?'opacity:.35;pointer-events:none':''}" onclick="${navFn}(1${extra})">›</button></div>`;
  return h;}
/* Chọn khoảng ngày tùy ý — thay cho 'Tất cả'. Lưu ở perTuy, áp cho mọi màn đang ở chế độ 'tuy'. */
function _perEarliest(){let m=now();(DB.butToan||[]).forEach(b=>{if(b&&b.thoiDiem&&b.thoiDiem<m)m=b.thoiDiem;});
  (DB.phieuGiao||[]).forEach(p=>(p.dongNhan||[]).forEach(x=>{if(x&&x.ngay&&x.ngay<m)m=x.ngay;}));return m;}
function perPick(applyFn){window.__perApply=applyFn||null;
  const f0=perTuy.from!=null?dayKey(perTuy.from):dayKey(_perEarliest());
  const t0=perTuy.to!=null?dayKey(perTuy.to):dayKey(now());const mx=dayKey(now());
  const inSt='width:100%;box-sizing:border-box;padding:11px;border:1.5px solid var(--line);border-radius:11px;font-size:16px;background:var(--card)';
  let o=el('per_ovl');if(!o){o=document.createElement('div');o.id='per_ovl';o.className='scrim';o.style.zIndex='3000';o.style.alignItems='center';document.body.appendChild(o);}
  o.innerHTML=`<div class="confirmbox" style="transform:none">
    <div class="sheet-h"><b>📅 Chọn khoảng ngày</b><button class="sheet-x" onclick="_perClose()">✕</button></div>
    <div class="sheet-body">
      <div class="field"><label>Từ ngày</label><input type="date" id="per_from" value="${f0}" max="${mx}" style="${inSt}"></div>
      <div class="field"><label>Đến ngày</label><input type="date" id="per_to" value="${t0}" max="${mx}" style="${inSt}"></div>
      <div id="per_err" class="hint" style="color:var(--thread);min-height:16px;margin:2px 0 8px"></div>
      <div class="act-grid"><button class="btn btn-ghost" onclick="_perClose()">Thôi</button>
        <button class="btn btn-primary" onclick="_perOk()">Xem</button></div>
    </div></div>`;
  o.classList.add('on');o.style.display='flex';}
function _perClose(){const o=el('per_ovl');if(o){o.classList.remove('on');o.style.display='none';o.innerHTML='';}window.__perApply=null;}
function _perOk(){const fv=(el('per_from')||{}).value,tv=(el('per_to')||{}).value;
  if(!fv||!tv){const e=el('per_err');if(e)e.textContent='Chọn cả hai ngày.';return;}
  let from=new Date(fv+'T00:00:00').getTime(),to=new Date(tv+'T23:59:59.999').getTime();
  if(from>to){const x=from;from=to;to=x;}
  perTuy={from,to};const f=window.__perApply;_perClose();if(f)setTimeout(f,10);}
/* Dải ngày rõ ràng "dd/mm/yyyy → dd/mm/yyyy" cho một kỳ (dùng gắn vào khối thu/chi) */
function perRangeText(P){
  if(!P||!isFinite(P.from)||!isFinite(P.to))return 'từ trước tới nay';
  const a=new Date(P.from).toLocaleDateString('vi-VN'),b=new Date(P.to).toLocaleDateString('vi-VN');
  return a===b?a:(a+' → '+b);}
/* Chia [from,to] thành cột hợp lý: ≤8 ngày→theo ngày · ≤45 ngày→theo tuần · còn lại→theo tháng · 'Tất cả'→12 tháng gần nhất */
function perBuckets(from,to){const DAY=86400000;
  if(!isFinite(from)||!isFinite(to)){const keys=thangGanDay(12);return {keys,keyFn:ymKey,labels:keys.map(ymLabel)};}
  const span=to-from;
  if(span<=8*DAY){const keys=[];const d=new Date(from);d.setHours(0,0,0,0);
    while(d.getTime()<=to){keys.push(dayKey(d.getTime()));d.setDate(d.getDate()+1);}return {keys,keyFn:dayKey,labels:keys.map(dayLabel)};}
  if(span<=45*DAY){const keys=[];const d=new Date(from);d.setHours(0,0,0,0);const g=(d.getDay()+6)%7;d.setDate(d.getDate()-g);
    while(d.getTime()<=to){keys.push(weekKey(d.getTime()));d.setDate(d.getDate()+7);}return {keys,keyFn:weekKey,labels:keys.map(weekLabel)};}
  const keys=[];const d=new Date(new Date(from).getFullYear(),new Date(from).getMonth(),1);
  while(d.getTime()<=to){keys.push(ymKey(d.getTime()));d.setMonth(d.getMonth()+1);}return {keys,keyFn:ymKey,labels:keys.map(ymLabel)};}
/* Gộp theo TUẦN TRONG THÁNG cho biểu đồ tháng: Tuần 1 = ngày 1–7, Tuần 2 = 8–14, … Tuần 5 = 29–cuối.
   Trả {keys,keyFn,labels} để miniThuChi dùng thay perBuckets. */
function monthWeekBuckets(refTs){
  const d=new Date(refTs);const y=d.getFullYear(),mo=d.getMonth();
  const last=new Date(y,mo+1,0).getDate();
  const keys=[],labels=[];
  for(let i=0;i<5;i++){const startDay=1+i*7;if(startDay>last)break;keys.push('W'+(i+1));labels.push('Tuần '+(i+1));}
  const keyFn=t=>{const dd=new Date(t).getDate();return 'W'+(Math.min(4,Math.floor((dd-1)/7))+1);};
  return {keys,keyFn,labels};
}
/* events:[{t,thu,chi}] → thẻ biểu đồ cột Thu(xanh)/Chi(đỏ). '' nếu rỗng. */
let chartOff={};   /* trang biểu đồ theo id, cho chế độ Chọn ngày */
function chartPg(id,dir){chartOff[id]=Math.max(0,(chartOff[id]||0)+dir);}
/* Biểu đồ Chọn ngày: mỗi NGÀY có thu/chi = 1 cột, phân trang ‹ › (mặc định trang mới nhất). */
function _miniPaged(from,to,events,opts){
  const id=opts.pager.id, re=opts.pager.reCall||'render()', PP=opts.pager.size||10;
  const dmap={};events.forEach(e=>{if(e.t<from||e.t>to)return;const k=dayKey(e.t);if(!dmap[k])dmap[k]={thu:0,chi:0};dmap[k].thu+=e.thu||0;dmap[k].chi+=e.chi||0;});
  const allKeys=Object.keys(dmap).filter(k=>dmap[k].thu!==0||dmap[k].chi!==0).sort();
  if(!allKeys.length)return `<div class="card"><div class="card-pad"><div class="hint" style="text-align:center;padding:16px 0;margin:0">📊 Kỳ này chưa có thu/chi để vẽ biểu đồ.</div></div></div>`;
  const pages=Math.ceil(allKeys.length/PP);
  let pg=(id in chartOff)?Math.min(Math.max(0,chartOff[id]),pages-1):(pages-1);chartOff[id]=pg;
  const winKeys=allKeys.slice(pg*PP,pg*PP+PP);
  const labels=winKeys.map(dayLabel);
  const groups=winKeys.map(k=>[{v:Math.abs(dmap[k].thu),color:'#2F7A63'},{v:Math.abs(dmap[k].chi),color:'#C0392B'}]);
  let nav='';
  if(pages>1){const atS=pg<=0,atE=pg>=pages-1;
    nav=`<div style="display:flex;align-items:center;gap:8px;margin-top:10px">
      <button class="btn btn-ghost" style="flex:0 0 auto;width:44px;padding:8px 0;font-size:18px;line-height:1;${atS?'opacity:.35;pointer-events:none':''}" onclick="chartPg('${id}',-1);${re}">‹</button>
      <div style="flex:1;text-align:center;font-size:12px;color:var(--ink-3)">${dayLabel(winKeys[0])} – ${dayLabel(winKeys[winKeys.length-1])} · trang ${pg+1}/${pages}</div>
      <button class="btn btn-ghost" style="flex:0 0 auto;width:44px;padding:8px 0;font-size:18px;line-height:1;${atE?'opacity:.35;pointer-events:none':''}" onclick="chartPg('${id}',1);${re}">›</button></div>`;}
  return `<div class="card"><div class="card-pad">${svgChart(labels,groups,{h:150})}${chartLegend([{name:opts.thuLbl||'Tiền vào',color:'#2F7A63'},{name:opts.chiLbl||'Tiền ra',color:'#C0392B'}])}${nav}</div></div>`;}
function miniThuChi(from,to,events,opts){opts=opts||{};
  if(opts.pager&&isFinite(from)&&isFinite(to))return _miniPaged(from,to,events,opts);
  const {keys,keyFn,labels}=opts.buckets||perBuckets(from,to);
  const thu={},chi={};keys.forEach(k=>{thu[k]=0;chi[k]=0;});
  events.forEach(e=>{const k=keyFn(e.t);if(!(k in thu))return;thu[k]+=e.thu||0;chi[k]+=e.chi||0;});
  const aThu=keys.map(k=>thu[k]),aChi=keys.map(k=>chi[k]);
  if(sum(aThu)===0&&sum(aChi)===0)return `<div class="card"><div class="card-pad"><div class="hint" style="text-align:center;padding:16px 0;margin:0">📊 Kỳ này chưa có thu/chi để vẽ biểu đồ.</div></div></div>`;
  const groups=labels.map((_,i)=>[{v:Math.abs(aThu[i]),color:'#2F7A63'},{v:Math.abs(aChi[i]),color:'#C0392B'}]);
  return `<div class="card"><div class="card-pad">${svgChart(labels,groups,{h:150})}${chartLegend([{name:opts.thuLbl||'Tiền vào',color:'#2F7A63'},{name:opts.chiLbl||'Tiền ra',color:'#C0392B'}])}</div></div>`;}
/* lương xưởng ĐÃ TRẢ cho thợ trong [from,to] — bản có mốc, cho Sổ riêng phân kỳ */
function luongXuongThoRange(thoId,from,to){const t=getTho(thoId);if(!t||t.isOwner)return 0;let s=0;

/* ===========================================================

  {const nn=nhanNhanhCount();if(nhanNhanhCoViec())h+=`<button class="btn btn-primary" style="width:100%;margin:2px 0 8px" onclick="moNhanNhanh()">⚡ Nhận nhanh — ${nn>0?nn+' công đoạn đủ điều kiện nhận':'xem công đoạn đang chờ'}</button>`;}
  // (Đã bỏ cụm nút Thu tiền / Chi tiền xưởng / Lịch sử nhập theo yêu cầu)

  // Việc nên làm — hàng bấm mở thẳng modal sẵn có
  const jobs=[];
  if(quaHan.length){const s=quaHan.sort((a,b)=>b.conLai-a.conLai)[0];const chu=getChu(s.chuHangId);
    jobs.push({ic:'💵',t:`Đòi nợ quá hạn: ${escHtml(chu.ten)}`,s:`${fmt(s.conLai)} · gối ${days(s.ngay)} ngày`,cl:`modalThuTien('${s.chuHangId}')`});}
  if(giuLau.length){const g=giuLau[0];const p0=g.list[0];const don0=getDon(p0.donId);
    jobs.push({ic:'🧵',t:`Nhận hàng về: ${escHtml(g.tho.ten)}`,
      s:g.soViec>1?`${g.soViec} việc · ${g.conLai} cái · giữ ${days(g.ngay)} ngày`:`${don0.ma} · ${tenDai(don0,p0)} · giữ ${days(g.ngay)} ngày`,
      cl:g.soViec>1?`modalThoChiTiet('${g.thoId}')`:`modalNhanVe('${p0.id}')`});}
  if(donChoGiao.length){const d=donChoGiao[0];
    jobs.push({ic:'📦',t:`Giao hàng cho chủ: ${d.ma}`,s:`${coTheGiaoTong(d)} cái đã xong · ${escHtml(getChu(d.chuHangId).ten)}`,cl:`modalGiaoTP('${d.id}')`});}
  canhBao.slice(0,2).forEach(d=>{const p=phieuCoHut(d)[0];
    jobs.push({ic:'⚠️',t:`Xử lý hụt: ${d.ma}`,s:`lệch ${Math.abs(p.hut)} cái (${p.lyDoHut||'chưa rõ'})`,cl:`modalDon('${d.id}')`});});
  chamCho.slice(0,1).forEach(d=>{const c=chamChoVe(d)[0];
    jobs.push({ic:'✂️',t:`Cắt châm chờ về: ${d.ma}`,s:`${sum(Object.values(c.sizes))} cái · ${c.lyDo||''}`,cl:`modalDon('${d.id}')`});});

  h+=`<div class="section-h">Việc nên làm</div><div class="card">`;
  h+=jobs.length?jobs.map(j=>`<div class="slip" onclick="${j.cl}"><div style="display:flex;gap:11px;align-items:flex-start">

    :`<div class="empty" style="padding:30px"><div class="ic">✅</div><b>Không có việc gấp</b>Xưởng đang gọn gàng.</div>`;
  h+=`</div>`;

  h+=`<div class="hint" style="text-align:center;margin-top:14px">Lãi & xu hướng theo kỳ xem ở <b>Lãi & Tiền</b> · <b>Biểu đồ</b>.</div>`;
  return h;
}

/* ---------- ĐƠN HÀNG ---------- */
let donSearch='';
let donTab=null; /* null = tự chọn mục đầu có đơn; 'dang'|'xong'|'huy' khi người dùng bấm */
function donKhop(d){if(!donSearch)return true;const q=donSearch.toLowerCase();
  return (d.ma+' '+getChu(d.chuHangId).ten+' '+getMau(d.mauId).ten).toLowerCase().includes(q);}
function viewDon(m){
  const matched=DB.don.filter(d=>!d.nhapNguoc&&donKhop(d));
  const items=loItems(matched);
  const buckets={dang:[],xong:[],huy:[]};
  items.forEach(it=>buckets[itemBucket(it)].push(it));
  /* 2 mục riêng: Đang làm / Đã xong (thêm Đã hủy nếu có) — lô tính là 1 mục */
  const groups=[['dang','Đang làm',buckets.dang],['xong','Đã xong',buckets.xong]];
  if(buckets.huy.length)groups.push(['huy','Đã hủy',buckets.huy]);
  let eff=donTab;
  if(!eff||!groups.some(g=>g[0]===eff))eff=(groups.find(g=>g[2].length)||groups[0])[0];
  const cur=groups.find(g=>g[0]===eff);
  const sub=eff==='dang'?'Hàng đang làm ở xưởng':eff==='xong'?'Đơn đã giao xong':'Đơn đã hủy';
  let h=`<div class="view-title">Đơn hàng<small>${sub}</small></div>`;
  if(DB.don.length>3||donSearch)h+=`<div class="field" style="margin-bottom:12px"><input id="don_q" placeholder="🔎 Tìm mã đơn, chủ hàng, mẫu..." value="${donSearch}" oninput="donSearch=this.value;const p=this.selectionStart;viewDon(document.getElementById('main'));const e=document.getElementById('don_q');if(e){e.focus();e.setSelectionRange(p,p);}"></div>`;
  if(!DB.don.length){h+=`<div class="empty"><div class="ic">🧵</div><b>Chưa có đơn nào</b>Tạo đơn đầu tiên khi nhận hàng cắt về.</div>`;}
  else{
    h+=`<div class="tabs" style="margin-bottom:12px">`+groups.map(([k,t,arr])=>`<button class="${eff===k?'on':''}" onclick="donTab='${k}';viewDon(document.getElementById('main'))">${t} <span style="opacity:.55;font-weight:700">${arr.length}</span></button>`).join('')+`</div>`;
    const list=cur[2];
    if(!list.length){
      const ic=donSearch?'🔎':eff==='dang'?'✅':eff==='xong'?'📭':'🗑️';
      const tt=donSearch?'Không tìm thấy đơn':eff==='dang'?'Không có đơn đang làm':eff==='xong'?'Chưa có đơn nào xong':'Không có đơn hủy';
      const ss=donSearch?'Thử từ khóa khác.':eff==='dang'?'Mọi đơn đã xong hoặc chưa tạo.':'';
      h+=`<div class="empty"><div class="ic">${ic}</div><b>${tt}</b>${ss}</div>`;
    }else h+=list.map(renderItem).join('');
  }
  m.innerHTML=h;
  el('fab').innerHTML=`<button class="btn btn-primary" onclick="modalTaoDon()">＋ Nhận hàng cắt mới</button>`;
}
function donCard(don){
  const chu=getChu(don.chuHangId),mau=getMau(don.mauId);const tong=tongNhan(don);
  const done=don.trangThai==='DA_GIAO_DU',huy=don.trangThai==='DA_HUY',cho=chamChoVe(don).length>0;
  let badge=done?`<span class="badge b-done">✓ Xong</span>`
    :huy?`<span class="badge b-huy">Đã hủy</span>`
    :don.trangThai==='BI_TRA_LAI'?`<span class="badge b-tra">Bị trả lại</span>`
    :cho?`<span class="badge b-cham">Chờ châm</span>`
    :don.trangThai==='DA_GIAO_MOT_PHAN'?`<span class="badge b-part">Giao 1 phần</span>`
    :`<span class="badge b-run">Đang làm</span>`;
  const td=tienDoCD(don);const pct=td.pct;const oDau=cdHienTai(don);const conCD=soCDConViec(don);
  const stages=`<div class="cd-prog${td.tong&&td.xong>=td.tong?' full':''}"><div class="bar"><i style="width:${pct}%"></i></div>
      <span><b>${n0(td.xong)}</b>/${n0(td.tong)} lượt · ${pct}%</span></div>`
    +((oDau&&!done)?`<div class="cd-at">${oDau.cho?'⏳':'👤'} ${oDau.n+1}. ${escHtml(don.snapshotCD[oDau.n].ten)} · <b>${oDau.sl}</b> cái ${oDau.cho?'chờ giao':'thợ đang giữ'}${conCD>1?' · '+conCD+' công đoạn còn việc':''}</div>`:'');
  const giaoDuoc=coTheGiaoTong(don);let foot='';
  if(donCoCanhBao(don)){const p=phieuCoHut(don)[0];
    foot=`<div class="alert-strip as-red">⚠ Phiếu hụt: ${escHtml(getTho(p.thoId).ten)}, lệch ${Math.abs(p.hut)} cái (${p.lyDoHut||'chưa rõ'})</div>`;
  }else if(cho){foot=`<div class="alert-strip as-purple">✂️ Đang chờ ${sum(Object.values(chamChoVe(don)[0].sizes))} cái cắt châm về</div>`;
  }else if(done){const l=laiDon(don);foot=`<div class="alert-strip as-green">💚 Lãi ròng ước tính: ${fmt(l.lai)}</div>`;
  }else if(!huy&&giaoDuoc>0){foot=`<div class="alert-strip as-amber">📦 Có ${giaoDuoc} cái đã xong, giao được cho chủ hàng</div>`;}
  return `<div class="order-card" onclick="modalDon('${don.id}')">
    <div class="oc-head"><div><div class="oc-ma">${don.ma} · ${escHtml(mau.ten)}</div><div class="oc-cust">${escHtml(chu.ten)}</div></div>
      <div class="oc-qty">${badge}<div style="margin-top:5px"><b class="num">${tong}</b> cái</div></div></div>
    ${huy?'':stages}${foot}</div>`;
}
/* Phân loại 1 đơn/1 lô vào tab: đang làm / đã xong / đã hủy. */
function donBucket(d){return d.trangThai==='DA_GIAO_DU'?'xong':d.trangThai==='DA_HUY'?'huy':'dang';}
function loStatus(dons){const live=dons.filter(d=>d.trangThai!=='DA_HUY');
  if(!live.length)return 'huy';
  if(live.every(d=>d.trangThai==='DA_GIAO_DU'))return 'xong';return 'dang';}
/* Gom danh sách đơn thành "mục": đơn lẻ (solo) hoặc lô (1 thẻ đại diện nhiều mẫu).
   Lô lấy trọn các đơn cùng maLo (kể cả đơn không lọt bộ lọc), hiện 1 lần theo lần xuất hiện đầu. */
function loItems(list){const seen={};const items=[];
  for(const d of list){const ml=d.maLo||'';
    if(!ml){items.push({type:'solo',don:d});continue;}
    if(seen[ml])continue;seen[ml]=1;
    items.push({type:'lo',maLo:ml,dons:donCuaLo(ml)});}
  return items;}
function itemBucket(it){return it.type==='solo'?donBucket(it.don):loStatus(it.dons);}
function renderItem(it){return it.type==='solo'?donCard(it.don):loCard(it.maLo,it.dons);}
/* Thẻ LÔ — trông như 1 đơn, bấm vào mở màn trung gian (modalLo) liệt kê các mẫu. */
function loCard(maLo,dons){
  const live=dons.filter(d=>d.trangThai!=='DA_HUY');
  const chu=getChu(dons[0].chuHangId);const st=loStatus(dons);
  const tong=live.reduce((a,d)=>a+tongNhan(d),0);
  let xong=0,tot=0;live.forEach(d=>{const t=tienDoCD(d);xong+=t.xong;tot+=t.tong;});
  const pct=tot?Math.round(xong/tot*100):0;
  const badge=st==='xong'?`<span class="badge b-done">✓ Xong</span>`
    :st==='huy'?`<span class="badge b-huy">Đã hủy</span>`:`<span class="badge b-run">Đang làm</span>`;
  const stages=`<div class="cd-prog${tot&&xong>=tot?' full':''}"><div class="bar"><i style="width:${pct}%"></i></div>
      <span><b>${n0(xong)}</b>/${n0(tot)} lượt · ${pct}%</span></div>`;
  let foot='';
  if(st==='xong'){const ll=laiLo(maLo);foot=`<div class="alert-strip as-green">💚 Lãi ròng cả lô: ${fmt(ll.lai)}</div>`;}
  const lbl=live.length===1?((getMau(live[0].mauId)||{}).ten||'1 mẫu'):(live.length+' mẫu');
  return `<div class="order-card" onclick="modalLo('${maLo}')">
    <div class="oc-head"><div><div class="oc-ma">🧺 Lô ${maLo} · ${lbl}</div><div class="oc-cust">${escHtml(chu.ten)}</div></div>
      <div class="oc-qty">${badge}<div style="margin-top:5px"><b class="num">${tong}</b> cái</div></div></div>
    ${st==='huy'?'':stages}${foot}</div>`;
}

function modalTaoDon(chuId){
  if(!DB.chuHang.length)return toast('Thêm chủ hàng trước đã.',true);
  const chu=chuId?getChu(chuId):DB.chuHang[0];
  tdState={chuId:chu.id,maLo:nextMa(),rows:[tdNewRow(chu)]};
  drawTaoDon();
}
function drawTaoDon(){
  const chu=getChu(tdState.chuId);const mauList=chu.mau||[];
  const chuOpts=DB.chuHang.map(c=>`<option value="${c.id}" ${c.id===tdState.chuId?'selected':''}>${escHtml(c.ten)}</option>`).join('');
  const nhieu=tdState.rows.length>1;
  let doanhThuLo=0;
  const rowsHtml=tdState.rows.map((r,i)=>{
    const mau=r.mauId?getMau(r.mauId):null;
    const sizeList=mau?((mau.sizeList&&mau.sizeList.length)?mau.sizeList:SIZES):[];
    const slRow=sum(Object.values(r.sizes||{}));doanhThuLo+=slRow*(r.gia||0);
    const mauOpts=mauList.length?mauList.map(m=>`<option value="${m.id}" ${r.mauId===m.id?'selected':''}>${escHtml(m.ten)} · ${fmt(m.giaGiaCong||0)}/cái</option>`).join(''):'';
    const head=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <label style="margin:0">Mẫu ${nhieu?'#'+(i+1):'của chủ hàng này'}</label>
        ${tdState.rows.length>1?`<button class="btn btn-ghost btn-sm" style="padding:2px 10px;color:var(--danger)" onclick="tdDelRow(${i})">✕ Bỏ mẫu</button>`:''}</div>`;
    if(!mauList.length)return `<div class="lo-row">${head}<div class="hint">Chủ hàng này chưa có mẫu — thêm mẫu ở màn chủ hàng.</div></div>`;
    return `<div class="lo-row" style="border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px">
      ${head}
      <select id="td_mau_${i}" onchange="tdSetMau(${i},this.value)" style="margin-bottom:10px">${mauOpts}</select>
      <label style="font-size:12px;color:var(--ink-3);font-weight:700">Số cái nhận về theo cỡ</label>
      <div class="sizegrid" style="margin:4px 0 8px">${sizeList.map(s=>`<div class="sizecell"><label>${s}</label>
        <input type="number" inputmode="numeric" min="0" id="sz_${i}_${s}" value="${r.sizes[s]||0}" oninput="tdSetSize(${i},'${s}',this.value)" onfocus="this.select()"></div>`).join('')}</div>
      <label style="font-size:12px;color:var(--ink-3);font-weight:700">Giá gia công / 1 cái</label>
      <input type="text" inputmode="numeric" class="sep" id="gia_${i}" value="${sepStr(r.gia||0)}" oninput="tdSetGia(${i},this.value)" style="margin-top:4px">
    </div>`;}).join('');
  const canAdd=mauList.length>0;
  const body=`
    <div class="field"><label>Chủ hàng</label><select id="f_chu" onchange="tdPick('chu',this.value)">${chuOpts}</select></div>
    <div class="field"><label>Mã lô${nhieu?' (chung cho các mẫu)':''}</label>
      <input id="f_malo" value="${tdState.maLo}" oninput="tdState.maLo=this.value"></div>
    ${rowsHtml}
    ${canAdd?`<button class="btn btn-ghost" style="width:100%;margin-bottom:12px" onclick="tdAddRow()">＋ Thêm mẫu vào lô</button>`:''}
    ${canAdd?`<div class="hint" style="margin-bottom:12px">Lô này gồm <b>${tdState.rows.length} mẫu</b> · doanh thu dự kiến <b>${fmt(doanhThuLo)}</b>.${nhieu?' Mỗi mẫu là 1 đơn riêng, vẫn xem/chốt lãi độc lập; lãi cả lô xem ở màn lô.':' Xem & thao tác qua màn lô.'}</div>`:''}
    ${canAdd?`<div class="sheet-cta"><button class="btn btn-primary" onclick="submitTaoLo()">Tạo lô · ${tdState.rows.length} mẫu</button></div>`:''}`;
  openSheet('Nhận hàng cắt mới',body);
}
function tdReadDom(){/* đồng bộ giá trị đang gõ vào state trước khi vẽ lại */
  tdState.rows.forEach((r,i)=>{const mau=r.mauId?getMau(r.mauId):null;if(!mau)return;
    const sizeList=(mau.sizeList&&mau.sizeList.length)?mau.sizeList:SIZES;
    sizeList.forEach(s=>{const e=el('sz_'+i+'_'+s);if(e)r.sizes[s]=+e.value||0;});
    const g=el('gia_'+i);if(g)r.gia=+String(g.value).replace(/[^\d]/g,'')||0;});
  const ml=el('f_malo');if(ml)tdState.maLo=ml.value;}
function tdPick(k,v){if(k==='chu'){tdReadDom();tdState.chuId=v;const c=getChu(v);tdState.rows=[tdNewRow(c)];}drawTaoDon();}
function tdSetMau(i,v){tdReadDom();const r=tdState.rows[i];r.mauId=v;const m=getMau(v);r.sizes={};r.gia=m?(m.giaGiaCong||0):0;drawTaoDon();}
function tdSetSize(i,s,v){tdState.rows[i].sizes[s]=+v||0;}
function tdSetGia(i,v){tdState.rows[i].gia=+String(v).replace(/[^\d]/g,'')||0;}
function tdAddRow(){tdReadDom();const chu=getChu(tdState.chuId);tdState.rows.push(tdNewRow(chu));drawTaoDon();}
function tdDelRow(i){tdReadDom();if(tdState.rows.length<=1)return;tdState.rows.splice(i,1);drawTaoDon();}
function nextMaLo(){const used=new Set(DB.don.map(d=>d.maLo||d.ma).filter(Boolean));
  let n=1;while(used.has('ĐH-'+String(n).padStart(3,'0')))n++;return 'ĐH-'+String(n).padStart(3,'0');}
function nextMa(){return nextMaLo()}
function submitTaoLo(){try{tdReadDom();
  const rows=[];
  for(let i=0;i<tdState.rows.length;i++){const r=tdState.rows[i];const mau=r.mauId?getMau(r.mauId):null;
    if(!mau)return toast('Chọn mẫu ở dòng '+(i+1)+' đã.',true);
    const sl=sum(Object.values(r.sizes||{}));if(sl<=0)return toast('Mẫu "'+mau.ten+'" chưa nhập số cái.',true);
    if((r.gia||0)<=0)return toast('Mẫu "'+mau.ten+'" chưa nhập giá gia công.',true);
    rows.push({mauId:r.mauId,sizes:{...r.sizes},gia:r.gia});}
  const ma=tdState.maLo||nextMa();
  taoLo({chuHangId:tdState.chuId,maLo:ma,rows});
  closeSheet();render();
  toast(rows.length>1?('Đã tạo lô '+rows.length+' mẫu — giao việc được rồi.'):'Đã tạo đơn — giao việc được rồi.');
}catch(e){toast(e.message,true)}}

/* ---------- Giao việc ---------- */
/* gvState.sel = tập công đoạn đã chọn (không cần liền nhau) */
/* gvInline = true khi form giao được nhúng thẳng vào tab "Giao hàng" của chi tiết đơn;
   false khi mở dạng sheet riêng (đường nvGuideGiao). */
let gvState={},gvInline=false;
function modalGiaoViec(donId){const don=getDon(donId);
  if(!DB.tho.some(t=>['sp','bao','gio'].includes(t.loai))){toast('Chưa có thợ nào — thêm thợ ở màn Thợ trước đã.',true);return;}
  const firstTho=DB.tho.find(t=>!t.isOwner&&['sp','bao','gio'].includes(t.loai))||DB.tho.find(t=>['sp','bao','gio'].includes(t.loai));
  let sel=[]; /* KHÔNG tự chọn công đoạn — người bấm tự chạm (tránh tưởng chưa bấm trúng rồi bấm lại) */
  gvState={donId,thoId:firstTho?firstTho.id:(DB.tho[0]&&DB.tho[0].id),sel,giao:{}};gvInline=false;gvFill();drawGiaoViec();}
/* Khởi tạo state + trả HTML form giao để nhúng thẳng vào tab "Giao hàng". */
function gvInlineInit(donId){const don=getDon(donId);
  if(!DB.tho.some(t=>['sp','bao','gio'].includes(t.loai)))return `<div class="hint">Chưa có thợ — thêm ở màn <b>Thợ</b> rồi mới giao việc được.</div>`;
  const firstTho=DB.tho.find(t=>!t.isOwner&&['sp','bao','gio'].includes(t.loai))||DB.tho.find(t=>['sp','bao','gio'].includes(t.loai));
  let sel=[]; /* KHÔNG tự chọn công đoạn — người bấm tự chạm (tránh tưởng chưa bấm trúng rồi bấm lại) */
  gvState={donId,thoId:firstTho?firstTho.id:(DB.tho[0]&&DB.tho[0].id),sel,giao:{}};gvInline=true;gvFill();
  return `<div id="gvHost">${gvBody()}</div>`;}
/* giao được tối đa bao nhiêu cỡ s = ít nhất trong các công đoạn đã chọn */
function gvMax(don,s){if(!gvState.sel.length)return 0;
  let m=Infinity;for(const n of gvState.sel)m=Math.min(m,ton(don,n,s));
  return Math.max(0,m);}
function gvFill(){const don=getDon(gvState.donId);gvState.giao={};
  sizesOf(don).forEach(s=>{const v=gvMax(don,s);if(v>0)gvState.giao[s]=v;});}
function gvBody(){const don=getDon(gvState.donId);const sel=gvState.sel;const hasSel=sel.length>0;
  const thoChips=DB.tho.filter(t=>['sp','bao','gio'].includes(t.loai)&&!t.nghi).map(t=>`<div class="chip ${gvState.thoId===t.id?'sel':''}" onclick="gvPick('tho','${t.id}')">${t.isOwner?'🧑‍🔧 ':''}${escHtml(t.ten)}${t.loai==='bao'?' <small>bao ngày</small>':t.loai==='gio'?' <small>bao giờ</small>':''}</div>`).join('');
  const cdChips=don.snapshotCD.map((c,n)=>{const t=tonCD(don,n);const on=sel.indexOf(n)>=0;
    const dim=(!on&&t<=0)?'style="opacity:.4"':'';
    return `<div class="chip ${on?'sel':''}" ${dim} onclick="gvPickCD(${n})">${n+1}.${escHtml(c.ten)}<small>${t>0?t+' chờ':'xong'}</small></div>`;}).join('');
  const goiTxt=hasSel?tenCds(don,sel):'';
  const dgGoi=hasSel?donGiaCds(don,sel):0;
  const avail=hasSel?sizesOf(don).map(s=>({s,v:gvMax(don,s)})).filter(x=>x.v>0):[];
  const tong=sum(Object.values(gvState.giao));
  const sizeRows=avail.length?avail.map(x=>{const on=(gvState.giao[x.s]||0)>0;return `<div class="gv-row${on?' on':''}">
      <label class="gv-tick"><input type="checkbox" ${on?'checked':''} onchange="gvTick('${x.s}',this.checked,${x.v})"><span>Cỡ ${x.s}<small>còn ${x.v}</small></span></label>
      <div class="stepper sm"><button ${on?'':'disabled'} onclick="gvSl('${x.s}',-5,${x.v})">−</button>
        <input type="number" id="gv_${x.s}" value="${gvState.giao[x.s]||0}" ${on?'':'disabled'} onchange="gvSet('${x.s}',+this.value,${x.v})" onfocus="this.select()">
        <button ${on?'':'disabled'} onclick="gvSl('${x.s}',5,${x.v})">＋</button></div></div>`;}).join('')
    :'<div class="hint">Các công đoạn đang chọn không còn cái nào chưa làm. Bỏ bớt công đoạn đi.</div>';
  return `
    <div class="field"><label>Giao cho thợ</label><div class="chipset">${thoChips}</div></div>
    <div class="field"><label>Công đoạn — chạm chọn, bao nhiêu cũng được</label><div class="chipset">${cdChips}</div>
      ${hasSel?`<div class="hint" style="margin-top:6px">Gói: <b>${goiTxt}</b>${sel.length>1?' · '+sel.length+' công đoạn':''} · tổng công <b>${fmt(dgGoi)}</b>/cái. Không cần chọn liền nhau — chạm lần nữa để bỏ.</div>`:`<div class="hint" style="margin-top:6px">Chạm công đoạn cần giao. Chọn được nhiều công đoạn rời nhau cho cùng một thợ.</div>`}</div>
    ${hasSel&&avail.length?`<div class="field"><label>Chọn cỡ & số cái giao</label>
      <div class="act-grid" style="margin-bottom:8px"><button class="btn btn-ghost btn-sm" onclick="gvAll(1)">Chọn hết</button><button class="btn btn-ghost btn-sm" onclick="gvAll(0)">Bỏ hết</button></div>
      ${sizeRows}
      <div class="hint">Thợ ôm cả gói, làm xong trả về. Tiền công = <b>tổng đơn giá</b> các công đoạn trong gói${sel.length>1?'. Số giao tối đa lấy theo công đoạn còn ít hàng nhất':''}.</div></div>
      <div class="sheet-cta"><button class="btn btn-primary" onclick="submitGiaoViec()">Giao ${tong} cái${sel.length>1?' · '+sel.length+' công đoạn':''}</button></div>`:''}`;
}
/* Inline: cập nhật thẳng #gvHost trong tab. Sheet: mở dạng cửa sổ (nvGuideGiao). */
function drawGiaoViec(){
  if(gvInline){const h=el('gvHost');if(h){h.innerHTML=gvBody();return;}}
  openSheet('Giao việc — '+getDon(gvState.donId).ma,gvBody());
}
function gvPick(k,v){if(k==='tho')gvState.thoId=v;drawGiaoViec();}
function gvPickCD(n){const don=getDon(gvState.donId);const i=gvState.sel.indexOf(n);
  if(i>=0)gvState.sel.splice(i,1);
  else{if(tonCD(don,n)<=0)return toast('Công đoạn này không còn cái nào chưa làm.',true);gvState.sel.push(n);}
  gvState.sel.sort((a,b)=>a-b);gvFill();drawGiaoViec();}
function gvSet(s,v,max){v=Math.max(0,Math.min(max,v||0));if(v>0)gvState.giao[s]=v;else delete gvState.giao[s];drawGiaoViec();}
function gvSl(s,d,max){gvSet(s,(gvState.giao[s]||0)+d,max);}
function gvTick(s,on,max){if(on)gvState.giao[s]=max;else delete gvState.giao[s];drawGiaoViec();}
function gvAll(on){const don=getDon(gvState.donId);gvState.giao={};
  if(on)sizesOf(don).forEach(s=>{const v=gvMax(don,s);if(v>0)gvState.giao[s]=v;});drawGiaoViec();}
function submitGiaoViec(){try{if(!gvState.sel.length)return toast('Chọn công đoạn đã.',true);
  if(sum(Object.values(gvState.giao))<=0)return toast('Chọn ít nhất một cỡ.',true);
  giaoViec({donId:gvState.donId,cds:gvState.sel,thoId:gvState.thoId,giao:gvState.giao});
  const _inline=gvInline;closeSheet();render();modalDon(gvState.donId,_inline?'giao':'chitiet');toast('Đã giao gói việc cho thợ.');}catch(e){toast(e.message,true)}}

/* ---------- Nhận về ---------- */
let nvLos=[],_nvSeq=0,_nvPid=null,_nvPending=null,nvShowHu=false,_nvBackTo=null;
/* ===================== ĐIỀU KIỆN (công thức) + NEO (mốc số lượng) =====================
   canTruoc=[[a,b],[c]] ⇔ (a VÀ b) HOẶC c.  Công thức = KHOÁ (được nhận hay chưa).
   Neo (giaiDoan) = HẠ TRẦN số lượng sau khi bước neo làm ra hàng; chưa xong thì trần=số đơn.
   X = hàm tra "đã xong bước n cỡ s" (dùng bản đã ghi, hoặc bản mô phỏng khi kiểm tra). */
function dkCts(don,n){const c=don.snapshotCD[n]&&don.snapshotCD[n].canTruoc;return Array.isArray(c)?c:[];}
function dkNeoOf(don,n){const g=don.snapshotCD[n]&&don.snapshotCD[n].giaiDoan;return(g==null||g==='')?null:g;}
function dkQtyCT(don,n,s,X){const cs=dkCts(don,n);if(!cs.length)return Infinity;let best=0;
  for(const ct of cs){let m=Infinity;for(const p of ct)m=Math.min(m,X(p,s));if(m===Infinity)m=0;best=Math.max(best,m);}return best;}
function dkCtHopLe(don,n,s,X){const cs=dkCts(don,n);for(let i=0;i<cs.length;i++){if(cs[i].every(p=>X(p,s)>=1))return i;}return -1;}
function dkNeoAllQty(don,k,s,X){const cs=dkCts(don,k);let m=Infinity;for(const ct of cs)for(const p of ct)m=Math.min(m,X(p,s));return m;}
function dkNeoLocked(don,k,s,X){const done=X(k,s);if(done<=0)return false;return dkNeoAllQty(don,k,s,X)>=done;}
function dkNeoCeil(don,n,s,X){const kn=dkNeoOf(don,n);const lim=(kn==null)?Infinity:kn;let best=null;
  for(let k=0;k<don.snapshotCD.length;k++){if(k===n)continue;const g=dkNeoOf(don,k);if(g==null)continue;if(!(g<lim))continue;
    if(!dkNeoLocked(don,k,s,X))continue;if(best===null||g>best.g)best={g,val:X(k,s)};}return best?best.val:null;}
/* trần TUYỆT ĐỐI cho "đã xong" của bước n (chưa trừ phần đã làm) */
function dkTran(don,n,s,X){let cap=capDon(don,s);const nc=dkNeoCeil(don,n,s,X);if(nc!=null)cap=Math.min(cap,nc);
  if(dkCts(don,n).length)cap=Math.min(cap,dkQtyCT(don,n,s,X));return cap;}
function dkNhanDuoc(don,n,s,X){if(!dkCts(don,n).length)return true;return dkQtyCT(don,n,s,X)>=1;}
function dkXcommit(don){return (n,s)=>xongCD(don,n,s);}
/* headroom: bước n cỡ s còn nhận thêm được bao nhiêu theo trần (chưa xét "còn ở thợ") */
function dkHeadroom(don,n,s,X){return Math.max(0,dkTran(don,n,s,X)-xongCD(don,n,s));}

/* trần của MỘT LÔ (tập bước 'ticked' cùng chảy qua) theo cỡ s:
   bước trong lô coi như đã thoả cho nhau; chỉ ràng buộc bởi bước NGOÀI lô + neo ngoài lô. */
function nvLoTranSize(p,ticked,s){const don=getDon(p.donId);
  const Xlo=(n,ss)=>ticked.indexOf(n)>=0?Infinity:xongCD(don,n,ss);
  let m=Infinity;for(const n of ticked)m=Math.min(m,dkHeadroom(don,n,s,Xlo));return m;}

/* KIỂM TRA điều kiện lúc GHI: dựng trạng thái SAU khi cộng mọi lô, mỗi bước phải ≤ trần của nó. */
function nvKiemTraDK(p,batches){const don=getDon(p.donId);const full=pCds(p);const delta={};
  for(const b of batches){const T=(b.cds&&b.cds.length)?b.cds:full;
    for(const n of T){const d=b.dat||{};for(const s in d){const v=d[s]||0;if(!v)continue;delta[n]=delta[n]||{};delta[n][s]=(delta[n][s]||0)+v;}}}
  const post=(n,s)=>xongCD(don,n,s)+((delta[n]||{})[s]||0);
  const ten=i=>don.snapshotCD[i]?don.snapshotCD[i].ten:('bước '+(i+1));
  for(const nk in delta){const n=+nk;for(const s in delta[nk]){
    const need=post(n,s);const tran=dkTran(don,n,s,post);if(need<=tran)continue;
    if(dkCts(don,n).length&&dkQtyCT(don,n,s,post)<1){
      const ct=dkCts(don,n)[0]||[];const thieu=ct.filter(x=>post(x,s)<1).map(ten);
      throw new Error('Cỡ '+s+': "'+ten(n)+'" chưa đủ điều kiện — cần xong '+(thieu.join(' và ')||'bước trước')+' trước.');}
    throw new Error('Cỡ '+s+': "'+ten(n)+'" chỉ được tối đa '+tran+' cái (đang khai '+need+') — bị bước trước/mốc khống chế. Bớt lại.');}}
}

/* Thông tin điều kiện hiển thị trong 1 lô: chỉ hiện bước có công thức HOẶC nằm sau một neo. */
function nvDKInfo(g){const p=DB.phieuGiao.find(x=>x.id===_nvPid);if(!p)return;const don=getDon(p.donId);
  const box=el('nvlDK_'+g);if(!box)return;const full=pCds(p);const sizes=pSizes(p);
  const ticked=full.filter(n=>{const e=el('nvlcd_'+g+'_'+n);return e&&e.checked;});
  const Xlo=(n,ss)=>ticked.indexOf(n)>=0?Infinity:xongCD(don,n,ss);
  const coNeoTruoc=n=>{for(let k=0;k<n;k++)if(dkNeoOf(don,k)!=null)return true;return false;};
  const ten=i=>don.snapshotCD[i]?don.snapshotCD[i].ten:('bước '+(i+1));
  const rows=[];
  for(const n of ticked){
    const chuaDu=sizes.filter(s=>!dkNhanDuoc(don,n,s,Xlo)&&capDon(don,s)>0);
    if(chuaDu.length){ const ct=dkCts(don,n)[0]||[];
      const thieu=ct.filter(x=>ticked.indexOf(x)<0&&sizes.some(s=>xongCD(don,x,s)<1)).map(ten);
      rows.push('<div style="color:#b3261e">🔴 '+ten(n)+': chưa đủ — cần '+(thieu.join(', ')||'bước trước')+(chuaDu.length<sizes.length?' (cỡ '+chuaDu.join(',')+')':'')+'</div>');
    }else{
      const tr=sizes.filter(s=>capDon(don,s)>0).map(s=>s+':'+dkHeadroom(don,n,s,Xlo)).join('  ');
      rows.push('<div style="color:#1f7a34">🟢 '+ten(n)+': đủ điều kiện — tối đa '+tr+'</div>');}
  }
  box.innerHTML=rows.length?('<div style="font-size:11.5px;line-height:1.6;margin-top:4px;padding-top:5px;border-top:1px dashed var(--line-2)">'+rows.join('')+'</div>'):'';
}

/* Điều hướng nhanh từ bảng đèn: nhảy sang GIAO / NHẬN bước cần trước rồi quay lại. */
function nvGuideGiao(donId,n){closeSheet();modalGiaoViec(donId);
  const t=(getDon(donId).snapshotCD[n]||{}).ten||'bước';toast('Giao "'+t+'" cho thợ, xong quay lại nhận tiếp.');}
function nvGuideNhan(donId,n,fromId){const don=getDon(donId);
  const cands=DB.phieuGiao.filter(p=>p.donId===donId&&p.trangThai==='MO'&&pLam(p,n)&&(pGiao(p)-pNhan(p))>0&&p.id!==fromId);
  const t=(don.snapshotCD[n]||{}).ten||'';
  if(cands.length){const c=cands[0];_nhanSel[donId]={thoId:c.thoId,phieuId:c.id};_nvBackTo=null;
    modalDon(donId,'nhan');
    toast('Đã chuyển sang '+getTho(c.thoId).ten+' — nhận "'+t+'".'+(cands.length>1?' (còn thợ khác cũng giữ bước này)':''));return;}
  modalDon(donId,'nhan');
  toast('Chưa thấy phiếu mở nào đang giữ "'+t+'".',true);}
function nvQuayLai(id){_nvBackTo=null;modalNhanVe(id);}

/* Bảng đèn TRẠNG THÁI CÔNG ĐOẠN (SPEC §17) — theo số đã xong hiện tại (committed). */
function nvBangCD(p){const don=getDon(p.donId);const sizes=pSizes(p);const cds=pCds(p);const X=dkXcommit(don);
  const ten=i=>don.snapshotCD[i]?don.snapshotCD[i].ten:('bước '+(i+1));
  const hasGiao=pp=>DB.phieuGiao.some(f=>f.donId===don.id&&pCds(f).indexOf(pp)>=0);
  const coCT=cds.some(n=>dkCts(don,n).length>0);const coNeo=cds.some(n=>dkNeoOf(don,n)!=null);
  if(!coCT&&!coNeo)return '';
  const live=sizes.filter(s=>capDon(don,s)>0);
  const cards=cds.map(n=>{const hasCT=dkCts(don,n).length>0;
    const okS=live.filter(s=>dkNhanDuoc(don,n,s,X)&&dkHeadroom(don,n,s,X)>0);
    const badS=live.filter(s=>!dkNhanDuoc(don,n,s,X));
    const ct0=dkCts(don,n)[0]||[];
    const giaoIdx=[],nhanIdx=[],tickIdx=[];
    ct0.forEach(pp=>{const tong=sizes.reduce((a,s)=>a+X(pp,s),0);if(tong>0)return;
      if(!hasGiao(pp)){giaoIdx.push(pp);return;}
      const khac=DB.phieuGiao.some(x=>x.id!==p.id&&x.donId===don.id&&x.trangThai==='MO'&&pLam(x,pp)&&(pGiao(x)-pNhan(x))>0);
      if(khac)nhanIdx.push(pp);else if(pLam(p,pp))tickIdx.push(pp);else nhanIdx.push(pp);});
    let den,label,color;
    if(!hasCT){den='🟢';label='Nhận được (chỉ neo giới hạn số)';color='#1f7a34';}
    else if(okS.length===0){ if(giaoIdx.length){den='🟠';label='Cần giao bước trước';color='#b26a00';}
      else{den='🔴';label='Chưa đủ điều kiện';color='#b3261e';} }
    else if(badS.length){den='🟡';label='Đủ một phần';color='#8a6d00';}
    else{den='🟢';label='Đủ điều kiện nhận';color='#1f7a34';}
    let chk='';
    if(hasCT){const iCT=dkCtHopLe(don,n,live[0]||sizes[0],X);const ct=(iCT>=0?dkCts(don,n)[iCT]:ct0);
      const items=ct.map(pp=>{const tong=sizes.reduce((a,s)=>a+X(pp,s),0);const giu=sizes.reduce((a,s)=>a+dangGiuCD(don,pp,s),0);
        let ic,tx; if(tong>0){ic='✓';tx='đã xong '+tong;} else if(giu>0||hasGiao(pp)){ic='⏳';tx='đã giao, chưa xong';} else {ic='📦';tx='chưa giao';}
        return '<div style="font-size:11.5px">'+ic+' '+ten(pp)+' — '+tx+'</div>';}).join('');
      const nCT=dkCts(don,n).length;
      chk='<div style="margin-top:2px">'+(nCT>1?'<div style="font-size:11px;color:var(--ink-2)">'+(iCT>=0?'Công thức '+(iCT+1)+' đang đủ':'Chưa công thức nào đủ')+' (trong '+nCT+')</div>':'')+items+'</div>';}
    let foot='';
    if(den==='🟢'||den==='🟡'){const tr=live.map(s=>s+':'+dkHeadroom(don,n,s,X)).join('  ');
      foot='<div style="font-size:11.5px;color:#1f7a34;margin-top:2px">→ Nhận được — tối đa '+tr+'</div>';
      if(badS.length)foot+='<div style="font-size:11px;color:#b3261e">cỡ '+badS.join(',')+' chưa đủ</div>';}
    else{const btn=(t,c)=>'<button class="btn btn-ghost btn-sm" style="margin:5px 5px 0 0;padding:4px 11px;font-size:12px" onclick="'+c+'">'+t+'</button>';
      const bs=[];
      giaoIdx.forEach(pp=>bs.push(btn('→ Giao '+ten(pp),"nvGuideGiao('"+don.id+"',"+pp+")")));
      nhanIdx.forEach(pp=>bs.push(btn('→ Nhận '+ten(pp)+' (thợ khác)',"nvGuideNhan('"+don.id+"',"+pp+",'"+p.id+"')")));
      foot=bs.length?('<div>'+bs.join('')+'</div>'):'';
      if(tickIdx.length)foot+='<div style="font-size:11px;color:var(--ink-3);margin-top:4px">Cần xong '+tickIdx.map(ten).join(', ')+' trước (tích ở lô bên dưới khi đủ điều kiện).</div>';}
    return '<div style="border:1px solid var(--line);border-left:3px solid '+color+';border-radius:8px;padding:6px 8px;margin-bottom:6px;background:#fff">'
      +'<div style="font-weight:700;font-size:12.5px;color:'+color+'">'+den+' '+(n+1)+'. '+ten(n)+' — '+label+'</div>'+chk+foot+'</div>';}).join('');
  return '<details style="margin-bottom:12px"><summary style="font-size:12px;color:var(--ink-2);cursor:pointer;margin-bottom:5px">▸ Tình trạng công đoạn (bấm để xem)</summary>'+cards+'</details>';}

/* ---------- Nhận hàng NHÚNG THẲNG vào tab "Nhận hàng" của chi tiết đơn:
   thanh chọn thợ ở trên (song song), tích thợ nào hiện form nhận của thợ ấy ---------- */
let _nhanSel={};
function nhanTabStyle(on){return `flex:0 0 auto;min-width:92px;text-align:center;padding:8px 12px;border-radius:11px;border:1.5px solid ${on?'var(--brand)':'var(--line)'};background:${on?'#fff':'var(--muslin)'};box-shadow:${on?'0 2px 8px rgba(27,42,74,.08)':'none'};cursor:pointer;line-height:1.15`;}
function nhanKhuVuc(donId){
  const groups=nhomPhieuMo(donId);
  if(!groups.length)return `<div class="divider-note" style="padding:14px">Chưa giao việc nào đang mở.</div>`;
  const sel=_nhanSel[donId];
  const g=(sel&&groups.find(x=>x.thoId===sel.thoId))||groups[0];
  const p=(sel&&sel.phieuId&&g.list.find(x=>x.id===sel.phieuId))||g.list[0];
  _nhanSel[donId]={thoId:g.thoId,phieuId:p.id};
  const tabs=groups.map(x=>{const on=x.thoId===g.thoId;const treo=days(x.ngay);
    return `<button onclick="nhanPickTho('${donId}','${x.thoId}')" style="${nhanTabStyle(on)}">
      <div style="font-weight:${on?'800':'700'};font-size:13.5px;color:${on?'var(--brand)':'var(--ink-2)'}">${escHtml(x.tho.ten)}</div>
      <div style="font-size:10.5px;font-weight:600;color:${on?'var(--brand)':'var(--ink-3)'};margin-top:1px">${x.conLai} cái${x.soViec>1?` · ${x.soViec} việc`:''}${treo>=3?` · giữ ${treo}n`:''}</div>
    </button>`;}).join('');
  let sub='';
  if(g.list.length>1){
    sub=`<div class="chipset" style="margin:2px 0 8px">`+g.list.map(q=>{const dn=getDon(q.donId);const on=q.id===p.id;
      return `<div class="chip ${on?'sel':''}" onclick="nhanPickPhieu('${donId}','${g.thoId}','${q.id}')">${tenDai(dn,q)}<small>còn ${pGiao(q)-pNhan(q)}</small></div>`;}).join('')
      +`</div><button class="btn btn-sage btn-sm" style="margin:0 0 10px" onclick="nhanDuNhom('${g.thoId}','${donId}')">✓ Nhận về tất cả việc của ${escHtml(g.tho.ten)}</button>`;
  }
  const nnC=nhanNhanhCount();
  const nnBtn=nhanNhanhCoViec()?`<button class="btn btn-primary btn-sm" style="width:100%;margin:0 0 10px" onclick="moNhanNhanhTuDon('${donId}')">⚡ Nhận nhanh toàn xưởng — ${nnC>0?nnC+' công đoạn đủ điều kiện':'xem công đoạn đang chờ'}</button>`:'';
  return `${nnBtn}<div style="position:sticky;top:96px;z-index:3;background:var(--muslin);display:flex;gap:7px;overflow-x:auto;padding:8px 0 9px;margin:0 0 2px;-webkit-overflow-scrolling:touch;box-shadow:0 7px 10px -8px rgba(27,42,74,.16)">${tabs}</div>${sub}
    <div id="nhanInlineForm" class="card" style="padding:12px">${nvFormHTML(p.id,true)}</div>`;
}
function nhanPickTho(donId,thoId){_nhanSel[donId]={thoId,phieuId:null};modalDon(donId,'nhan');}
function nhanPickPhieu(donId,thoId,phieuId){_nhanSel[donId]={thoId,phieuId};modalDon(donId,'nhan');}
function nvInlineInit(){if(!el('nhanInlineForm'))return;const p=DB.phieuGiao.find(x=>x.id===_nvPid);if(!p)return;
  if(pCds(p).length>1)nvAddLo(_nvPid,true);nvRecount();}
function nvFormHTML(phieuId,inline){const p=DB.phieuGiao.find(x=>x.id===phieuId);const don=getDon(p.donId);
  nvLos=[];_nvSeq=0;_nvPid=phieuId;_nvPending=null;nvShowHu=false;
  const sizes=pSizes(p);const cds=pCds(p);const multi=cds.length>1;const con=pGiao(p)-pNhan(p);
  let body;
  if(!multi){
    const n0=cds[0];const Xc=dkXcommit(don);
    const rows=sizes.map(s=>{const c=pConSize(p,s);
      return `<div class="nv-row"><div class="nv-lbl">Cỡ ${s}<small>giao ${pGiaoSize(p,s)} · còn ${pConSize(p,s)}</small></div>
        <div class="nv-ins">
          <div class="nv-in"><span>đạt</span><input type="number" id="nv_dat_${s}" value="${c>0?c:0}" onfocus="this.select()" oninput="nvRecount()"></div>
          <div class="nv-in nv-hu" id="nvhu_${s}" style="display:none"><span>hư</span><input type="number" id="nv_phe_${s}" value="0" onfocus="this.select()" oninput="nvRecount()"></div>
        </div></div>`;}).join('');
    let dkNote='';const coNeo=(function(){for(let k=0;k<n0;k++)if(dkNeoOf(don,k)!=null)return true;return false;})();
    if(dkCts(don,n0).length||coNeo){
      const bad=sizes.filter(s=>!dkNhanDuoc(don,n0,s,Xc)&&capDon(don,s)>0);
      if(bad.length){const ct=dkCts(don,n0)[0]||[];const thieu=ct.filter(x=>sizes.some(s=>xongCD(don,x,s)<1)).map(i=>don.snapshotCD[i].ten);
        dkNote='<div style="color:#b3261e;font-size:12px;margin-top:6px">🔴 Chưa đủ điều kiện — cần xong '+(thieu.join(', ')||'bước trước')+' trước'+(bad.length<sizes.length?' (cỡ '+bad.join(',')+')':'')+'</div>';}
      else{const tr=sizes.map(s=>s+':'+dkHeadroom(don,n0,s,Xc)).join('  ');
        dkNote='<div style="color:#1f7a34;font-size:12px;margin-top:6px">🟢 Tối đa '+tr+'</div>';}
    }
    body=`<div class="field"><label>Số cái nhận về theo cỡ</label>
      <div id="nvRows">${rows}</div>${dkNote}
      <button id="nvHuToggle" class="btn btn-ghost btn-sm" onclick="nvToggleHu()" style="margin-top:2px">+ Có hàng hư?</button>
      <div class="hint">Điền sẵn số còn lại — sửa nếu nhận thiếu, cỡ nào chưa nhận để <b>0</b>. Thợ nhận công phần đạt.</div></div>`;
  }else{
    body=`<details style="margin-bottom:10px"><summary class="hint" style="cursor:pointer">▸ Cách nhập nhiều bước (bấm xem)</summary><div class="hint" style="margin-top:6px">Mỗi <b>lô</b> = chọn <b>1 công đoạn</b> thợ vừa làm xong — số tự điền theo <b>trần</b> (mốc/điều kiện). Thợ làm xong bước khác nữa thì bấm <b>＋ Thêm lô</b>. <b>Hàng hư</b>: bật "+ Có hàng hư?" rồi nhập ở lô đang vướng.</div></details>
      <div id="nvLos"></div>
      <div style="margin-top:2px">
        <button class="btn btn-ghost btn-sm" onclick="nvAddLo('${phieuId}')">＋ Thêm lô (làm tới bước khác)</button>
        <button id="nvHuToggle" class="btn btn-ghost btn-sm" onclick="nvToggleHu()" style="margin-left:6px">+ Có hàng hư?</button>
      </div>`;
  }
  const head=inline
    ?`<div style="font-size:12.5px;color:var(--ink-2);margin:-2px 0 10px">${tenCds(don,cds)} · giao ${pGiao(p)} · ${sizes.map(s=>s+':'+pGiaoSize(p,s)).join(' ')}${pNhan(p)?` · đã nhận ${pNhan(p)}`:''} · còn ở thợ <b>${con}</b></div>`
    :`<div style="margin:-4px 0 12px"><div style="font-weight:700">${escHtml(getTho(p.thoId).ten)} · ${tenCds(don,cds)}</div>
      <div style="font-size:13px;color:var(--ink-2)">Giao ${pGiao(p)} cái · ${sizes.map(s=>s+':'+pGiaoSize(p,s)).join(' ')}${pNhan(p)?` · đã nhận ${pNhan(p)}`:''} · còn ở thợ <b>${con}</b></div></div>`;
  const backBtn=(!inline&&_nvBackTo&&_nvBackTo!==phieuId&&DB.phieuGiao.some(x=>x.id===_nvBackTo&&x.trangThai==='MO'))?`<button class="btn btn-ghost btn-sm" style="margin:-2px 0 10px;padding:5px 12px" onclick="nvQuayLai('${_nvBackTo}')">‹ Quay lại phiếu trước</button>`:'';
  return `${head}${backBtn}
    ${nvBangCD(p)}
    ${body}
    <div id="nvConLai" style="margin:8px 0 12px"></div>
    <div class="act-grid" style="grid-template-columns:1fr 1fr;gap:8px">
      <button class="btn btn-primary" onclick="nvNhanGiuMo('${phieuId}')">Nhận hàng</button>
      <button class="btn btn-sage" onclick="nvXong('${phieuId}')">Nhận &amp; đóng phiếu</button></div>
    <div class="hint" style="text-align:center;margin-top:6px"><b>Nhận hàng</b>: ghi nhận, giữ phiếu mở tới khi xong hết công đoạn đã giao. <b>Nhận &amp; đóng phiếu</b>: chốt phiếu ngay.</div>
    ${p.dongNhan.length?'':`<div style="height:10px"></div><div style="text-align:center"><button class="btn btn-ghost btn-sm" onclick="doHuyPhieu('${phieuId}')">Thợ chưa làm gì — hủy phiếu</button></div>`}`;
}
function modalNhanVe(phieuId,opts){const p=DB.phieuGiao.find(x=>x.id===phieuId);
  openSheet('Nhận hàng về',nvFormHTML(phieuId,false));
  if(pCds(p).length>1)nvAddLo(phieuId,true);
  nvRecount();
}
/* một LÔ: tập bước đã xong (mặc định đủ) + số cái đạt/hư từng cỡ */
/* chọn công đoạn mặc định cho lô: bước đầu tiên ĐỦ ĐIỀU KIỆN + còn ở thợ; không có thì bước đầu */
function nvDefStage(p){const don=getDon(p.donId);const full=pCds(p);const X=dkXcommit(don);const live=pSizes(p).filter(s=>capDon(don,s)>0);
  for(const n of full){if(live.some(s=>pGiuCD(p,n,s)>0&&dkNhanDuoc(don,n,s,X)&&dkHeadroom(don,n,s,X)>0))return n;}
  return full[0];}
/* chọn 1 bước (kiểu radio): bỏ tích các bước khác, rồi điền lại số theo trần của bước vừa chọn */
function nvLoPick(g,n){const p=DB.phieuGiao.find(x=>x.id===_nvPid);if(!p)return;const full=pCds(p);
  full.forEach(k=>{const e=el('nvlcd_'+g+'_'+k);if(e)e.checked=(k===n);});
  nvRefillLo(g);nvLoSync(g);}
/* điền số lượng của lô theo trần (mốc/điều kiện) của bước đang chọn, chặn bởi "còn ở thợ" */
function nvRefillLo(g){const p=DB.phieuGiao.find(x=>x.id===_nvPid);if(!p)return;const full=pCds(p);
  const ticked=full.filter(n=>{const e=el('nvlcd_'+g+'_'+n);return e&&e.checked;});
  if(ticked.length!==1)return;const n=ticked[0];
  pSizes(p).forEach(s=>{const e=el('nvl_'+g+'_'+s);if(e)e.value=Math.max(0,Math.min(pGiuCD(p,n,s),nvLoTranSize(p,[n],s)));});}
function nvAddLo(phieuId,prefill){const p=DB.phieuGiao.find(x=>x.id===phieuId);const don=getDon(p.donId);
  const g=++_nvSeq;nvLos.push(g);const full=pCds(p);const sizes=pSizes(p);const first=nvLos.length===1;
  const def=nvDefStage(p);
  const cdBoxes=full.map(n=>`<label class="chip" style="cursor:pointer"><input type="checkbox" id="nvlcd_${g}_${n}" ${n===def?'checked':''} onchange="nvLoPick(${g},${n})" style="margin-right:5px">${n+1}.${escHtml(don.snapshotCD[n].ten)}</label>`).join('');
  const datIns=sizes.map(s=>{const v=prefill?Math.max(0,Math.min(pGiuCD(p,def,s),nvLoTranSize(p,[def],s))):'';return `<div class="nv-in"><span>${s}</span><input type="number" id="nvl_${g}_${s}" value="${v}" placeholder="0" onfocus="this.select()" oninput="nvRecount()" style="width:56px"></div>`;}).join('');
  const pheIns=sizes.map(s=>`<div class="nv-in nv-hu" id="nvlhu_${g}_${s}" style="display:${nvShowHu?'':'none'}"><span>${s} hư</span><input type="number" id="nvlp_${g}_${s}" value="0" onfocus="this.select()" oninput="nvRecount()" style="width:48px"></div>`).join('');
  const html=`<div class="nvg-card" id="nvloCard_${g}" style="border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px;background:#fff">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <b id="nvloSum_${g}" style="flex:1;font-size:13px">Xong: ${escHtml(don.snapshotCD[def].ten)}</b>
      ${first?'':`<button class="btn btn-ghost btn-sm" onclick="nvDelLo(${g})" style="padding:4px 9px">✕</button>`}</div>
    <div style="font-size:11.5px;color:var(--ink-2);margin-bottom:4px">Chọn 1 công đoạn thợ vừa làm xong (số tự điền theo trần):</div>
    <div id="nvloCds_${g}" class="chipset" style="margin-bottom:8px">${cdBoxes}</div>
    <div class="nv-ins" style="flex-wrap:wrap;gap:6px">${datIns}${pheIns}</div>
    <div id="nvlDK_${g}"></div></div>`;
  const box=el('nvLos');if(box)box.insertAdjacentHTML('beforeend',html);nvLoSync(g);nvRecount();}
function nvLoSync(g){const p=DB.phieuGiao.find(x=>x.id===_nvPid);if(!p)return;const full=pCds(p);const don=getDon(p.donId);
  const ticked=full.filter(n=>{const e=el('nvlcd_'+g+'_'+n);return e&&e.checked;});
  pSizes(p).forEach(s=>{const e=el('nvlhu_'+g+'_'+s);if(e)e.style.display=nvShowHu?'':'none';});
  const b=el('nvloSum_'+g);if(!b){nvRecount();return;}
  if(!ticked.length)b.innerHTML='⚠ Chưa chọn công đoạn';
  else b.innerHTML='Xong: '+ticked.map(n=>don.snapshotCD[n].ten).join(', ');
  nvDKInfo(g);nvRecount();}
function nvDelLo(g){nvLos=nvLos.filter(x=>x!==g);const c=el('nvloCard_'+g);if(c)c.remove();nvRecount();}
function nvToggleHu(){const p=DB.phieuGiao.find(x=>x.id===_nvPid);if(!p)return;nvShowHu=!nvShowHu;const full=pCds(p);
  pSizes(p).forEach(s=>{const e=el('nvhu_'+s);if(e)e.style.display=nvShowHu?'':'none';});
  for(const g of nvLos){
    pSizes(p).forEach(s=>{const e=el('nvlhu_'+g+'_'+s);if(e)e.style.display=nvShowHu?'':'none';});}
  const b=el('nvHuToggle');if(b)b.textContent=nvShowHu?'– Ẩn cột hư':'+ Có hàng hư?';}
/* số CÒN CHƯA KHAI = số còn ở thợ − tổng đã gõ (đạt+hư, mọi lô) */
function nvRecount(){const p=DB.phieuGiao.find(x=>x.id===_nvPid);if(!p)return;const full=pCds(p);
  const box=el('nvConLai');if(!box)return;
  if(full.length<=1){let khai=0;pSizes(p).forEach(s=>{khai+=numVal('nv_dat_'+s)+numVal('nv_phe_'+s);});
    const con=pGiao(p)-pNhan(p);const conLai=con-khai;let bg,fg,txt;
    if(conLai<0){bg='#fdeaea';fg='#b3261e';txt='⚠ Vượt <b>'+(-conLai)+'</b> cái so với số còn ở thợ ('+con+') — bớt lại.';}
    else if(conLai===0){bg='#e8f5ea';fg='#1f7a34';txt='✓ Đã khai đủ '+con+' cái còn ở thợ.';}
    else{bg='#fdf3e3';fg='#8a5a00';txt='⏳ Còn chưa khai: <b>'+conLai+'</b> cái — bấm Xong sẽ hỏi phần này ở đâu.';}
    box.innerHTML='<div style="padding:9px 11px;border-radius:10px;font-size:13.5px;background:'+bg+';color:'+fg+'">'+txt+'</div>';return;}
  const con=pGiao(p)-pNhan(p);
  box.innerHTML=con>0
    ?'<div style="padding:8px 11px;border-radius:10px;font-size:13px;background:#f3f4f6;color:var(--ink-2)">Còn ở thợ (chưa xong hết gói): <b>'+con+'</b> cái. Ghi từng công đoạn — xong hết bước mới đóng phiếu.</div>'
    :'<div style="padding:8px 11px;border-radius:10px;font-size:13px;background:#e8f5ea;color:#1f7a34">✓ Đã xong hết gói.</div>';}
function stepIn(id,d){const e=el(id);e.value=Math.max(0,(+e.value||0)+d)}
/* đọc mọi lô -> batches {dat,phe,(cds nếu chỉ vài bước)}. Lô đủ bước = "cả gói" (không kèm cds, y như cũ). */
function nvReadLos(p){const full=pCds(p);const out=[];
  if(full.length<=1){const dat={},phe={};pSizes(p).forEach(s=>{const d=numVal('nv_dat_'+s);if(d>0)dat[s]=d;const f=numVal('nv_phe_'+s);if(f>0)phe[s]=f;});
    if(sum(Object.values(dat))+sum(Object.values(phe))>0)out.push({dat,phe});return out;}
  for(const g of nvLos){
    const ticked=full.filter(n=>{const e=el('nvlcd_'+g+'_'+n);return e&&e.checked;});
    const caGoi=ticked.length>=full.length;
    const dat={},phe={};pSizes(p).forEach(s=>{const d=numVal('nvl_'+g+'_'+s);if(d>0)dat[s]=d;const f=numVal('nvlp_'+g+'_'+s);if(f>0)phe[s]=f;});
    if(!sum(Object.values(dat))&&!sum(Object.values(phe)))continue;
    if(!ticked.length)throw new Error('Có lô chưa tích bước nào đã xong — tích bước hoặc xoá lô đó.');
    if(caGoi)out.push({dat,phe});
    else out.push({dat,phe,cds:ticked});}
  return out;}
function nvBatches(p){const all=nvReadLos(p);const full=pCds(p);const fin=finalCd(p);const don=getDon(p.donId);
  const ten=i=>don.snapshotCD[i]?don.snapshotCD[i].ten:('bước '+(i+1));
  for(const s of pSizes(p)){const giaoS=pGiaoSize(p,s);
    for(const n of full){let after=pXongBuocSize(p,n,s);
      for(const b of all){const T=(b.cds&&b.cds.length)?b.cds:full;if(T.indexOf(n)>=0)after+=(b.dat&&b.dat[s])||0;}
      if(n===fin){let phe=pPheSize(p,s);for(const b of all)phe+=(b.phe&&b.phe[s])||0;
        if(after+phe>giaoS)throw new Error('Cỡ '+s+': "'+ten(n)+'" xong '+after+' + hư '+phe+' vượt số giao ('+giaoS+'). Bớt lại.');}
      else if(after>giaoS)throw new Error('Cỡ '+s+': "'+ten(n)+'" nhận '+after+' vượt số giao ('+giaoS+'). Bớt lại.');}}
  nvKiemTraDK(p,all);
  return all;}
function doHuyPhieu(phieuId){try{const p=DB.phieuGiao.find(x=>x.id===phieuId);huyPhieu(phieuId);
  closeSheet();render();modalDon(p.donId,'nhan');toast('Đã hủy phiếu, trả hàng về hàng chờ.');}catch(e){toast(e.message,true)}}
/* MỘT nút "Xong": khai đủ -> đóng luôn; còn thiếu -> hỏi đúng 1 câu. */
/* đã nhận đủ MỌI công đoạn đã giao cho toàn bộ số cái chưa? (để nút "Nhận hàng" biết khi nào đóng) */
function pXongHetBuoc(p){const cds=pCds(p);
  for(const s of pSizes(p)){const target=pGiaoSize(p,s)-pPheSize(p,s);if(target<=0)continue;
    for(const n of cds){if(pXongBuocSize(p,n,s)<target)return false;}}
  return true;
}
/* NÚT "NHẬN HÀNG": ghi nhận (trả hàng về như thường), NHƯNG giữ phiếu MỞ nếu gói còn
   công đoạn chưa xong. Chỉ đóng phiếu khi đã nhận hết mọi công đoạn đã giao. */
function nvNhanGiuMo(phieuId){try{const p=DB.phieuGiao.find(x=>x.id===phieuId);if(!p)return;
  const batches=nvBatches(p);
  const nhap=sum(batches.map(b=>sum(Object.values(b.dat||{}))+sum(Object.values(b.phe||{}))));
  if(nhap<=0)return toast('Nhập số cái nhận về.',true);
  const back=_nvBackTo;_nvBackTo=null;
  nhanVe({phieuId,batches});
  const het=pXongHetBuoc(p);
  if(het){p.hut=0;p.lyDoHut=null;p.thoTra=Math.max(0,pGiao(p)-pNhan(p));p.trangThai='DONG';}
  Store.save();closeSheet();render();
  const veBack=back&&DB.phieuGiao.some(x=>x.id===back&&x.trangThai==='MO');
  if(veBack)modalNhanVe(back);else if(_nhanNhanhBack){_nhanNhanhBack=false;moNhanNhanh();}else modalDon(p.donId,'nhan');
  toast(het?'Đã nhận — xong hết công đoạn, đóng phiếu.':(veBack?'Đã nhận — quay lại phiếu trước.':'Đã nhận hàng — phiếu vẫn mở.'));
}catch(e){toast(e.message,true)}}
function nvXong(phieuId){try{const p=DB.phieuGiao.find(x=>x.id===phieuId);if(!p)return;
  const batches=nvBatches(p);
  const conLai=pConSauBatches(p,batches);
  const don=getDon(p.donId);const full=pCds(p);const sizeList=pSizes(p);const nhieu=sizeList.length>1;
  const perStr=m=>nhieu?' ('+sizeList.filter(s=>m[s]).map(s=>s+':'+m[s]).join(' ')+')':'';
  const cdList=cds=>cds.map(i=>(i+1)+'.'+(don.snapshotCD[i]?don.snapshotCD[i].ten:'?')).join(', ');
  let msg='';
  batches.forEach(b=>{const cds=(b.cds&&b.cds.length)?b.cds.slice().sort((x,y)=>x-y):full.slice();
    const dq=sum(Object.values(b.dat||{}));const hq=sum(Object.values(b.phe||{}));
    const caGoi=cds.length>=full.length;
    if(dq>0)msg+='\n· '+(caGoi?'Xong cả gói — ':'Chỉ xong ')+cdList(cds)+': '+dq+' cái'+perStr(b.dat||{});
    if(hq>0)msg+='\n· Hư ('+(caGoi?'cả gói':cdList(cds))+', không tính công): '+hq+' cái'+perStr(b.phe||{});});
  if(!msg)msg='\n· (chưa khai cái nào)';
  if(conLai<=0){
    xacNhan('Nhận về:'+msg+'\n\n→ Đủ số còn ở thợ. Ghi công & đóng phiếu?',()=>nvGhiRoiDong(phieuId,batches),{title:'Ghi nhận',ok:'Ghi & đóng'});
    return;}
  _nvPending={phieuId,batches,conLai};
  openSheet('Còn '+conLai+' cái chưa khai — đang ở đâu?',`
    <div class="hint" style="margin-bottom:12px">Đã khai:${msg.replace(/\n/g,'<br>')}<br><br>Còn <b>${conLai} cái</b> chưa khai — chọn cách xử lý:</div>
    <button class="btn btn-primary" onclick="nvChonGiu()" style="margin-bottom:10px">🧵 Thợ giữ, làm tiếp — giữ phiếu mở</button>
    <button class="btn btn-ghost" onclick="nvChonTraVe()" style="margin-bottom:10px">↩️ Trả về xưởng — may bù (về hàng chờ, giữ kế hoạch)</button>
    <button class="btn btn-ghost" onclick="nvChonBoLuon()">🚫 Bỏ luôn — giao thiếu (trừ kế hoạch, không lỗ)</button>`);
}catch(e){toast(e.message,true)}}

  const p=DB.phieuGiao.find(y=>y.id===x.phieuId);

/* ③ BỎ LUÔN — trừ số thiếu khỏi kế hoạch đơn (capDon giảm), KHÔNG ghi lỗ.
   Tiền công các bước đã may cứ để yên trong Hàng dở, không chuyển thành lỗ. */

/* ---------- THẺ GỘP: một thợ = một phiếu (chỉ ở lớp hiển thị) ---------- */
function theNhomPhieu(g,donId){
  const nhieu=g.soViec>1;const trong=donId?true:false;
  const tong=nhomPhieuCuaTho(g.thoId);const khac=trong&&tong?tong.soViec-g.soViec:0;
  const dong=g.list.map(p=>{const don=getDon(p.donId);const daNhan=pNhan(p);

      <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();modalNhanVe('${p.id}')">Nhận về</button></div>`;}).join('');

      <button class="btn btn-sage btn-sm" onclick="event.stopPropagation();nhanDuNhom('${g.thoId}','${donId||''}')">✓ Nhận về tất cả</button>
    </div>`:''}</div>`;
}
/* nhận đủ toàn bộ việc thợ đang giữ — chạy lần lượt từng phiếu, sổ vẫn ghi riêng */
function nhanDuNhom(thoId,donId){
  const g=nhomPhieuMo(donId||null).filter(x=>x.thoId===thoId)[0];
  if(!g)return toast('Thợ này không còn việc đang mở.',true);
  if(!confirm(`${g.tho.ten} trả xong đủ ${g.soViec} việc (${g.conLai} cái)?\nTiền công ${fmt(g.tienCong)} sẽ ghi ngay.`))return;
  try{
    g.list.forEach(p=>{const dat={};pSizes(p).forEach(s=>{const con=pConSize(p,s);if(con>0)dat[s]=con;});
      if(sum(Object.values(dat))>0)nhanVe({phieuId:p.id,dat,phe:{}});
      dongPhieu({phieuId:p.id,lyDo:null});});
    closeSheet();render();
    if(donId)modalDon(donId,'nhan');else modalThoChiTiet(thoId);
    toast(`Đã nhận đủ ${g.soViec} việc của ${g.tho.ten}.`);
  }catch(e){toast(e.message,true)}
}

/* ============================================================
   ⚡ NHẬN NHANH — gom mọi công đoạn ĐỦ ĐIỀU KIỆN NHẬN toàn xưởng.
   Bấm 1 dòng → nhảy thẳng vào form nhận (đã điền sẵn) rồi quay lại bảng;
   hoặc "Nhận hết" theo từng thợ / tất cả (chạy nền, không mở form).
   Số & điều kiện dùng đúng logic form: pGiuCD + dkNhanDuoc + dkHeadroom.
   ============================================================ */
let _nhanNhanhBack=false,_nnReturn=null,_sheetClose=null;
/* mở bảng Nhận nhanh TỪ trang nhận hàng của 1 đơn -> nhớ đường về đúng trang đó */
function moNhanNhanhTuDon(donId){_nnReturn={donId};moNhanNhanh();}
/* đóng bảng Nhận nhanh: nếu mở từ trang nhận hàng thì quay lại đúng trang đó, không thoát ra màn chính */
function nnThoat(){const r=_nnReturn;_nnReturn=null;_nhanNhanhBack=false;if(r&&getDon(r.donId))modalDon(r.donId,'nhan');else closeSheet();}
/* số cái sẵn sàng nhận ở bước n của phiếu p (đúng công thức điền sẵn của lô) */
/* các bước ĐỦ ĐIỀU KIỆN NHẬN của phiếu (thợ đang giữ + điều kiện/mốc cho phép + còn số) */
/* CHUỖI BẬC của phiếu: 0 = nhận được ngay; 1 = còn 1 bước; 2 = còn 2 bước.
   Mô phỏng lần lượt hoàn thành bước sẵn sàng để mở khoá bước kế (đúng engine điều kiện). */
/* quét toàn xưởng -> gộp theo thợ, sắp thợ giữ lâu nhất lên trên */
/* CHUỖI ĐỦ CÔNG ĐOẠN của ĐƠN, từ trên xuống:
   tier 0 = nhận được ngay (có thợ đang giữ + đủ điều kiện);
   tier 1,2,3… = các công đoạn còn lại chưa nhận được (chưa giao / chờ bước trước),
   đánh số "còn N bước" theo thứ tự sản xuất. Chỉ bỏ công đoạn đã xong hết. */
function nnDonPipeline(don){
  const live=sizesOf(don).filter(s=>capDon(don,s)>0);const X=dkXcommit(don);
  const ten=i=>don.snapshotCD[i]?don.snapshotCD[i].ten:('bước '+(i+1));
  const full=don.snapshotCD.map((_,i)=>i);
  const remaining=full.filter(n=>live.some(s=>xongCD(don,n,s)<capDon(don,s)));
  const recvNow=n=>live.some(s=>dangGiuCD(don,n,s)>0&&dkNhanDuoc(don,n,s,X)&&dkHeadroom(don,n,s,X)>0);
  let fut=0;
  return remaining.map(n=>{
    if(recvNow(n)){const holders=[];
      DB.phieuGiao.filter(p=>p.donId===don.id&&p.trangThai==='MO'&&pLam(p,n)&&(pGiao(p)-pNhan(p))>0).forEach(p=>{
        const q=sum(live.map(s=>Math.max(0,Math.min(pGiuCD(p,n,s),nvLoTranSize(p,[n],s)))));
        if(q>0)holders.push({phieuId:p.id,tho:getTho(p.thoId),qty:q});});
      if(holders.length)return {n,ten:ten(n),tier:0,holders,qty:sum(holders.map(h=>h.qty)),pre:[]};}
    fut++;const giu=live.some(s=>dangGiuCD(don,n,s)>0);
    const pre=(dkCts(don,n)[0]||[]).filter(x=>full.indexOf(x)>=0&&live.some(s=>xongCD(don,x,s)<1)).map(ten);
    return {n,ten:ten(n),tier:fut,holders:[],qty:0,pre,giu};});}
/* quét toàn xưởng -> gộp theo ĐƠN (chỉ đơn có ≥1 công đoạn nhận được ngay) */
function nhanNhanhScan(){const ids=[];
  DB.phieuGiao.filter(p=>p.trangThai==='MO'&&(pGiao(p)-pNhan(p))>0).forEach(p=>{if(ids.indexOf(p.donId)<0)ids.push(p.donId);});
  const out=[];
  ids.forEach(id=>{const don=getDon(id);if(!don)return;
    const pipe=nnDonPipeline(don);if(!pipe.length)return;
    const greens=pipe.filter(r=>r.tier===0);
    const openP=DB.phieuGiao.filter(p=>p.donId===id&&p.trangThai==='MO');
    const ngay=Math.min.apply(null,openP.map(p=>p.ngay));
    out.push({donId:id,don,donMa:don.ma,chuTen:(getChu(don.chuHangId)||{}).ten||'',pipe,greens,
      hasGreen:greens.length>0,soSan:sum(greens.map(g=>g.holders.length)),tongCai:sum(greens.map(g=>g.qty)),ngay,days:days(ngay)});});
  return out.sort((a,b)=>(a.hasGreen?0:1)-(b.hasGreen?0:1)||a.ngay-b.ngay);}
function nhanNhanhCount(){return sum(nhanNhanhScan().map(g=>g.soSan));}
function nhanNhanhCoViec(){return DB.phieuGiao.some(p=>p.trangThai==='MO'&&(pGiao(p)-pNhan(p))>0);}
/* dựng batch mặc định (đúng bước sẵn-sàng đầu tiên, số điền sẵn) để nhận nền */
function nhanNhanhBatches(p){const full=pCds(p);const n=nvDefStage(p);const don=getDon(p.donId);
  const live=pSizes(p).filter(s=>capDon(don,s)>0);const dat={};
  live.forEach(s=>{const q=Math.max(0,Math.min(pGiuCD(p,n,s),nvLoTranSize(p,[n],s)));if(q>0)dat[s]=q;});
  if(!sum(Object.values(dat)))return[];
  return full.length<=1?[{dat,phe:{}}]:[{dat,phe:{},cds:[n]}];}
/* nhận nền 1 phiếu (bước sẵn sàng đầu tiên); đóng phiếu nếu đã xong hết gói */
function nhanNhanhChay(phieuId){const p=DB.phieuGiao.find(x=>x.id===phieuId);
  if(!p||p.trangThai!=='MO')return false;const batches=nhanNhanhBatches(p);if(!batches.length)return false;
  nhanVe({phieuId,batches});
  if(pXongHetBuoc(p)){p.hut=0;p.lyDoHut=null;p.thoTra=Math.max(0,pGiao(p)-pNhan(p));p.trangThai='DONG';}
  return true;}
/* bấm 1 dòng -> mở form nhận (đã điền sẵn), nhận xong quay lại bảng Nhận nhanh */
function nhanNhanhVao(phieuId){_nhanNhanhBack=true;modalNhanVe(phieuId);_sheetClose=()=>{_nhanNhanhBack=false;moNhanNhanh();};}
/* nhận LIÊN TIẾP cả chuỗi bước của 1 phiếu: xong bước này mở khoá bước sau, nhận tiếp */
function nhanNhanhChayChuoi(phieuId){let k=0,guard=0;
  while(guard++<40){if(!nhanNhanhChay(phieuId))break;k++;
    const p=DB.phieuGiao.find(x=>x.id===phieuId);if(!p||p.trangThai!=='MO')break;}
  return k;}
/* nhận liên tiếp mọi công đoạn sẵn sàng của 1 ĐƠN */
function nhanNhanhDon(donId){const g=nhanNhanhScan().find(x=>x.donId===donId);
  if(!g)return toast('Đơn này không còn công đoạn sẵn sàng.',true);
  const pids=[];g.greens.forEach(r=>r.holders.forEach(h=>{if(pids.indexOf(h.phieuId)<0)pids.push(h.phieuId);}));
  xacNhan('Đơn '+g.donMa+' — nhận liên tiếp '+g.soSan+' công đoạn đủ điều kiện?\nTiền công phần đạt sẽ ghi ngay.',()=>{
    try{let k=0;pids.forEach(pid=>{k+=nhanNhanhChayChuoi(pid);});
      Store.save();render();moNhanNhanh();toast('Đã nhận '+k+' công đoạn của đơn '+g.donMa+'.');
    }catch(e){toast(e.message,true);}},{title:'Nhận nhanh',ok:'Nhận'});}
/* nhận hết tất cả công đoạn sẵn sàng toàn xưởng */
function nhanNhanhTatCa(){const gs=nhanNhanhScan();if(!gs.length)return;
  const soDon=gs.length,soCD=sum(gs.map(g=>g.soSan));const pids=[];
  gs.forEach(g=>g.greens.forEach(r=>r.holders.forEach(h=>{if(pids.indexOf(h.phieuId)<0)pids.push(h.phieuId);})));
  xacNhan('Nhận liên tiếp mọi công đoạn đủ điều kiện của '+soDon+' đơn ('+soCD+' công đoạn)?\nTiền công phần đạt sẽ ghi ngay.',()=>{
    try{let k=0;pids.forEach(pid=>{k+=nhanNhanhChayChuoi(pid);});
      Store.save();render();moNhanNhanh();toast('Đã nhận '+k+' công đoạn.');
    }catch(e){toast(e.message,true);}},{title:'Nhận nhanh',ok:'Nhận hết'});}
/* mở bảng Nhận nhanh (bottom-sheet) — gom theo ĐƠN, liệt kê ĐỦ chuỗi công đoạn từ trên xuống */
function moNhanNhanh(){const gs=nhanNhanhScan();
  const nnBack=(_nnReturn&&getDon(_nnReturn.donId))?`<button class="btn btn-ghost btn-sm" style="width:100%;margin:-2px 0 10px;padding:7px 12px;text-align:left" onclick="nnThoat()">‹ Quay lại nhận hàng ${getDon(_nnReturn.donId).ma}</button>`:'';
  if(!gs.length){openSheet('⚡ Nhận nhanh',nnBack+`<div class="empty" style="padding:34px"><div class="ic">✅</div><b>Không có hàng nào đang ở thợ</b>Khi thợ nhận việc, các công đoạn sẽ hiện ở đây.</div>`);if(_nnReturn)_sheetClose=nnThoat;return;}
  const soCD=sum(gs.map(g=>g.soSan));const coXanh=gs.some(g=>g.hasGreen);
  let h=nnBack+`<div class="hint" style="margin:-2px 2px 10px">Mỗi đơn liệt kê <b>đủ công đoạn từ trên xuống</b>: 🟢 nhận được ngay (bấm để nhận, số điền sẵn) rồi các bước <b>chưa tới lượt</b> (⚪ còn N bước). Nhận xong bước xanh, bước kế tự lên xanh để bấm liên tiếp.</div>`;
  if(soCD>1)h+=`<button class="btn btn-sage" style="margin-bottom:12px" onclick="nhanNhanhTatCa()">✓ Nhận hết tất cả (${soCD} công đoạn)</button>`;
  let daChen=false;
  h+=gs.map(g=>{
    let sep='';
    if(!g.hasGreen&&!daChen){daChen=true;sep=`<div class="section-h" style="margin:10px 2px 6px;color:var(--ink-3)">Đang chờ — chưa tới lượt nhận</div>`;}
    const rows=g.pipe.map(r=>{
      if(r.tier===0){
        return r.holders.map(hd=>`<div class="slip" onclick="nhanNhanhVao('${hd.phieuId}')">
          <div style="flex:1;display:flex;justify-content:space-between;gap:8px;align-items:center">
            <span style="font-size:13px;font-weight:600">🟢 ${escHtml(r.ten)}${hd.tho?` · <span style="color:var(--ink-2);font-weight:500">${escHtml(hd.tho.ten)}</span>`:''}</span>
            <b style="color:#1f7a34;white-space:nowrap">${hd.qty} cái · nhận được ngay</b></div>
          <span style="color:var(--ink-3);align-self:center;margin-left:6px">›</span></div>`).join('');
      }
      const ly=r.pre&&r.pre.length?`cần ${r.pre.join(', ')}`:(r.giu?'thợ đang giữ, chờ bước trước':'chưa giao thợ');
      return `<div class="slip" style="opacity:.6">
        <div style="flex:1;display:flex;justify-content:space-between;gap:8px;align-items:center">
          <span style="font-size:12.5px">⚪ ${escHtml(r.ten)}</span>
          <span style="color:var(--ink-3);white-space:nowrap;font-size:11.5px">còn ${r.tier} bước · ${ly}</span></div></div>`;
    }).join('');
    const meta=g.hasGreen?`${g.soSan} công đoạn nhận được ngay · ${g.tongCai} cái`:`đang chờ · ${g.pipe.length} công đoạn`;
    return `${sep}<div class="pg-group"><div class="pg-head">
        <div><div class="who">${g.donMa}${g.chuTen?` · ${g.chuTen}`:''}</div>
          <div class="meta">${meta}</div></div>
        ${g.days>=3?`<div class="pg-warn">giữ ${g.days} ngày</div>`:''}</div>
      ${rows}
      ${g.soSan>1?`<div class="pg-foot"><button class="btn btn-sage btn-sm" onclick="nhanNhanhDon('${g.donId}')">✓ Nhận hết đơn ${g.donMa}</button></div>`:''}</div>`;}).join('');
  openSheet('⚡ Nhận nhanh',h);if(_nnReturn)_sheetClose=nnThoat;}

function quyRows(which){const pred=which==='chi'?(d=>d.tk===TK.QUY&&d.quy==='chi'):(d=>d.tk===TK.QUY&&d.quy!=='chi');
  const arr=DB.butToan.slice().sort((a,b)=>a.thoiDiem-b.thoiDiem);let run=0;const rows=[];
  for(const bt of arr){if(bt.dao_cua||bt.daDao)continue;let s=0;for(const d of bt.dong)if(pred(d))s+=(d.chieu==='NO'?d.soTien:-d.soTien);if(!s)continue;run+=s;rows.push({bt,s,run});}
  return rows;}

/* ===== Điều chỉnh (kiểm kê) số dư một quỹ về đúng tiền thật =====
   Ghi một khoản đối ứng VỐN để sổ luôn cân (Nợ=Có) và cầu nối tự khớp:
   delta>0 → coi như chủ bỏ thêm tiền; delta<0 → coi như chủ rút bớt. KHÔNG đụng lãi/lỗ.
   Khoản này hiện thành một dòng trong quỹ, có thể xóa/sửa lại như mọi khoản khác. */
function dieuChinhQuy({which,target,dienGiai,ngay}){
  const cur=which==='chi'?quyChi():quyChinh();
  const delta=Math.round(target)-cur;
  if(delta===0)throw new Error('Số dư đã đúng, không cần chỉnh.');
  const ten=which==='chi'?'Quỹ phụ':'Quỹ chính';
  const qline={tk:TK.QUY,chieu:delta>0?'NO':'CO',soTien:Math.abs(delta)};
  if(which==='chi')qline.quy='chi';
  beginOp();
  ghi('Điều chỉnh số dư '+ten+(dienGiai?': '+dienGiai:''),[
    qline,{tk:TK.VON,chieu:delta>0?'CO':'NO',soTien:Math.abs(delta)}],ngay?{thoiDiem:ngay}:null);
  Store.save();
}
function dcCalc(which){const h=el('dc_calc');if(!h)return;const cur=which==='chi'?quyChi():quyChinh();const d=numVal('dc_sl')-cur;
  h.innerHTML=d===0?'Bằng số cũ — không thay đổi.':(d>0?('Máy sẽ ghi thêm <b>+'+fmt(d)+'</b> (coi như bỏ thêm tiền vào quỹ).'):('Máy sẽ ghi bớt <b>−'+fmt(-d)+'</b> (coi như rút bớt tiền khỏi quỹ).'));}
function modalDieuChinhQuy(which){const cur=which==='chi'?quyChi():quyChinh();const ten=which==='chi'?'Quỹ phụ':'Quỹ chính';
  openSheet('Điều chỉnh số dư '+ten,`

    <div class="field"><label>Lý do (không bắt buộc)</label><input id="dc_dg" placeholder="VD: kiểm quỹ cuối tháng lệch"></div>

    <button class="btn btn-primary" onclick="submitDieuChinhQuy('${which}')">Ghi điều chỉnh</button>`);
  dcCalc(which);}
function submitDieuChinhQuy(which){try{const t=numVal('dc_sl');
  const dstr=(el('dc_ngay')||{}).value||'';if(!dstr)return toast('Chọn ngày.',true);
  const ts=kmTs(dstr);if(ts>now())return toast('Không ghi cho ngày chưa tới.',true);

/* Mở lại màn Ghi bổ sung để NHẬP TIẾP hàng loạt: giữ nguyên NGÀY + LOẠI + người vừa chọn,
   xóa số tiền và focus sẵn — phục vụ nhập bù cả tuần một lần. */
function gbsReopen(st){

  const d=el('gbs_ngay'); if(d&&st.dstr)d.value=st.dstr;
