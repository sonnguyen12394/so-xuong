<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Chim Bay — Phiêu Lưu</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:#0d1117;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100dvh;overflow:hidden;color:#fff;user-select:none;
  }
  #wrap{
    position:relative;
    width:min(100vw,440px);height:min(100dvh,760px);
    max-width:100vw;max-height:100dvh;
    box-shadow:0 20px 60px rgba(0,0,0,.5);border-radius:14px;overflow:hidden;
  }
  canvas{display:block;width:100%;height:100%;touch-action:none;background:#4ec0e0;}
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;text-align:center;
    padding:24px;background:rgba(12,18,28,.6);backdrop-filter:blur(3px);
    transition:opacity .25s;z-index:5;
  }
  .overlay.hidden{opacity:0;pointer-events:none;}
  .title{
    font-size:clamp(30px,9vw,48px);font-weight:800;letter-spacing:1px;color:#f9c22e;
    text-shadow:0 3px 0 #b8791b,0 6px 14px rgba(0,0,0,.4);
  }
  .subtitle{font-size:14px;opacity:.9;line-height:1.55;max-width:310px;}
  .btn{
    background:#f9c22e;color:#3a2c1a;border:none;font-size:19px;font-weight:700;
    padding:14px 44px;border-radius:999px;cursor:pointer;
    box-shadow:0 5px 0 #b8791b,0 8px 18px rgba(0,0,0,.35);
    transition:transform .08s,box-shadow .08s;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b8791b,0 3px 8px rgba(0,0,0,.35);}
  .score-big{font-size:60px;font-weight:800;text-shadow:0 3px 0 rgba(0,0,0,.3);line-height:1;}
  .best{font-size:15px;opacity:.85;}
  .medal{font-size:56px;line-height:1;}
  #hud{position:absolute;top:14px;left:0;right:0;text-align:center;pointer-events:none;z-index:4;}
  #hudScore{font-size:50px;font-weight:800;text-shadow:0 3px 0 rgba(0,0,0,.35);}
  #hudCombo{font-size:18px;font-weight:800;color:#ffd23f;text-shadow:0 2px 0 rgba(0,0,0,.4);min-height:22px;transition:transform .1s;}
  .hint{font-size:12px;opacity:.65;margin-top:2px;}
  .credit{position:absolute;bottom:8px;width:100%;text-align:center;font-size:11px;opacity:.45;z-index:3;pointer-events:none;}
  /* skin picker */
  .skinRow{display:flex;align-items:center;gap:14px;margin-top:2px;}
  .arrow{
    width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.15);
    color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .arrow:active{background:rgba(255,255,255,.3);}
  .skinBox{width:120px;}
  .skinName{font-size:16px;font-weight:700;margin-top:4px;}
  .skinLock{font-size:12px;opacity:.8;margin-top:2px;min-height:16px;color:#ffb4b4;}
  #skinCanvas{background:rgba(255,255,255,.08);border-radius:14px;}
  /* sound toggle */
  #soundBtn{
    position:absolute;top:12px;right:12px;z-index:6;width:40px;height:40px;border-radius:50%;
    border:none;background:rgba(12,18,28,.5);color:#fff;font-size:19px;cursor:pointer;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud"><div id="hudScore"></div><div id="hudCombo"></div></div>
  <button id="soundBtn" title="Bật/tắt âm thanh">🔊</button>

  <!-- Màn bắt đầu -->
  <div class="overlay" id="startScreen">
    <div class="title">CHIM BAY 🐤</div>
    <div class="subtitle">
      Chạm màn hình / <b>Space</b> để vỗ cánh.<br>
      Nhặt <b>xu 🪙</b>, gom <b>sức mạnh</b>, giữ <b>combo 🔥</b> để ghi điểm khủng!
    </div>
    <div class="skinRow">
      <button class="arrow" id="skinPrev">‹</button>
      <div class="skinBox">
        <canvas id="skinCanvas" width="120" height="96"></canvas>
        <div class="skinName" id="skinName">Gà Con</div>
        <div class="skinLock" id="skinLock"></div>
      </div>
      <button class="arrow" id="skinNext">›</button>
    </div>
    <button class="btn" id="startBtn">Chơi ngay</button>
    <div class="best" id="startBest"></div>
  </div>

  <!-- Màn kết thúc -->
  <div class="overlay hidden" id="overScreen">
    <div class="medal" id="medal"></div>
    <div style="font-size:20px;font-weight:600;" id="overTitle">Kết thúc</div>
    <div class="score-big" id="finalScore">0</div>
    <div class="best" id="finalDetail"></div>
    <div class="best" id="finalBest"></div>
    <button class="btn" id="againBtn">Chơi lại</button>
    <div class="hint">Chạm màn hình để chơi lại</div>
  </div>

  <div class="credit">Chim Bay · Phiêu Lưu Edition 🎮</div>
</div>

<script>
(function(){
  "use strict";

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hudScore = document.getElementById('hudScore');
  const hudCombo = document.getElementById('hudCombo');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');
  const startBtn = document.getElementById('startBtn');
  const againBtn = document.getElementById('againBtn');
  const finalScore = document.getElementById('finalScore');
  const finalDetail = document.getElementById('finalDetail');
  const finalBest = document.getElementById('finalBest');
  const startBest = document.getElementById('startBest');
  const medalEl = document.getElementById('medal');
  const soundBtn = document.getElementById('soundBtn');

  const W = 440, H = 760;
  const FLOOR_H = 96;
  const PIPE_W = 66;
  const GRAVITY = 0.45;
  const FLAP = -7.6;
  const GAP_MIN = 155, GAP_MAX = 200;

  function resize(){
    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Skins ----------
  const SKINS = [
    { id:'chick',  name:'Gà Con',   unlock:0,  body:'#f9c22e', dark:'#c8901a', belly:'#ffe08a', wing:'#f2ab1e', beak:'#f37021', beakDark:'#c8560f' },
    { id:'blue',   name:'Chim Xanh', unlock:8,  body:'#4aa3f0', dark:'#2f6fc0', belly:'#c3e2ff', wing:'#2f86d6', beak:'#f5a623', beakDark:'#c47f12' },
    { id:'parrot', name:'Vẹt Đỏ',   unlock:18, body:'#e0483d', dark:'#b02f26', belly:'#ffd7a8', wing:'#c5352b', beak:'#ffd23f', beakDark:'#c9a010' },
    { id:'dragon', name:'Rồng Nhí', unlock:30, body:'#57c36a', dark:'#37934a', belly:'#d3f0b8', wing:'#3f9e4f', beak:'#ffcf5b', beakDark:'#c99a2b' },
    { id:'ghost',  name:'Ma Bay',   unlock:45, body:'#eef0f7', dark:'#c4c7d6', belly:'#ffffff', wing:'#dadce9', beak:'#b9bcd0', beakDark:'#9498ad' }
  ];
  let skinIdx = parseInt(localStorage.getItem('flappy_skin') || '0', 10) || 0;
  let best = parseInt(localStorage.getItem('flappy_best') || '0', 10);
  let soundOn = localStorage.getItem('flappy_sound') !== 'off';
  soundBtn.textContent = soundOn ? '🔊' : '🔇';

  function skinUnlocked(i){ return best >= SKINS[i].unlock; }

  // ---------- Audio (WebAudio, không cần file) ----------
  let actx = null;
  function initAudio(){
    if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(actx && actx.state === 'suspended') actx.resume();
  }
  function beep(freq, dur, type, vol, slideTo){
    if(!soundOn || !actx) return;
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime((vol||0.1), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur);
  }
  const sfx = {
    flap: ()=> beep(520, 0.09, 'square', 0.06, 380),
    coin: ()=> { beep(880,0.07,'square',0.09); setTimeout(()=>beep(1180,0.09,'square',0.09),60); },
    power:()=> { beep(600,0.1,'triangle',0.12,1200); setTimeout(()=>beep(1000,0.14,'triangle',0.1,1600),90); },
    hit:  ()=> beep(200, 0.25, 'sawtooth', 0.14, 60),
    shield:()=> beep(300,0.18,'triangle',0.13,700),
    over: ()=> { beep(400,0.15,'square',0.12,200); setTimeout(()=>beep(260,0.2,'square',0.12,120),140); setTimeout(()=>beep(160,0.3,'square',0.12,80),300); }
  };

  // ---------- Trạng thái ----------
  const READY=0, PLAY=1, OVER=2;
  let state = READY;
  let bird, pipes, items, particles, popups;
  let score, coinBonus, combo, comboTimer, frame, speed, spawnEvery, groundX;
  let curLevel, lastLevel;
  let shakeT, shakeMag, flashT, flashColor, overGuard;
  let inv, invT, slow, slowT, shield;
  let stars;

  function makeStars(){
    stars = [];
    for(let i=0;i<40;i++){
      stars.push({ x:Math.random()*W, y:Math.random()*(H-FLOOR_H-120), r:Math.random()*1.6+0.4, tw:Math.random()*Math.PI*2 });
    }
  }
  makeStars();

  function reset(){
    bird = { x: W*0.28, y: H*0.45, r: 15, vy:0, rot:0, flapT:0, trail:0 };
    pipes = []; items = []; particles = []; popups = [];
    score = 0; coinBonus = 0; combo = 1; comboTimer = 0;
    frame = 0; speed = 2.6; spawnEvery = 100; groundX = 0;
    curLevel = 1; lastLevel = 1;
    shakeT = 0; shakeMag = 0; flashT = 0; overGuard = 0;
    inv = false; invT = 0; slow = false; slowT = 0; shield = false;
    hudScore.textContent = ''; hudCombo.textContent = '';
  }

  // ---------- Spawn ----------
  // Số giây đã sống trong ván hiện tại (độ khó tăng theo thời gian này)
  function elapsedSec(){ return state===READY ? 0 : frame/60; }
  function currentGap(){
    // khe hở thu hẹp dần theo thời gian: 200 -> 150 trong ~55 giây
    return Math.max(GAP_MIN, GAP_MAX - Math.min(elapsedSec()*0.9, GAP_MAX-GAP_MIN));
  }
  function spawnPipe(){
    const gap = currentGap();
    const margin = 64;
    const top = margin + Math.random()*(H - FLOOR_H - gap - margin*2);
    const secs = elapsedSec();
    const moving = secs >= 20 && Math.random() < Math.min(0.12 + (secs-20)*0.008, 0.4);
    const p = { x: W + PIPE_W, top, gap, passed:false,
                moving, baseTop:top, phase:Math.random()*Math.PI*2, amp: 26 + Math.random()*22 };
    pipes.push(p);

    // Vật phẩm trong khe
    const cx = W + PIPE_W + PIPE_W/2;
    const cy = top + gap/2;
    const roll = Math.random();
    if(score >= 3 && roll < 0.14){
      const kinds = ['shield','star','slow'];
      const kind = kinds[Math.floor(Math.random()*kinds.length)];
      items.push({ x:cx, y:cy, r:16, type:kind, t:0 });
    } else if(roll < 0.72){
      // hàng xu hình vòng cung
      const n = 3;
      for(let i=0;i<n;i++){
        items.push({ x:cx + (i-1)*30, y:cy + Math.sin(i-1)*10, r:11, type:'coin', t:0 });
      }
    }
  }

  // ---------- Điều khiển bay ----------
  function flap(){
    initAudio();
    if(state === READY){ startGame(); return; }
    if(state === OVER){ if(overGuard<=0) startGame(); return; }
    bird.vy = FLAP; bird.flapT = 8;
    sfx.flap();
    for(let i=0;i<3;i++){
      particles.push({ x:bird.x-8, y:bird.y+4, vx:-Math.random()*1.5-0.5, vy:Math.random()*1.2-0.6,
                       life:20, max:20, size:Math.random()*2+1.5, color:'#ffffff', g:0.02 });
    }
  }

  function startGame(){
    initAudio();
    reset();
    state = PLAY;
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
  }

  function gameOver(){
    state = OVER;
    overGuard = 24; // ~0.4s chống chạm nhầm
    hudScore.textContent = ''; hudCombo.textContent = '';
    shakeT = 18; shakeMag = 9; flashT = 8; flashColor = '#ff5a5a';
    sfx.hit(); sfx.over();
    // nổ hạt
    for(let i=0;i<26;i++){
      const a = Math.random()*Math.PI*2, s = Math.random()*4+1.5;
      particles.push({ x:bird.x, y:bird.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-1,
                       life:40, max:40, size:Math.random()*3+2, color: Math.random()<0.5?SKINS[skinIdx].body:'#ffffff', g:0.15 });
    }
    if(score > best){ best = score; localStorage.setItem('flappy_best', String(best)); }
    finalScore.textContent = score;
    finalDetail.textContent = '🪙 Điểm xu: ' + coinBonus;
    finalBest.textContent = '🏆 Kỷ lục: ' + best;
    let m='🐣';
    if(score>=60) m='👑'; else if(score>=40) m='🥇'; else if(score>=20) m='🥈'; else if(score>=10) m='🥉';
    medalEl.textContent = m;
    overScreen.classList.remove('hidden');
    refreshStartUI();
  }

  // ---------- Cập nhật ----------
  function update(){
    frame++;
    if(overGuard>0) overGuard--;
    const ts = slow ? 0.5 : 1;   // hệ số thời gian (chậm)

    // powerup timers
    if(inv){ invT--; if(invT<=0){ inv=false; } }
    if(slow){ slowT--; if(slowT<=0){ slow=false; } }
    if(comboTimer>0){ comboTimer--; if(comboTimer<=0) combo=1; }

    // chim
    bird.vy += GRAVITY * ts;
    bird.y += bird.vy * ts;
    if(bird.flapT>0) bird.flapT--;
    const target = Math.max(-0.5, Math.min(1.4, bird.vy/12));
    bird.rot += (target - bird.rot)*0.2;

    // vệt cầu vồng khi vô địch
    if(inv && frame%2===0){
      particles.push({ x:bird.x-6, y:bird.y, vx:-1, vy:0, life:18, max:18, size:5,
                       color:'hsl('+(frame*20%360)+',90%,60%)', g:0 });
    }

    // độ khó tăng dần theo THỜI GIAN sống sót
    const secs = frame/60;
    speed = 2.6 + Math.min(secs*0.045, 2.6);           // 2.6 -> 5.2 trong ~58s
    spawnEvery = Math.max(70, 100 - secs*0.55);          // ống ra dày hơn theo thời gian
    // "MÀN" mới mỗi 12 giây -> báo hiệu độ khó lên
    curLevel = 1 + Math.floor(secs/12);
    if(curLevel > lastLevel){
      lastLevel = curLevel;
      addScorePopup(W/2, H*0.32, 'MÀN '+curLevel+'!', '#ff8c42');
      flashT = 6; flashColor = '#ffd6a0'; shakeT = 8; shakeMag = 5;
      sfx.power();
    }
    // sinh ống
    if(frame % Math.round(spawnEvery) === 0) spawnPipe();

    const eff = speed * ts;

    // ống
    for(let i=pipes.length-1;i>=0;i--){
      const p = pipes[i];
      p.x -= eff;
      if(p.moving){
        p.phase += 0.03*ts;
        p.top = p.baseTop + Math.sin(p.phase)*p.amp;
        p.top = Math.max(50, Math.min(H-FLOOR_H-p.gap-50, p.top));
      }
      if(!p.passed && p.x + PIPE_W < bird.x){
        p.passed = true; score++;
        addScorePopup(bird.x+20, bird.y-24, '+1', '#ffffff');
        hudScore.textContent = score;
        if(score>0 && score%10===0){ flashT=6; flashColor='#ffffff'; }
      }
      if(!inv && collidePipe(bird,p)){ handleHit(); if(state===OVER) return; }
      if(p.x + PIPE_W < -10) pipes.splice(i,1);
    }

    // vật phẩm
    for(let i=items.length-1;i>=0;i--){
      const it = items[i];
      it.x -= eff; it.t += ts;
      const dx = it.x - bird.x, dy = it.y - bird.y;
      if(dx*dx+dy*dy < (it.r+bird.r)*(it.r+bird.r)){
        collectItem(it);
        items.splice(i,1);
        continue;
      }
      if(it.x < -30) items.splice(i,1);
    }

    // đất / trần
    if(bird.y + bird.r >= H - FLOOR_H){
      bird.y = H - FLOOR_H - bird.r;
      if(!inv){ gameOver(); return; } else { bird.vy = FLAP*0.7; }
    }
    if(bird.y - bird.r < 0){ bird.y = bird.r; if(bird.vy<0) bird.vy = 0; }

    groundX = (groundX - eff) % 24;

    updateParticles();
    updatePopups();
    if(shakeT>0) shakeT--;
    if(flashT>0) flashT--;

    // HUD combo
    if(combo>1){ hudCombo.textContent = 'COMBO x'+combo+' 🔥'; }
    else hudCombo.textContent = '';
  }

  function handleHit(){
    if(shield){
      shield = false;
      shakeT = 10; shakeMag = 6; flashT = 6; flashColor = '#7fd6ff';
      inv = true; invT = 45; // vài frame bất tử để thoát
      sfx.shield();
      addScorePopup(bird.x, bird.y-26, 'KHIÊN!', '#7fd6ff');
      for(let i=0;i<16;i++){ const a=Math.random()*Math.PI*2,s=Math.random()*3+1;
        particles.push({x:bird.x,y:bird.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:26,max:26,size:3,color:'#7fd6ff',g:0.05}); }
      bird.vy = FLAP*0.6;
    } else {
      gameOver();
    }
  }

  function collectItem(it){
    if(it.type === 'coin'){
      comboTimer = 200;
      combo = Math.min(combo+1, 9);
      const val = combo;
      coinBonus += val; score += val;
      hudScore.textContent = score;
      addScorePopup(it.x, it.y-14, '+'+val, '#ffd23f');
      hudCombo.style.transform = 'scale(1.25)';
      setTimeout(()=>hudCombo.style.transform='scale(1)',100);
      sfx.coin();
      sparkle(it.x, it.y, '#ffd23f', 8);
    } else {
      sfx.power();
      if(it.type==='shield'){ shield=true; addScorePopup(it.x,it.y-16,'KHIÊN 🛡️','#7fd6ff'); sparkle(it.x,it.y,'#7fd6ff',14); }
      else if(it.type==='star'){ inv=true; invT=Math.max(invT,300); addScorePopup(it.x,it.y-16,'VÔ ĐỊCH ⭐','#ffe14d'); sparkle(it.x,it.y,'#ffe14d',16); }
      else if(it.type==='slow'){ slow=true; slowT=Math.max(slowT,240); addScorePopup(it.x,it.y-16,'CHẬM ⏳','#b7a7ff'); sparkle(it.x,it.y,'#b7a7ff',14); }
    }
  }

  function collidePipe(b,p){
    const r = b.r*0.82;
    if(b.x+r>p.x && b.x-r<p.x+PIPE_W){
      if(b.y-r < p.top || b.y+r > p.top+p.gap) return true;
    }
    return false;
  }

  // ---------- Hạt & popup ----------
  function sparkle(x,y,color,n){
    for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2,s=Math.random()*3+1;
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:24,max:24,size:Math.random()*2.5+1.5,color,g:0.03}); }
  }
  function updateParticles(){
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=p.g||0; p.life--;
      if(p.life<=0) particles.splice(i,1);
    }
  }
  function addScorePopup(x,y,text,color){ popups.push({x,y,text,color,life:36,max:36}); }
  function updatePopups(){
    for(let i=popups.length-1;i>=0;i--){ const q=popups[i]; q.y-=0.8; q.life--; if(q.life<=0) popups.splice(i,1); }
  }

  // ---------- Bối cảnh ngày/đêm ----------
  const SKY = {
    day:    [[78,192,224],[143,214,234],[201,233,172]],
    sunset: [[255,140,90],[255,185,138],[255,214,160]],
    night:  [[26,33,64],[43,53,96],[61,74,107]]
  };
  function lerp(a,b,t){ return a+(b-a)*t; }
  function mix(c1,c2,t){ return [lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)]; }
  function rgb(c){ return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')'; }
  function skyColors(){
    const p = Math.min(elapsedSec()/28, 2);   // hoàng hôn ~28s, đêm ~56s
    let a,b;
    if(p<1){ a=SKY.day; b=SKY.sunset; } else { a=SKY.sunset; b=SKY.night; }
    const t = p<1? p : p-1;
    return [ mix(a[0],b[0],t), mix(a[1],b[1],t), mix(a[2],b[2],t) ];
  }
  function nightAmount(){ return Math.max(0, Math.min(1, (elapsedSec()/28 - 1))); }

  // ---------- Vẽ ----------
  function drawBackground(){
    const c = skyColors();
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,rgb(c[0])); g.addColorStop(0.6,rgb(c[1])); g.addColorStop(1,rgb(c[2]));
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    const night = nightAmount();
    // mặt trời / mặt trăng
    const cx = 340, cy = 110 + night*10;
    if(night < 0.5){
      ctx.globalAlpha = 1-night*1.4;
      ctx.fillStyle='#fff3b0'; ctx.beginPath(); ctx.arc(cx,cy,30,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    } else {
      ctx.globalAlpha=(night-0.4)/0.6;
      ctx.fillStyle='#f5f3d8'; ctx.beginPath(); ctx.arc(cx,cy,26,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=rgb(mix(SKY.night[0],SKY.night[0],0)); ctx.beginPath(); ctx.arc(cx+9,cy-6,24,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    }
    // sao ban đêm
    if(night>0.1){
      ctx.fillStyle='#fff';
      for(const s of stars){
        const a = (0.4+0.6*Math.abs(Math.sin(frame*0.05+s.tw)))*night;
        ctx.globalAlpha=a; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha=1;
    }
    // mây (mờ dần về đêm)
    ctx.fillStyle='rgba(255,255,255,'+(0.5*(1-night)+0.08)+')';
    cloud(70,150,34); cloud(300,90,42); cloud(190,220,26);
  }
  function cloud(x,y,r){
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2); ctx.arc(x+r,y+6,r*0.8,0,Math.PI*2); ctx.arc(x-r,y+8,r*0.7,0,Math.PI*2);
    ctx.fill();
  }
  function roundRectPath(x,y,w,h,r){
    if(h<=0){ ctx.beginPath(); return; }
    r=Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function drawPipe(p){
    const gt=p.top, gb=p.top+p.gap;
    const night=nightAmount();
    const grad=ctx.createLinearGradient(p.x,0,p.x+PIPE_W,0);
    grad.addColorStop(0, p.moving?'#c07be0':'#5cb64a');
    grad.addColorStop(0.5, p.moving?'#d99bf0':'#7ed957');
    grad.addColorStop(1, p.moving?'#9c56c0':'#4a9e38');
    ctx.fillStyle=grad; ctx.strokeStyle=p.moving?'#7a3fa0':'#3c7a2e'; ctx.lineWidth=3;
    roundRectPath(p.x,0,PIPE_W,gt,4); ctx.fill(); ctx.stroke();
    roundRectPath(p.x-5,gt-26,PIPE_W+10,26,6); ctx.fill(); ctx.stroke();
    roundRectPath(p.x,gb,PIPE_W,H-FLOOR_H-gb,4); ctx.fill(); ctx.stroke();
    roundRectPath(p.x-5,gb,PIPE_W+10,26,6); ctx.fill(); ctx.stroke();
    if(night>0.3){ ctx.fillStyle='rgba(20,26,50,'+(night*0.35)+')';
      ctx.fillRect(p.x,0,PIPE_W,gt); ctx.fillRect(p.x,gb,PIPE_W,H-FLOOR_H-gb); }
  }
  function drawGround(){
    const y=H-FLOOR_H, night=nightAmount();
    ctx.fillStyle=rgb(mix([222,216,149],[70,74,110],night)); ctx.fillRect(0,y,W,FLOOR_H);
    ctx.fillStyle=rgb(mix([126,200,80],[44,90,70],night)); ctx.fillRect(0,y,W,14);
    ctx.fillStyle=rgb(mix([92,182,74],[34,70,56],night));
    for(let x=groundX;x<W;x+=24) ctx.fillRect(x,y+10,12,6);
    ctx.fillStyle=rgb(mix([207,199,125],[60,64,96],night));
    for(let x=groundX*0.6;x<W;x+=40) ctx.fillRect(x,y+22,24,FLOOR_H-22);
  }

  function drawItem(it){
    const bob = Math.sin(it.t*0.15)*2;
    ctx.save(); ctx.translate(it.x, it.y+bob);
    if(it.type==='coin'){
      const w = Math.abs(Math.cos(it.t*0.12))*it.r + 3; // xoay
      ctx.fillStyle='#ffcf2e'; ctx.strokeStyle='#c99a10'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(0,0,w,it.r,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#fff1a8'; ctx.beginPath(); ctx.ellipse(-w*0.3,-it.r*0.3,w*0.35,it.r*0.4,0,0,Math.PI*2); ctx.fill();
    } else {
      const map={shield:['#7fd6ff','#2f9fd6','🛡️'], star:['#ffe14d','#e0a81f','⭐'], slow:['#b7a7ff','#7a63d6','⏳']};
      const m=map[it.type];
      const pulse=1+Math.sin(it.t*0.2)*0.08;
      ctx.scale(pulse,pulse);
      const g=ctx.createRadialGradient(0,0,2,0,0,it.r+4);
      g.addColorStop(0,m[0]); g.addColorStop(1,m[1]);
      ctx.fillStyle=g; ctx.strokeStyle='#fff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,0,it.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.font='16px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(m[2],0,1);
    }
    ctx.restore();
  }

  function drawBird(x,y,rot,r,flapT,skin,ghostAlpha){
    ctx.save();
    ctx.translate(x,y); ctx.rotate(rot);
    if(skin.id==='ghost') ctx.globalAlpha = ghostAlpha!=null?ghostAlpha:0.85;

    // hào quang khi vô địch
    if(inv && state===PLAY){
      ctx.save();
      ctx.globalAlpha=0.5;
      const g=ctx.createRadialGradient(0,0,r*0.5,0,0,r+12);
      g.addColorStop(0,'hsla('+(frame*20%360)+',90%,60%,0.9)'); g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r+12,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    ctx.fillStyle=skin.body; ctx.strokeStyle=skin.dark; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(0,0,r+3,r,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle=skin.belly; ctx.beginPath(); ctx.ellipse(2,5,r-2,r-5,0,0,Math.PI*2); ctx.fill();

    // đặc trưng từng skin
    if(skin.id==='parrot'){ ctx.fillStyle=skin.wing; ctx.beginPath();
      ctx.moveTo(-4,-r); ctx.quadraticCurveTo(-14,-r-10,-2,-r-4); ctx.quadraticCurveTo(4,-r-8,4,-r+2); ctx.fill(); }
    if(skin.id==='dragon'){ ctx.fillStyle='#ffe38a'; ctx.strokeStyle=skin.dark;
      ctx.beginPath(); ctx.moveTo(4,-r); ctx.lineTo(8,-r-9); ctx.lineTo(12,-r); ctx.fill();
      ctx.fillStyle=skin.dark; for(let i=-1;i<2;i++){ ctx.beginPath();
        ctx.moveTo(i*7,-r+1); ctx.lineTo(i*7+3,-r-5); ctx.lineTo(i*7+6,-r+1); ctx.fill(); } }

    // cánh
    const up=flapT>0;
    ctx.fillStyle=skin.wing; ctx.strokeStyle=skin.dark; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(-3, up?-4:4, 9,6, up?-0.5:0.4, 0,Math.PI*2); ctx.fill(); ctx.stroke();

    // mắt
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(r-2,-5,6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(r,-5,3,0,Math.PI*2); ctx.fill();
    // mỏ
    ctx.fillStyle=skin.beak; ctx.strokeStyle=skin.beakDark;
    ctx.beginPath(); ctx.moveTo(r+2,-1); ctx.lineTo(r+14,2); ctx.lineTo(r+2,6); ctx.closePath(); ctx.fill(); ctx.stroke();

    // khiên
    if(shield && state===PLAY){
      ctx.globalAlpha=0.55+Math.sin(frame*0.2)*0.15;
      ctx.strokeStyle='#7fd6ff'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(0,0,r+8,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=1;
    }
    ctx.restore();
  }

  function drawParticles(){
    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life/p.max);
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  function drawPopups(){
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(const q of popups){
      ctx.globalAlpha=Math.max(0,q.life/q.max);
      ctx.font='bold 20px Segoe UI, sans-serif';
      ctx.fillStyle=q.color; ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=3;
      ctx.strokeText(q.text,q.x,q.y); ctx.fillText(q.text,q.x,q.y);
    }
    ctx.globalAlpha=1;
  }
  function drawPowerBars(){
    // nhãn MÀN (level) góc trên trái
    let yy=16;
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.font='bold 15px Segoe UI, sans-serif';
    const lvTxt = 'MÀN '+curLevel;
    ctx.fillStyle='rgba(0,0,0,.28)'; roundRectPath(12,yy,74,20,8); ctx.fill();
    ctx.fillStyle='#ffd6a0'; ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=3;
    ctx.strokeText(lvTxt,18,yy+10); ctx.fillText(lvTxt,18,yy+10);
    yy+=26;
    // thanh thời gian sức mạnh
    ctx.font='14px serif';
    function bar(icon,frac,col){
      ctx.fillStyle='rgba(0,0,0,.25)'; roundRectPath(12,yy,88,16,8); ctx.fill();
      ctx.fillStyle=col; roundRectPath(12,yy,Math.max(16,88*frac),16,8); ctx.fill();
      ctx.fillText(icon,15,yy+8);
      yy+=22;
    }
    if(inv) bar('⭐', invT/300, '#ffe14d');
    if(slow) bar('⏳', slowT/240, '#b7a7ff');
    if(shield){ ctx.font='16px serif'; ctx.fillText('🛡️',14,yy+8); yy+=22; }
  }

  function render(){
    ctx.save();
    if(shakeT>0){ ctx.translate((Math.random()*2-1)*shakeMag, (Math.random()*2-1)*shakeMag); }
    drawBackground();
    for(const it of items) drawItem(it);
    for(const p of pipes) drawPipe(p);
    drawGround();
    drawParticles();
    if(bird) drawBird(bird.x,bird.y,bird.rot,bird.r,bird.flapT,SKINS[skinIdx]);
    drawPopups();
    if(state===PLAY) drawPowerBars();
    ctx.restore();
    // flash toàn màn
    if(flashT>0){ ctx.globalAlpha=flashT/8*0.4; ctx.fillStyle=flashColor||'#fff'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  }

  function loop(){
    if(state===PLAY){ update(); }
    else if(state===READY && bird){
      frame++;
      bird.y = H*0.45 + Math.sin(frame*0.08)*8;
      bird.rot = Math.sin(frame*0.08)*0.12;
      groundX = (groundX-1.5)%24;
      updateParticles();
    } else if(state===OVER){
      if(overGuard>0) overGuard--;
      updateParticles(); updatePopups();
      if(shakeT>0) shakeT--; if(flashT>0) flashT--;
    }
    render();
    requestAnimationFrame(loop);
  }

  // ---------- Skin picker UI ----------
  const skinCanvas = document.getElementById('skinCanvas');
  const sctx = skinCanvas.getContext('2d');
  const skinNameEl = document.getElementById('skinName');
  const skinLockEl = document.getElementById('skinLock');

  function drawSkinPreview(){
    sctx.clearRect(0,0,120,96);
    const skin = SKINS[skinIdx];
    const unlocked = skinUnlocked(skinIdx);
    // vẽ chim mini trong khung chọn nhân vật
    sctx.save(); sctx.translate(60,48); sctx.scale(1.6,1.6);
    if(!unlocked) sctx.globalAlpha=0.35;
    sctx.fillStyle=skin.body; sctx.strokeStyle=skin.dark; sctx.lineWidth=2;
    sctx.beginPath(); sctx.ellipse(0,0,18,15,0,0,Math.PI*2); sctx.fill(); sctx.stroke();
    sctx.fillStyle=skin.belly; sctx.beginPath(); sctx.ellipse(2,4,13,10,0,0,Math.PI*2); sctx.fill();
    sctx.fillStyle=skin.wing; sctx.strokeStyle=skin.dark;
    sctx.beginPath(); sctx.ellipse(-3,3,9,6,0.4,0,Math.PI*2); sctx.fill(); sctx.stroke();
    sctx.fillStyle='#fff'; sctx.beginPath(); sctx.arc(13,-5,6,0,Math.PI*2); sctx.fill();
    sctx.fillStyle='#222'; sctx.beginPath(); sctx.arc(15,-5,3,0,Math.PI*2); sctx.fill();
    sctx.fillStyle=skin.beak; sctx.strokeStyle=skin.beakDark;
    sctx.beginPath(); sctx.moveTo(16,-1); sctx.lineTo(28,2); sctx.lineTo(16,6); sctx.closePath(); sctx.fill(); sctx.stroke();
    sctx.restore();
    if(!unlocked){ sctx.font='26px serif'; sctx.textAlign='center'; sctx.textBaseline='middle'; sctx.fillText('🔒',60,48); }

    skinNameEl.textContent = skin.name;
    skinLockEl.textContent = unlocked ? '' : 'Mở khóa khi đạt '+skin.unlock+' điểm';
    startBtn.style.opacity = unlocked ? '1':'0.5';
  }
  function refreshStartUI(){
    startBest.textContent = best>0 ? '🏆 Kỷ lục: '+best : '';
    drawSkinPreview();
  }
  document.getElementById('skinPrev').addEventListener('click', e=>{ e.stopPropagation();
    skinIdx=(skinIdx-1+SKINS.length)%SKINS.length; drawSkinPreview(); });
  document.getElementById('skinNext').addEventListener('click', e=>{ e.stopPropagation();
    skinIdx=(skinIdx+1)%SKINS.length; drawSkinPreview(); });

  // ---------- Điều khiển ----------
  function tryStart(){
    if(!skinUnlocked(skinIdx)){
      skinLockEl.textContent='🔒 Chưa mở khóa — chọn nhân vật khác!';
      return;
    }
    localStorage.setItem('flappy_skin', String(skinIdx));
    startGame();
  }
  window.addEventListener('keydown', e=>{
    if(e.code==='Space'||e.code==='ArrowUp'){
      e.preventDefault();
      if(state===READY){ tryStart(); return; }
      if(state===OVER){ if(overGuard<=0) tryStart(); return; }
      flap();
    }
  });
  canvas.addEventListener('pointerdown', e=>{ e.preventDefault(); if(state===PLAY) flap(); });
  startBtn.addEventListener('click', e=>{ e.stopPropagation(); tryStart(); });
  againBtn.addEventListener('click', e=>{ e.stopPropagation(); if(overGuard<=0) tryStart(); });
  overScreen.addEventListener('pointerdown', e=>{ if(e.target===overScreen && overGuard<=0) tryStart(); });
  soundBtn.addEventListener('click', e=>{ e.stopPropagation(); soundOn=!soundOn;
    soundBtn.textContent=soundOn?'🔊':'🔇'; localStorage.setItem('flappy_sound', soundOn?'on':'off'); if(soundOn){ initAudio(); } });

  refreshStartUI();
  reset();
  state = READY;
  loop();
})();
</script>
</body>
</html>
