<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sổ Xưởng — Quản lý xưởng may gia công</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cloth:#1B2A4A;--cloth-2:#24365C;--muslin:#FAF7F0;--chalk:#FFFFFF;--card:#FFFFFF;
  --tape:#E8A33D;--tape-soft:#FBEBCB;--thread:#C0392B;--thread-soft:#F7DDD8;
  --sage:#2F7A63;--sage-soft:#DDEDE6;--ink:#20293A;--ink-2:#5B6676;--ink-3:#8A94A3;
  --line:#E7E2D6;--line-2:#EFEBE1;--shadow:0 1px 2px rgba(27,42,74,.06),0 6px 20px rgba(27,42,74,.06);--radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--muslin);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
#app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--muslin);position:relative;padding-bottom:76px}
header.top{background:var(--cloth);color:var(--chalk);padding:14px 18px 16px;position:sticky;top:0;z-index:20;border-bottom:2px dashed rgba(255,255,255,.18)}
header.top .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand span{font-size:11px;color:var(--tape);font-weight:600;text-transform:uppercase;letter-spacing:.14em}
.h-sub{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:3px}
.pill-cash{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 12px;text-align:right;min-width:112px}
.pill-cash small{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tape);font-weight:700}
.pill-cash b{font-size:15px;font-weight:700}
.hdr-gear{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);color:#fff;font-size:18px;line-height:1}
main{padding:16px 14px 8px}
.view-title{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:2px 2px 14px}
.view-title small{display:block;font-weight:500;font-size:13px;color:var(--ink-2);letter-spacing:0;margin-top:2px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;max-width:460px;margin:0 auto;background:var(--chalk);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{padding:9px 2px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);font-size:10px;font-weight:600;line-height:1.05;text-align:center}
nav.bottom button .ic{font-size:18px;line-height:1}
nav.bottom button.on{color:var(--cloth)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card-pad{padding:14px 15px}
.order-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;position:relative}
.order-card:active{transform:scale(.994)}
.oc-head{padding:13px 15px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.oc-ma{font-weight:800;font-size:16px;letter-spacing:-.01em}
.oc-cust{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.oc-qty{font-size:12px;color:var(--ink-2);text-align:right;white-space:nowrap}
.oc-qty b{color:var(--ink);font-size:15px}
.stages{display:flex;gap:0;padding:2px 15px 14px;align-items:flex-start}
.stg{flex:1;position:relative;text-align:center}
.stg .dot{width:15px;height:15px;border-radius:50%;margin:0 auto 5px;border:2.5px solid var(--line);background:var(--card);position:relative;z-index:2}
.stg.done .dot{background:var(--sage);border-color:var(--sage)}
.stg.active .dot{background:var(--tape);border-color:var(--tape);box-shadow:0 0 0 4px var(--tape-soft)}
.stg .thread-line{position:absolute;top:6px;left:-50%;width:100%;height:2.5px;background:var(--line);z-index:1}
.stg.reached .thread-line{background:var(--sage)}
.stg:first-child .thread-line{display:none}
.stg .lbl{font-size:9.5px;color:var(--ink-3);line-height:1.15;font-weight:600}
.stg .tn{font-size:12px;font-weight:700;color:var(--ink)}
.stg.has .tn{color:var(--tape)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
.b-run{background:var(--tape-soft);color:#9A6612}
.b-part{background:#E7EEF9;color:#2C4A7A}
.b-done{background:var(--sage-soft);color:var(--sage)}
.b-cham{background:#EDE4F7;color:#6B3FA0}
.b-huy{background:var(--line-2);color:var(--ink-2)}
.b-tra{background:var(--thread-soft);color:var(--thread)}
.alert-strip{font-size:12px;font-weight:600;padding:7px 15px;display:flex;align-items:center;gap:7px;border-top:1px dashed rgba(0,0,0,.1)}
.as-red{background:var(--thread-soft);color:var(--thread)}
.as-green{background:var(--sage-soft);color:var(--sage)}
.as-amber{background:var(--tape-soft);color:#9A6612}
.as-purple{background:#EDE4F7;color:#6B3FA0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:15px;padding:12px 16px;border-radius:12px;transition:.12s;width:100%}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--cloth);color:#fff}
.btn-tape{background:var(--tape);color:#3a2803}
.btn-ghost{background:var(--muslin);color:var(--ink);border:1px solid var(--line)}
.btn-sage{background:var(--sage);color:#fff}
.btn-danger{background:var(--card);color:var(--thread);border:1px solid var(--thread-soft)}
.btn-sm{padding:9px 12px;font-size:13px;border-radius:10px;width:auto}
.fab{position:fixed;bottom:88px;left:0;right:0;max-width:460px;margin:0 auto;z-index:25;padding:0 14px;pointer-events:none}
.fab .btn{pointer-events:auto;box-shadow:0 8px 24px rgba(27,42,74,.28)}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line-2);gap:10px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-2);font-size:13.5px}
.kv .v{font-weight:700;text-align:right}
.money-pos{color:var(--sage)}
.money-neg{color:var(--thread)}
.section-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);margin:20px 4px 8px}
.slip{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line-2);gap:10px}
.slip:last-child{border-bottom:none}
.slip .who{font-weight:700;font-size:14px}
.slip .meta{font-size:12px;color:var(--ink-2);margin-top:1px}
.slip-right{text-align:right}
.empty{text-align:center;padding:48px 24px;color:var(--ink-2)}
.empty .ic{font-size:40px;margin-bottom:10px;opacity:.55}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.scrim{position:fixed;inset:0;background:rgba(27,42,74,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{background:var(--muslin);width:100%;max-width:460px;border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(20px);transition:transform .2s;padding-bottom:24px}
.scrim.on .sheet{transform:translateY(0)}
.sheet-h{position:sticky;top:0;background:var(--muslin);padding:16px 18px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);z-index:2}
.sheet-h b{font-size:18px;font-weight:800}
.sheet-x{width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px;color:var(--ink-2)}
.sheet-body{padding:16px 18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.field input,.field select{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font-weight:600}
.field input:focus,.field select:focus{outline:none;border-color:var(--tape)}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);font-weight:700;font-size:14px;color:var(--ink-2)}
.chip.sel{border-color:var(--cloth);background:var(--cloth);color:#fff}
.chip small{display:block;font-size:10px;font-weight:600}
.stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card)}
.stepper button{width:46px;height:46px;font-size:22px;font-weight:700;color:var(--cloth);background:var(--muslin)}
.stepper input{border:none;text-align:center;flex:1;font-size:20px;font-weight:800;background:transparent}
.hint{font-size:12px;color:var(--ink-2);margin-top:6px;line-height:1.4}
.hint b{color:var(--tape)}
.big-num{font-size:15px;font-weight:800}
.sizegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sizecell{border:1.5px solid var(--line);border-radius:11px;padding:8px 4px;text-align:center;background:var(--card)}
.sizecell label{font-size:11px;font-weight:800;color:var(--ink-2);display:block;margin-bottom:3px}
.sizecell input{width:100%;border:none;text-align:center;font-size:18px;font-weight:800;background:transparent;padding:0}
.stepper.sm{width:150px}
.stepper.sm button{width:38px;height:40px;font-size:20px}
.stepper.sm input{font-size:17px}
.gv-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card);opacity:.58;transition:opacity .12s,border-color .12s,background .12s}
.gv-row.on{opacity:1;border-color:var(--cloth);background:var(--muslin)}
.gv-lbl{font-weight:800;color:var(--ink-1);font-size:15px}
.gv-lbl small{display:block;font-size:11px;font-weight:600;color:var(--ink-3)}
.gv-tick{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;color:var(--ink-1);cursor:pointer;flex:1;min-width:0;-webkit-user-select:none;user-select:none}
.gv-tick input{width:24px;height:24px;flex:none;accent-color:var(--cloth);cursor:pointer}
.gv-tick small{display:block;font-size:11px;font-weight:600;color:var(--ink-3)}
.stepper button:disabled{opacity:.35}
.stepper input:disabled{color:var(--ink-3)}
.mau-anh-wrap{position:relative;display:inline-block;max-width:100%}
.mau-anh-xem{display:block;max-width:100%;max-height:230px;border-radius:14px;border:1.5px solid var(--line);object-fit:contain;background:var(--muslin)}
.mau-anh-xoa{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(0,0,0,.62);color:#fff;font-size:17px;font-weight:700;cursor:pointer;line-height:1}
.mau-anh-trong{padding:22px;text-align:center;color:var(--ink-3);font-size:13px;font-weight:600;border:1.5px dashed var(--line);border-radius:14px;background:var(--muslin)}
.mau-thumb{width:46px;height:46px;object-fit:cover;border-radius:9px;flex:none;border:1px solid var(--line)}
.mau-thumb-trong{width:46px;height:46px;border-radius:9px;flex:none;background:var(--muslin);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;opacity:.5}
.gate{position:fixed;inset:0;z-index:2000;background:var(--muslin);display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{width:100%;max-width:360px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.gate-logo{font-size:40px;margin-bottom:6px}
.gate-title{font-size:22px;font-weight:800;color:var(--ink-1)}
.gate-sub{font-size:13px;color:var(--ink-2);margin:4px 0 18px}
.gate-card input{width:100%;box-sizing:border-box;padding:13px 14px;margin-bottom:10px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:var(--muslin);color:var(--ink-1)}
.gate-card input:focus{outline:none;border-color:var(--cloth)}
.gate-btn{width:100%;box-sizing:border-box;padding:14px;border:none;border-radius:12px;background:var(--tape);color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:4px}
.gate-btn:active{opacity:.85}
.gate-link{display:block;width:100%;background:none;border:none;color:var(--ink-2);font-size:13px;margin-top:14px;cursor:pointer;text-decoration:underline}
.gate-err{background:#fdeaea;color:#a4342b;font-size:13px;font-weight:600;padding:9px 12px;border-radius:10px;margin-bottom:12px}
.cloudbar{position:fixed;left:0;right:0;bottom:0;z-index:1500;padding:11px 14px;font-size:13.5px;font-weight:600;text-align:center;box-shadow:0 -4px 16px rgba(0,0,0,.1)}
.cloudbar.warn{background:#fff4d6;color:#7a5a00;border-top:1.5px solid var(--tape-soft)}
.cloudbar.off{background:#eef0f2;color:#555}
.cloudbar button{margin-left:6px;padding:6px 12px;border:none;border-radius:8px;background:var(--tape);color:#fff;font-weight:700;font-size:13px;cursor:pointer}
.cloudbar button.ghost{background:transparent;color:inherit;text-decoration:underline}
.nv-row{padding:9px 0;border-bottom:1px solid var(--line)}
.nv-row:last-child{border-bottom:none}
.nv-lbl{font-weight:800;font-size:14px;margin-bottom:6px}
.nv-lbl small{font-weight:600;color:var(--ink-3);margin-left:6px}
.nv-ins{display:flex;gap:10px}
.nv-in{flex:1;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card)}
.nv-in span{font-size:12px;font-weight:700;color:var(--ink-3)}
.nv-in input{flex:1;border:none;text-align:right;font-size:17px;font-weight:800;background:transparent;width:100%}
.reveal{background:linear-gradient(160deg,var(--cloth),var(--cloth-2));color:#fff;border-radius:18px;padding:22px 20px;text-align:center;margin-bottom:12px}
.reveal .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--tape);font-weight:700}
.reveal .amt{font-size:38px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px}
.reveal .note{font-size:12px;color:rgba(255,255,255,.7)}
.bridge-row{display:flex;align-items:center;gap:12px;padding:11px 15px}
.bridge-row .bl{font-size:13px;font-weight:600;color:var(--ink);flex:1}
.bridge-row .bv{font-weight:800;font-size:14px;white-space:nowrap}
.bridge-row.head{background:var(--cloth);color:#fff}
.bridge-row.head .bl{color:#fff;font-weight:700}
.bridge-row.foot{background:var(--sage-soft)}
.bridge-row.foot .bl{font-weight:800;color:var(--sage)}
.bridge-row.foot .bv{color:var(--sage);font-size:17px}
.bridge-sign{width:22px;text-align:center;font-weight:800;font-size:16px;color:var(--ink-3)}
.bridge-explain{font-size:11.5px;color:var(--ink-2);padding:0 15px 4px;margin-top:-4px}
.check-ok{background:var(--sage-soft);color:var(--sage);font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:10px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.check-bad{background:var(--thread-soft);color:var(--thread)}
.rank{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line-2)}
.rank:last-child{border-bottom:none}
.rank .n{width:24px;height:24px;border-radius:8px;background:var(--muslin);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--ink-2)}
.rank.top .n{background:var(--tape);color:#3a2803}
.rank .nm{flex:1;font-weight:700;font-size:14px}
.rank .rv{text-align:right}
.rank .rv b{font-size:15px}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--line-2);padding:4px;border-radius:12px;overflow-x:auto}
.tabs button{flex:1 0 auto;padding:9px 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink-2);white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--cloth);box-shadow:var(--shadow)}
.toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--cloth);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;z-index:100;opacity:0;transition:.2s;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--thread)}
.ledger-line{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:8px 12px;border-bottom:1px solid var(--line-2)}
.ledger-line .ev{color:var(--cloth);font-weight:700;font-size:11px;display:flex;justify-content:space-between;align-items:center}
.ledger-line .ln{display:flex;justify-content:space-between;color:var(--ink-2);margin-top:2px}
.ledger-line .ln.no{color:var(--ink)}
.ledger-line.rev{opacity:.55;background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(0,0,0,.02) 6px,rgba(0,0,0,.02) 12px)}
.mini-btn{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--muslin);border:1px solid var(--line);color:var(--thread)}
.warn-box{background:#FFF8EC;border:1px solid var(--tape-soft);border-radius:12px;padding:12px 14px;font-size:12.5px;color:#7a5a1a;margin-bottom:12px}
.divider-note{font-size:11.5px;color:var(--ink-3);text-align:center;padding:8px;font-style:italic}
.act-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.act-grid .btn{font-size:13.5px;padding:11px 8px}
.act-grid .btn.wide{grid-column:1/3}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{background:var(--cloth);color:#fff;font-weight:700;padding:8px 6px;text-align:left;position:sticky;top:0}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .st-chua{color:var(--thread);font-weight:700}
.tbl .st-roi{color:var(--sage);font-weight:700}
.filter-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filter-row .chip{padding:7px 12px;font-size:12.5px}
.tro-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.tro-line:last-child{border:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%;padding:20px}
}
#printArea{display:none}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="row">
      <div>
        <div class="brand"><b>Sổ Xưởng</b><span>gia công</span></div>
        <div class="h-sub" id="hSub">Xưởng may của bạn</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <button class="hdr-gear" onclick="modalCaiDat()" aria-label="Cài đặt">⚙</button>
        <div class="pill-cash">
          <small>Tiền trong két</small>
          <b class="num" id="hCash">0 đ</b>
        </div>
      </div>
    </div>
  </header>
  <main id="main"></main>
  <div id="fab"></div>
  <nav class="bottom" id="nav"></nav>
</div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div id="cloudbar" class="cloudbar" style="display:none"></div>
<div id="gate" class="gate" style="display:none"></div>
<div id="printArea"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===========================================================
   SỔ XƯỞNG — máy sinh bút toán ẩn dưới giao diện đời thường
   =========================================================== */
const TK={QUY:'QUY',PHAI_THU:'PHAI_THU',WIP:'WIP',RO_CHUNG:'RO_CHUNG',
  PHAI_TRA_THO:'PHAI_TRA_THO',CONG_CHU_XUONG:'CONG_CHU_XUONG',
  DOANH_THU:'DOANH_THU',GIA_VON:'GIA_VON',LO_KHAC:'LO_KHAC',VON:'VON'};
let DB;
const SIZES=['S','M','L','XL'];
const SCHEMA=3; // cấu trúc dữ liệu: mẫu theo chủ hàng + phiếu nhiều cỡ
function sizesOf(don){return don&&don.sizeList&&don.sizeList.length?don.sizeList:SIZES;}
/* ---- truy cập phiếu giao nhiều cỡ ---- */
function pGiaoSize(p,s){return (p.giao&&p.giao[s])||0;}
function pGiao(p){return p.giao?sum(Object.values(p.giao)):0;}
function pDatSize(p,s){return sum(p.dongNhan.map(x=>(x.dat&&x.dat[s])||0));}
function pPheSize(p,s){return sum(p.dongNhan.map(x=>(x.phe&&x.phe[s])||0));}
function pDat(p){return sum(p.dongNhan.map(x=>sum(Object.values(x.dat||{}))));}
function pPhe(p){return sum(p.dongNhan.map(x=>sum(Object.values(x.phe||{}))));}
function pNhan(p){return pDat(p)+pPhe(p);}
function pConSize(p,s){return pGiaoSize(p,s)-pDatSize(p,s)-pPheSize(p,s);}
function pSizes(p){return Object.keys(p.giao||{}).filter(s=>p.giao[s]>0);}
const HUY_WINDOW=5*60*1000; // cửa sổ hủy 5 phút (BR-31)

const Store={ok:true,
  save(){try{localStorage.setItem('soxuong_v2',JSON.stringify(DB))}catch(e){this.ok=false}},
  load(){try{const r=localStorage.getItem('soxuong_v2');return r?JSON.parse(r):null}catch(e){this.ok=false;return null}}
};

/* ---------- LÕI: bút toán kép ---------- */
/* Gom bút toán của cùng MỘT thao tác người dùng thành một "phát sinh" (op).
   Mỗi hành động ghi sổ gọi beginOp() ở đầu; các bút toán con (hấp thụ chung,
   kết chuyển giá vốn...) tự thừa hưởng cùng op. */
let _opSeq=0,_opActive=null;
function beginOp(){_opActive={id:_opSeq++};Promise.resolve().then(()=>{_opActive=null;});return _opActive.id;}
function curOp(){if(!_opActive)beginOp();return _opActive.id;}
function ghi(suKien,dong,meta){
  const no=dong.filter(d=>d.chieu==='NO').reduce((s,d)=>s+d.soTien,0);
  const co=dong.filter(d=>d.chieu==='CO').reduce((s,d)=>s+d.soTien,0);
  if(no!==co) throw new Error('Bút toán lệch '+(no-co)+' — từ chối ghi ('+suKien+')');
  DB.butToan.push(Object.assign({id:uid(),suKien,thoiDiem:now(),op:curOp(),dong},meta||{}));
}
function bal(tk,filter){let no=0,co=0;
  for(const bt of DB.butToan) for(const d of bt.dong){
    if(d.tk!==tk)continue; if(filter&&!filter(d))continue;
    if(d.chieu==='NO')no+=d.soTien;else co+=d.soTien;
  } return {no,co,net:no-co};
}

/* ---------- tiện ích ---------- */
function uid(){return Math.random().toString(36).slice(2,10)}
function now(){return Date.now()}
function fmt(n){n=Math.round(n);const s=Math.abs(n).toLocaleString('vi-VN');return (n<0?'−':'')+s+' đ'}
function fmtShort(n){n=Math.round(n);const a=Math.abs(n);let s;if(a>=1e6)s=(a/1e6).toFixed(a>=1e7?0:1).replace('.',',')+'tr';else if(a>=1e3)s=Math.round(a/1e3)+'k';else s=a+'';return (n<0?'−':'')+s}
function sepStr(v){v=(''+(v==null?'':v)).replace(/[^\d]/g,'');return v?(+v).toLocaleString('vi-VN'):'';}
function numVal(id){const e=el(id);return e?(+((''+e.value).replace(/[^\d]/g,''))||0):0;}
function numOf(e){return e?(+((''+e.value).replace(/[^\d]/g,''))||0):0;}
function sum(a){return a.reduce((s,x)=>s+x,0)}
function el(id){return document.getElementById(id)}
function days(ms){return Math.floor((now()-ms)/86400000)}
const getChu=id=>DB.chuHang.find(c=>c.id===id);
const getMau=id=>{for(const c of DB.chuHang){const m=(c.mau||[]).find(m=>m.id===id);if(m)return m;}return null;};
const getMauChu=id=>DB.chuHang.find(c=>(c.mau||[]).some(m=>m.id===id));
const getTho=id=>DB.tho.find(t=>t.id===id);
const getDon=id=>DB.don.find(d=>d.id===id);
const owner=()=>DB.tho.find(t=>t.isOwner);

/* ---------- tồn theo công đoạn × size ---------- */
function chamVeSize(don,s){return sum((don.chamList||[]).filter(c=>c.veRoi).map(c=>c.veSizes[s]||0))}
function sanXuatVao(don,n,size){
  if(n===0) return (don.sizes[size]||0)+chamVeSize(don,size);
  return sum(DB.phieuGiao.filter(p=>p.donId===don.id&&p.congDoanIdx===n-1&&p.trangThai!=='HUY')
    .map(p=>pDatSize(p,size)));
}
function daGiaoRaCD(don,n,size){return sum(DB.phieuGiao.filter(p=>p.donId===don.id&&p.congDoanIdx===n&&p.trangThai!=='HUY').map(p=>pGiaoSize(p,size)))}
function ton(don,n,size){return sanXuatVao(don,n,size)-daGiaoRaCD(don,n,size)}
function tonCD(don,n){return sum(sizesOf(don).map(s=>Math.max(0,ton(don,n,s))))}
function xong(don,size){const last=don.snapshotCD.length-1;
  return sum(DB.phieuGiao.filter(p=>p.donId===don.id&&p.congDoanIdx===last&&p.trangThai!=='HUY').map(p=>pDatSize(p,size)))}
function daGiaoTP(don,size){return sum(DB.giaoTP.filter(g=>g.donId===don.id).map(g=>g.sizes[size]||0))}
function coTheGiao(don,size){return xong(don,size)-daGiaoTP(don,size)}
function coTheGiaoTong(don){return sum(sizesOf(don).map(s=>Math.max(0,coTheGiao(don,s))))}
function wipDon(don){return bal(TK.WIP,d=>d.donId===don.id).net}
function sumGiaCD(don){return sum(don.snapshotCD.map(c=>c.donGia))}
function tongNhan(don){return sum(sizesOf(don).map(s=>(don.sizes[s]||0)+chamVeSize(don,s)))}
function tongPhe(don){return sum(DB.phieuGiao.filter(p=>p.donId===don.id).map(p=>pPhe(p)))}
function phieuCoHut(don){return DB.phieuGiao.filter(p=>p.donId===don.id&&p.trangThai==='DONG'&&p.hut&&p.hut!==0)}
function donCoCanhBao(don){return phieuCoHut(don).length>0}
function chamChoVe(don){return (don.chamList||[]).filter(c=>!c.veRoi)}

/* ===========================================================
   HÀNH ĐỘNG (mỗi cái là một SỰ KIỆN → tự sinh bút toán)
   =========================================================== */
function taoDon({chuHangId,mauId,ma,sizes,giaGiaCong}){
  const mau=getMau(mauId);
  const sizeList=(mau.sizeList&&mau.sizeList.length)?mau.sizeList.slice():SIZES.slice();
  const don={id:uid(),ma,chuHangId,mauId,ngay:now(),sizes:{...sizes},giaGiaCong,sizeList,
    snapshotCD:mau.congDoan.map(c=>({ten:c.ten,donGia:c.donGia})),
    gioDinhMuc:mau.gioDinhMuc||0,chamList:[],trangThai:'DANG_CHAY'};
  DB.don.push(don);Store.save();return don;
}
/* giao: {S:10,M:20,...} — một phiếu có thể gồm nhiều cỡ */
function giaoViec({donId,congDoanIdx,thoId,giao}){
  const don=getDon(donId);const g={};
  for(const s of Object.keys(giao||{})){const q=giao[s]||0;if(q<=0)continue;
    const conlai=ton(don,congDoanIdx,s);
    if(q>conlai) throw new Error('Cỡ '+s+' chỉ còn '+conlai+' cái ở công đoạn này. Không giao '+q+'.');
    g[s]=q;}
  if(!sum(Object.values(g))) throw new Error('Chưa chọn cỡ nào để giao.');
  DB.phieuGiao.push({id:uid(),donId,congDoanIdx,thoId,giao:g,dongNhan:[],trangThai:'MO',ngay:now()});
  Store.save();
}
function hapThuChung(donId,tienCong){
  const cpc=Math.round(tienCong*DB.settings.tyLeChung);
  if(cpc>0) ghi('Chi phí chung phân bổ',[
    {tk:TK.WIP,chieu:'NO',soTien:cpc,donId},{tk:TK.RO_CHUNG,chieu:'CO',soTien:cpc}]);
}
function nhanVe({phieuId,dat,phe}){beginOp();
  const p=DB.phieuGiao.find(x=>x.id===phieuId);const don=getDon(p.donId);
  const cd=don.snapshotCD[p.congDoanIdx];const tho=getTho(p.thoId);
  dat=dat||{};phe=phe||{};
  const slDat=sum(Object.values(dat));
  p.dongNhan.push({ngay:now(),dat:{...dat},phe:{...phe}});
  const tienCong=slDat*cd.donGia;
  const tkCong=tho.isOwner?TK.CONG_CHU_XUONG:TK.PHAI_TRA_THO;
  ghi('Nhận hàng về ('+cd.ten+')',[
    {tk:TK.WIP,chieu:'NO',soTien:tienCong,donId:don.id},
    {tk:tkCong,chieu:'CO',soTien:tienCong,thoId:tho.isOwner?null:tho.id}]);
  hapThuChung(don.id,tienCong);Store.save();
}
function dongPhieu({phieuId,lyDo}){
  const p=DB.phieuGiao.find(x=>x.id===phieuId);
  p.hut=pGiao(p)-pNhan(p);p.lyDoHut=p.hut!==0?lyDo:null;p.trangThai='DONG';Store.save();
}
/* thợ giờ (event #7) — chi phí bậc lô gắn đơn */
function chamGio({donId,thoId,gio}){beginOp();
  const tho=getTho(thoId);const tien=Math.round(gio*tho.donGiaGio);const pgId=uid();
  DB.phienGio.push({id:pgId,donId,thoId,gio,tien,ngay:now()});
  ghi('Chấm công thợ giờ ('+tho.ten+')',[
    {tk:TK.WIP,chieu:'NO',soTien:tien,donId,loai:'BAC_LO'},
    {tk:TK.PHAI_TRA_THO,chieu:'CO',soTien:tien,thoId}],{phienGioId:pgId});
  hapThuChung(donId,tien);Store.save();
}
/* chi phí trực tiếp gắn đơn (ship nhận/giao — event #2/#13) */
function chiPhiDon({donId,soTien,dienGiai}){beginOp();
  ghi('Chi phí đơn: '+dienGiai,[
    {tk:TK.WIP,chieu:'NO',soTien,donId,loai:'BAC_LO'},{tk:TK.QUY,chieu:'CO',soTien}]);
  Store.save();
}
/* tiền đền hàng hư (event #12) */
function tienDen({donId,soTien}){beginOp();
  const don=getDon(donId);const dong=don.trangThai==='DA_GIAO_DU';
  const target=dong?{tk:TK.GIA_VON,loai:'CHENH_LECH'}:{tk:TK.WIP,loai:'BAC_LO'};
  ghi('Tiền đền hàng hư',[
    Object.assign({chieu:'NO',soTien,donId},target),{tk:TK.QUY,chieu:'CO',soTien}]);
  Store.save();
}
/* cắt châm 11a — xin (không bút toán) */
function xinCham({donId,sizes,lyDo}){
  const don=getDon(donId);
  don.chamList.push({id:uid(),sizes:{...sizes},lyDo,ngay:now(),veRoi:false,veSizes:{}});
  Store.save();
}
/* cắt châm 11b — hàng châm về (ship = bậc lô) */
function chamVeAction({donId,chamId,veSizes,shipCost}){beginOp();
  const don=getDon(donId);const c=don.chamList.find(x=>x.id===chamId);
  c.veRoi=true;c.veSizes={...veSizes};c.ngayVe=now();
  if(shipCost>0) ghi('Ship cắt châm về',[
    {tk:TK.WIP,chieu:'NO',soTien:shipCost,donId,loai:'BAC_LO'},{tk:TK.QUY,chieu:'CO',soTien:shipCost}]);
  Store.save();
}
/* tháo (event 23–24) — rẽ nhánh theo ai chịu (QĐ-39) */
function ghiThao({donId,dong}){beginOp();
  const don=getDon(donId);const isDone=don.trangThai==='DA_GIAO_DU';
  DB.phieuThao.push({id:uid(),donId,ngay:now(),dong:dong.map(d=>({...d}))});
  for(const l of dong){
    const tien=l.sl*l.donGia;if(tien<=0&&l.aiChiu!=='THO')continue;
    const chi=isDone?{tk:TK.GIA_VON,loai:'CHENH_LECH'}:{tk:TK.WIP,loai:'BAC_LO'};
    if(l.aiChiu==='THO'){/* thợ chịu — không bút toán tiền */}
    else if(l.aiChiu==='XUONG'){
      ghi('Tháo — xưởng trả công',[
        Object.assign({chieu:'NO',soTien:tien,donId},chi),
        {tk:TK.PHAI_TRA_THO,chieu:'CO',soTien:tien,thoId:l.thoId}]);
    } else if(l.aiChiu==='CHU_HANG'){
      ghi('Tháo — trả công thợ',[
        Object.assign({chieu:'NO',soTien:tien,donId},chi),
        {tk:TK.PHAI_TRA_THO,chieu:'CO',soTien:tien,thoId:l.thoId}]);
      ghi('Tháo — thu công chủ hàng',[
        {tk:TK.PHAI_THU,chieu:'NO',soTien:tien,chuHangId:don.chuHangId,donId,phieuGiaoId:uid(),ngay:now(),loaiSlip:'THAO'},
        {tk:TK.DOANH_THU,chieu:'CO',soTien:tien,donId,loai:'THAO'}]);
    }
  }
  Store.save();
}
/* giao thành phẩm */
function giaoThanhPham({donId,sizes}){beginOp();
  const don=getDon(donId);const prevTT=don.trangThai;const N=sum(sizesOf(don).map(s=>sizes[s]||0));
  if(N<=0) throw new Error('Chưa chọn số lượng giao.');
  for(const s of sizesOf(don)){if((sizes[s]||0)>coTheGiao(don,s)) throw new Error('Cỡ '+s+' chỉ có '+coTheGiao(don,s)+' cái xong.');}
  const doanhThu=N*don.giaGiaCong;const slipId=uid();
  ghi('Giao thành phẩm cho chủ hàng',[
    {tk:TK.PHAI_THU,chieu:'NO',soTien:doanhThu,chuHangId:don.chuHangId,donId:don.id,phieuGiaoId:slipId,ngay:now()},
    {tk:TK.DOANH_THU,chieu:'CO',soTien:doanhThu,donId:don.id,loai:'GIA_CONG'}],{restoreSlip:slipId,prevTT,restoreDonId:don.id});
  const T=Math.max(1,tongNhan(don)-tongPhe(don));
  const wip=wipDon(don);let ketChuyen=Math.round(wip*N/T);if(ketChuyen>wip)ketChuyen=wip;
  capNhatGiaVon(don,N,ketChuyen);
  DB.giaoTP.push({id:slipId,donId,sizes:{...sizes},tien:doanhThu,ngay:now()});
  don.trangThai='DA_GIAO_MOT_PHAN';Store.save();
}
function capNhatGiaVon(don,N,tong){
  const dinhMuc=Math.min(tong,N*sumGiaCD(don));const chenh=tong-dinhMuc;
  const lines=[{tk:TK.GIA_VON,chieu:'NO',soTien:dinhMuc,donId:don.id,loai:'DINH_MUC'}];
  if(chenh!==0)lines.push({tk:TK.GIA_VON,chieu:chenh>0?'NO':'CO',soTien:Math.abs(chenh),donId:don.id,loai:'CHENH_LECH'});
  lines.push({tk:TK.WIP,chieu:'CO',soTien:tong,donId:don.id});
  ghi('Kết chuyển giá vốn',lines);
}
function dongDon(donId){beginOp();
  const don=getDon(donId);const prevTT=don.trangThai;const wip=wipDon(don);
  if(wip>0){
    const giaoLuyKe=sum(sizesOf(don).map(s=>daGiaoTP(don,s)));
    const dmDaCo=bal(TK.GIA_VON,d=>d.donId===don.id&&d.loai==='DINH_MUC').net;
    const dm=Math.max(0,Math.min(wip,giaoLuyKe*sumGiaCD(don)-dmDaCo));const chenh=wip-dm;
    const lines=[];
    if(dm>0)lines.push({tk:TK.GIA_VON,chieu:'NO',soTien:dm,donId:don.id,loai:'DINH_MUC'});
    if(chenh!==0)lines.push({tk:TK.GIA_VON,chieu:'NO',soTien:chenh,donId:don.id,loai:'CHENH_LECH'});
    lines.push({tk:TK.WIP,chieu:'CO',soTien:wip,donId:don.id});
    ghi('Đóng đơn — kết chuyển hết',lines,{prevTT,restoreDonId:don.id});
  }
  don.trangThai='DA_GIAO_DU';Store.save();return laiDon(don);
}
function huyDon(donId){beginOp();
  const don=getDon(donId);const prevTT=don.trangThai;const wip=wipDon(don);
  if(wip>0) ghi('Hủy đơn — chuyển thành lỗ',[
    {tk:TK.LO_KHAC,chieu:'NO',soTien:wip,donId},{tk:TK.WIP,chieu:'CO',soTien:wip,donId}],{prevTT,restoreDonId:don.id});
  don.trangThai='DA_HUY';Store.save();
}
function traLai(donId){beginOp();
  const don=getDon(donId);const prevTT=don.trangThai;
  const slips=DB.giaoTP.filter(g=>g.donId===don.id);
  const dt=sum(slips.map(g=>g.tien));
  const gv=bal(TK.GIA_VON,d=>d.donId===don.id).net;
  if(dt>0){const lines=[{tk:TK.DOANH_THU,chieu:'NO',soTien:dt,donId,loai:'GIA_CONG'}];
    slips.forEach(g=>lines.push({tk:TK.PHAI_THU,chieu:'CO',soTien:g.tien,chuHangId:don.chuHangId,donId,phieuGiaoId:g.id}));
    ghi('Hàng bị trả lại — đảo doanh thu',lines,{prevTT,restoreDonId:don.id});}
  if(gv>0) ghi('Hàng bị trả lại — mở lại WIP',[
    {tk:TK.WIP,chieu:'NO',soTien:gv,donId},
    {tk:TK.GIA_VON,chieu:'CO',soTien:gv,donId,loai:'CHENH_LECH'}],{prevTT,restoreDonId:don.id});
  don.trangThai='BI_TRA_LAI';Store.save();
}
function capTru(chuHangId,soTien,uuTien){ // FIFO theo phiếu; uuTien = phiếu được ưu tiên trừ trước (E-16)
  let slips=slipList(chuHangId).filter(s=>s.conLai>0);
  if(uuTien)slips=slips.filter(s=>s.id===uuTien).concat(slips.filter(s=>s.id!==uuTien));
  let left=soTien;const alloc=[];
  for(const s of slips){if(left<=0)break;const pay=Math.min(left,s.conLai);alloc.push({s,pay});left-=pay;}
  return {alloc,du:left};
}
function thuTien({chuHangId,soTien,uuTien}){beginOp();
  const {alloc,du}=capTru(chuHangId,soTien,uuTien);
  const lines=[{tk:TK.QUY,chieu:'NO',soTien}];
  alloc.forEach(a=>lines.push({tk:TK.PHAI_THU,chieu:'CO',soTien:a.pay,chuHangId,phieuGiaoId:a.s.id}));
  if(du>0) lines.push({tk:TK.PHAI_THU,chieu:'CO',soTien:du,chuHangId,phieuGiaoId:'UNG-'+chuHangId});
  ghi('Chủ hàng trả tiền',lines);Store.save();return {alloc,du};
}
function traLuong({thoId,soTien}){beginOp();
  ghi('Trả lương thợ',[
    {tk:TK.PHAI_TRA_THO,chieu:'NO',soTien,thoId},{tk:TK.QUY,chieu:'CO',soTien}]);Store.save();
}
function ungLuong({thoId,soTien}){beginOp();
  ghi('Ứng lương thợ',[
    {tk:TK.PHAI_TRA_THO,chieu:'NO',soTien,thoId},{tk:TK.QUY,chieu:'CO',soTien}]);Store.save();
}
/* chủ rút tiền về nhà / bỏ thêm tiền vào xưởng — chạm VỐN, KHÔNG phải chi phí */
function rutVon({soTien,dienGiai}){beginOp();
  ghi('Chủ rút tiền về nhà'+(dienGiai?': '+dienGiai:''),[
    {tk:TK.VON,chieu:'NO',soTien},{tk:TK.QUY,chieu:'CO',soTien}]);Store.save();
}
function boVon({soTien,dienGiai}){beginOp();
  ghi('Chủ bỏ thêm tiền vào xưởng'+(dienGiai?': '+dienGiai:''),[
    {tk:TK.QUY,chieu:'NO',soTien},{tk:TK.VON,chieu:'CO',soTien}]);Store.save();
}
function chiPhiXuong({soTien,dienGiai}){beginOp();
  ghi('Chi tiền: '+dienGiai,[
    {tk:TK.RO_CHUNG,chieu:'NO',soTien},{tk:TK.QUY,chieu:'CO',soTien}]);Store.save();
}
function noXau({chuHangId,soTien}){beginOp();
  const {alloc,du}=capTru(chuHangId,soTien);
  const lines=[{tk:TK.LO_KHAC,chieu:'NO',soTien,chuHangId}];
  alloc.forEach(a=>lines.push({tk:TK.PHAI_THU,chieu:'CO',soTien:a.pay,chuHangId,phieuGiaoId:a.s.id}));
  if(du>0) lines.push({tk:TK.PHAI_THU,chieu:'CO',soTien:du,chuHangId,phieuGiaoId:'XOA-'+chuHangId});
  ghi('Xóa nợ xấu',lines);Store.save();
}
function xoaUngTho({thoId,soTien}){beginOp();
  ghi('Xóa số dư ứng thợ nghỉ',[

function laiDon(don){
  const dtb=bal(TK.DOANH_THU,d=>d.donId===don.id);const dt=dtb.co-dtb.no;

  return {doanhThu:dt,giaVon:gv,lai:dt-gv,
    congTho:congThoDon(don),congMinh:congMinhDon(don),chung:chungDon(don),
    chenh:bal(TK.GIA_VON,d=>d.donId===don.id&&d.loai==='CHENH_LECH').net};
}
function congThoDon(don){return sum(DB.phieuGiao.filter(p=>p.donId===don.id).map(p=>{
  const t=getTho(p.thoId);if(t.isOwner)return 0;const cd=don.snapshotCD[p.congDoanIdx];
  return pDat(p)*cd.donGia;}))
  +sum(DB.phienGio.filter(pg=>pg.donId===don.id).map(pg=>pg.tien))}
function congMinhDon(don){return sum(DB.phieuGiao.filter(p=>p.donId===don.id).map(p=>{
  const t=getTho(p.thoId);if(!t.isOwner)return 0;const cd=don.snapshotCD[p.congDoanIdx];
  return pDat(p)*cd.donGia;}))}
function chungDon(don){return Math.round((congThoDon(don)+congMinhDon(don))*DB.settings.tyLeChung)}
function noChuHang(chuId){return bal(TK.PHAI_THU,d=>d.chuHangId===chuId).net}
function luongNoTho(thoId){const b=bal(TK.PHAI_TRA_THO,d=>d.thoId===thoId);return b.co-b.no;}
/* công nợ theo TỪNG PHIẾU GIAO (slip) — dựng từ sổ cái */
function slipList(chuId){
  const deb={},cre={};
  for(const bt of DB.butToan) for(const d of bt.dong){
    if(d.tk!==TK.PHAI_THU||!d.phieuGiaoId)continue;
    if(d.chieu==='NO'){const e=deb[d.phieuGiaoId]||{ngay:d.ngay||bt.thoiDiem,giaTri:0,chuHangId:d.chuHangId,donId:d.donId,loai:d.loaiSlip||'GIAO'};e.giaTri+=d.soTien;deb[d.phieuGiaoId]=e;}
    else cre[d.phieuGiaoId]=(cre[d.phieuGiaoId]||0)+d.soTien;
  }
  return Object.entries(deb).map(([id,v])=>({id,...v,daThu:cre[id]||0,conLai:v.giaTri-(cre[id]||0)}))
    .filter(s=>!chuId||s.chuHangId===chuId).sort((a,b)=>a.ngay-b.ngay);
}

/* ===========================================================
   BIỂU ĐỒ (SVG thuần) + GỘP SỐ THEO THÁNG — đọc từ sổ cái
   =========================================================== */
function ymKey(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function ymLabel(k){return 'T'+(+k.split('-')[1]);}
function thangGanDay(n){const out=[],b=new Date();for(let i=n-1;i>=0;i--){const d=new Date(b.getFullYear(),b.getMonth()-i,1);out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));}return out;}
function laiTheoThang(keys){const m={};keys.forEach(k=>m[k]=0);
  DB.butToan.forEach(bt=>{const k=ymKey(bt.thoiDiem);if(!(k in m))return;
    bt.dong.forEach(d=>{
      if(d.tk===TK.DOANH_THU)m[k]+=(d.chieu==='CO'?d.soTien:-d.soTien);
      else if(d.tk===TK.GIA_VON)m[k]-=(d.chieu==='NO'?d.soTien:-d.soTien);
      else if(d.tk===TK.LO_KHAC)m[k]-=(d.chieu==='NO'?d.soTien:-d.soTien);});});
  return keys.map(k=>m[k]);}
function dongTienTheoThang(keys){const vao={},ra={};keys.forEach(k=>{vao[k]=0;ra[k]=0;});
  DB.butToan.forEach(bt=>{const k=ymKey(bt.thoiDiem);if(!(k in vao))return;
    bt.dong.forEach(d=>{if(d.tk!==TK.QUY)return;if(d.chieu==='NO')vao[k]+=d.soTien;else ra[k]+=d.soTien;});});
  return {vao:keys.map(k=>vao[k]),ra:keys.map(k=>ra[k])};}
/* groups: mảng theo cột, mỗi cột là mảng {v,color}; showVal: ghi số trên đầu cột (1 cột 1 cây) */
function svgChart(labels,groups,opts){opts=opts||{};
  const W=340,H=opts.h||132,padT=opts.showVal?16:8,padB=20,padX=8;
  const n=labels.length||1;let maxV=0,minV=0;
  groups.forEach(g=>g.forEach(b=>{if(b.v>maxV)maxV=b.v;if(b.v<minV)minV=b.v;}));
  if(maxV<=0&&minV>=0)maxV=1;const range=(maxV-minV)||1;
  const plotH=H-padT-padB,zeroY=padT+(maxV/range)*plotH,gW=(W-padX*2)/n;
  let out=`<line x1="${padX}" y1="${zeroY.toFixed(1)}" x2="${(W-padX)}" y2="${zeroY.toFixed(1)}" stroke="#E7E2D6" stroke-width="1"/>`;
  for(let i=0;i<n;i++){const bars=groups[i]||[];const k=bars.length||1;const ig=3;
    const barW=Math.max(6,Math.min(30,(gW-10)/k-ig));const cw=k*barW+(k-1)*ig;const sx=padX+i*gW+(gW-cw)/2;
    bars.forEach((b,bi)=>{const bh=Math.abs(b.v)/range*plotH;const x=sx+bi*(barW+ig);const y=b.v>=0?zeroY-bh:zeroY;
      out+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1,bh).toFixed(1)}" rx="2.5" fill="${b.color}"/>`;
      if(opts.showVal&&k===1&&b.v!==0)out+=`<text x="${(x+barW/2).toFixed(1)}" y="${(b.v>=0?y-4:y+bh+11).toFixed(1)}" font-size="8.5" text-anchor="middle" fill="#5B6676">${fmtShort(b.v)}</text>`;});
    out+=`<text x="${(padX+i*gW+gW/2).toFixed(1)}" y="${H-6}" font-size="10" text-anchor="middle" fill="#8A94A3">${labels[i]}</text>`;}
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">${out}</svg>`;}
function chartLegend(items){return `<div style="display:flex;gap:16px;justify-content:center;margin-top:8px;flex-wrap:wrap">`+
  items.map(it=>`<span style="font-size:11.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px"><span style="width:11px;height:11px;border-radius:3px;background:${it.color};display:inline-block"></span>${it.name}</span>`).join('')+`</div>`;}

    jobs.push({ic:'⚠️',t:`Xử lý hụt: ${d.ma}`,s:`lệch ${Math.abs(p.hut)} cái (${p.lyDoHut||'chưa rõ'})`,cl:`modalDon('${d.id}')`});});
  chamCho.slice(0,1).forEach(d=>{const c=chamChoVe(d)[0];
    jobs.push({ic:'✂️',t:`Cắt châm chờ về: ${d.ma}`,s:`${sum(Object.values(c.sizes))} cái · ${c.lyDo||''}`,cl:`modalDon('${d.id}')`});});

  h+=`<div class="section-h">Việc nên làm</div><div class="card">`;
  h+=jobs.length?jobs.map(j=>`<div class="slip" onclick="${j.cl}"><div style="display:flex;gap:11px;align-items:flex-start">
      <div style="font-size:18px;line-height:1.2">${j.ic}</div>
      <div><div class="who" style="font-size:14px">${j.t}</div><div class="meta">${j.s}</div></div></div>
      <span style="color:var(--ink-3);align-self:center">›</span></div>`).join('')
    :`<div class="empty" style="padding:30px"><div class="ic">✅</div><b>Không có việc gấp</b>Xưởng đang gọn gàng.</div>`;
  h+=`</div>`;

  // Tháng này + biểu đồ lãi
  const keys=thangGanDay(6);const laiS=laiTheoThang(keys);const labels=keys.map(ymLabel);
  const groups=laiS.map(v=>[{v,color:v>=0?'#2F7A63':'#C0392B'}]);
  h+=`<div class="section-h">Tháng này</div><div class="card"><div class="card-pad">
    <div class="kv"><div class="k">Lãi ròng ghi nhận</div><div class="v big-num ${laiThangNay>=0?'money-pos':'money-neg'}">${fmt(laiThangNay)}</div></div>
    <div class="kv"><div class="k">Tiền vào két</div><div class="v money-pos">+ ${fmtShort(vaoThang)}</div></div>
    <div class="kv"><div class="k">Tiền ra khỏi két</div><div class="v money-neg">− ${fmtShort(raThang)}</div></div></div></div>`;
  h+=`<div class="section-h">Lãi 6 tháng gần đây</div><div class="card"><div class="card-pad">
    ${svgChart(labels,groups,{showVal:true,h:140})}
    <div class="hint" style="text-align:center;margin-top:4px">Biểu đồ đầy dần theo từng tháng bạn dùng app.</div></div></div>`;
  return h;
}

/* ---------- ĐƠN HÀNG ---------- */
let donSearch='';
function donKhop(d){if(!donSearch)return true;const q=donSearch.toLowerCase();
  return (d.ma+' '+getChu(d.chuHangId).ten+' '+getMau(d.mauId).ten).toLowerCase().includes(q);}
function viewDon(m){
  const dangChay=DB.don.filter(d=>['DANG_CHAY','DA_GIAO_MOT_PHAN','CHO_CHAM','BI_TRA_LAI'].includes(d.trangThai)&&donKhop(d));
  const xongRoi=DB.don.filter(d=>d.trangThai==='DA_GIAO_DU'&&donKhop(d));
  const huy=DB.don.filter(d=>d.trangThai==='DA_HUY'&&donKhop(d));
  let h=`<div class="view-title">Đơn hàng<small>Hàng đang làm ở xưởng</small></div>`;
  if(DB.don.length>3||donSearch)h+=`<div class="field" style="margin-bottom:12px"><input id="don_q" placeholder="🔎 Tìm mã đơn, chủ hàng, mẫu..." value="${donSearch}" oninput="donSearch=this.value;const p=this.selectionStart;viewDon(document.getElementById('main'));const e=document.getElementById('don_q');if(e){e.focus();e.setSelectionRange(p,p);}"></div>`;
  if(!DB.don.length){h+=`<div class="empty"><div class="ic">🧵</div><b>Chưa có đơn nào</b>Tạo đơn đầu tiên khi nhận hàng cắt về.</div>`;}
  else if(!dangChay.length&&!xongRoi.length&&!huy.length){h+=`<div class="empty"><div class="ic">🔎</div><b>Không tìm thấy đơn</b>Thử từ khóa khác.</div>`;}
  else{
    h+=dangChay.map(donCard).join('');
    if(xongRoi.length)h+=`<div class="section-h">Đơn đã xong</div>`+xongRoi.map(donCard).join('');
    if(huy.length)h+=`<div class="section-h">Đơn đã hủy</div>`+huy.map(donCard).join('');
  }
  m.innerHTML=h;
  el('fab').innerHTML=`<button class="btn btn-tape" onclick="modalTaoDon()">＋ Nhận hàng cắt mới</button>`;
}
function donCard(don){
  const chu=getChu(don.chuHangId),mau=getMau(don.mauId);const tong=tongNhan(don);
  const done=don.trangThai==='DA_GIAO_DU',huy=don.trangThai==='DA_HUY',cho=chamChoVe(don).length>0;
  let badge=done?`<span class="badge b-done">✓ Xong</span>`
    :huy?`<span class="badge b-huy">Đã hủy</span>`
    :don.trangThai==='BI_TRA_LAI'?`<span class="badge b-tra">Bị trả lại</span>`
    :cho?`<span class="badge b-cham">Chờ châm</span>`
    :don.trangThai==='DA_GIAO_MOT_PHAN'?`<span class="badge b-part">Giao 1 phần</span>`
    :`<span class="badge b-run">Đang làm</span>`;
  const nCD=don.snapshotCD.length;let stages='';
  for(let n=0;n<nCD;n++){const t=tonCD(don,n);
    const raOut=n<nCD-1?sum(sizesOf(don).map(s=>sanXuatVao(don,n+1,s))):sum(sizesOf(don).map(s=>xong(don,s)));
    const reached=raOut>0||n===0;const active=t>0;const doneStage=raOut>=tong&&tong>0;
    stages+=`<div class="stg ${reached?'reached':''} ${doneStage?'done':active?'active':''} ${t>0?'has':''}">
      <div class="thread-line"></div><div class="dot"></div>
      <div class="tn">${t>0?t:(doneStage?'✓':'·')}</div><div class="lbl">${don.snapshotCD[n].ten}</div></div>`;}
  const giaoDuoc=coTheGiaoTong(don);let foot='';
  if(donCoCanhBao(don)){const p=phieuCoHut(don)[0];
    foot=`<div class="alert-strip as-red">⚠ Phiếu hụt: ${getTho(p.thoId).ten}, lệch ${Math.abs(p.hut)} cái (${p.lyDoHut||'chưa rõ'})</div>`;
  }else if(cho){foot=`<div class="alert-strip as-purple">✂️ Đang chờ ${sum(Object.values(chamChoVe(don)[0].sizes))} cái cắt châm về</div>`;
  }else if(done){const l=laiDon(don);foot=`<div class="alert-strip as-green">💚 Lãi ròng ước tính: ${fmt(l.lai)}</div>`;
  }else if(!huy&&giaoDuoc>0){foot=`<div class="alert-strip as-amber">📦 Có ${giaoDuoc} cái đã xong, giao được cho chủ hàng</div>`;}
  return `<div class="order-card" onclick="modalDon('${don.id}')">
    <div class="oc-head"><div><div class="oc-ma">${don.ma} · ${mau.ten}</div><div class="oc-cust">${chu.ten}</div></div>
      <div class="oc-qty">${badge}<div style="margin-top:5px"><b class="num">${tong}</b> cái</div></div></div>
    ${huy?'':`<div class="stages">${stages}</div>`}${foot}</div>`;
}

/* ---------- CHI TIẾT ĐƠN ---------- */
function modalDon(id){

  for(let n=0;n<nCD;n++){const perSize=sizesOf(don).map(s=>({s,v:Math.max(0,ton(don,n,s))})).filter(x=>x.v>0);const t=tonCD(don,n);
    tonRows+=`<div class="kv"><div class="k">${n+1}. ${don.snapshotCD[n].ten}
      <div style="font-size:11px;color:var(--ink-3)">${fmt(don.snapshotCD[n].donGia)}/cái</div></div>
      <div class="v" style="${t>0?'color:var(--tape)':'color:var(--ink-3)'}">${t>0?t+' cái chờ giao':'—'}

    <div class="meta">${c.lyDo||''} · ${sizesOf(don).filter(s=>c.sizes[s]).map(s=>s+':'+c.sizes[s]).join(' ')}</div></div>
    <button class="btn btn-ghost btn-sm" onclick="modalChamVe('${don.id}','${c.id}')">Hàng về</button></div>`).join('');

  const giaoDuoc=coTheGiaoTong(don);const giaoLuyKe=sum(sizesOf(don).map(s=>daGiaoTP(don,s)));
  let actions='';
  if(done){const l=laiDon(don);
    actions=`<div class="reveal"><div class="lbl">Lãi ròng ước tính</div><div class="amt">${fmt(l.lai)}</div>
      <div class="note">Doanh thu ${fmtShort(l.doanhThu)} − chi phí ${fmtShort(l.giaVon)}</div></div>
      <div class="act-grid">
        <button class="btn btn-ghost" onclick="inPhieu('${id}')">🖨 In phiếu</button>
        <button class="btn btn-ghost" onclick="modalThao('${id}')">🔧 Tháo sửa</button>
        <button class="btn btn-danger wide" onclick="confirmTraLai('${id}')">↩ Chủ hàng trả lại hàng</button>
      </div>`;
  }else if(huy){actions=`<div class="warn-box">Đơn đã hủy. Chi phí dở dang đã chuyển thành lỗ.</div>`;}
  else{

      <div class="hint" style="margin:0">Bấm <b>Đóng đơn</b> khi giao xong để chốt lãi cuối cùng.</div></div></div>
      <button class="btn btn-primary" onclick="modalGiaoViec('${id}')">👤 Giao việc cho thợ</button>
      <div style="height:8px"></div>
      ${giaoDuoc>0?`<button class="btn btn-tape" onclick="modalGiaoTP('${id}')">📦 Giao ${giaoDuoc} cái cho chủ hàng</button><div style="height:8px"></div>`:''}
      ${giaoLuyKe>0?`<button class="btn btn-sage" onclick="confirmDongDon('${id}')">✅ Đóng đơn — xem lãi</button><div style="height:8px"></div>`:''}
      <button class="btn btn-ghost" onclick="const d=el('donMore');d.style.display=d.style.display==='none'?'block':'none';this.textContent=d.style.display==='none'?'⋯ Thao tác khác':'⌃ Thu gọn'">⋯ Thao tác khác</button>
      <div id="donMore" style="display:none;margin-top:8px"><div class="act-grid">
        <button class="btn btn-ghost" onclick="modalChamGio('${id}')">⏱ Chấm giờ</button>
        <button class="btn btn-ghost" onclick="modalXinCham('${id}')">✂️ Xin cắt châm</button>
        <button class="btn btn-ghost" onclick="modalChiPhiDon('${id}')">🧵 Chi phí đơn</button>
        <button class="btn btn-ghost" onclick="modalTienDen('${id}')">💸 Tiền đền</button>
        <button class="btn btn-ghost" onclick="modalSuaDon('${id}')">✎ Sửa đơn</button>
        <button class="btn btn-ghost" onclick="modalThao('${id}')">🔧 Tháo sửa</button>
        <button class="btn btn-ghost" onclick="inPhieu('${id}')">🖨 In phiếu</button>

  }
  openSheet(don.ma,`

      ${tonRows}
      <div class="kv"><div class="k">Thành phẩm đã xong</div><div class="v" style="color:var(--sage)">${sum(sizesOf(don).map(s=>xong(don,s)))} cái</div></div>
      <div class="kv"><div class="k">Đã giao chủ hàng</div><div class="v">${giaoLuyKe} cái</div></div></div></div>
    ${chamRows?`<div class="section-h">Cắt châm đang chờ</div><div class="card">${chamRows}</div>`:''}

/* ---------- Tạo đơn ---------- */
let tdState={};
function modalTaoDon(chuId){
  if(!DB.chuHang.length)return toast('Thêm chủ hàng trước đã.',true);
  const chu=chuId?getChu(chuId):DB.chuHang[0];
  const firstMau=(chu.mau&&chu.mau.length)?chu.mau[0]:null;
  tdState={chuId:chu.id,mauId:firstMau?firstMau.id:null};
  drawTaoDon();
}
function drawTaoDon(){
  const chu=getChu(tdState.chuId);const mauList=chu.mau||[];
  const mau=tdState.mauId?getMau(tdState.mauId):null;
  const chuOpts=DB.chuHang.map(c=>`<option value="${c.id}" ${c.id===tdState.chuId?'selected':''}>${c.ten}</option>`).join('');
  const mauChips=mauList.length?mauList.map(m=>`<div class="chip ${tdState.mauId===m.id?'sel':''}" onclick="tdPick('mau','${m.id}')">${m.ten}<small>${fmt(m.giaGiaCong||0)}/cái</small></div>`).join(''):'<div class="hint">Chủ hàng này chưa có mẫu — thêm mẫu ở màn chủ hàng.</div>';
  const sizeList=mau?((mau.sizeList&&mau.sizeList.length)?mau.sizeList:SIZES):[];
  const body=`
    <div class="field"><label>Chủ hàng</label><select id="f_chu" onchange="tdPick('chu',this.value)">${chuOpts}</select></div>
    <div class="field"><label>Mẫu của chủ hàng này</label><div class="chipset">${mauChips}</div>
      <div class="hint">Cỡ và giá lấy sẵn từ mẫu. Muốn đổi mẫu/cỡ/giá gốc thì sửa ở màn chủ hàng.</div></div>
    ${mau?`
    <div class="field"><label>Mã đơn / tên lô</label><input id="f_ma" value="${nextMa()}"></div>
    <div class="field"><label>Số cái nhận về theo cỡ</label>
      <div class="sizegrid">${sizeList.map(s=>`<div class="sizecell"><label>${s}</label>
        <input type="number" inputmode="numeric" min="0" id="sz_${s}" value="0" onfocus="this.select()"></div>`).join('')}</div>
      <div class="hint">Số thật đếm được, không phải số trên phiếu.</div></div>
    <div class="field"><label>Giá gia công / 1 cái (đơn này)</label><input type="text" inputmode="numeric" class="sep" id="f_gia" value="${sepStr(mau.giaGiaCong||0)}"></div>
    <button class="btn btn-primary" onclick="submitTaoDon()">Tạo đơn</button>`:''}`;
  openSheet('Nhận hàng cắt mới',body);
}
function tdPick(k,v){if(k==='chu'){tdState.chuId=v;const c=getChu(v);tdState.mauId=(c.mau&&c.mau.length)?c.mau[0].id:null;}
  if(k==='mau')tdState.mauId=v;drawTaoDon();}
function nextMa(){return 'ĐH-'+String(DB.don.length+1).padStart(3,'0')}
function submitTaoDon(){try{const mau=getMau(tdState.mauId);if(!mau)return toast('Chọn mẫu đã.',true);
  const sizeList=(mau.sizeList&&mau.sizeList.length)?mau.sizeList:SIZES;const sizes={};
  sizeList.forEach(s=>sizes[s]=+el('sz_'+s).value||0);
  if(sum(Object.values(sizes))<=0)return toast('Nhập số cái theo cỡ đã.',true);
  const gia=numVal('f_gia');if(gia<=0)return toast('Nhập giá gia công / cái.',true);
  taoDon({chuHangId:tdState.chuId,mauId:tdState.mauId,ma:el('f_ma').value||nextMa(),sizes,giaGiaCong:gia});
  closeSheet();render();toast('Đã tạo đơn — giao việc được rồi.');}catch(e){toast(e.message,true)}}

/* ---------- Giao việc ---------- */
let gvState={};
function modalGiaoViec(donId){const don=getDon(donId);let cdIdx=0;
  for(let n=0;n<don.snapshotCD.length;n++){if(tonCD(don,n)>0){cdIdx=n;break;}}
  gvState={donId,cdIdx,thoId:DB.tho.find(t=>!t.isOwner&&t.loai==='sp').id,giao:{}};gvFill();drawGiaoViec();}
function gvFill(){gvState.giao={};}
function drawGiaoViec(){const don=getDon(gvState.donId);
  const cdChips=don.snapshotCD.map((c,n)=>{const t=tonCD(don,n);
    return `<div class="chip ${gvState.cdIdx===n?'sel':''}" ${t>0?'':'style="opacity:.4"'} onclick="gvPick('cd',${n})">${n+1}.${c.ten}<small>${t} chờ</small></div>`;}).join('');
  const thoChips=DB.tho.filter(t=>t.loai==='sp').map(t=>`<div class="chip ${gvState.thoId===t.id?'sel':''}" onclick="gvPick('tho','${t.id}')">${t.isOwner?'🧑‍🔧 ':''}${t.ten}</div>`).join('');
  const avail=sizesOf(don).map(s=>({s,v:Math.max(0,ton(don,gvState.cdIdx,s))})).filter(x=>x.v>0);
  const tong=sum(Object.values(gvState.giao));
  const sizeRows=avail.length?avail.map(x=>{const on=(gvState.giao[x.s]||0)>0;return `<div class="gv-row${on?' on':''}">
      <label class="gv-tick"><input type="checkbox" ${on?'checked':''} onchange="gvTick('${x.s}',this.checked,${x.v})"><span>Cỡ ${x.s}<small>còn ${x.v}</small></span></label>
      <div class="stepper sm"><button ${on?'':'disabled'} onclick="gvSl('${x.s}',-5,${x.v})">−</button>
        <input type="number" id="gv_${x.s}" value="${gvState.giao[x.s]||0}" ${on?'':'disabled'} onchange="gvSet('${x.s}',+this.value,${x.v})" onfocus="this.select()">
        <button ${on?'':'disabled'} onclick="gvSl('${x.s}',5,${x.v})">＋</button></div></div>`;}).join(''):'<div class="hint">Công đoạn này chưa có hàng chờ.</div>';
  openSheet('Giao việc — '+don.ma,`
    <div class="field"><label>Công đoạn</label><div class="chipset">${cdChips}</div></div>
    <div class="field"><label>Giao cho thợ</label><div class="chipset">${thoChips}</div></div>
    ${avail.length?`<div class="field"><label>Chọn cỡ & số cái giao</label>
      <div class="act-grid" style="margin-bottom:8px"><button class="btn btn-ghost btn-sm" onclick="gvAll(1)">Chọn hết</button><button class="btn btn-ghost btn-sm" onclick="gvAll(0)">Bỏ hết</button></div>
      ${sizeRows}
      <div class="hint">Tích vào cỡ muốn giao (tích là lấy hết số đang chờ, có thể chỉnh xuống). Một thợ nhận nhiều cỡ trong cùng một phiếu.</div></div>
      <button class="btn btn-primary" onclick="submitGiaoViec()">Giao ${tong} cái</button>`:''}`);
}
function gvPick(k,v){if(k==='cd'){gvState.cdIdx=v;gvFill();}if(k==='tho')gvState.thoId=v;drawGiaoViec();}
function gvSet(s,v,max){v=Math.max(0,Math.min(max,v||0));if(v>0)gvState.giao[s]=v;else delete gvState.giao[s];drawGiaoViec();}
function gvSl(s,d,max){gvSet(s,(gvState.giao[s]||0)+d,max);}
function gvTick(s,on,max){if(on)gvState.giao[s]=max;else delete gvState.giao[s];drawGiaoViec();}
function gvAll(on){const don=getDon(gvState.donId);gvState.giao={};
  if(on)sizesOf(don).forEach(s=>{const v=Math.max(0,ton(don,gvState.cdIdx,s));if(v>0)gvState.giao[s]=v;});drawGiaoViec();}
function submitGiaoViec(){try{if(sum(Object.values(gvState.giao))<=0)return toast('Chọn ít nhất một cỡ.',true);
  giaoViec({donId:gvState.donId,congDoanIdx:gvState.cdIdx,thoId:gvState.thoId,giao:gvState.giao});
  closeSheet();render();modalDon(gvState.donId);toast('Đã giao việc cho thợ.');}catch(e){toast(e.message,true)}}

/* ---------- Nhận về ---------- */
function modalNhanVe(phieuId){const p=DB.phieuGiao.find(x=>x.id===phieuId);const don=getDon(p.donId);
  const sizes=pSizes(p);
  const rows=sizes.map(s=>{const con=pConSize(p,s);

  openSheet('Nhận hàng về',`
    <div style="margin:-4px 0 14px"><div style="font-weight:700">${getTho(p.thoId).ten} · ${don.snapshotCD[p.congDoanIdx].ten}</div>
      <div style="font-size:13px;color:var(--ink-2)">Giao ${pGiao(p)} cái · ${sizes.map(s=>s+':'+pGiaoSize(p,s)).join(' ')}${pNhan(p)?` · đã nhận ${pNhan(p)}`:''}</div></div>

    <button class="btn btn-tape" onclick="nhanMotDot('${phieuId}')" style="margin-bottom:10px">Ghi đợt này, còn nữa</button>

    ${p.dongNhan.length?'':`<div style="height:10px"></div><button class="btn btn-danger" onclick="doHuyPhieu('${phieuId}')">Thợ trả lại nguyên — hủy phiếu</button>`}`);
}
function stepIn(id,d){const e=el(id);e.value=Math.max(0,(+e.value||0)+d)}
function nvRead(p){const dat={},phe={};pSizes(p).forEach(s=>{const d=+((el('nv_dat_'+s)||{}).value||0),f=+((el('nv_phe_'+s)||{}).value||0);if(d>0)dat[s]=d;if(f>0)phe[s]=f;});return {dat,phe};}
function doHuyPhieu(phieuId){try{const p=DB.phieuGiao.find(x=>x.id===phieuId);huyPhieu(phieuId);
  closeSheet();render();modalDon(p.donId);toast('Đã hủy phiếu, trả hàng về tồn.');}catch(e){toast(e.message,true)}}
function nhanDu(phieuId){try{const p=DB.phieuGiao.find(x=>x.id===phieuId);const dat={};
  pSizes(p).forEach(s=>{const con=pConSize(p,s);if(con>0)dat[s]=con;});
  nhanVe({phieuId,dat,phe:{}});dongPhieu({phieuId,lyDo:null});
  closeSheet();render();modalDon(p.donId);toast('Đã nhận đủ, tiền công đã ghi.');}catch(e){toast(e.message,true)}}
function nhanMotDot(phieuId){try{const p=DB.phieuGiao.find(x=>x.id===phieuId);const {dat,phe}=nvRead(p);
  if(sum(Object.values(dat))+sum(Object.values(phe))<=0)return toast('Nhập số cái nhận về.',true);
  nhanVe({phieuId,dat,phe});
  closeSheet();render();modalDon(p.donId);toast('Đã ghi đợt nhận, phiếu vẫn mở.');}catch(e){toast(e.message,true)}}
function nhanVaDong(phieuId){const p=DB.phieuGiao.find(x=>x.id===phieuId);const {dat,phe}=nvRead(p);
  if(sum(Object.values(dat))+sum(Object.values(phe))>0)nhanVe({phieuId,dat,phe});
  const hut=pGiao(p)-pNhan(p);
  if(hut!==0)modalLyDoHut(phieuId,hut);
  else{dongPhieu({phieuId,lyDo:null});closeSheet();render();modalDon(p.donId);toast('Đã đóng phiếu, khớp số.');}}
function modalLyDoHut(phieuId,hut){
  const opts=hut>0?['Đang tháo sửa (sẽ quay lại)','Đếm sai đầu vào','Hàng phế chưa ghi','Hụt chưa rõ']:['Đếm sai đầu vào (thừa)','Hàng cỡ khác lẫn vào'];
  openSheet(hut>0?`Thiếu ${hut} cái — vì sao?`:`Dư ${-hut} cái — vì sao?`,`
    <div class="warn-box">Số giao và số trả về lệch <b>${Math.abs(hut)} cái</b>. Chọn lý do để đóng phiếu.</div>
    ${opts.map(o=>`<button class="btn btn-ghost" style="margin-bottom:9px;justify-content:flex-start" onclick="chotHut('${phieuId}','${o}')">${o}</button>`).join('')}`);
}
function chotHut(phieuId,lyDo){const p=DB.phieuGiao.find(x=>x.id===phieuId);
  dongPhieu({phieuId,lyDo});closeSheet();render();modalDon(p.donId);toast('Đã đóng phiếu, ghi chênh lệch.');}

function viewTho(m){

  const thoList=DB.tho.filter(t=>!t.isOwner);

  h+=DB.tho.map(t=>{const no=t.isOwner?0:luongNoTho(t.id);const ns=nangSuat(t.id);
    return `<div class="order-card" onclick="modalThoChiTiet('${t.id}')"><div class="oc-head">
      <div><div class="oc-ma">${t.isOwner?'🧑‍🔧 ':''}${t.ten}</div>
        <div class="oc-cust">${t.isOwner?'Chủ xưởng':t.loai==='gio'?'Tính giờ · '+fmt(t.donGiaGio)+'/h':'Tính sản phẩm'} · đã làm ${ns.tongCai} cái${ns.tongGio?' · '+ns.tongGio+'h':''}</div></div>
      <div class="oc-qty">${t.isOwner?`<div style="font-size:11px;color:var(--ink-3)">công đã tính<br>vào lãi</div>`
        :`<div class="big-num ${no>0?'money-neg':no<0?'money-pos':''}">${no?fmt(no):'—'}</div><div style="font-size:11px;margin-top:2px">${no>0?'còn nợ':no<0?'ứng dư':'xong'}</div>`}</div></div></div>`;}).join('');
  m.innerHTML=h;
  el('fab').innerHTML=`<button class="btn btn-tape" onclick="modalThemTho()">＋ Thêm thợ</button>`;
}
function nangSuat(thoId){
  const ps=DB.phieuGiao.filter(p=>p.thoId===thoId&&p.trangThai!=='HUY');
  let tongCai=0,tongCong=0,tongPhe=0;
  ps.forEach(p=>{const don=getDon(p.donId);const cd=don.snapshotCD[p.congDoanIdx];
    const dat=pDat(p);tongCai+=dat;tongCong+=dat*cd.donGia;tongPhe+=pPhe(p);});
  const pg=DB.phienGio.filter(x=>x.thoId===thoId);const tongGio=sum(pg.map(x=>x.gio));tongCong+=sum(pg.map(x=>x.tien));
  return {tongCai,tongCong,tongPhe,tongGio};
}
function congThoEvents(thoId){
  const ev=[];
  DB.phieuGiao.filter(p=>p.thoId===thoId&&p.trangThai!=='HUY').forEach(p=>{
    const don=getDon(p.donId);const cd=don.snapshotCD[p.congDoanIdx];
    (p.dongNhan||[]).forEach(dn=>{const sl=sum(Object.values(dn.dat||{}));if(sl<=0)return;
      ev.push({ngay:dn.ngay,don:don.ma,mo:cd.ten,soCai:sl,tien:sl*cd.donGia});});});
  DB.phienGio.filter(x=>x.thoId===thoId).forEach(pg=>{const don=getDon(pg.donId);
    ev.push({ngay:pg.ngay,don:don?don.ma:'—',mo:'Công giờ '+pg.gio+'h',soCai:0,tien:pg.tien});});
  (DB.phieuThao||[]).forEach(pt=>{const don=getDon(pt.donId);
    (pt.dong||[]).forEach(l=>{if(l.thoId!==thoId||l.aiChiu==='THO')return;const tien=l.sl*l.donGia;if(tien<=0)return;
      ev.push({ngay:pt.ngay,don:don?don.ma:'—',mo:'Tháo · '+(don?don.snapshotCD[l.congDoanIdx].ten:''),soCai:l.sl,tien});});});
  ev.sort((a,b)=>a.ngay-b.ngay);
  let tra=bal(TK.PHAI_TRA_THO,d=>d.thoId===thoId).no; // đã trả + ứng
  ev.forEach(e=>{if(tra>=e.tien){e.daTinh=true;tra-=e.tien;}else{e.daTinh=false;if(tra>0){e.tinhMotPhan=tra;tra=0;}}});
  return ev;
}
/* ---- Lịch sử trả/ứng của thợ ---- */
function traUngList(thoId){const out=[];
  DB.butToan.forEach(bt=>bt.dong.forEach(d=>{if(d.tk===TK.PHAI_TRA_THO&&d.thoId===thoId&&d.chieu==='NO'){
    out.push({ngay:bt.thoiDiem,loai:bt.suKien,tien:d.soTien});}}));
  return out.sort((a,b)=>b.ngay-a.ngay);
}

let scState={thoId:'',loc:'chua'};
function modalSoCong(thoId){scState={thoId:thoId||'',loc:'chua'};drawSoCong();}
function scPick(k,v){if(k==='tho')scState.thoId=v;if(k==='loc')scState.loc=v;drawSoCong();}
function soCongRows(filtTho,filtLoc){const rows=[];
  const ids=filtTho?[filtTho]:DB.tho.filter(t=>!t.isOwner).map(t=>t.id);
  ids.forEach(tid=>{const t=getTho(tid);congThoEvents(tid).forEach(e=>{
    if(filtLoc==='chua'&&e.daTinh)return;if(filtLoc==='roi'&&!e.daTinh)return;
    rows.push(Object.assign({tho:t.ten},e));});});
  rows.sort((a,b)=>b.ngay-a.ngay);return rows;}
function drawSoCong(){

  const rows=soCongRows(scState.thoId,scState.loc);

  const body=`

    <div class="field" style="margin-bottom:8px"><label>Thợ</label><div class="chipset">${thoOpts}</div></div>

    ${rows.length?rows.map(r=>`<tr><td>${r.tho}</td><td>${r.don}<br><span style="color:var(--ink-3)">${r.mo}</span></td>
      <td>${new Date(r.ngay).toLocaleDateString('vi-VN')}</td><td class="r">${r.soCai||'—'}</td>
      <td class="r">${fmt(r.tien)}</td><td class="${r.daTinh?'st-roi':'st-chua'}">${r.daTinh?'đã':(r.tinhMotPhan?'1 phần':'chưa')}</td></tr>`).join(''):`<tr><td colspan="6" style="text-align:center;padding:18px;color:var(--ink-2)">Không có dòng nào.</td></tr>`}
    </tbody></table></div>
    ${scState.loc!=='roi'?`<div class="kv" style="margin-top:10px"><div class="k">Tổng công chưa tính sổ (đang lọc)</div><div class="v big-num money-neg">${fmt(tong)}</div></div>`:''}
    <div class="act-grid" style="margin-top:8px">
      <button class="btn btn-ghost" onclick="xuatSoCongCSV()">⬇ Xuất CSV</button>
      <button class="btn btn-primary" onclick="modalChotLuong('${scState.thoId}')">🧾 Chốt lương</button></div>`;
  openSheet('Bảng sổ công thợ',body);
}

/* ---- Xuất / nhập dữ liệu ---- */
function escHtml(x){return (''+x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function downloadFile(name,text,mime){try{
  const blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';a.rel='noopener';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{try{document.body.removeChild(a);}catch(_){}try{URL.revokeObjectURL(url);}catch(_){}},1500);
  return true;}catch(e){return false;}}
function copyText(id){const e=el(id);if(!e)return;e.focus();e.select();try{e.setSelectionRange(0,999999);}catch(_){}
  let ok=false;try{ok=document.execCommand('copy');}catch(_){}
  if(navigator.clipboard&&navigator.clipboard.writeText){try{navigator.clipboard.writeText(e.value);ok=true;}catch(_){}}
  toast(ok?'Đã sao chép — dán vào ghi chú/Excel hoặc phần Phục hồi.':'Đã bôi chọn — nhấn giữ để Copy.');}

    <div class="hint" style="margin-top:8px"><b>${filename}</b> là dữ liệu thật. Lưu file hoặc sao chép; khi cần dùng <b>Phục hồi</b> để hiển thị lại.</div>`);
}
function taiCSV(name,rows){
  const NL=String.fromCharCode(13,10),BOM=String.fromCharCode(0xFEFF),LF=String.fromCharCode(10);
  const csv=BOM+rows.map(r=>r.map(c=>{c=(''+c).replace(/"/g,'""');return (/[",;]/.test(c)||c.indexOf(LF)>=0)?'"'+c+'"':c;}).join(',')).join(NL);
  exportModal('Xuất CSV',name+'-'+new Date().toISOString().slice(0,10)+'.csv',csv,'text/csv;charset=utf-8','Bảng CSV mở được bằng Excel / Google Sheets. Tải file hoặc sao chép.');
}
function csvCell(x){x=(''+(x==null?'':x));return /[",\n\r]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}
function csvRow(a){return a.map(csvCell).join(',');}
function parseCSV(text){const rows=[];let i=0,cell='',row=[],inq=false;const n=text.length;
  while(i<n){const c=text[i];
    if(inq){if(c==='"'){if(text[i+1]==='"'){cell+='"';i+=2;continue;}inq=false;i++;continue;}cell+=c;i++;continue;}
    if(c==='"'){inq=true;i++;continue;}
    if(c===','){row.push(cell);cell='';i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';i++;continue;}
    cell+=c;i++;}
  row.push(cell);rows.push(row);return rows;}
function dbToCSV(){const L=[];const NL=String.fromCharCode(13,10);
  L.push('SOXUONG_CSV,3');L.push('');
  L.push('@CHUHANG');L.push(csvRow(['id','ten']));
  DB.chuHang.forEach(c=>L.push(csvRow([c.id,c.ten])));
  L.push('');L.push('@THO');L.push(csvRow(['id','ten','loai','donGiaGio','isOwner']));
  DB.tho.forEach(t=>L.push(csvRow([t.id,t.ten,t.loai||'sp',t.donGiaGio||0,t.isOwner?1:0])));
  L.push('');L.push('@MAU');L.push(csvRow(['chuHangId','id','ten','sizes','giaGiaCong','gioDinhMuc','congDoan']));
  DB.chuHang.forEach(c=>(c.mau||[]).forEach(m=>L.push(csvRow([c.id,m.id,m.ten,(m.sizeList||[]).join('|'),m.giaGiaCong||0,m.gioDinhMuc||0,(m.congDoan||[]).map(x=>x.ten+':'+x.donGia).join('|')]))));
  L.push('');L.push('@SETTINGS');L.push(csvRow(['key','value']));
  Object.keys(DB.settings||{}).forEach(k=>{const v=DB.settings[k];L.push(csvRow([k,(v&&typeof v==='object')?JSON.stringify(v):v]));});
  const jt=(name,arr)=>{L.push('');L.push('@'+name);L.push('json');(arr||[]).forEach(o=>L.push(csvRow([JSON.stringify(o)])));};
  jt('DON',DB.don);jt('PHIEUGIAO',DB.phieuGiao);jt('PHIENGIO',DB.phienGio);jt('PHIEUTHAO',DB.phieuThao);jt('GIAOTP',DB.giaoTP);jt('BUTTOAN',DB.butToan);
  return String.fromCharCode(0xFEFF)+L.join(NL);}
function csvToDB(text){if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const rows=parseCSV(text).filter(r=>!(r.length===1&&r[0].trim()===''));
  if(!rows.length||!/^SOXUONG_CSV/.test(rows[0][0]))throw new Error('không phải CSV Sổ Xưởng');
  const sec={};let cur=null;
  for(let k=1;k<rows.length;k++){const r=rows[k];
    if(r[0]&&r[0].charAt(0)==='@'){cur=r[0].slice(1);sec[cur]=[];continue;}
    if(cur)sec[cur].push(r);}
  const db={schema:SCHEMA,chuHang:[],tho:[],don:[],phieuGiao:[],phienGio:[],phieuThao:[],giaoTP:[],butToan:[],settings:{tyLeChung:0.15,view:'don'}};
  function tbl(name){const sc=sec[name];if(!sc||!sc.length)return [];const head=sc[0];return sc.slice(1).map(r=>{const o={};head.forEach((h,i)=>o[h]=r[i]);return o;});}
  tbl('CHUHANG').forEach(o=>{if(o.id)db.chuHang.push({id:o.id,ten:o.ten||'',mau:[]});});
  const cById={};db.chuHang.forEach(c=>cById[c.id]=c);
  tbl('THO').forEach(o=>{if(!o.id)return;const t={id:o.id,ten:o.ten||'',loai:o.loai||'sp',donGiaGio:+o.donGiaGio||0};if(+o.isOwner)t.isOwner=true;db.tho.push(t);});
  tbl('MAU').forEach(o=>{if(!o.id)return;const c=cById[o.chuHangId];if(!c)return;
    const sizeList=(o.sizes||'').split('|').map(x=>x.trim()).filter(Boolean);
    const congDoan=(o.congDoan||'').split('|').map(x=>x.trim()).filter(Boolean).map(seg=>{const j=seg.lastIndexOf(':');return {ten:j>=0?seg.slice(0,j):seg,donGia:j>=0?(+seg.slice(j+1)||0):0};});
    c.mau.push({id:o.id,ten:o.ten||'',sizeList,giaGiaCong:+o.giaGiaCong||0,gioDinhMuc:+o.gioDinhMuc||0,congDoan,lichSuGia:[{ngay:now(),congDoan:congDoan.map(x=>({...x})),sizeList:sizeList.slice(),giaGiaCong:+o.giaGiaCong||0}]});});
  const st=sec['SETTINGS'];if(st&&st.length)st.slice(1).forEach(r=>{const k=r[0],v=r[1];if(!k)return;let val=v;
    if(v==='true')val=true;else if(v==='false')val=false;else if(v!==''&&/^-?[0-9]+(\.[0-9]+)?$/.test(v))val=+v;else if(/^[[{]/.test(v||'')){try{val=JSON.parse(v);}catch(e){}}
    db.settings[k]=val;});
  const jr=name=>{const sc=sec[name];if(!sc)return [];return sc.filter(r=>r[0]&&r[0]!=='json').map(r=>{try{return JSON.parse(r[0]);}catch(e){return null;}}).filter(Boolean);};
  db.don=jr('DON');db.phieuGiao=jr('PHIEUGIAO');db.phienGio=jr('PHIENGIO');db.phieuThao=jr('PHIEUTHAO');db.giaoTP=jr('GIAOTP');db.butToan=jr('BUTTOAN');
  return db;}
function importAny(text){const stripped=(''+text).replace(/^\uFEFF/,'');const t=stripped.replace(/^\s+/,'');
  let obj;
  if(t.charAt(0)==='{')obj=JSON.parse(t);
  else if(/^SOXUONG_CSV/.test(t)||t.charAt(0)==='@')obj=csvToDB(stripped);
  else throw new Error('định dạng lạ — cần JSON hoặc CSV Sổ Xưởng');
  applyImport(obj);}

/* ---- Sửa / xóa đơn ---- */
function donCoButToan(donId){return DB.butToan.some(bt=>bt.dong.some(d=>d.donId===donId));}
function donCoPhatSinh(donId){return donCoButToan(donId)||DB.phieuGiao.some(p=>p.donId===donId);}
function suaDon({donId,mauId,ma,sizes,giaGiaCong}){
  const don=getDon(donId);
  if(don.trangThai==='DA_GIAO_DU'||don.trangThai==='DA_HUY')throw new Error('Đơn đã đóng/hủy — không sửa được.');
  if(mauId&&mauId!==don.mauId){
    if(donCoPhatSinh(donId))throw new Error('Đơn đã có phát sinh — không đổi mẫu. Hãy hủy và tạo đơn mới.');
    const mau=getMau(mauId);don.mauId=mauId;don.snapshotCD=mau.congDoan.map(c=>({ten:c.ten,donGia:c.donGia}));
    don.sizeList=(mau.sizeList&&mau.sizeList.length)?mau.sizeList.slice():SIZES.slice();don.gioDinhMuc=mau.gioDinhMuc||0;
    don.giaGiaCong=mau.giaGiaCong||don.giaGiaCong;const ns={};don.sizeList.forEach(x=>ns[x]=don.sizes[x]||0);don.sizes=ns;}
  if(sizes){for(const x of Object.keys(sizes)){const q=sizes[x]||0;const daRa=daGiaoRaCD(don,0,x);
    if(q<daRa)throw new Error('Cỡ '+x+' đã đưa vào sản xuất '+daRa+' cái — không giảm dưới mức đó.');}
    don.sizes={...sizes};}
  if(ma)don.ma=ma;
  if(giaGiaCong!=null&&giaGiaCong>0)don.giaGiaCong=giaGiaCong;
  Store.save();
}

/* ===========================================================
   NHẬT KÝ NHẬP — gom bút toán theo thao tác (op), xem theo ngày, hoàn tác/sửa
   =========================================================== */
const UNDO_DANGER=['Giao thành phẩm','Kết chuyển giá vốn','Đóng đơn','Hủy đơn','Hàng bị trả lại','Khóa kỳ','Số dư đầu kỳ','Ship cắt châm','Nhận hàng về','Tháo'];
function opGroups(){
  const m={};
  DB.butToan.forEach(bt=>{const k=(bt.op!=null?'o'+bt.op:'b'+bt.id);(m[k]=m[k]||[]).push(bt);});
  return Object.keys(m).map(k=>{const bts=m[k].slice().sort((a,b)=>a.thoiDiem-b.thoiDiem);
    const isRev=bts.every(b=>b.dao_cua);
    const daDao=bts.some(b=>b.daDao);
    const t=bts[0].thoiDiem;
    const quy=sum(bts.map(b=>b.dong.filter(d=>d.tk===TK.QUY).reduce((s,d)=>s+(d.chieu==='NO'?d.soTien:-d.soTien),0)));
    const danger=bts.some(b=>UNDO_DANGER.some(p=>b.suKien.startsWith(p)));
    const handled=bts.some(b=>b.prevTT!==undefined||b.restoreSlip!==undefined); // thao tác gắn đơn có khôi phục trạng thái
    const within=bts.every(b=>now()-b.thoiDiem<HUY_WINDOW);
    const allMoney=!danger;
    const undoNow=!daDao&&within&&(allMoney||handled);   // xóa hẳn ngay (an toàn)
    const undoLater=!daDao&&!within&&allMoney;           // quá 5 phút: chỉ đảo op tiền
    return {key:k,bts,isRev,daDao,t,quy,within,allMoney,handled,undoNow,undoLater,undoable:undoNow||undoLater,label:friendlyOp(bts),ic:opIcon(bts)};
  }).filter(g=>!g.isRev).sort((a,b)=>(b.t-a.t)||((b.bts[0].op||0)-(a.bts[0].op||0)));
}
function friendlyOp(bts){
  const main=bts.find(b=>!/^Chi phí chung/.test(b.suKien))||bts[0];let s=main.suKien;
  const meta=(key)=>{for(const b of bts)for(const d of b.dong)if(d[key])return d[key];return null;};
  const chuId=meta('chuHangId'),thoId=meta('thoId'),donId=meta('donId');const extra=[];
  if(donId&&getDon(donId))extra.push(getDon(donId).ma);
  if(chuId&&getChu(chuId))extra.push(getChu(chuId).ten);else if(thoId&&getTho(thoId))extra.push(getTho(thoId).ten);
  return s+(extra.length?' · '+extra.join(' · '):'');
}
function opIcon(bts){const s=bts.map(b=>b.suKien).join(' ');
  if(/Chủ rút tiền|Chủ bỏ thêm/.test(s))return '🏠';
  if(/trả tiền/.test(s))return '💵';if(/Trả lương|Ứng lương/.test(s))return '👛';
  if(/Giao thành phẩm/.test(s))return '📦';if(/Nhận hàng/.test(s))return '🧵';
  if(/Chấm công/.test(s))return '⏱';if(/Tháo/.test(s))return '🔧';
  if(/Chi tiền|Chi phí/.test(s))return '🧾';if(/nợ xấu|ứng thợ/.test(s))return '✖️';
  if(/Đóng đơn/.test(s))return '✅';if(/trả lại/.test(s))return '↩';if(/đền/.test(s))return '💸';
  if(/đầu kỳ/.test(s))return '🏁';if(/Khóa kỳ/.test(s))return '🔒';return '•';}
function hoanTacOp(key,lyDo){
  const g=opGroups().find(x=>x.key===key);if(!g||g.daDao)return;
  const within=g.bts.every(b=>now()-b.thoiDiem<HUY_WINDOW);
  if(within){
    // gỡ dấu vết cấu trúc kèm theo
    g.bts.forEach(b=>{
      if(b.phienGioId)DB.phienGio=DB.phienGio.filter(x=>x.id!==b.phienGioId);
      if(b.restoreSlip)DB.giaoTP=DB.giaoTP.filter(x=>x.id!==b.restoreSlip);
      if(b.prevTT!==undefined&&b.restoreDonId){const d=getDon(b.restoreDonId);if(d)d.trangThai=b.prevTT;}
    });
    const ids=new Set(g.bts.map(b=>b.id));DB.butToan=DB.butToan.filter(b=>!ids.has(b.id));
  }else{
    // quá cửa sổ: chỉ cho đảo op tiền thuần
    if(!g.allMoney)return;
    beginOp();g.bts.forEach(bt=>{const dong=bt.dong.map(d=>Object.assign({},d,{chieu:d.chieu==='NO'?'CO':'NO'}));
      DB.butToan.push({id:uid(),suKien:'Sửa: '+bt.suKien,thoiDiem:now(),op:curOp(),dong,dao_cua:bt.id,lyDo});bt.daDao=true;});
  }
  Store.save();
}
function sameDay(a,b){const x=new Date(a),y=new Date(b);return x.getFullYear()===y.getFullYear()&&x.getMonth()===y.getMonth()&&x.getDate()===y.getDate();}
function tkTen(tk){return {QUY:'Quỹ tiền',PHAI_THU:'Phải thu',WIP:'Hàng dở',RO_CHUNG:'Rổ chung',PHAI_TRA_THO:'Nợ lương',CONG_CHU_XUONG:'Công chủ',DOANH_THU:'Doanh thu',GIA_VON:'Giá vốn',LO_KHAC:'Lỗ khác',VON:'Vốn'}[tk]||tk;}
let nkFilter='today';
function bcNhatKy(){
  const gs=opGroups();const now2=now();
  const inF=(t)=>nkFilter==='today'?sameDay(t,now2):nkFilter==='7d'?(now2-t<7*86400000):true;
  const fg=gs.filter(g=>inF(g.t));
  const chips=[['today','Hôm nay'],['7d','7 ngày'],['all','Tất cả']].map(([k,l])=>`<div class="chip ${nkFilter===k?'sel':''}" onclick="nkFilter='${k}';render()">${l}</div>`).join('');
  let h=`<div class="filter-row">${chips}</div>`;

  const byDay={},order=[];fg.forEach(g=>{const dk=new Date(g.t).toLocaleDateString('vi-VN');if(!byDay[dk]){byDay[dk]=[];order.push(dk);}byDay[dk].push(g);});
  order.forEach(dk=>{const list=byDay[dk];const wd=new Date(list[0].t).toLocaleDateString('vi-VN',{weekday:'long'});const tienNgay=sum(list.map(g=>g.quy));
    h+=`<div class="section-h" style="display:flex;justify-content:space-between;align-items:baseline"><span>${wd}, ${dk} · ${list.length} phát sinh</span>
      <span class="${tienNgay>=0?'money-pos':'money-neg'}" style="text-transform:none;letter-spacing:0;font-weight:800">${tienNgay>=0?'+':''}${fmtShort(tienNgay)}</span></div><div class="card">`;
    h+=list.map(g=>{const tm=new Date(g.t).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
      return `<div class="slip" onclick="modalOp('${g.key}')" style="${g.daDao?'opacity:.5':''}">
        <div style="display:flex;gap:11px;align-items:flex-start"><div style="font-size:17px;line-height:1.2">${g.ic}</div>
        <div><div class="who" style="font-size:13.5px">${g.label}${g.daDao?' <span style="color:var(--thread)">· đã sửa</span>':''}</div>
        <div class="meta">${tm}${g.undoable&&!g.daDao?' · sửa được':''}</div></div></div>
        <div style="text-align:right;white-space:nowrap">${g.quy?`<div class="big-num ${g.quy>0?'money-pos':'money-neg'}" style="font-size:14px">${g.quy>0?'+':''}${fmtShort(g.quy)}</div>`:''}<span style="color:var(--ink-3)">›</span></div></div>`;}).join('');
    h+=`</div>`;});
  h+=`<div class="hint" style="text-align:center">Mỗi dòng là một lần nhập. Bấm vào để xem chi tiết, hoàn tác hoặc sửa lại.</div>`;
  return h;
}
function modalOp(key){
  const g=opGroups().find(x=>x.key===key);if(!g)return;
  const tm=new Date(g.t).toLocaleString('vi-VN');
  const lines=g.bts.map(b=>`<div class="slip"><div><div class="who" style="font-size:13px">${b.suKien}</div>
    <div class="meta">${b.dong.map(d=>(d.chieu==='NO'?'Nợ ':'Có ')+tkTen(d.tk)+' '+fmtShort(d.soTien)).join(' · ')}</div></div></div>`).join('');

  else if(g.undoLater)actions=`<div class="field" style="margin-top:4px"><label>Lý do sửa</label><input id="op_ly" placeholder="VD: Nhập nhầm số tiền"></div>

  else actions=`<div class="warn-box">Phát sinh này gắn với hàng hóa (giao hàng, nhận về, tháo, đóng đơn...) và đã quá 5 phút. Để sửa mà không lệch tồn kho, mở <b>Đơn</b> → chọn đơn → dùng thao tác tương ứng (giao lại, hàng bị trả lại, hủy phiếu...).</div>`;
  openSheet('Chi tiết phát sinh',`
    <div style="margin:-4px 0 12px"><div style="font-weight:700">${g.ic} ${g.label}</div>

    <div class="section-h" style="margin-top:0">Máy đã ghi gì</div><div class="card">${lines}</div>
    ${actions}`);
}

function bcLai(){
  const dons=DB.don.filter(d=>bal(TK.DOANH_THU,x=>x.donId===d.id).co>0);
  const byMau={},byChu={};dons.forEach(d=>{const l=laiDon(d);

    byChu[d.chuHangId]=(byChu[d.chuHangId]||0)+l.lai;});
  const rankMau=Object.entries(byMau).sort((a,b)=>b[1].rong-a[1].rong);const rankChu=Object.entries(byChu).sort((a,b)=>b[1]-a[1]);
